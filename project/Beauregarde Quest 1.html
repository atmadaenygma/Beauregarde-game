];
function DeviceHUD({show,isClosing,onClose,inventory,heartNum,onUseItem,money,onBuyVideo,reputation,onChangeColor,characterCategories,onCategorizeCharacter,currentOutfit,onEquipItem,videoLibUnlocked=new Set(),onUnlockVideo,musicFolder,setMusicFolder,musicTrackIdx,setMusicTrackIdx,musicPlaying,setMusicPlaying,musicTime,setMusicTime,musicDuration,setMusicDuration,musicAudioRef}){
  const [activeTabIdx,setActiveTabIdx]=useState(0);
  const [selectedIdx,setSelectedIdx]=useState(0);
  const [activeInvSubTabIdx,setActiveInvSubTabIdx]=useState(0);
  const [sysMode,setSysMode]=useState('save');
  const [activeActionIdx,setActiveActionIdx]=useState(0);
  const [phoneSubApp,setPhoneSubApp]=useState(null);
  const [activeVideoIdx,setActiveVideoIdx]=useState(0);
  const [playingVideoId,setPlayingVideoId]=useState(null);
  const [viewingImage,setViewingImage]=useState(null); // {src,caption} or null
  const [ytVolume,setYtVolume]=useState(80);
  const [ytMuted,setYtMuted]=useState(false);
  const [showOppPopout,setShowOppPopout]=useState(false);
  const videoPlayerRef=useRef(null);
  const inputSrc=useInputSource();
  const selectedItemRef=useRef(null);
  const videoRef=useRef(null);
  const videoControlRef=useRef({isDragging:false,autoPlaySpeed:0.5});
  const [hoveredTabIdx,setHoveredTabIdx]=useState(null);
  const [hoveredSubTabIdx,setHoveredSubTabIdx]=useState(null);
  const [hoveredSysMode,setHoveredSysMode]=useState(null);
  const [activeColorPreset,setActiveColorPreset]=useState(()=>localStorage.getItem('hudColor')||'default');
  const listScrollRef=useRef(null);
  // Music player — state comes from QuestApp props (persists when HUD closes)
  // eqBars and eqIntervalRef are visual-only, fine to reset on HUD open
  const [eqBars,setEqBars]=useState(Array.from({length:18},()=>0.12));
  const eqIntervalRef=useRef(null);

  // Auto-scroll selected item into view (skip in controller mode — cursor handles positioning)
  useEffect(()=>{
    if(inputSrc==='controller')return;
    if(selectedItemRef.current){
      selectedItemRef.current.scrollIntoView({behavior:'auto',block:'nearest'});
    }
  },[selectedIdx,inputSrc]);

  // Reset action selection when item or tab changes
  useEffect(()=>{setActiveActionIdx(0);},[selectedIdx,activeTabIdx]);


  // Virtual cursor — left analog stick moves it while HUD is open
  const cursorRef=useRef({x:640,y:360});
  const [cursorPos,setCursorPos]=useState({x:640,y:360});
  const prevHoverRef=useRef(null);
  useEffect(()=>{
    let rafId;
    const findScroller=(x,y)=>{
      const el=document.elementFromPoint(x,y);
      let s=el;
      while(s){
        if(s.scrollHeight>s.clientHeight+1){
          const cs=getComputedStyle(s);
          if(cs.overflowY==='auto'||cs.overflowY==='scroll')return s;
        }
        s=s.parentElement;
      }
      return null;
    };
    const loop=()=>{
      const pads=navigator.getGamepads?navigator.getGamepads():[];
      let moved=false;
      for(const gp of pads){
        if(!gp)continue;
        const ax=gp.axes[0]??0;
        const ay=gp.axes[1]??0;
        const ry=gp.axes[3]??0;
        const dz=0.12;

        // Left stick — pure mouse-style cursor movement (X and Y always)
        if(Math.abs(ax)>dz||Math.abs(ay)>dz){
          const speed=10;
          cursorRef.current.x=Math.max(0,Math.min(1279,cursorRef.current.x+ax*speed));
          cursorRef.current.y=Math.max(0,Math.min(719,cursorRef.current.y+ay*speed));
          setCursorPos({x:cursorRef.current.x,y:cursorRef.current.y});
          moved=true;
        }

        // Right stick Y — acts like a scroll wheel: scrolls the element under the cursor,
        // falling back to listScrollRef when no scrollable element is under the cursor
        if(Math.abs(ry)>dz){
          const sw=document.getElementById('scale-wrap');
          const r=sw?sw.getBoundingClientRect():{left:0,top:0,width:1280,height:720};
          const vx=r.left+cursorRef.current.x*(r.width/1280);
          const vy=r.top+cursorRef.current.y*(r.height/720);
          const scroller=findScroller(vx,vy)||listScrollRef.current;
          if(scroller)scroller.scrollTop+=ry*12;
        }
      }
      // Dispatch real DOM mouse events — convert game→viewport coords via scale-wrap rect
      if(moved){
        const sw=document.getElementById('scale-wrap');
        const r=sw?sw.getBoundingClientRect():{left:0,top:0,width:1280,height:720};
        const vx=r.left+cursorRef.current.x*(r.width/1280);
        const vy=r.top+cursorRef.current.y*(r.height/720);
        const el=document.elementFromPoint(vx,vy);
        if(el!==prevHoverRef.current){
          if(prevHoverRef.current) prevHoverRef.current.dispatchEvent(new MouseEvent('mouseout',{bubbles:true,cancelable:true}));
          if(el) el.dispatchEvent(new MouseEvent('mouseover',{bubbles:true,cancelable:true,clientX:vx,clientY:vy}));
          prevHoverRef.current=el;
        }
      }
      rafId=requestAnimationFrame(loop);
    };
    rafId=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(rafId);
  },[]);

  // EQ bar animation — runs while musicPlaying
  useEffect(()=>{
    if(musicPlaying){
      eqIntervalRef.current=setInterval(()=>{
        setEqBars(()=>Array.from({length:18},()=>0.08+Math.random()*0.92));
      },90);
    }else{
      clearInterval(eqIntervalRef.current);
      setEqBars(Array.from({length:18},()=>0.08+Math.random()*0.14));
    }
    return()=>clearInterval(eqIntervalRef.current);
  },[musicPlaying]);

  // Audio track load & sync
  useEffect(()=>{
    if(phoneSubApp!=='music')return;
    const tracks=MUSIC_LIB[musicFolder];
    if(!tracks||tracks.length===0)return;
    const track=tracks[musicTrackIdx];
    if(!track)return;
    if(!musicAudioRef.current)musicAudioRef.current=new Audio();
    const a=musicAudioRef.current;
    const absUrl=new URL(track.src,window.location.href).href;
    if(a.src!==absUrl){a.src=track.src;a.load();}
    if(musicPlaying)a.play().catch(()=>{});
    const onTime=()=>setMusicTime(a.currentTime);
    const onMeta=()=>setMusicDuration(a.duration||0);
    const onEnd=()=>{const next=(musicTrackIdx+1)%tracks.length;setMusicTrackIdx(next);};
    a.addEventListener('timeupdate',onTime);
    a.addEventListener('loadedmetadata',onMeta);
    a.addEventListener('ended',onEnd);
    return()=>{a.removeEventListener('timeupdate',onTime);a.removeEventListener('loadedmetadata',onMeta);a.removeEventListener('ended',onEnd);};
  },[phoneSubApp,musicFolder,musicTrackIdx,musicPlaying]);

  // Cleanup EQ animation on unmount — audio lives at QuestApp level, do not touch it here
  useEffect(()=>()=>{clearInterval(eqIntervalRef.current);},[]);

  if(!show)return null;

  const handleClose=onClose;
  const CTRL=inputSrc==='controller';
  const H={close:CTRL?'[SELECT]':'[I]',tabs:CTRL?'[LB/RB]':'[Q/W]',nav:CTRL?'[D-PAD]':'[↑↓]',use:CTRL?'[B]':'[E]',run:CTRL?'[A]':'[SHIFT]',lr:CTRL?'[←→]':'[←→]'};
  const GRID_COLS=5;
  const ITEMS_PER_PAGE=10;
  const TAB_BAR_H=26;
  const HUD_FONT_SCALE=1.4;


  const getTabItems=()=>{
    let tab=HUD_TABS[activeTabIdx];
    if(tab.hasDropdown){
      const safeIdx=Math.min(activeInvSubTabIdx,tab.subTabs.length-1);
      const subTab=tab.subTabs[safeIdx];
      if(subTab)tab=subTab;
    }
    switch(tab.source){
      case 'people': {
        // Only show discovered characters
        const discovered=PEOPLE_DB.filter(p=>p.discovered!==false);
        if(tab.filterStatus==='allies') return discovered.filter(p=>characterCategories[p.id]==='allies');
        if(tab.filterStatus==='suspects') return discovered.filter(p=>characterCategories[p.id]==='suspects');
        return discovered;
      }
      case 'inventory': {
        const items=inventory.filter(id=>ITEM_DEFS[id]).map(id=>({id,...ITEM_DEFS[id]}));
        let filtered=tab.itemCategory?items.filter(it=>it.category===tab.itemCategory):items;
        if((tab.itemCategory==='misc'||!tab.itemCategory)&&money>0){
          filtered=[...filtered,{id:'_money',name:'CASH',category:'misc',icon:'../graphics/inventory/currency/money.png',desc:'',restore:0,_isMoney:true}];
        }
        return filtered;
      }
      case 'threads': {
        const all=[];
        THREAD_CATS.forEach(cat=>{
          (ENTRIES[cat.id]||[]).forEach(e=>all.push({...e,catLabel:cat.label}));
        });
        return all;
      }
      case 'intel': return INTEL_DB;
      case 'places': return PLACES_DB;
      case 'map': return MAP_PINS;
      case 'skills': return SKILLS_DB;
      case 'conversations': return CONVERSATION_HISTORY;
      case 'phone': return PHONE_APPS;
      case 'quests': {
        const category=tab.questCategory;
        return QUESTS_DB[category]||[];
      }
      default: return [];
    }
  };
  const items=getTabItems();
  const selected=items[selectedIdx];

  // Top screen: tab bar + 5x2 grid of items for active tab
  const renderTopScreen=()=>{
    const tab=HUD_TABS[activeTabIdx];
    // Phone → video/image viewer sub-app (top screen)
    if(tab.id==='phone'&&phoneSubApp==='videos'){
      const playing=VIDEO_LIBRARY.find(v=>v.id===playingVideoId)||null;
      const isImageMode=!!viewingImage;
      const F=HUD_FONT_SCALE;

      // Image viewer
      if(isImageMode){return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
          <div style={{display:'flex',alignItems:'center',padding:`${Math.round(2*F)}px ${Math.round(4*F)}px`,borderBottom:`1px solid ${C.border}44`,background:C.panel,flexShrink:0,gap:Math.round(6*F)}}>
            <span style={{color:C.dim,fontSize:Math.round(7*F),cursor:'pointer',userSelect:'none'}} onClick={()=>setViewingImage(null)}>← VIDEO</span>
            <span style={{flex:1,color:C.text,fontSize:Math.round(6*F),letterSpacing:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              // {viewingImage.caption.toUpperCase().slice(0,50)}{viewingImage.caption.length>50?'…':''}
            </span>
          </div>
          <div style={{flex:1,background:'#010101',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
            <img src={viewingImage.src} alt={viewingImage.caption} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',filter:'sepia(0.12) contrast(1.05)'}}/>
          </div>
        </div>
      );}

      // List view (no video selected)
      if(!playing){
        const PADX=Math.round(5*F);
        return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
          {/* Header with clickable BACK + title + count */}
          <div style={{display:'flex',alignItems:'center',padding:`${Math.round(2*F)}px ${PADX}px`,borderBottom:`1px solid ${C.border}44`,background:C.panel,flexShrink:0,gap:Math.round(4*F)}}>
            <span onClick={()=>{setPhoneSubApp(null);setSelectedIdx(0);}}
              style={{color:C.dim,fontSize:Math.round(6*F),cursor:'pointer',userSelect:'none',letterSpacing:1,flexShrink:0,padding:`${Math.round(1*F)}px ${Math.round(2*F)}px`,border:`1px solid ${C.border}66`,borderRadius:2}}>
              ← BACK
            </span>
            <span style={{flex:1,color:C.gold,fontSize:Math.round(7*F),letterSpacing:2,textAlign:'center'}}>// VIDEO ARCHIVE</span>
            <span style={{color:C.dim,fontSize:Math.round(5*F),flexShrink:0}}>{videoLibUnlocked.size}/{VIDEO_LIBRARY.length}</span>
          </div>
          <div style={{flex:1,overflowY:'auto',minHeight:0,padding:`${Math.round(2*F)}px 0`}}>
            {VIDEO_LIBRARY.map((v,i)=>{
              const unlocked=videoLibUnlocked.has(v.id)||(VIDEO_TEST_BYPASS);
              const isSel=i===activeVideoIdx;
              return(
                <div key={v.id} ref={isSel?selectedItemRef:null} data-hudidx={i}
                  onClick={()=>{setActiveVideoIdx(i);if(unlocked){if(musicAudioRef.current&&musicPlaying){musicAudioRef.current.pause();setMusicPlaying(false);}setPlayingVideoId(v.id);setViewingImage(null);}}}
                  style={{display:'flex',alignItems:'center',gap:Math.round(4*F),padding:`${Math.round(3*F)}px ${PADX}px`,
                    borderLeft:`2px solid ${isSel?C.gold:'transparent'}`,
                    background:isSel?C.selBg+'88':'transparent',cursor:'pointer',marginBottom:Math.round(1*F)}}>
                  <span style={{color:unlocked?C.gold:C.dim+'33',fontSize:Math.round(7*F),flexShrink:0,width:Math.round(10*F),textAlign:'center'}}>▶</span>
                  <span style={{flex:1,fontSize:Math.round(7*F),color:isSel?C.gold:unlocked?C.text:C.dim,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.title}</span>
                  <span style={{fontSize:Math.round(5*F),color:v.forbidden&&!unlocked?'#c43028':C.dim,flexShrink:0,letterSpacing:1,whiteSpace:'nowrap'}}>
                    {unlocked?v.duration:'SUPPRESSED'}
                  </span>
                </div>
              );
            })}
          </div>
          <div style={{background:C.panel,borderTop:`1px solid ${C.border}44`,padding:`${Math.round(2*F)}px ${PADX}px`,flexShrink:0,display:'flex',justifyContent:'space-between',color:C.dim,fontSize:Math.round(6*F),letterSpacing:0.5}}>
            <span>[BKS] BACK</span><span>[↑↓] NAV</span><span>[E] OPEN</span>
          </div>
        </div>
      );}

      // Player view (video selected) — CRT display + VCR transport
      const ytPost=(func,args)=>{try{videoPlayerRef.current?.contentWindow?.postMessage(JSON.stringify({event:'command',func,args:args??''}),'*');}catch(e){}};
      const adjustVol=(delta)=>{
        const next=Math.max(0,Math.min(100,ytVolume+delta));
        setYtVolume(next);
        if(ytMuted&&next>0){setYtMuted(false);ytPost('unMute');}
        ytPost('setVolume',[next]);
      };
      const toggleMute=()=>{
        if(ytMuted){setYtMuted(false);ytPost('unMute');}
        else{setYtMuted(true);ytPost('mute');}
      };
      const VCR=[
        {s:'|◄', f:()=>ytPost('seekTo',[0,true])},
        {s:'◄◄', f:()=>ytPost('seekTo',[-15,false])},
        {s:'■',  f:()=>ytPost('stopVideo'),hi:C.red},
        {s:'►',  f:()=>ytPost('playVideo'),hi:C.gold},
        {s:'‖',  f:()=>ytPost('pauseVideo')},
        {s:'►►', f:()=>ytPost('seekTo',[15,false])},
        {s:'►|', f:null},
      ];
      return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
          {/* Header */}
          <div style={{display:'flex',alignItems:'center',gap:Math.round(5*F),padding:`${Math.round(2*F)}px ${Math.round(4*F)}px`,borderBottom:`1px solid ${C.border}44`,background:C.panel,flexShrink:0}}>
            <span style={{color:C.dim,fontSize:Math.round(7*F),cursor:'pointer',userSelect:'none',flexShrink:0}}
              onClick={()=>{setPlayingVideoId(null);setViewingImage(null);}}>← LIST</span>
            <span style={{flex:1,color:C.gold,fontSize:Math.round(6*F),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',letterSpacing:0.5}}>{playing.title}</span>
            <span style={{color:C.red,fontSize:Math.round(5*F),letterSpacing:1,flexShrink:0}}>▶ LIVE</span>
          </div>
          {/* CRT screen */}
          <div style={{flex:1,background:'#010101',position:'relative',overflow:'hidden'}}>
            {playing.src?(
              playing.src.includes('youtube.com')||playing.src.includes('youtu.be')?(
                <iframe ref={videoPlayerRef} key={playing.id}
                  src={playing.src+(playing.src.includes('?')?'&':'?')+'enablejsapi=1&autoplay=1'}
                  style={{width:'100%',height:'100%',border:'none',display:'block'}}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen title={playing.title}/>
              ):(
                <video ref={videoPlayerRef} key={playing.id} src={playing.src}
                  style={{width:'100%',height:'100%',objectFit:'contain'}} controls muted autoPlay/>
              )
            ):(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:Math.round(4*F),textAlign:'center',padding:Math.round(8*F)}}>
                <div style={{color:C.gold,fontSize:Math.round(8*F),fontWeight:700,lineHeight:1.4}}>{playing.title}</div>
                <div style={{color:C.dim,fontSize:Math.round(5*F),letterSpacing:1}}>{playing.category} · {playing.duration}</div>
                <div style={{color:'#c4302888',fontSize:Math.round(5*F),letterSpacing:1}}>// SUPPRESSED — SOURCE PENDING</div>
              </div>
            )}
            <div style={{position:'absolute',inset:0,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000016 3px,#00000016 4px)'}}/>
          </div>
          {/* VCR transport bar */}
          <div style={{background:'#080604',borderTop:`1px solid ${C.border}33`,padding:`${Math.round(4*F)}px ${Math.round(6*F)}px`,flexShrink:0,display:'flex',justifyContent:'center',gap:Math.round(3*F),alignItems:'center'}}>
            {VCR.map((btn,i)=>(
              <div key={i} onClick={btn.f||undefined}
                style={{width:Math.round(22*F),height:Math.round(18*F),display:'flex',alignItems:'center',justifyContent:'center',
                  border:`1px solid ${C.border}55`,background:'#0e0c0a',
                  color:btn.hi||(btn.f?C.text:C.dim+'44'),
                  fontSize:Math.round(7*F),cursor:btn.f?'pointer':'default',userSelect:'none',letterSpacing:0,
                  boxShadow:btn.f?`0 1px 0 ${C.border}33`:undefined}}>
                {btn.s}
              </div>
            ))}
            {/* Separator */}
            <div style={{width:1,height:Math.round(14*F),background:C.border+'66',margin:`0 ${Math.round(2*F)}px`}}/>
            {/* Volume rocker — single tall button, top = vol+, bottom = vol− */}
            <div style={{display:'flex',flexDirection:'column',width:Math.round(22*F),height:Math.round(18*F),border:`1px solid ${C.border}55`,background:'#0e0c0a',userSelect:'none',overflow:'hidden'}}>
              <div onClick={()=>adjustVol(10)}
                style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:ytVolume>=100?C.dim+'66':C.text,fontSize:Math.round(6*F),cursor:'pointer',borderBottom:`1px solid ${C.border}33`,lineHeight:1}}>
                ▲
              </div>
              <div onClick={()=>adjustVol(-10)}
                style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:ytVolume<=0?C.dim+'66':C.text,fontSize:Math.round(6*F),cursor:'pointer',lineHeight:1}}>
                ▼
              </div>
            </div>
            {/* Volume level readout */}
            <div style={{minWidth:Math.round(22*F),height:Math.round(18*F),display:'flex',alignItems:'center',justifyContent:'center',border:`1px solid ${C.border}33`,background:'#050403',color:ytMuted?C.red:C.gold,fontSize:Math.round(6*F),letterSpacing:0,userSelect:'none'}}>
              {ytMuted?'MUTE':String(ytVolume).padStart(2,'0')}
            </div>
            {/* Mute toggle */}
            <div onClick={toggleMute}
              style={{width:Math.round(22*F),height:Math.round(18*F),display:'flex',alignItems:'center',justifyContent:'center',
                border:`1px solid ${ytMuted?C.red:C.border}55`,background:ytMuted?C.selBg:'#0e0c0a',
                color:ytMuted?C.red:C.text,
                fontSize:Math.round(8*F),cursor:'pointer',userSelect:'none',lineHeight:1}}>
              {ytMuted?'⊘':'♪'}
            </div>
          </div>
        </div>
      );
    }
    // Phone → music player top screen
    if(tab.id==='phone'&&phoneSubApp==='music'){
      const F=HUD_FONT_SCALE;
      const tracks=MUSIC_LIB[musicFolder];
      const track=tracks[musicTrackIdx]||null;
      const pct=musicDuration>0?(musicTime/musicDuration)*100:0;
      const fmt=s=>{const m=Math.floor(s/60);const ss=Math.floor(s%60);return`${m}:${ss.toString().padStart(2,'0')}`;};
      const togglePlay=()=>{
        if(!tracks||tracks.length===0)return;
        if(!musicAudioRef.current)musicAudioRef.current=new Audio();
        const a=musicAudioRef.current;
        if(musicPlaying){a.pause();setMusicPlaying(false);}
        else{
          if(track){const abs=new URL(track.src,window.location.href).href;if(a.src!==abs){a.src=track.src;a.load();}}
          a.play().then(()=>setMusicPlaying(true)).catch(()=>{});
        }
      };
      const prevTrack=()=>{setMusicTrackIdx(i=>Math.max(0,i-1));setMusicTime(0);};
      const nextTrack=()=>{setMusicTrackIdx(i=>Math.min((tracks?.length||1)-1,i+1));setMusicTime(0);};
      return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace",background:C.bg}}>
          {/* Header */}
          <div style={{display:'flex',alignItems:'center',padding:`${Math.round(2*F)}px ${Math.round(4*F)}px`,borderBottom:`1px solid ${C.border}44`,background:C.panel,flexShrink:0,gap:Math.round(5*F)}}>
            <span onClick={()=>{setPhoneSubApp(null);setSelectedIdx(0);}} style={{color:C.dim,fontSize:Math.round(6*F),cursor:'pointer',userSelect:'none',letterSpacing:1,border:`1px solid ${C.border}66`,padding:`${Math.round(1*F)}px ${Math.round(3*F)}px`,borderRadius:1}}>← BACK</span>
            <span style={{flex:1,color:C.gold,fontSize:Math.round(7*F),letterSpacing:2,textAlign:'center'}}>// MUSIC</span>
            <span style={{color:musicPlaying?C.red:C.dim+'66',fontSize:Math.round(5*F),letterSpacing:1}}>{musicPlaying?'▶ ON':'■ OFF'}</span>
          </div>
          {/* Track info */}
          <div style={{padding:`${Math.round(4*F)}px ${Math.round(5*F)}px ${Math.round(2*F)}px`,flexShrink:0}}>
            {track?(
              <>
                <div style={{color:C.text,fontSize:Math.round(8*F),letterSpacing:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{track.title}</div>
                <div style={{color:C.dim,fontSize:Math.round(5*F),letterSpacing:2,marginTop:Math.round(1*F)}}>{track.artist||musicFolder.toUpperCase()}</div>
              </>
            ):(
              <div style={{color:C.dim+'55',fontSize:Math.round(7*F),letterSpacing:2}}>// NO TRACKS LOADED</div>
            )}
          </div>
          {/* EQ bars */}
          <div style={{padding:`${Math.round(1*F)}px ${Math.round(5*F)}px`,flexShrink:0,display:'flex',alignItems:'flex-end',gap:1,height:Math.round(32*F)}}>
            {eqBars.map((h,i)=>(
              <div key={i} style={{flex:1,background:musicPlaying?`linear-gradient(to top,${C.red},${C.gold}88)`:C.border+'33',height:`${Math.max(6,Math.round(h*100))}%`,transition:'height 0.09s ease-out'}}/>
            ))}
          </div>
          {/* Progress bar */}
          <div style={{padding:`${Math.round(1*F)}px ${Math.round(5*F)}px`,flexShrink:0}}>
            <div style={{height:3,background:C.border+'33',borderRadius:1,position:'relative',cursor:'pointer'}}
              onClick={e=>{
                if(!musicAudioRef.current||!musicDuration)return;
                const r=e.currentTarget.getBoundingClientRect();
                musicAudioRef.current.currentTime=((e.clientX-r.left)/r.width)*musicDuration;
              }}>
              <div style={{position:'absolute',top:0,left:0,height:'100%',width:`${pct}%`,background:C.red,borderRadius:1,transition:'width 0.3s linear'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:Math.round(1*F)}}>
              <span style={{color:C.dim,fontSize:Math.round(5*F)}}>{fmt(musicTime)}</span>
              <span style={{color:C.dim,fontSize:Math.round(5*F)}}>{track?track.duration||fmt(musicDuration):'--:--'}</span>
            </div>
          </div>
          {/* Playback controls */}
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:Math.round(5*F),padding:`0 ${Math.round(4*F)}px`}}>
            {[
              {lbl:'|◄',fn:()=>{setMusicTrackIdx(0);setMusicTime(0);},big:false},
              {lbl:'◄◄',fn:prevTrack,big:false},
              {lbl:musicPlaying?'■ PAUSE':'▶ PLAY',fn:togglePlay,big:true},
              {lbl:'▶▶',fn:nextTrack,big:false},
              {lbl:'►|',fn:()=>{setMusicTrackIdx(Math.max(0,(tracks?.length||1)-1));setMusicTime(0);},big:false},
            ].map((btn,i)=>(
              <div key={i} onClick={btn.fn} style={{
                padding:`${Math.round(2*F)}px ${Math.round(btn.big?8:4)*F}px`,
                border:`1px solid ${btn.big?C.gold:C.border}66`,
                background:btn.big?C.selBg:'transparent',
                color:btn.big?C.gold:C.dim,
                fontSize:Math.round((btn.big?7:6)*F),
                cursor:'pointer',letterSpacing:1,userSelect:'none',textAlign:'center',
                minWidth:btn.big?Math.round(36*F):Math.round(18*F)}}>
                {btn.lbl}
              </div>
            ))}
          </div>
        </div>
      );
    }
    // Phone home screen (no sub-app open)
    if(tab.id==='phone'&&!phoneSubApp){
      const F=HUD_FONT_SCALE;
      return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',fontFamily:"'Blue Screen',monospace"}}>
          <div style={{display:'flex',height:TAB_BAR_H,borderBottom:`1px solid ${C.border}66`,background:C.panel,flexShrink:0}}>
            {HUD_TABS.map((t,i)=>{
              const active=i===activeTabIdx;
              const hov=i===hoveredTabIdx&&!active;
              return(
                <div key={t.id} onClick={()=>{setActiveTabIdx(i);setSelectedIdx(0);setActiveInvSubTabIdx(0);}} data-hudtab={i}
                  style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:Math.round(8*F),letterSpacing:1,
                    color:active?C.gold:hov?C.text:C.dim,
                    background:active?C.selBg:hov?C.selBg+'44':'transparent',
                    borderBottom:hov?`1px solid ${C.border}88`:'1px solid transparent',
                    cursor:'pointer'}}>
                  {t.label}
                </div>
              );
            })}
          </div>
          <div style={{flex:1,overflowY:'auto',minHeight:0,padding:`${Math.round(3*F)}px ${Math.round(3*F)}px`}}>
            {PHONE_APPS.map((app,i)=>{
              const isSel=i===selectedIdx;
              const isVideos=app.id==='phone_videos';
              const isMusic=app.id==='phone_music';
              const count=isVideos?videoLibUnlocked.size:0;
              const badge=count>0?String(count):'none';
              const hasContent=count>0||isMusic;
              const openApp=()=>{
                setSelectedIdx(i);
                if(isMusic){setPhoneSubApp('music');}
                else if(isVideos&&videoLibUnlocked.size>0){setPhoneSubApp('videos');setActiveVideoIdx(0);setPlayingVideoId(null);}
              };
              return(
                <div key={app.id} ref={isSel?selectedItemRef:null} data-hudidx={i}
                  onClick={openApp}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    padding:`${Math.round(4*F)}px ${Math.round(5*F)}px`,
                    borderLeft:`2px solid ${isSel?C.gold:'transparent'}`,
                    background:isSel?C.selBg+'88':'transparent',cursor:'pointer',marginBottom:Math.round(1*F)}}>
                  <span style={{fontSize:Math.round(8*F),color:isSel?C.gold:hasContent?C.text:C.dim,letterSpacing:1}}>{app.name}</span>
                  <span style={{fontSize:Math.round(7*F),color:hasContent?C.gold:C.dim+'44',letterSpacing:1}}>{isMusic?'▶':badge}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    const isStub=tab.hasDropdown?false:tab.source==='stub';
    return(
      <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
        {/* Tab bar */}
        <div style={{display:'flex',height:TAB_BAR_H,borderBottom:`1px solid ${C.border}66`,background:C.panel,flexShrink:0}}>
          {HUD_TABS.map((t,i)=>{
            const active=i===activeTabIdx;
            const hov=i===hoveredTabIdx&&!active;
            return(
              <div key={t.id} onClick={()=>{setActiveTabIdx(i);setSelectedIdx(0);setActiveInvSubTabIdx(0);}} data-hudtab={i}
                style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:Math.round(8*HUD_FONT_SCALE),letterSpacing:1,
                  color:active?C.gold:hov?C.text:C.dim,
                  background:active?C.selBg:hov?C.selBg+'44':'transparent',
                  borderBottom:hov?`1px solid ${C.border}88`:'1px solid transparent',
                  cursor:'pointer'}}>
                {t.label}
              </div>
            );
          })}
        </div>
        {/* Investigations dropdown menu */}
        {tab.hasDropdown&&tab.id!=='system'&&(
          <div style={{display:'flex',borderBottom:`1px solid ${C.border}66`,background:C.panel,flexShrink:0}}>
            {tab.subTabs.map((st,i)=>{
              const active=i===activeInvSubTabIdx;
              const hov=i===hoveredSubTabIdx&&!active;
              return(
                <div key={st.id} onClick={()=>{setActiveInvSubTabIdx(i);setSelectedIdx(0);}} data-hudsubtab={i}
                  style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:Math.round(3*HUD_FONT_SCALE),
                    fontSize:Math.round(7*HUD_FONT_SCALE),letterSpacing:1,color:active?C.gold:hov?C.text:C.dim,
                    background:active?C.selBg+'88':hov?C.selBg+'44':'transparent',
                    borderBottom:active?`1px solid ${C.red}`:hov?`1px solid ${C.border}66`:'1px solid transparent',cursor:'pointer',padding:'4px 0',position:'relative'}}>
                  {st.label}
                  {st.hasPopout&&(
                    <span onClick={(e)=>{e.stopPropagation();setShowOppPopout(!showOppPopout);}}
                      style={{cursor:'pointer',fontSize:Math.round(6*HUD_FONT_SCALE),opacity:0.8,userSelect:'none'}}>
                      (?)
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {/* System menu bar */}
        {tab.id==='system'&&(
          <div style={{display:'flex',borderBottom:`1px solid ${C.border}66`,background:C.panel,flexShrink:0}}>
            {['SAVE','LOAD','OPTIONS','QUIT'].map((mode)=>{
              const modeId=mode.toLowerCase();
              const active=sysMode===modeId;
              const hov=modeId===hoveredSysMode&&!active;
              return(
                <div key={modeId} onClick={()=>{setSysMode(modeId);setSelectedIdx(0);}} data-hudsys={modeId}
                  style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:Math.round(8*HUD_FONT_SCALE),letterSpacing:1,color:active?C.gold:hov?C.text:C.dim,
                    background:active?C.selBg+'88':hov?C.selBg+'44':'transparent',
                    borderBottom:active?`1px solid ${C.red}`:hov?`1px solid ${C.border}66`:'1px solid transparent',cursor:'pointer',padding:'4px 0',fontWeight:active?'700':'400'}}>
                  {mode}
                </div>
              );
            })}
          </div>
        )}
        {/* Grid OR stub */}
        {isStub&&tab.id==='system'?(
          // System menu modes - simplified
          <div ref={listScrollRef} style={{flex:1,display:'flex',flexDirection:'column',overflowY:'auto',overflowX:'hidden',padding:Math.round(4*HUD_FONT_SCALE)}}>
            {(sysMode==='save'||sysMode==='load')&&SAVE_SLOTS.map((slot,i)=>{
              const isSel=i===selectedIdx;
              return(
                <div key={slot.slot} onClick={()=>{setSelectedIdx(i);}} ref={isSel?selectedItemRef:null} data-hudidx={i}
                  style={{display:'flex',justifyContent:'space-between',padding:`${Math.round(3*HUD_FONT_SCALE)}px ${Math.round(4*HUD_FONT_SCALE)}px`,
                    border:`1px solid ${isSel?C.gold:C.border+'66'}`,
                    background:isSel?C.selBg+'88':'transparent',cursor:'pointer',gap:Math.round(4*HUD_FONT_SCALE),borderRadius:'2px',marginBottom:Math.round(2*HUD_FONT_SCALE)}}>
                  <div style={{display:'flex',flexDirection:'column',gap:Math.round(1*HUD_FONT_SCALE),flex:1}}>
                    <span style={{fontSize:Math.round(9*HUD_FONT_SCALE),color:isSel?C.gold:C.text,fontWeight:'600'}}>{slot.name}</span>
                    <span style={{fontSize:Math.round(7*HUD_FONT_SCALE),color:C.dim}}>// {slot.status==='occupied'?`${slot.scene} · ${slot.time}`:slot.status}</span>
                  </div>

  const stateRef=useRef({activeTabIdx,selectedIdx,handleClose,onUseItem,items,activeInvSubTabIdx,sysMode,activeActionIdx,inputSrc,phoneSubApp,activeVideoIdx,playingVideoId,videoLibUnlocked});
  stateRef.current={activeTabIdx,selectedIdx,handleClose,onUseItem,items,activeInvSubTabIdx,sysMode,activeActionIdx,inputSrc,phoneSubApp,activeVideoIdx,playingVideoId,videoLibUnlocked};
  useEffect(()=>{
    const kd=e=>{
      const stop=()=>{e.stopImmediatePropagation();e.preventDefault();};
      // OPP popout — close on Escape
      if(showOppPopout&&e.code==='Escape'){
        stop();
        setShowOppPopout(false);
        return;
      }
      const s=stateRef.current;
      const tab=HUD_TABS[s.activeTabIdx];
      // Controller B button (KeyE) always clicks the element under the cursor.
      // Must run BEFORE sub-app handlers so cursor-targeted clicks (e.g. ← BACK button)
      // take priority over context actions like "play selected video".
      if(s.inputSrc==='controller'&&e.code==='KeyE'){
        stop();
        const sw=document.getElementById('scale-wrap');
        const r=sw?sw.getBoundingClientRect():{left:0,top:0,width:1280,height:720};
        const vx=r.left+cursorRef.current.x*(r.width/1280);
        const vy=r.top+cursorRef.current.y*(r.height/720);
        const el=document.elementFromPoint(vx,vy);
        if(el)el.click();
        return;
      }
      // Music player sub-app navigation
      if(tab.id==='phone'&&s.phoneSubApp==='music'){
        if(e.code==='Backspace'){
          if(musicAudioRef.current){musicAudioRef.current.pause();}
          setMusicPlaying(false);setPhoneSubApp(null);setSelectedIdx(0);return;
        }
        // Controller uses cursor (left stick + E) — same as the rest of the HUD.
        // Only keyboard gets D-pad style track navigation.
        if(s.inputSrc!=='controller'){
          if(e.code==='ArrowUp'){setMusicTrackIdx(i=>Math.max(0,i-1));return;}
          if(e.code==='ArrowDown'){setMusicTrackIdx(i=>Math.min(Math.max(0,MUSIC_LIB[musicFolder].length-1),i+1));return;}
          if(e.code==='ArrowLeft'){
            const nf=musicFolder==='instrumentals'?'vocals':'instrumentals';
            setMusicFolder(nf);setMusicTrackIdx(0);setMusicTime(0);
            if(musicAudioRef.current&&musicPlaying){musicAudioRef.current.pause();setMusicPlaying(false);}
            return;
          }
          if(e.code==='ArrowRight'){
            const nf=musicFolder==='vocals'?'instrumentals':'vocals';
            setMusicFolder(nf);setMusicTrackIdx(0);setMusicTime(0);
            if(musicAudioRef.current&&musicPlaying){musicAudioRef.current.pause();setMusicPlaying(false);}
            return;
          }
          if(e.code==='KeyE'){
            const tracks=MUSIC_LIB[musicFolder];
            if(!tracks||tracks.length===0)return;
            if(!musicAudioRef.current)musicAudioRef.current=new Audio();
            const a=musicAudioRef.current;
            if(musicPlaying){a.pause();setMusicPlaying(false);}
            else{
              const t=tracks[musicTrackIdx];
              if(t){const abs=new URL(t.src,window.location.href).href;if(a.src!==abs){a.src=t.src;a.load();}}
              a.play().then(()=>setMusicPlaying(true)).catch(()=>{});
            }
            return;
          }
          return;
        }
        // Controller: only handle Backspace (already done above) — cursor+E handles the rest
        return;
      }
      // Video library sub-app navigation
      if(tab.id==='phone'&&s.phoneSubApp==='videos'){
        if(e.code==='Backspace'){
          stop();
          if(s.playingVideoId){setPlayingVideoId(null);setViewingImage(null);}
          else{setPhoneSubApp(null);setSelectedIdx(0);}
          return;
        }
        if(e.code==='ArrowUp'){stop();setActiveVideoIdx(i=>Math.max(0,i-1));return;}
        if(e.code==='ArrowDown'){stop();setActiveVideoIdx(i=>Math.min(VIDEO_LIBRARY.length-1,i+1));return;}
        if(e.code==='KeyE'&&!s.playingVideoId){
          stop();
          const v=VIDEO_LIBRARY[s.activeVideoIdx];
          if(v&&(s.videoLibUnlocked.has(v.id)||VIDEO_TEST_BYPASS)){if(musicAudioRef.current&&musicPlaying){musicAudioRef.current.pause();setMusicPlaying(false);}setPlayingVideoId(v.id);setViewingImage(null);}
          return;
        }
      }
      // Tab switching (Q/W = keyboard, LB/RB = controller via keyMap)
      if(e.code==='KeyQ'){stop();setActiveTabIdx(i=>Math.max(0,i-1));setSelectedIdx(0);setActiveInvSubTabIdx(0);setPhoneSubApp(null);return;}
      if(e.code==='KeyW'){stop();setActiveTabIdx(i=>Math.min(HUD_TABS.length-1,i+1));setSelectedIdx(0);setActiveInvSubTabIdx(0);setPhoneSubApp(null);return;}
      // D-pad disabled in controller mode — left stick cursor handles all navigation
      if(s.inputSrc==='controller'&&(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight')){stop();return;}
      // SYS tab — left/right switches mode, up/down navigates items (save slots)
      if(tab.id==='system'){
        if(e.code==='ArrowLeft'){stop();setSysMode(m=>{const i=SYS_MODES.indexOf(m);return SYS_MODES[Math.max(0,i-1)];});setSelectedIdx(0);return;}
        if(e.code==='ArrowRight'){stop();setSysMode(m=>{const i=SYS_MODES.indexOf(m);return SYS_MODES[Math.min(SYS_MODES.length-1,i+1)];});setSelectedIdx(0);return;}
        if(e.code==='ArrowUp'){stop();setSelectedIdx(i=>Math.max(0,i-1));return;}
        if(e.code==='ArrowDown'){stop();setSelectedIdx(i=>Math.min(SAVE_SLOTS.length-1,i+1));return;}
        // fall through — KeyE ([B]) still needs to reach the confirm handler below
      }
      // Dropdown submenu navigation — left/right for submenu (if investigations tab is active)
      if(tab.hasDropdown){
        if(e.code==='ArrowLeft'){stop();setActiveInvSubTabIdx(i=>Math.max(0,i-1));setSelectedIdx(0);return;}
        if(e.code==='ArrowRight'){stop();setActiveInvSubTabIdx(i=>Math.min(tab.subTabs.length-1,i+1));setSelectedIdx(0);return;}
      }
      // Inventory action row — left/right navigates USE/EQUIP/GIVE/DROP buttons
      if(tab.source==='inventory'){
        if(e.code==='ArrowLeft'){stop();setActiveActionIdx(i=>Math.max(0,i-1));return;}
        if(e.code==='ArrowRight'){stop();setActiveActionIdx(i=>Math.min(3,i+1));return;}
      }
      // Main items navigation — up/down for list navigation
      if(e.code==='ArrowUp'){stop();setSelectedIdx(i=>Math.max(0,i-1));return;}
      if(e.code==='ArrowDown'){stop();setSelectedIdx(i=>Math.min(Math.max(0,s.items.length-1),i+1));return;}
      // Confirm/use
      if(e.code==='KeyE'){
        stop();
        // Controller mode: B button clicks whatever the virtual cursor is over (game→viewport coords)
        if(s.inputSrc==='controller'){
          const sw=document.getElementById('scale-wrap');
          const r=sw?sw.getBoundingClientRect():{left:0,top:0,width:1280,height:720};
          const vx=r.left+cursorRef.current.x*(r.width/1280);
          const vy=r.top+cursorRef.current.y*(r.height/720);
          const el=document.elementFromPoint(vx,vy);
          if(el)el.click();
          return;
        }
        // Keyboard mode: list-based action
        const actualTab=tab.hasDropdown?tab.subTabs[Math.min(s.activeInvSubTabIdx,tab.subTabs.length-1)]:tab;
        // Phone — enter video sub-app
        if(actualTab.source==='phone'){
          const it=s.items[s.selectedIdx];
          if(it&&it.id==='phone_videos'&&s.videoLibUnlocked.size>0){setPhoneSubApp('videos');setActiveVideoIdx(0);setPlayingVideoId(null);}
          if(it&&it.id==='phone_music'){setPhoneSubApp('music');setSelectedIdx(0);}
          return;
        }
        if(actualTab.source==='inventory'){
          const it=s.items[s.selectedIdx];
          if(it){
            const ACT=['USE','EQUIP','GIVE','DROP'];
            const act=ACT[s.activeActionIdx];
            if(act==='USE'){s.onUseItem(it.id);s.handleClose();}
            // EQUIP / GIVE / DROP — stubs, no-op for now
          }
        }
      }
    };
    window.addEventListener('keydown',kd,true);
    return()=>window.removeEventListener('keydown',kd,true);
  },[]);

      const launchTrack=(i)=>{
        setMusicTrackIdx(i);
        if(!musicAudioRef.current)musicAudioRef.current=new Audio();
        const a=musicAudioRef.current;
        const t=MUSIC_LIB[musicFolder][i];
        if(t){a.src=t.src;a.load();a.play().then(()=>setMusicPlaying(true)).catch(()=>{});}
      };
      return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
          {/* Track list */}
          <div style={{flex:1,overflowY:'auto',minHeight:0,padding:`${Math.round(2*F)}px 0`}} ref={listScrollRef}>
            {tracks.length===0?(
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:C.dim+'44',fontSize:Math.round(7*F),letterSpacing:2,flexDirection:'column',gap:Math.round(4*F)}}>
                <span>// NO TRACKS</span>
                <span style={{fontSize:Math.round(5*F),color:C.dim+'33',letterSpacing:1}}>add files to audio/music/{musicFolder}/</span>
              </div>
            ):tracks.map((t,i)=>{
              const isCur=i===musicTrackIdx;
              return(
                <div key={t.id} onClick={()=>launchTrack(i)}
                  style={{display:'flex',alignItems:'center',gap:Math.round(3*F),
                    padding:`${Math.round(3*F)}px ${Math.round(4*F)}px`,
                    background:isCur?C.selBg:'transparent',
                    borderLeft:`2px solid ${isCur?C.red:'transparent'}`,cursor:'pointer'}}>
                  <span style={{color:isCur?C.red:C.dim,fontSize:Math.round(6*F),width:Math.round(12*F),flexShrink:0,textAlign:'right'}}>{isCur?'▶':`${i+1}.`}</span>
                  <span style={{flex:1,color:isCur?C.text:C.dim,fontSize:Math.round(7*F),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.title}</span>
                  <span style={{color:C.dim+'88',fontSize:Math.round(6*F),flexShrink:0}}>{t.duration||'--:--'}</span>
                </div>
              );
            })}
          </div>
          {/* Folder switcher */}
          <div style={{borderTop:`1px solid ${C.border}44`,background:C.panel,flexShrink:0,display:'flex'}}>
            {['instrumentals','vocals'].map(f=>{
              const active=f===musicFolder;
              return(
                <div key={f} onClick={()=>{setMusicFolder(f);setMusicTrackIdx(0);setMusicTime(0);if(musicAudioRef.current&&musicPlaying){musicAudioRef.current.pause();setMusicPlaying(false);}}}
                  style={{flex:1,padding:`${Math.round(5*F)}px`,textAlign:'center',
                    color:active?C.gold:C.dim,
                    background:active?C.selBg:'transparent',
                    borderTop:`2px solid ${active?C.gold:'transparent'}`,
                    fontSize:Math.round(6*F),letterSpacing:2,cursor:'pointer',userSelect:'none'}}>
                  {f.toUpperCase()}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    // Phone home screen (no sub-app open)
    if(tab.id==='phone'&&!phoneSubApp){
      const F=HUD_FONT_SCALE;
      const selApp=PHONE_APPS[selectedIdx]||PHONE_APPS[0];
      const isVideos=selApp?.id==='phone_videos';
      const isMusic=selApp?.id==='phone_music';
      const videoCount=videoLibUnlocked.size;
      const unlockedVids=VIDEO_LIBRARY.filter(v=>videoLibUnlocked.has(v.id));
      return(
        <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',fontFamily:"'Blue Screen',monospace"}}>
          <div style={{padding:`${Math.round(2*F)}px ${Math.round(5*F)}px`,borderBottom:`1px solid ${C.border}33`,flexShrink:0}}>
            <span style={{color:C.red,fontSize:Math.round(6*F),letterSpacing:2}}>// {selApp?.name||'PHONE'}</span>
          </div>
          <div style={{flex:1,overflowY:'auto',minHeight:0,padding:`${Math.round(4*F)}px ${Math.round(5*F)}px`}}>
            {isVideos&&videoCount>0?(
              <>
                <div style={{color:C.text,fontSize:Math.round(7*F),marginBottom:Math.round(4*F),lineHeight:1.5}}>{videoCount} video{videoCount!==1?'s':''} collected</div>
                {unlockedVids.map(v=>(
                  <div key={v.id} style={{color:C.gold,fontSize:Math.round(7*F),lineHeight:1.6,marginBottom:Math.round(2*F)}}>— {v.title}</div>
                ))}
              </>
            ):(
              <div style={{color:C.dim,fontSize:Math.round(7*F),lineHeight:1.7}}>{selApp?.info}</div>
            )}
          </div>
          {isVideos&&videoCount>0&&(
            <div style={{padding:`${Math.round(2*F)}px ${Math.round(4*F)}px`,borderTop:`1px solid ${C.border}33`,flexShrink:0}}>
              <div onClick={()=>{setPhoneSubApp('videos');setActiveVideoIdx(0);setPlayingVideoId(null);}}
                style={{padding:`${Math.round(2*F)}px ${Math.round(6*F)}px`,border:`1px solid ${C.gold}`,background:C.selBg,color:C.gold,fontSize:Math.round(6*F),letterSpacing:1,cursor:'pointer',display:'inline-block',userSelect:'none'}}>
                [E] OPEN VIDEOS
              </div>
            </div>
          )}
          {isMusic&&(
            <div style={{padding:`${Math.round(2*F)}px ${Math.round(4*F)}px`,borderTop:`1px solid ${C.border}33`,flexShrink:0}}>
              <div onClick={()=>setPhoneSubApp('music')}
                style={{padding:`${Math.round(2*F)}px ${Math.round(6*F)}px`,border:`1px solid ${C.gold}`,background:C.selBg,color:C.gold,fontSize:Math.round(6*F),letterSpacing:1,cursor:'pointer',display:'inline-block',userSelect:'none'}}>
                [E] OPEN MUSIC
              </div>
            </div>
          )}
        </div>
      );
    }

    const sysFooter=(
      <div style={{background:C.selBg,borderTop:`1px solid ${C.border}`,padding:`${Math.round(1*HUD_FONT_SCALE)}px ${Math.round(4*HUD_FONT_SCALE)}px`,flexShrink:0,display:'flex',justifyContent:'space-between',color:C.dim,fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:0.5,fontFamily:"'Blue Screen',monospace"}}>
        <span>{H.close} CLOSE</span><span>{H.tabs} TABS</span><span>{H.lr} MODE</span><span>{H.nav} NAV</span><span>{H.use} USE</span>
      </div>
    );
    // Handle SYS tab separately
    if(tab.id==='system'){
      if(sysMode==='save'||sysMode==='load'){
        const slot=SAVE_SLOTS[selectedIdx];
        if(!slot) return(<div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:C.dim,fontSize:Math.round(8*HUD_FONT_SCALE),fontFamily:"'Blue Screen',monospace"}}>// SELECT SLOT</div>);
        return(
          <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
            <div style={{flex:1,display:'flex',padding:Math.round(3*HUD_FONT_SCALE),gap:Math.round(3*HUD_FONT_SCALE),overflow:'hidden',minHeight:0}}>
              <div style={{width:'28%',border:`1px solid ${C.border}66`,background:C.panel,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:C.dim,fontSize:Math.round(7*HUD_FONT_SCALE),textAlign:'center'}}>
                {slot.status==='empty'?'EMPTY':slot.scene.toUpperCase()}
              </div>
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:Math.round(2*HUD_FONT_SCALE),overflow:'hidden',minHeight:0}}>
                <div style={{flexShrink:0}}>
                  <div style={{color:C.gold,fontSize:Math.round(10*HUD_FONT_SCALE),fontWeight:700,letterSpacing:1}}>{slot.name}</div>
                  <div style={{color:C.dim,fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:1,marginTop:Math.round(1*HUD_FONT_SCALE)}}>// {sysMode.toUpperCase()}</div>
                </div>
                <div style={{border:`1px solid ${C.border}44`,padding:`${Math.round(2*HUD_FONT_SCALE)}px ${Math.round(3*HUD_FONT_SCALE)}px`,flexShrink:0,fontSize:Math.round(7*HUD_FONT_SCALE)}}>
                  {[['LOCATION',slot.scene.toUpperCase()],['TIME',slot.time],['STATUS',slot.status.toUpperCase()]].map(([k,v])=>(
                    <div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:Math.round(1*HUD_FONT_SCALE)}}>
                      <span style={{color:C.dim}}>{k}:</span>
                      <span style={{color:C.text}}>{v}</span>
                    </div>
                  ))}
                </div>
                <div style={{flex:1,overflowY:'auto',fontSize:Math.round(7*HUD_FONT_SCALE),color:C.dim,lineHeight:1.4,minHeight:0}}>
                  {slot.status==='empty'?'// Empty slot — available for saving.':'// Progress saved at this location.'}
                </div>
              </div>
            </div>
            {sysFooter}
          </div>
        );
      } else if(sysMode==='options'){
        const previewKey=Object.keys(COLOR_PRESETS)[Math.max(0,Math.min(selectedIdx,Object.keys(COLOR_PRESETS).length-1))];
        const preview=COLOR_PRESETS[previewKey]||COLOR_PRESETS.default;
        return(
          <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
            <div style={{flex:1,padding:Math.round(4*HUD_FONT_SCALE),overflow:'hidden',minHeight:0,display:'flex',flexDirection:'column',gap:Math.round(4*HUD_FONT_SCALE)}}>
              <div style={{color:C.gold,fontSize:Math.round(9*HUD_FONT_SCALE),fontWeight:700,letterSpacing:2}}>{preview.name} — PREVIEW</div>
              {/* Color swatch row */}
              <div style={{display:'flex',gap:Math.round(3*HUD_FONT_SCALE)}}>
                {[['BG',preview.bg],['PANEL',preview.panel],['ACCENT',preview.red],['GOLD',preview.gold],['TEXT',preview.text],['DIM',preview.dim]].map(([label,col])=>(
                  <div key={label} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:Math.round(2*HUD_FONT_SCALE)}}>
                    <div style={{width:'100%',height:Math.round(14*HUD_FONT_SCALE),background:col,border:`1px solid ${preview.border}`}}/>
                    <span style={{fontSize:Math.round(5*HUD_FONT_SCALE),color:C.dim,letterSpacing:0.5}}>{label}</span>
                  </div>
                ))}
              </div>
              <div style={{color:C.dim,fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:0.5,lineHeight:1.5}}>
                {previewKey===activeColorPreset?'// ACTIVE THEME':'// PRESS [E] TO APPLY'}
              </div>
            </div>
            {sysFooter}
          </div>
        );
      } else if(sysMode==='quit'){
        return(
          <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:Math.round(8*HUD_FONT_SCALE),padding:Math.round(8*HUD_FONT_SCALE),textAlign:'center'}}>
              <div style={{color:C.gold,fontSize:Math.round(10*HUD_FONT_SCALE),letterSpacing:2}}>// EXIT GAME?</div>
              <div style={{color:C.text,fontSize:Math.round(8*HUD_FONT_SCALE),lineHeight:1.6}}>Unsaved progress will be lost.</div>
              <div style={{display:'flex',gap:Math.round(12*HUD_FONT_SCALE),fontSize:Math.round(7*HUD_FONT_SCALE),color:C.dim}}>
                <span>[ E ] CONFIRM</span><span>[ ESC ] CANCEL</span>
              </div>
            </div>
            {sysFooter}
          </div>
        );
      }
    }

    const actualTab=tab.hasDropdown?tab.subTabs[Math.min(activeInvSubTabIdx,tab.subTabs.length-1)]:tab;
    const actualSource=actualTab?.source||'stub';
    if(actualSource==='stub'){
      return(
        <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:C.dim,fontSize:Math.round(24*HUD_FONT_SCALE),fontFamily:"'Blue Screen',monospace"}}>
          // NO DATA
        </div>
      );
    }
    if(items.length===0||!selected){
      return(
        <div style={{padding:Math.round(8*HUD_FONT_SCALE),color:C.dim,fontSize:Math.round(24*HUD_FONT_SCALE),fontFamily:"'Blue Screen',monospace"}}>
          // NO {actualTab.label}
        </div>
      );
    }
    let title='', subtitle='', stats=[], body='', useable=false;
    if(actualSource==='people'){
      title=selected.name;
      subtitle=selected.role||'';
      stats=[['STATUS',selected.status],['HANDLE',selected.handle||'—']];
      body=selected.info||'';
    } else if(actualSource==='inventory'){
      if(selected._isMoney){
        title='CASH';
        subtitle='CURRENCY';
        stats=[['AMOUNT','$'+money],['STATUS','ON HAND']];
        body='All I have. Money means options — food, medicine, time. Spend carefully.';
        useable=false;
      } else {
        title=selected.name;
        subtitle=(selected.id||'').toUpperCase();
        stats=selected.restore>0?[['RESTORE','+'+selected.restore+'% VITALS']]:[];
        body=selected.desc||'';
        useable=true;
      }
    } else if(actualSource==='threads'){
      title=selected.name;
      subtitle=selected.handle||selected.catLabel||'';
      stats=[['STATUS',selected.status||'OPEN']];
      body=selected.info||'';
    } else if(actualSource==='intel'){
      title=selected.name;
      subtitle=selected.type||'';
      stats=[['ADDRESS',selected.address||'—'],['HOURS',selected.hours||'—']];
      body=selected.info||'';
    } else if(actualSource==='places'){
      title=selected.name;
      subtitle=selected.type||'';
      stats=[['LOCATION',selected.location||'—'],['STATUS',selected.status||'—']];
      body=selected.info||'';
    } else if(actualSource==='map'){
      title=selected.name;
      subtitle=selected.type||'';
      stats=[['LOCATION',selected.location||'—'],['STATUS',selected.status||'UNKNOWN']];
      body=selected.info||'';
    } else if(actualSource==='skills'){
      title=selected.name;
      subtitle=selected.category||'';
      stats=[['LEVEL',selected.level||'UNKNOWN']];
      body=selected.info||'';
    } else if(actualSource==='conversations'){
      title=selected.npc;
      subtitle=selected.location||'';
      stats=[['WHEN',selected.timestamp||'—'],['TOPIC',selected.summary?.split('.')[0]+'.' || '—']];
      body=selected.excerpt||selected.summary||'';
    } else if(actualSource==='phone'){
      title=selected.name;
      subtitle=selected.type||'';
      const stat1=selected.unread?['UNREAD',selected.unread]:selected.count?['COUNT',selected.count]:selected.areas?['AREAS',selected.areas]:selected.photos?['PHOTOS',selected.photos]:selected.notes?['NOTES',selected.notes]:['STATUS','AVAILABLE'];
      stats=[stat1];
      body=selected.info||'';
    }
    return(
      <div style={{display:'flex',flexDirection:'column',height:'100%',fontFamily:"'Blue Screen',monospace"}}>
        {/* Info display — fills all space above footer */}
        <div style={{flex:1,display:'flex',padding:Math.round(3*HUD_FONT_SCALE),gap:Math.round(3*HUD_FONT_SCALE),overflow:'hidden',minHeight:0}}>
          {/* Left portrait box — fixed 155px square */}
          <div style={{width:'155px',height:'155px',border:`1px solid ${C.border}66`,background:C.panel,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,position:'relative',overflow:'hidden'}}>
            {selected.portrait360?(
              <video
                ref={videoRef}
                src={selected.portrait360}
                style={{width:'100%',height:'100%',objectFit:'cover'}}
                autoPlay
                loop
                muted
                onMouseMove={(e)=>{
                  if(!videoRef.current)return;
                  const rect=e.currentTarget.getBoundingClientRect();
                  const x=(e.clientX-rect.left)/rect.width;
                  if(x<0.4){videoRef.current.playbackRate=Math.max(-2,-1+(x/0.4));}
                  else if(x>0.6){videoRef.current.playbackRate=Math.min(3,1+((x-0.6)/0.4)*2);}
                  else{videoRef.current.playbackRate=0;}
                }}
                onMouseLeave={()=>{if(videoRef.current)videoRef.current.playbackRate=0.5;}}
              />
            ):selected.portrait?(
              <img src={selected.id==='octavia'?(selected[`portrait_${currentOutfit}`]||selected.portrait):selected.portrait} style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'center top'}}/>
            ):selected.icon?(
              <img src={selected.icon} style={{width:'70%',height:'70%',objectFit:'contain',imageRendering:'pixelated'}}/>
            ):(
              <svg width="80%" height="80%" viewBox="0 0 40 40" preserveAspectRatio="none">
                <line x1="0" y1="0" x2="40" y2="40" stroke={C.border} strokeWidth="0.4"/>
                <line x1="0" y1="40" x2="40" y2="0" stroke={C.border} strokeWidth="0.4"/>
              </svg>
            )}
          </div>
          {/* Right column: title + stats + scrollable body */}
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:Math.round(2*HUD_FONT_SCALE),overflow:'hidden',minHeight:0}}>
            {/* Title / subtitle */}
            <div style={{flexShrink:0}}>
              <div style={{color:C.gold,fontSize:Math.round(10*HUD_FONT_SCALE),fontWeight:700,letterSpacing:1,lineHeight:1.2}}>{String(title||'').toUpperCase()}</div>
              {subtitle&&<div style={{color:C.dim,fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:1,marginTop:Math.round(1*HUD_FONT_SCALE)}}>// {String(subtitle).toUpperCase()}</div>}
            </div>
            {/* Stats */}
            {stats.length>0&&(
              <div style={{border:`1px solid ${C.border}44`,padding:`${Math.round(2*HUD_FONT_SCALE)}px ${Math.round(3*HUD_FONT_SCALE)}px`,flexShrink:0,fontSize:Math.round(7*HUD_FONT_SCALE)}}>
                {stats.map(([k,v],i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',gap:Math.round(4*HUD_FONT_SCALE),marginBottom:i<stats.length-1?Math.round(1*HUD_FONT_SCALE):0}}>
                    <span style={{color:C.dim}}>{k}:</span>
                    <span style={{color:C.text,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{String(v||'').toUpperCase()}</span>
                  </div>
                ))}
              </div>
            )}
            {/* Body text — scrolls */}
            <div style={{flex:1,overflowY:'auto',overflowX:'hidden',lineHeight:1.4,color:C.text,minHeight:0,fontSize:Math.round(7*HUD_FONT_SCALE)}}>{body}</div>
            {useable&&(
              <div style={{flexShrink:0,display:'flex',gap:Math.round(3*HUD_FONT_SCALE),marginTop:Math.round(2*HUD_FONT_SCALE)}}>
                {selected.equippable?(
                  // Equippable item: show EQUIP button (or REMOVE if already equipped)
                  <div onClick={()=>{if(onEquipItem)onEquipItem(currentOutfit===selected.id?'cyber_octavia':selected.id);handleClose();}} data-hudaction={0}
                    style={{flex:1,padding:`${Math.round(2*HUD_FONT_SCALE)}px 0`,
                      border:`1px solid ${C.gold}`,
                      background:C.selBg,
                      color:C.gold,
                      fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:1,textAlign:'center',cursor:'pointer'}}>
                    {currentOutfit===selected.id?'REMOVE':'EQUIP'}
                  </div>
                ):(
                  // Consumable: show USE button
                  ['USE','GIVE','DROP'].map((act,ai)=>{
                    const isActSel=ai===activeActionIdx;
                    return(
                      <div key={act} onClick={()=>{setActiveActionIdx(ai);if(act==='USE'){onUseItem(selected.id);handleClose();}}} data-hudaction={ai}
                        style={{flex:1,padding:`${Math.round(2*HUD_FONT_SCALE)}px 0`,
                          border:`1px solid ${isActSel?C.gold:C.border+'66'}`,
                          background:isActSel?C.selBg:'transparent',
                          color:isActSel?C.gold:C.dim,
                          fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:1,textAlign:'center',cursor:'pointer'}}>
                        {act}
                      </div>
                    );
                  })
                )}
              </div>
            )}
            {actualSource==='people'&&(
              <div style={{flexShrink:0,display:'flex',gap:Math.round(3*HUD_FONT_SCALE),marginTop:Math.round(2*HUD_FONT_SCALE)}}>
                {['ALLIES','SUSPECTS'].map((cat)=>{
                  const catLower=cat.toLowerCase();
                  const isCatSel=characterCategories[selected.id]===catLower;
                  return(
                    <div key={cat} onClick={()=>{if(onCategorizeCharacter)onCategorizeCharacter(selected.id,catLower);}}
                      style={{flex:1,padding:`${Math.round(2*HUD_FONT_SCALE)}px 0`,
                        border:`1px solid ${isCatSel?C.gold:C.border+'66'}`,
                        background:isCatSel?C.selBg:'transparent',
                        color:isCatSel?C.gold:C.dim,
                        fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:1,textAlign:'center',cursor:'pointer'}}>
                      {cat}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
        {/* Footer nav instructions — full width, pinned at bottom */}
        <div style={{background:C.selBg,borderTop:`1px solid ${C.border}`,padding:`${Math.round(1*HUD_FONT_SCALE)}px ${Math.round(4*HUD_FONT_SCALE)}px`,flexShrink:0,display:'flex',justifyContent:'space-between',color:C.dim,fontSize:Math.round(6*HUD_FONT_SCALE),letterSpacing:0.5}}>
          <span>{H.close} CLOSE</span>
          <span>{H.tabs} TABS</span>
          <span>{H.nav} NAV</span>
          <span>{H.use} USE</span>
        </div>
      </div>
    );
  };

  // Hover handler — updates list selection, action buttons, and nav highlights.
  // Tabs/subtabs/sys-mode only show a hover glow on hover; they switch on click.
  const handleHover=e=>{
    let node=e.target;
    while(node&&node!==e.currentTarget){
      const ds=node.dataset;
      if(ds){
        if(ds.hudidx!==undefined){setSelectedIdx(parseInt(ds.hudidx));return;}
        if(ds.hudaction!==undefined){setActiveActionIdx(parseInt(ds.hudaction));return;}
        if(ds.hudtab!==undefined){setHoveredTabIdx(parseInt(ds.hudtab));return;}
        if(ds.hudsubtab!==undefined){setHoveredSubTabIdx(parseInt(ds.hudsubtab));return;}
        if(ds.hudsys!==undefined){setHoveredSysMode(ds.hudsys);return;}
      }
      node=node.parentElement;
    }
  };

  const handleMouseOut=e=>{
    let node=e.target;
    while(node&&node!==e.currentTarget){
      const ds=node.dataset;
      if(ds){
        if(ds.hudtab!==undefined){setHoveredTabIdx(null);return;}
        if(ds.hudsubtab!==undefined){setHoveredSubTabIdx(null);return;}
        if(ds.hudsys!==undefined){setHoveredSysMode(null);return;}
      }
      node=node.parentElement;
    }
  };

  return(
    <div style={{position:'fixed',inset:0,zIndex:500,background:C.bg+"a0",display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:'40px',cursor:inputSrc==='controller'?'none':'auto',animation:isClosing?'hudFadeOut 0.4s ease-in forwards':'hudFadeIn 0.4s ease-out forwards'}}>
      <div style={{width:HUD_W+'px',height:HUD_H+'px',position:'relative',overflow:'visible',animation:isClosing?'hudSlideDown 0.4s ease-in forwards':'hudSlideUp 0.4s ease-out forwards'}}>
        {/* Device frame (rendered FIRST, below content) */}
        <img src={DEVICE_HUD_IMG} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:100,objectFit:'contain'}}/>
        {/* Masked content layer — sits ON TOP of the frame; mask clips content to the white regions only */}
        <div onMouseOver={handleHover} onMouseOut={handleMouseOut} style={{
          position:'absolute',inset:0,zIndex:200,isolation:'isolate',

function PauseMenu({onResume,onRestart,onQuit}){
  const [sel,setSel]=useState(0);
  const opts=['RESUME','RESTART AREA','QUIT TO MENU'];
  useEffect(()=>{
    const kd=e=>{
      if(e.code==='Pause'||e.code==='Escape'){onResume();return;}
      if(e.code==='ArrowUp'){setSel(s=>Math.max(0,s-1));}
      if(e.code==='ArrowDown'){setSel(s=>Math.min(opts.length-1,s+1));}
      if(e.code==='KeyE'||e.code==='Enter'){
        if(sel===0)onResume();
        else if(sel===1)onRestart();
        else if(sel===2)onQuit();
      }
      e.stopImmediatePropagation();e.preventDefault();
    };
    window.addEventListener('keydown',kd,true);
    return()=>window.removeEventListener('keydown',kd,true);
  },[sel,onResume,onRestart,onQuit]);
  return(
    <div style={{position:'absolute',inset:0,zIndex:9000,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Blue Screen',monospace"}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:0,minWidth:220}}>
        <div style={{color:C.dim,fontSize:7,letterSpacing:4,marginBottom:24}}>// PAUSED</div>
        {opts.map((o,i)=>(
          <div key={o} onClick={()=>{setSel(i);if(i===0)onResume();else if(i===1)onRestart();else onQuit();}}
            style={{width:'100%',padding:'10px 24px',marginBottom:2,
              background:sel===i?C.selBg:'transparent',
              border:`1px solid ${sel===i?C.gold:C.border+'44'}`,
              color:sel===i?C.gold:C.dim,
              fontSize:9,letterSpacing:2,cursor:'pointer',textAlign:'center'}}>
            {sel===i&&'▶ '}{o}
          </div>
        ))}
      </div>
    </div>
  );
}

function LoadingScreen({onStart}){
  const [progress,setProgress]=useState(0);
  const [status,setStatus]=useState('INITIALIZING');
  const [ready,setReady]=useState(false);
  const [blink,setBlink]=useState(true);
  useEffect(()=>{
    let p=0;
    const phases=[
      {target:28,msg:'INITIALIZING',delay:500},
      {target:58,msg:'LOADING ASSETS',delay:700},
      {target:82,msg:'BUILDING WORLD',delay:600},
      {target:100,msg:'READY',delay:400},
    ];
    let idx=0;
    const tick=()=>{
      if(idx>=phases.length)return;
      const ph=phases[idx];
      if(p<ph.target){p=Math.min(ph.target,p+1.6);setProgress(Math.floor(p));setTimeout(tick,16);}
      else{setStatus(ph.msg);idx++;if(idx<phases.length)setTimeout(tick,ph.delay);else setTimeout(()=>setReady(true),350);}
    };
    setTimeout(tick,400);
  },[]);
  useEffect(()=>{if(!ready)return;const id=setInterval(()=>setBlink(b=>!b),540);return()=>clearInterval(id);},[ready]);
  useEffect(()=>{
    if(!ready)return;
    const h=e=>{if(e.type==='click'||e.type==='keydown')onStart();};
    window.addEventListener('keydown',h);window.addEventListener('click',h);
    // Gamepad: any button press starts the game
    let raf;
    const pollPad=()=>{
      const pads=navigator.getGamepads?navigator.getGamepads():[];
      if([...pads].some(gp=>gp&&gp.buttons.some(b=>b.pressed))){onStart();return;}
      raf=requestAnimationFrame(pollPad);
    };
    raf=requestAnimationFrame(pollPad);
    return()=>{
      window.removeEventListener('keydown',h);window.removeEventListener('click',h);
      cancelAnimationFrame(raf);
    };
  },[ready,onStart]);
  return(
    <div style={{position:'absolute',inset:0,background:'#000',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',fontFamily:"'Blue Screen',monospace",userSelect:'none'}}>
      <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 2px)',pointerEvents:'none',zIndex:2}}/>
      <div style={{position:'relative',zIndex:3,display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{width:440,height:1,background:'#ffffff18',marginBottom:36}}/>
        <div style={{fontSize:64,letterSpacing:18,color:'#e8e0d0',lineHeight:1,textAlign:'center'}}>BEAUREGARDE</div>
        <div style={{fontSize:13,letterSpacing:12,color:'#7a7060',marginTop:12,textAlign:'center'}}>Q U E S T &nbsp;&nbsp; I</div>
        <div style={{width:440,height:1,background:'#ffffff18',marginTop:36,marginBottom:52}}/>
        <div style={{width:340,height:2,background:'#181410',position:'relative',marginBottom:14}}>
          <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${progress}%`,background:'#c8b890',transition:'width 0.08s linear'}}/>
        </div>
        <div style={{fontSize:8,letterSpacing:5,color:'#4a4438',height:14,textAlign:'center'}}>{status}</div>
        <div style={{marginTop:44,fontSize:11,letterSpacing:5,color:ready&&blink?'#c8b890':'transparent',height:18,textAlign:'center'}}>— PRESS ANY KEY TO START —</div>
      </div>
      <div style={{position:'absolute',bottom:18,right:24,fontSize:7,letterSpacing:2,color:'#2a261e',zIndex:3}}>BEAUREGARDE INTERACTIVE © 2026</div>
    </div>
  );
}

  },[]);
  const [debug,setDebug]=useState(true);
  const [showerStat,setNewShowerStat]=useState(null);

  const [musicTrackIdx,setMusicTrackIdx]=useState(0);
  const [musicPlaying,setMusicPlaying]=useState(false);
  const [musicTime,setMusicTime]=useState(0);
  const [musicDuration,setMusicDuration]=useState(0);

  useGamepad();

    };
  },[]);
  useEffect(()=>{
    const h=e=>{
      const id=e.detail?.id;if(!id)return;

  const moLines=useMemo(()=>{

    window.addEventListener('keyup',  block,true);

        hudOpen={showDevice} debug={debug} debugGo={go}/>}
      {scene==='elevator_hallway'&&<ElevatorHallwayScene
        onStairwell={()=>go('apt_stairwell')} onElevator={()=>go('elevator')} onReturn={()=>{setFourthFloorSpawnX(100);go('fourth_floor_hallway');}}
        spawnX={elevatorHallSpawnX}
        currentOutfit={currentOutfit} stamina={stamina} onStaminaChange={setStamina}
        hudOpen={showDevice} debug={debug} debugGo={go}/>}
      {scene==='apt_stairwell'&&<AptStairwellScene
        onReturn={()=>{setElevatorHallSpawnX(663);go('elevator_hallway');}} onDown={()=>{setLobbySpawnX(191);go('lobby');}}
        currentOutfit={currentOutfit} stamina={stamina} onStaminaChange={setStamina}
        hudOpen={showDevice} debug={debug} debugGo={go}/>}
      {scene==='lobby'&&<LobbyScene spawnX={lobbySpawnX} onExit={()=>{setStreetSpawnX(1245);go('street');}} currentOutfit={currentOutfit} stamina={stamina} onStaminaChange={setStamina} hudOpen={showDevice} debug={debug} debugGo={go}/>}
      <Fade on={fading}/>
      {money>0&&scene!=='nightmare'&&scene!=='opening'&&scene!=='bathroom'&&<MoneyHUD amount={money}/>}
      {(scene==='apartment'||scene==='hallway'||scene==='hallway_in'||scene==='street'||scene==='returning'||scene==='store'||scene==='pharmacy'||scene==='restaurant'||scene==='alley_video_store'||scene==='lobby'||scene==='fourth_floor_hallway'||scene==='elevator_hallway'||scene==='apt_stairwell')&&<StaminaBar stamina={stamina}/>}
      {showDevice&&<div style={{position:'absolute',inset:0,zIndex:499,backdropFilter:'blur(6px)',WebkitBackdropFilter:'blur(6px)',background:'rgba(0,0,0,0.55)',pointerEvents:'auto'}}/>}
      {showDevice&&<DeviceHUD show={showDevice} isClosing={isClosingDevice} onClose={closeDevice}
        inventory={inventory} heartNum={heartNum} onUseItem={useItem} money={money}
        onBuyVideo={(price)=>setMoney(m=>Math.max(0,m-price))}
        onChangeColor={handleChangeColor}
        characterCategories={characterCategories} onCategorizeCharacter={handleCategorizeCharacter}
        currentOutfit={currentOutfit} onEquipItem={handleEquipItem}
        videoLibUnlocked={videoLibUnlocked}
        onUnlockVideo={(id)=>setVideoLibUnlocked(s=>{const ns=new Set(s);ns.add(id);localStorage.setItem('beau_videos_v1',JSON.stringify([...ns]));return ns;})}
        musicFolder={musicFolder} setMusicFolder={setMusicFolder}
        musicTrackIdx={musicTrackIdx} setMusicTrackIdx={setMusicTrackIdx}
        musicPlaying={musicPlaying} setMusicPlaying={setMusicPlaying}
        musicTime={musicTime} setMusicTime={setMusicTime}
        musicDuration={musicDuration} setMusicDuration={setMusicDuration}
        musicAudioRef={musicAudioRef}/>}
      {showPause&&<PauseMenu onResume={()=>setShowPause(false)} onRestart={()=>{setShowPause(false);go(scene);}} onQuit={()=>{setShowPause(false);go('opening');}}/>}
      <div style={{position:'absolute',top:14,left:16,zIndex:600,color:`${C.dim}44`,fontSize:8,letterSpacing:3,fontFamily:"'Blue Screen',monospace",opacity:fading?0:1,transition:'opacity 1s'}}>
        QUEST I — WAKING UP
      </div>
      {padConnected&&<div style={{position:'absolute',top:10,right:12,zIndex:600,color:`${C.gold}88`,fontSize:8,letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>● CONTROLLER</div>}
    </div>
  );
}
function Root(){
  const [started,setStarted]=useState(false);
  if(!started)return <LoadingScreen onStart={()=>setStarted(true)}/>;
  return <QuestApp/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
<script>
(function(){
  function scale(){const s=Math.min(window.innerWidth/1280,window.innerHeight/720);const w=document.getElementById('scale-wrap');w.style.transform=`scale(${s})`;w.style.marginLeft=((window.innerWidth-1280*s)/2)+'px';w.style.marginTop='0px';}
  scale();window.addEventListener('resize',scale);
})();
</script>
</body>
</html>
