        {/* NODE LIBRARY — all placed nodes across all graphs */}
        <div className="acc-section">
          <div className="acc-header" onClick={()=>setOpenAcc(o=>o==='library'?null:'library')}>
            <span className="acc-arrow" style={{transform:openAcc==='library'?'rotate(90deg)':''}}>&#9658;</span>
            <span className="acc-label">NODE LIBRARY</span>
            <span className="acc-count">{allLibNodes.length}</span>
          </div>
          {openAcc==='library'&&<div className="acc-body">
            {LIB_GROUPS.map(g=>{
              const gn=allLibNodes.filter(n=>n.type===g.key);
              if(!gn.length)return null;
              const m=NM[g.key]||{icon:'?',color:'#888'};
              return(
                <React.Fragment key={g.key}>
                  <div className="sb-sep" style={{color:m.color}}>{g.label} ({gn.length})</div>
                  {gn.map(n=>(
                    <div key={n.id} className="sb-item" draggable
                      onDragStart={sbDragStart(n.type,n.label||m.lbl,libNodeExtra(n))}
                      onClick={()=>placeNode(n.type,n.label||m.lbl,libNodeExtra(n))}>
                      <span className="sb-item-icon" style={{color:m.color}}>{m.icon}</span>
                      <span className="sb-item-name">{n.label||m.lbl}</span>
                      {n.sceneType&&<span className="sb-item-sub">{n.sceneType}</span>}
                      {n.worldX!==undefined&&!n.sceneType&&<span className="sb-item-sub">x:{n.worldX}</span>}
                    </div>
                  ))}
                </React.Fragment>
              );
            })}
            {allLibNodes.length===0&&(
              <div style={{padding:'16px 12px',fontSize:'7px',color:'var(--muted)',letterSpacing:'1px'}}>
                No nodes yet. Place nodes on any graph to build the library.
              </div>
            )}
          </div>}
        </div>
      </>);
    }

    /* sub-view sidebar — dialogue conditions + node palette */
    if(view.type==='dialogue'){
      const tree=dtrees.find(t=>t.id===view.id);
      const updTree=f=>{
        setDtrees(p=>p.map(t=>{
          if(t.id!==view.id)return t;
          const u={...t,...f};
          const pc=u.playCount||'always';const cc=(u.conditions||[]).length;const pl=u.playLimit||1;
          setMt(prev=>prev.map(mt=>({...mt,nodes:(mt.nodes||[]).map(n=>n.entityId===view.id?{...n,_playCount:pc,_condCount:cc,_playLimit:pl}:n)})));
          return u;
        }));
      };
      const conds=tree?.conditions||[];
      const pc=tree?.playCount||'always';
      const pl=tree?.playLimit||1;
      return(<>
        {/* ── PLAY CONDITIONS ─────────────────────── */}
        <div className="acc-section" style={{borderLeft:'3px solid #e09030'}}>
          <div className="acc-header"><span className="acc-label" style={{color:'#e09030'}}>⚙ PLAY CONDITIONS</span></div>
          <div className="acc-body">
            <div className="pf">
              <label className="pfl">PLAY COUNT</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:2}}>
                {[['always','ALWAYS'],['once','ONCE'],['limit','LIMIT']].map(([v,l])=>(
                  <label key={v} style={{display:'flex',alignItems:'center',gap:4,fontSize:'var(--fxs)',cursor:'pointer',letterSpacing:'1px'}}>
                    <input type="radio" name={'pc_'+view.id} value={v} checked={pc===v} onChange={()=>updTree({playCount:v})}/>
                    {l}
                  </label>
                ))}
              </div>
              {pc==='limit'&&(
                <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6}}>
                  <input className="pfi" type="number" min={1} max={99} style={{width:52}}
                    value={pl} onChange={e=>updTree({playLimit:parseInt(e.target.value)||1})}/>
                  <span style={{fontSize:'var(--fxs)',color:'var(--text2)',letterSpacing:'1px'}}>TIMES</span>
                </div>
              )}
            </div>
            <div className="pf" style={{marginTop:8}}>
              <label className="pfl">CONDITIONS (all must pass)</label>
              {conds.map(c=>(
                <ConditionRow key={c.id} cond={c} outfits={outfits} chars={chars} items={items} quests={quests} vars={vars}
                  onChange={f=>updTree({conditions:conds.map(x=>x.id===c.id?{...x,...f}:x)})}
                  onRemove={()=>updTree({conditions:conds.filter(x=>x.id!==c.id)})}/>
              ))}
              {conds.length===0&&<div style={{fontSize:'var(--fxs)',color:'var(--muted)',letterSpacing:'1px',padding:'4px 0'}}>no conditions — always fires</div>}
              <button className="acc-add" style={{marginTop:6,width:'100%',textAlign:'center'}}
                onClick={()=>updTree({conditions:[...conds,{id:uid(),negate:false,type:'var',op:'is_true',value:'',varId:'',questId:'',questState:'complete'}]})}>
                + ADD CONDITION
              </button>
            </div>
          </div>
        </div>
        {/* ── OCTAVIA'S VOICE ─────────────────────── */}
        <div className="acc-section" style={{borderLeft:'2px solid #40e090'}}>
          <div className="acc-header">
            <span className="acc-label" style={{color:'#40e090'}}>OCTAVIA'S VOICE</span>
          </div>
          <div className="acc-body">
            <div className="sb-item" draggable
              onDragStart={sbDragStart('THOUGHTS','THOUGHTS',{})}
              onClick={()=>placeNode('THOUGHTS','THOUGHTS',{})}>
              <span className="sb-item-icon" style={{color:'#40e090'}}>〰</span>
              <span className="sb-item-name">THOUGHTS</span>
              <span className="sb-item-sub">internal voice</span>
            </div>
          </div>
        </div>
        {/* ── DIALOGUE NODES ──────────────────────── */}
        <div className="acc-section">
          <div className="acc-header"><span className="acc-label">DIALOGUE NODES</span></div>
          <div className="acc-body">
            {['STATEMENT','QUESTION','ITEMS','DEAD_END','LOOP','END_CONVO','OUTFIT_CHECK'].map(type=>{
              const m=NM[type];
              return(<div key={type} className="sb-item" draggable
                onDragStart={sbDragStart(type,m.lbl,{})}
                onClick={()=>placeNode(type,m.lbl,{})}>
                <span className="sb-item-icon" style={{color:m.color}}>{m.icon}</span>
                <span className="sb-item-name">{m.lbl}</span>
              </div>);
            })}
          </div>
        </div>
      </>);
    }

    /* cutscene sub-canvas — own early return like dialogue */
    if(view.type==='cutscene'){
      return(<>
        <div className="acc-section" style={{borderLeft:'3px solid #e05030'}}>
          <div className="acc-header"><span className="acc-label" style={{color:'#e05030'}}>&#9654; CUTSCENE NODES</span></div>
          <div className="acc-body">
            {['CUT_START','CUT_LINE','CUT_CHOICE','CUT_VIDEO','CUT_TITLE','CUT_WAIT','CUT_ACTION'].map(type=>{
              const m=NM[type];
              return(<div key={type} className="sb-item" draggable onDragStart={sbDragStart(type,m.lbl,{})} onClick={()=>placeNode(type,m.lbl,{})}>
                <span className="sb-item-icon" style={{color:m.color}}>{m.icon}</span>
                <span className="sb-item-name">{m.lbl}</span>
              </div>);
            })}
          </div>
        </div>
        <div className="acc-section" style={{borderLeft:'3px solid #d4a020'}}>
          <div className="acc-header">
            <span className="acc-label" style={{color:'#d4a020'}}>&#9733; PRESETS</span>
            <span className="acc-count">{cutPresets.length}</span>
          </div>
          <div className="acc-body">
            {cutPresets.length===0&&<div style={{padding:'10px 12px',fontSize:'var(--fxs)',color:'var(--muted)',letterSpacing:'1px',lineHeight:1.7}}>No presets yet. Edit a node, then click &#9733; SAVE PRESET to save it here.</div>}
            {cutPresets.map(p=>{
              const m=NM[p.type]||{icon:'?',color:'#888',lbl:p.type};
              return(
                <div key={p.id} className="sb-item" draggable
                  onDragStart={sbDragStart(p.type,p.name,p.data)}
                  onClick={()=>placeNode(p.type,p.name,p.data)}>
                  <span style={{fontSize:'var(--fxt)',fontWeight:700,padding:'1px 5px',background:m.color,color:'var(--bg)',letterSpacing:'0.5px',flexShrink:0}}>{(m.lbl||p.type).slice(0,3)}</span>
                  <span className="sb-item-name">{p.name}</span>
                  <span className="node-del" style={{marginLeft:'auto'}} onClick={e=>{e.stopPropagation();setCutPresets(prev=>prev.filter(x=>x.id!==p.id));}}>&#x2715;</span>
                </div>
              );
            })}
          </div>
        </div>
      </>);
    }

    const vtypes=VIEW_NODES[view.type]||[];
    return(<div className="acc-section">
      <div className="acc-header"><span className="acc-label">{view.type.toUpperCase()+' NODES'}</span></div>
      <div className="acc-body">
        {vtypes.map(type=>{
          const m=NM[type];
          return(<div key={type} className="sb-item" draggable
            onDragStart={sbDragStart(type,m.lbl,{})}
            onClick={()=>placeNode(type,m.lbl,{})}>
            <span className="sb-item-icon" style={{color:m.color}}>{m.icon}</span>
            <span className="sb-item-name">{m.lbl}</span>
          </div>);
        })}
        {view.type==='character'&&<>
          <div className="sb-sep">LINK DIALOGUE TREE</div>
          {dtrees.map(t=>(<div key={t.id} className="sb-item" onClick={()=>placeNode('CHAR_DIALOGUE_REF',t.name,{entityId:t.id})}>
            <span className="sb-item-icon">&#128172;</span>
            <span className="sb-item-name">{t.name}</span>
          </div>))}
          <div className="sb-sep">LINK QUEST</div>
          {quests.map(q=>(<div key={q.id} className="sb-item" onClick={()=>placeNode('CHAR_QUEST_REF',q.name,{entityId:q.id})}>
            <span className="sb-item-icon" style={{color:q.major?'#d4a020':'#a08060'}}>{q.major?'◆':'◇'}</span>
            <span className="sb-item-name">{q.name}</span>
          </div>))}
        </>}
        {view.type==='quest'&&<>
          <div className="sb-sep">LINK DIALOGUE</div>
          {dtrees.map(t=>(<div key={t.id} className="sb-item" onClick={()=>placeNode('QUEST_STEP',t.name,{entityId:t.id})}>
            <span className="sb-item-icon">&#128172;</span>
            <span className="sb-item-name">{t.name}</span>
          </div>))}
        </>}
      </div>
    </div>);
  };

  /* ── RENDER ──────────────────────────────────────────────────── */
  return(
    <div className="shell">
      {/* NAV */}
      <div className="nav">
        {vStack.length>1&&<button className="nav-btn back-btn" onClick={popView}>&#8592; BACK</button>}
        <span className="nav-title">&#10216; BEAUREGARDE CONSTRUCTION KIT</span>
        <div className="nav-spacer"/>
        <div className="nav-search">
          <span style={{color:'var(--muted)',fontSize:'9px'}}>&#128269;</span>
          <input className="nav-search-input" value={search}
            onChange={e=>setSearch(e.target.value)}
            placeholder="SEARCH NODES, CHARACTERS, SCENES..."/>
          {search&&<span className="nav-search-clear" onClick={()=>setSearch('')}>&#x2715;</span>}
        </div>
        <select className="pal-sel" value={textSize} onChange={e=>setTextSize(e.target.value)}>
          <option value="sm">TEXT SM</option>
          <option value="md">TEXT MD</option>
          <option value="lg">TEXT LG</option>
          <option value="xl">TEXT XL</option>
          <option value="xxl">TEXT XXL</option>
        </select>
        <select className="pal-sel" value={pal} onChange={e=>setPal(e.target.value)}>
          <option value="void">VOID</option>
          <option value="chalk">CHALK</option>
          <option value="northside">NORTHSIDE</option>
          <option value="chromakopia">CHROMAKOPIA</option>
        </select>
        <button className="nav-btn" style={{borderColor:'var(--accent2)',color:'var(--accent2)',boxShadow:'3px 3px 0 var(--accent2)'}} onClick={()=>setShowGuide(p=>!p)}>◉ GUIDE</button>
        <button className="nav-btn" style={{borderColor:'var(--accent)',color:'var(--accent)',boxShadow:'3px 3px 0 var(--accent)'}} onClick={()=>setShowAI(p=>!p)}>✦ AI</button>
        <button className="nav-btn save-btn" onClick={()=>{saveState({chars,dtrees,quests,mt,amid,outfits,audio,items,vars,cutPresets});showToast('SAVED');}}>SAVE</button>
        <button className="nav-btn export-btn" onClick={exportGame}>EXPORT TO GAME</button>
        <button className="nav-btn back-btn" style={{fontSize:'var(--fxt)',padding:'4px 8px'}}
          title="Change the target file for next export"
          onClick={async()=>{_fhHandle.current=null;try{const db=await getDB();db.transaction('h','readwrite').objectStore('h').delete('exportHandle');}catch(e){}showToast('FILE RESET — next export will prompt');}}>&#128196;</button>
      </div>

      {/* ZONE BAR / BREADCRUMB */}
      {view.type==='master'?(
        <div className="tree-bar">
          {(()=>{
            const t=mt.find(x=>x.id===amid)||mt[0]||{name:'',nodes:[]};
            const zc=t.zoneColor||ZONE_PALETTE[0];
            const zs=(t.name||'?').slice(0,2).toUpperCase();
            return(
              <>
                <div className="zone-indicator" style={{borderRightColor:'var(--brutal)'}}>
                  <div style={{width:22,height:22,background:zc,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'7px',fontWeight:700,color:'var(--bg)',letterSpacing:'0.5px',flexShrink:0}}>{zs}</div>
                  <span style={{fontSize:'var(--fxb)',fontWeight:700,letterSpacing:'2px',color:zc,whiteSpace:'nowrap'}}>{t.name||'—'}</span>
                </div>
                <span style={{padding:'0 12px',fontSize:'var(--fxs)',color:'var(--muted)',letterSpacing:'1px',alignSelf:'center',whiteSpace:'nowrap'}}>
                  {(t.nodes||[]).length}&nbsp;NODES
                </span>
              </>
            );
          })()}
        </div>
      ):(
        <div className="tree-bar">
          {vStack.map((v,i)=>(
            <React.Fragment key={i}>
              {i>0&&<span className="bc-sep">&nbsp;&#8250;&nbsp;</span>}
              <div className={'bc-item'+(i===vStack.length-1?' active':'')}
                onClick={()=>{ if(i<vStack.length-1)setVStack(vStack.slice(0,i+1)); }}>
                {v.type==='dialogue'?(()=>{
                  const tree=dtrees.find(t=>t.id===v.id);
                  const oc=tree?.outfitCondition||'any';
                  return(<>
                    {renamingTree===v.id+'_bc'
                      ?<input autoFocus className="tree-tab-rename" style={{fontSize:'var(--fxb)',marginLeft:4}}
                          defaultValue={tree?.name||''}
                          onBlur={e=>{renameTree(v.id,e.target.value);setRenamingTree(null);}}
                          onKeyDown={e=>{if(e.key==='Enter'){renameTree(v.id,e.target.value);setRenamingTree(null);}e.stopPropagation();}}
                          onClick={e=>e.stopPropagation()}/>
                      :<span style={{marginLeft:4}} onDoubleClick={e=>{e.stopPropagation();setRenamingTree(v.id+'_bc');}} title="double-click to rename">
                        {i===vStack.length-1?'DIALOGUE: '+(tree?.name||v.id):viewName(v)}
                      </span>
                    }
                    <span title={'Outfit: '+outfitLabel(oc,outfits)+' — click to cycle'}
                      style={{marginLeft:6,fontSize:'6px',fontWeight:700,padding:'1px 4px',background:outfitColor(oc,outfits),color:'var(--bg)',borderRadius:1,cursor:'pointer',letterSpacing:'0.5px'}}
                      onClick={e=>{e.stopPropagation();setDtrees(p=>p.map(x=>x.id===v.id?{...x,outfitCondition:cycleOutfitId(x.outfitCondition||'any',outfits)}:x));}}>
                      {outfitBadge(oc,outfits)}
                    </span>
                  </>);
                })():viewName(v)}
              </div>
            </React.Fragment>
          ))}
        </div>
      )}

      {/* BODY */}
      <div className="body-row">
        <div className="sidebar">{renderSidebar()}</div>

        <div className="canvas-area">
          <div className="canvas-wrap" ref={canvasRef}
            onMouseDown={onCMD} onMouseMove={onCMM} onMouseUp={onCMU}
            onWheel={onCW} onContextMenu={onCCM}
            onDrop={onDrop} onDragOver={onDragOver}>

            {nodes.length===0&&(
              <div className="canvas-empty">
                <div className="canvas-empty-label">{viewName(view)}</div>
                {(view.type==='dialogue'||view.type==='cutscene')
                  ?<>
                    <div className="canvas-empty-sub" style={{color:'var(--accent)',letterSpacing:'2px'}}>THIS IS THE NODE CANVAS</div>
                    <div className="canvas-empty-sub" style={{marginTop:4}}>click a node type in the left panel &#8729; it will appear here</div>
                    <div className="canvas-empty-sub" style={{marginTop:2,opacity:0.6}}>then double-click the node to enter its text</div>
                  </>
                  :<div className="canvas-empty-sub">click items in sidebar &#8729; or drag them here</div>
                }
              </div>
            )}

            <WireLayer conns={conns} nodes={nodes} portPositions={portPos} draft={draft} zoom={zoom} offset={offset}/>

            <div className="canvas-inner" style={{transform:'translate('+(offset.x*zoom)+'px,'+(offset.y*zoom)+'px) scale('+zoom+')'}}>
              {nodes.map(n=>(
                <CanvasNode key={n.id} node={n}
                  selected={n.id===selectedId}
                  onHdr={onHdr} onDelete={delNode}
                  onPortMouseDown={onPortMD}
                  onOpen={view.type==='master'?pushView:null}
                  onEdit={view.type==='master'?(id=>setPopover({type:'character',nodeId:n.id,entityId:id})):null}
                  onDblClick={onNodeDblClick}
                  cPorts={cPorts} conns={conns}
                />
              ))}
            </div>
          </div>

        </div>
      </div>

      {/* POPOVERS */}
      {popover?.type==='character' && chars.find(x=>x.id===popover.entityId) && (
        <CharPopover char={chars.find(x=>x.id===popover.entityId)}
          onSave={c=>setChars(p=>p.map(x=>x.id===c.id?c:x))}
          onOpen={pushView} onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='inventory' && nodes.find(x=>x.id===popover.nodeId) && (
        <InventoryPopover node={nodes.find(x=>x.id===popover.nodeId)}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='spawn' && nodes.find(x=>x.id===popover.nodeId) && (
        <SpawnPopover node={nodes.find(x=>x.id===popover.nodeId)}
          chars={chars}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='scene' && nodes.find(x=>x.id===popover.nodeId) && (
        <ScenePopover node={nodes.find(x=>x.id===popover.nodeId)}
          chars={chars} audio={audio}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='quest' && quests.find(x=>x.id===popover.entityId) && (
        <QuestPopover quest={quests.find(x=>x.id===popover.entityId)}
          items={items}
          onSave={q=>setQuests(p=>p.map(x=>x.id===q.id?{...x,...q}:x))}
          onOpen={pushView} onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='dialoguenode' && nodes.find(x=>x.id===popover.nodeId) && (
        <DialogueNodePopover node={nodes.find(x=>x.id===popover.nodeId)}
          chars={chars} items={items}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='itemnode' && nodes.find(x=>x.id===popover.nodeId) && (
        <ItemNodePopover node={nodes.find(x=>x.id===popover.nodeId)}
          items={items}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {itemEdit&&(
        <ItemPopover item={itemEdit.item}
          onSave={saved=>{
            if(itemEdit.isNew)setItems(p=>[...p,saved]);
            else setItems(p=>p.map(x=>x.id===saved.id?saved:x));
            setItemEdit(null);
          }}
          onClose={()=>setItemEdit(null)}/>
      )}
      {varEdit&&(
        <VarPopover variable={varEdit.variable}
          onSave={saved=>{
            if(varEdit.isNew)setVars(p=>[...p,saved]);
            else setVars(p=>p.map(x=>x.id===saved.id?saved:x));
            setVarEdit(null);
          }}
          onClose={()=>setVarEdit(null)}/>
      )}
      {popover?.type==='level' && nodes.find(x=>x.id===popover.nodeId) && (
        <LevelPopover node={nodes.find(x=>x.id===popover.nodeId)}
          chars={chars} audio={audio}
          allLevelNodes={nodes.filter(n=>n.type==='LEVEL_CONNECTOR')}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='questnode' && nodes.find(x=>x.id===popover.nodeId) && (
        <QuestNodePopover node={nodes.find(x=>x.id===popover.nodeId)}
          dtrees={dtrees}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onClose={()=>setPopover(null)}/>
      )}
      {popover?.type==='cutscenenode' && nodes.find(x=>x.id===popover.nodeId) && (
        <CutsceneNodePopover node={nodes.find(x=>x.id===popover.nodeId)}
          onSave={updated=>setNodes(p=>p.map(x=>x.id===updated.id?updated:x))}
          onSavePreset={(name,data)=>setCutPresets(p=>[...p,{id:uid(),name,type:data.type,data}])}
          onClose={()=>setPopover(null)}/>
      )}

      {/* CONTEXT MENU */}
      {ctx&&(
        <div className="ctx-menu" style={{left:ctx.x,top:ctx.y}} onMouseLeave={()=>setCtx(null)}>
          {ctx.nodeId&&<>
            {(nodes.find(n=>n.id===ctx.nodeId)?.type==='CHARACTER'||nodes.find(n=>n.id===ctx.nodeId)?.type==='OCTAVIA')&&(
              <div className="ctx-item" onClick={()=>{const n=nodes.find(x=>x.id===ctx.nodeId);if(n)setPopover({type:'character',nodeId:n.id,entityId:n.entityId||n.id});setCtx(null);}}>EDIT</div>
            )}
            {nodes.find(n=>n.id===ctx.nodeId)?.type==='SCENE'&&(
              <div className="ctx-item" onClick={()=>{setPopover({type:'scene',nodeId:ctx.nodeId});setCtx(null);}}>EDIT SCENE</div>
            )}
            {nodes.find(n=>n.id===ctx.nodeId)?.type==='SPAWN_POINT'&&(
              <div className="ctx-item" onClick={()=>{setPopover({type:'spawn',nodeId:ctx.nodeId});setCtx(null);}}>EDIT SPAWN POINT</div>
            )}
            {nodes.find(n=>n.id===ctx.nodeId)?.type==='LEVEL_CONNECTOR'&&(
              <div className="ctx-item" onClick={()=>{setPopover({type:'level',nodeId:ctx.nodeId});setCtx(null);}}>EDIT LEVEL</div>
            )}
            {view.type==='master'&&NM[nodes.find(n=>n.id===ctx.nodeId)?.type]?.canOpen&&(
              <div className="ctx-item" onClick={()=>{const n=nodes.find(x=>x.id===ctx.nodeId);if(n){const m=NM[n.type];pushView(m.ot,n.entityId||n.id);}setCtx(null);}}>OPEN CANVAS</div>
            )}
            <div className="ctx-item" onClick={()=>{const n=nodes.find(x=>x.id===ctx.nodeId);if(n)placeNode(n.type,n.label,n,null);setCtx(null);}}>DUPLICATE</div>
            <div className="ctx-item danger" onClick={()=>{delNode(ctx.nodeId);setCtx(null);}}>DELETE NODE</div>
          </>}
        </div>
      )}

      {toast&&<div className="toast">{toast}</div>}
      {showGuide&&<GuideModal onClose={()=>setShowGuide(false)}/>}
      {showAI&&<AIAssistant chars={chars} dtrees={dtrees} quests={quests} onClose={()=>setShowAI(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
