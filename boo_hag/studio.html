                {CONSCIOUSNESS_LABELS[vars.consciousness ?? 0]}
              </span>
            </div>
            {Object.keys(store.variables)
              .filter(k => k !== 'calm' && k !== 'consciousness')
              .map(k => {
                const val = vars[k];
                const vv = store.variables[k];
                const isInt = vv?.type === 'int';
                return (
                  <div key={k} className="play-var-row" style={{background: flashedVar === k ? 'rgba(200,136,10,0.12)' : 'transparent', transition:'background 0.3s', borderRadius:3}}>
                    <span className="play-var-name">{k.replace(/_/g,' ')}</span>
                    {isInt ? (
                      <span className="play-var-val">{val ?? vv?.initial ?? 0}</span>
                    ) : (
                      <span className="play-var-val" style={{color: val ? 'var(--amber)' : 'var(--text-dim)'}}>
                        {val ? '✓' : '✗'}
                      </span>
                    )}
                  </div>
                );
              })}

            {/* Quest log — live progress from visited quest-linked nodes */}
            {(store.quests || []).length > 0 && (
              <>
                <div className="play-vars-title" style={{marginTop:14}}>Quests</div>
                {store.quests.map(q => {
                  const objs = q.objectives || [];
                  const objDone = (o) => (o.nodeIds || []).some(r => visitedRefs.includes(r));
                  const doneCount = objs.filter(objDone).length;
                  let liveState = q.state;
                  if (liveState === 'inactive' && doneCount > 0) liveState = 'active';
                  if (liveState !== 'failed' && objs.length > 0 && doneCount === objs.length) liveState = 'complete';
                  const col = liveState === 'complete' ? 'var(--green)'
                            : liveState === 'failed' ? 'var(--red)'
                            : liveState === 'active' ? 'var(--amber)' : 'var(--text-dim)';
                  return (
                    <div key={q.id} style={{marginBottom:8}}>
                      <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <span style={{color:col,fontSize:'9px',flexShrink:0}}>◆</span>
                        <span style={{color:col,fontSize:'10px',fontWeight:'bold',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={q.description || q.name}>
                          {q.name}
                        </span>
                        <span style={{color:'var(--text-dim)',fontSize:'8px',flexShrink:0}}>{liveState}</span>
                      </div>
                      {liveState !== 'inactive' && objs.map(o => (
                        <div key={o.id} style={{display:'flex',gap:5,fontSize:'9px',lineHeight:1.6,paddingLeft:12}}>
                          <span style={{color: objDone(o) ? 'var(--green)' : 'var(--text-dim)',flexShrink:0}}>
                            {objDone(o) ? '✓' : '○'}
                          </span>
                          <span style={{color: objDone(o) ? 'var(--bone-dim)' : 'var(--text-dim)',
                            textDecoration: objDone(o) ? 'line-through' : 'none',
                            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={o.text}>
                            {o.text}
                          </span>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function ShortcutsModal({ onClose }) {
  const groups = [
    { title: 'Global', rows: [
      ['Ctrl+Z', 'Undo last tracked action'],
      ['?', 'Show this shortcuts overlay'],
    ]},
    { title: 'Tree view', rows: [
      ['Scroll', 'Zoom in/out at cursor'],
      ['Drag canvas', 'Pan'],
      ['Drag node', 'Reposition manually'],
      ['Drag ● (node bottom)', 'Connect to another node'],
      ['Right-click canvas', 'Add a node at cursor'],
      ['Click node', 'Select / open edit panel'],
      ['Double-click node', 'Collapse / expand its subtree'],
      ['C', 'Collapse / expand selected node\'s subtree'],
      ['Delete / Backspace', 'Delete selected node'],
      ['Ctrl+D', 'Duplicate selected node'],
      ['Escape', 'Deselect'],
      ['⊡ button', 'Fit all nodes in view'],
      ['⊞ button', 'Clear manual layout (auto-layout)'],
      ['↺ button', 'Reset view to origin'],
    ]},
    { title: 'Chat', rows: [
      ['Enter', 'Send message'],
      ['Shift+Enter', 'New line'],
    ]},
  ];
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'16px 20px',minWidth:340,maxWidth:440,maxHeight:'80vh',overflowY:'auto',boxShadow:'0 12px 40px rgba(0,0,0,0.6)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <h3 style={{margin:0,color:'var(--amber)',fontSize:'13px',letterSpacing:'0.06em'}}>KEYBOARD SHORTCUTS</h3>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        {groups.map(g => (
          <div key={g.title} style={{marginBottom:14}}>
            <div style={{color:'var(--text-dim)',fontSize:'10px',letterSpacing:'0.1em',marginBottom:6,textTransform:'uppercase'}}>{g.title}</div>
            {g.rows.map(([key, desc]) => (
              <div key={key} style={{display:'flex',gap:10,padding:'3px 0',fontSize:'11px'}}>
                <span style={{minWidth:150,flexShrink:0,fontFamily:'monospace',color:'var(--bone)',background:'rgba(0,0,0,0.06)',borderRadius:3,padding:'1px 6px'}}>{key}</span>
                <span style={{color:'var(--bone-dim)'}}>{desc}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState('TREE');
  const [store, setStoreRaw]  = useState(loadStore);
  const [history, setHistory] = useState(loadHistory);
  const [showHistory, setShowHistory]       = useState(false);
  const [showExport, setShowExport]         = useState(false);
  const [showVarsExport, setShowVarsExport] = useState(false);
  const [showInkImport, setShowInkImport]   = useState(false);
  const [pendingNodeContext, setPendingNodeContext] = useState(null);
  const [treeCenterTrigger, setTreeCenterTrigger] = useState(0);
  const [jumpToNode, setJumpToNode] = useState(null);
  const [showShortcuts, setShowShortcuts] = useState(false);
  const [leftWidth, setLeftWidth] = useState(() => {
    const s = localStorage.getItem('boo_hag_left_w');
    return s ? Number(s) : 520;
  });
  const [resizing, setResizing] = useState(false);
  const resizeRef = useRef({ active: false, startX: 0, startW: 0 });

  useEffect(() => {
    const onMove = (e) => {
      if (!resizeRef.current.active) return;
      const dx = e.clientX - resizeRef.current.startX;
      const w = Math.max(280, Math.min(900, resizeRef.current.startW + dx));
      setLeftWidth(w);
      localStorage.setItem('boo_hag_left_w', String(w));
    };
    const onUp = () => {
      if (!resizeRef.current.active) return;
      resizeRef.current.active = false;
      setResizing(false);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, []);

  const startResize = useCallback((e) => {
    e.preventDefault();
    resizeRef.current = { active: true, startX: e.clientX, startW: leftWidth };
    setResizing(true);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }, [leftWidth]);

  const onStoreChange = useCallback((newStore, snapshotLabel) => {
    setStoreRaw(newStore);
    saveStore(newStore);
    if (snapshotLabel) {
      setHistory(prev => {
        const snaps = [...prev.snapshots, { timestamp: Date.now(), label: snapshotLabel, state: newStore }]
          .slice(-MAX_HISTORY);
        const h = { snapshots: snaps };
        saveHistory(h);
        return h;
      });
    }
  }, []);

  // Ctrl+Z undo — ignore while typing so native text-undo in inputs/textareas
  // (e.g. fixing a typo in the chat box) isn't hijacked into reverting the
  // whole studio's design state.
  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        const snaps = history.snapshots;
        if (snaps.length > 1) {
          const prev = snaps[snaps.length - 2];
          setStoreRaw(prev.state);
          saveStore(prev.state);
          setHistory(h => ({ snapshots: h.snapshots.slice(0, -1) }));
        }
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [history]);

  // "?" opens the shortcuts overlay — ignored while typing
  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === '?') { e.preventDefault(); setShowShortcuts(v => !v); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const restoreSnapshot = useCallback((snap) => {
    onStoreChange(snap.state, `Restored: ${snap.label}`);
    setShowHistory(false);
  }, [onStoreChange]);

  const injectNodeToChat = useCallback((node) => {
    const preview = (node.text || node.label || Object.values(node.branches || {})[0] || '').slice(0, 100);
    const contextStr = `[${node.type}${preview ? ': "' + preview + '"' : ''}] `;
    setPendingNodeContext({ str: contextStr, ts: Date.now() });
  }, []);

  const jumpToNodeInScene = useCallback((sceneId, nodeId) => {
    if (store.activeScene !== sceneId) {
      const next = JSON.parse(JSON.stringify(store));
      next.activeScene = sceneId;
      onStoreChange(next, null);
    }
    setTab('TREE');
    setJumpToNode({ sceneId, nodeId, ts: Date.now() });
  }, [store, onStoreChange]);

  return (
    <>
      <div id="root-inner" style={{display:'flex',flexDirection:'column',height:'100vh'}}>
        <div className="topbar">
          <span className="topbar-title">BOO HAG ◆ STUDIO</span>
          <div className="topbar-right">
            <button className="topbar-btn" onClick={() => setShowHistory(true)}>⟳ History ({history.snapshots.length})</button>
            <button className="topbar-btn" onClick={() => setShowInkImport(true)}>⬆ Import .ink</button>
            <button className="topbar-btn" onClick={() => setShowExport(true)}>⬇ Scene .ink</button>
            <button className="topbar-btn" onClick={() => setShowVarsExport(true)}>⬇ variables.ink</button>
            <button className="topbar-btn" onClick={() => {
              const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
              const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
              a.download = `boo_hag_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
            }} title="Download full project backup as JSON">⬇ Backup</button>
            <label className="topbar-btn" style={{cursor:'pointer'}} title="Restore from JSON backup">
              ↑ Restore
              <input type="file" accept=".json" style={{display:'none'}} onChange={e => {
                const file = e.target.files?.[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                  try {
                    const data = JSON.parse(ev.target.result);
                    if (!data.scenes) throw new Error('Not a valid backup');
                    if (!confirm('Replace all studio data with backup? This cannot be undone.')) return;
                    onStoreChange(data, 'Restored from backup');
                  } catch (err) { alert('Invalid backup file: ' + err.message); }
                };
                reader.readAsText(file);
                e.target.value = '';
              }} />
            </label>
            <button className="topbar-btn" style={{color:'var(--text-dim)',fontSize:'10px'}} title="Ctrl+Z to undo">Ctrl+Z</button>
            <button className="topbar-btn" onClick={() => setShowShortcuts(true)} title="Keyboard shortcuts (?)">?</button>
          </div>
        </div>

        <div className="studio-body" style={{cursor: resizing ? 'col-resize' : ''}}>
          {/* LEFT — chat always visible */}
          <div className="left-col" style={{width: leftWidth}}>
            <ChatView
              store={store}
              onStoreChange={onStoreChange}
              history={history}
              pendingNodeContext={pendingNodeContext}
              onSwitchToTree={(andCenter) => { setTab('TREE'); if (andCenter) setTreeCenterTrigger(t => t + 1); }}
              onJumpToNode={jumpToNodeInScene}
            />
          </div>

          {/* DRAG HANDLE */}
          <div className={`resize-handle${resizing ? ' active' : ''}`} onMouseDown={startResize} />

          {/* RIGHT — TREE / STORY / PLAY */}
          <div className="right-col">
            <div className="right-tabs">
              {['TREE','STORY','PLAY'].map(t => (
                <button key={t} className={`right-tab-btn${tab===t?' active':''}`} onClick={() => setTab(t)}>{t}</button>
              ))}
              <span style={{marginLeft:'auto',color:'var(--text-dim)',fontSize:'10px'}}>
                {store.scenes.find(s=>s.id===store.activeScene)?.name || '—'} · {store.scenes.find(s=>s.id===store.activeScene)?.nodes.length || 0} nodes
              </span>
            </div>
            <div className="right-col-content">
              {tab === 'TREE'  && <TreeView  store={store} onStoreChange={onStoreChange} onNodeContext={injectNodeToChat} centerTrigger={treeCenterTrigger} jumpToNode={jumpToNode} onJumpToNode={jumpToNodeInScene} />}
              {tab === 'PLAY'  && <PlayView  store={store} onStoreChange={onStoreChange} />}
              {tab === 'STORY' && <StoryView store={store} onStoreChange={onStoreChange} onSwitchTab={setTab} />}
            </div>
          </div>
        </div>
      </div>

      {showHistory && (
        <HistoryPanel
          history={history}
          onRestore={restoreSnapshot}
          onClose={() => setShowHistory(false)}
        />
      )}

      {showExport && (
        <InkExportModal store={store} onClose={() => setShowExport(false)} />
      )}
      {showVarsExport && (
        <VarsInkModal store={store} onClose={() => setShowVarsExport(false)} />
      )}
      {showInkImport && (
        <InkImportModal
          store={store}
          onStoreChange={onStoreChange}
          onClose={() => setShowInkImport(false)}
          onImported={() => { setTab('TREE'); setTreeCenterTrigger(t => t + 1); }}
        />
      )}
      {showShortcuts && (
        <ShortcutsModal onClose={() => setShowShortcuts(false)} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
