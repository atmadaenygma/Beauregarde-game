function CutsceneNodePopover({node,onSave,onClose,onSavePreset}){
  const t=node.type;
  const meta=NM[t]||{color:'#e05030',lbl:t};
  const TABS_LINE=['CONTENT','EFFECTS'];
  const TABS_VIDEO=['MEDIA','EFFECTS'];
  const [tab,setTab]=useState('CONTENT');
  // --- shared fields ---
  const [text,setText]=useState(node.text||'');
  const [speaker,setSpeaker]=useState(node.speaker||'NARRATOR');
  const [voiceChannel,setVoiceChannel]=useState(node.voiceChannel||'NARRATOR');
  const [textEffect,setTextEffect]=useState(node.textEffect||'typewriter');
  const [effectSpeed,setEffectSpeed]=useState(node.effectSpeed||34);
  const [autoAdvance,setAutoAdvance]=useState(node.autoAdvance||0);
  const [fadeEffect,setFadeEffect]=useState(node.fadeEffect||'none');
  // --- CUT_START ---
  const [background,setBackground]=useState(node.background||'#060a08');
  const [backgroundVideo,setBackgroundVideo]=useState(node.backgroundVideo||'');
  // --- CUT_CHOICE ---
  const [options,setOptions]=useState(node.options||[{text:'',muted:false},{text:'',muted:false},{text:'',muted:true}]);
  const uOpt=(i,f)=>setOptions(p=>p.map((o,j)=>j===i?{...o,...f}:o));
  // --- CUT_VIDEO ---
  const [videoFile,setVideoFile]=useState(node.videoFile||'');
  const [videoEffect,setVideoEffect]=useState(node.videoEffect||'none');
  const [loop,setLoop]=useState(node.loop||false);
  const [duration,setDuration]=useState(node.duration||0);
  const [overlayText,setOverlayText]=useState(node.overlayText||'');
  const [overlayEffect,setOverlayEffect]=useState(node.overlayEffect||'instant');
  // --- CUT_TITLE ---
  const [titleText,setTitleText]=useState(node.titleText||'');
  const [titleSub,setTitleSub]=useState(node.titleSub||'');
  // --- CUT_WAIT ---
  const [waitMs,setWaitMs]=useState(node.waitMs||1000);
  // --- CUT_ACTION ---
  const [action,setAction]=useState(node.action||'goto_scene');
  const [actionValue,setActionValue]=useState(node.actionValue||'');
  // --- preset naming ---
  const [presetNameMode,setPresetNameMode]=useState(false);
  const [presetName,setPresetName]=useState('');

  const vc=VOICE_CHANNELS.find(v=>v.id===voiceChannel)||VOICE_CHANNELS[0];
  const actDef=CUT_ACTIONS.find(a=>a.id===action)||CUT_ACTIONS[0];

  const gather=()=>{
    const base={...node};
    if(t==='CUT_START')  return{...base,background,backgroundVideo};
    if(t==='CUT_LINE')   return{...base,text,speaker,voiceChannel,textEffect,effectSpeed,autoAdvance,fadeEffect};
    if(t==='CUT_CHOICE') return{...base,options};
    if(t==='CUT_VIDEO')  return{...base,videoFile,videoEffect,fadeEffect,loop,duration,overlayText,overlayEffect};
    if(t==='CUT_TITLE')  return{...base,titleText,titleSub,textEffect,background,duration,fadeEffect};
    if(t==='CUT_WAIT')   return{...base,waitMs,fadeEffect};
    if(t==='CUT_ACTION') return{...base,action,actionValue};
    return base;
  };
  const save=()=>{onSave(gather());onClose();};
  const savePreset=()=>{if(presetName.trim()){onSavePreset(presetName.trim(),gather());setPresetNameMode(false);setPresetName('');}};

  const titleMap={CUT_START:'▶ CUT START',CUT_LINE:'💬 LINE',CUT_CHOICE:'? CHOICE',CUT_VIDEO:'⊡ VIDEO',CUT_TITLE:'◈ TITLE CARD',CUT_WAIT:'◷ WAIT',CUT_ACTION:'⚡ ACTION'};

  return(
    <PopoverModal title={titleMap[t]||meta.lbl} color={meta.color} onClose={onClose}>

      {/* tab bar for multi-section nodes */}
      {(t==='CUT_LINE')&&(
        <div className="pop-tabs">
          {TABS_LINE.map(tb=><div key={tb} className={'pop-tab'+(tab===tb?' active':'')} onClick={()=>setTab(tb)}>{tb}</div>)}
        </div>
      )}
      {(t==='CUT_VIDEO')&&(
        <div className="pop-tabs">
          {TABS_VIDEO.map(tb=><div key={tb} className={'pop-tab'+(tab===tb?' active':'')} onClick={()=>setTab(tb)}>{tb}</div>)}
        </div>
      )}

      <div className="pop-tab-body" style={{gap:8}}>

        {/* ── CUT_START ── */}
        {t==='CUT_START'&&(<>
          <div className="pf-row">
            <div className="pf" style={{flex:1}}>
              <label className="pfl">BACKGROUND COLOUR</label>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <input type="color" value={background} onChange={e=>setBackground(e.target.value)}
                  style={{width:40,height:32,border:'2px solid var(--brutal)',cursor:'pointer',background:'none',padding:2}}/>
                <input className="pfi" value={background} onChange={e=>setBackground(e.target.value)} style={{flex:1}}/>
              </div>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">BACKGROUND VIDEO (optional)</label>
            <MediaPicker value={backgroundVideo} onChange={setBackgroundVideo} accept="video" label="BG VIDEO" hint="L:\Beauregarde_game\underneath\graphics\..."/>
          </div>
          <div style={{fontSize:'var(--fxs)',color:'var(--text2)',letterSpacing:'0.5px',lineHeight:1.7}}>This is the entry point for the cutscene. Set the default background here — individual LINE and VIDEO nodes can override it.</div>
        </>)}

        {/* ── CUT_LINE content ── */}
        {t==='CUT_LINE'&&tab==='CONTENT'&&(<>
          <div className="pf-row">
            <div className="pf" style={{flex:3}}>
              <label className="pfl">SPEAKER / NAME (shown above text)</label>
              <input className="pfi" value={speaker} onChange={e=>setSpeaker(e.target.value)} placeholder="NARRATOR, leave blank for no label"/>
            </div>
            <div className="pf" style={{flex:2}}>
              <label className="pfl">VOICE CHANNEL (colour)</label>
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <div style={{width:16,height:16,background:vc.color,flexShrink:0,border:'2px solid var(--brutal)'}}/>
                <select className="pfi" style={{flex:1}} value={voiceChannel} onChange={e=>setVoiceChannel(e.target.value)}>
                  {VOICE_CHANNELS.map(v=><option key={v.id} value={v.id}>{v.id}</option>)}
                </select>
              </div>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">DIALOGUE TEXT</label>
            <textarea className="pfi" rows={5} style={{resize:'vertical',minHeight:90,color:vc.color}} value={text} onChange={e=>setText(e.target.value)} placeholder="Enter the line spoken or narrated…"/>
          </div>
        </>)}

        {/* ── CUT_LINE effects ── */}
        {t==='CUT_LINE'&&tab==='EFFECTS'&&(<>
          <EffectSelect value={textEffect} onChange={setTextEffect} effects={TEXT_EFFECTS} label="TEXT EFFECT"/>
          {(textEffect==='typewriter'||textEffect==='scramble'||textEffect==='glitch')&&(
            <div className="pf">
              <label className="pfl">EFFECT SPEED (ms per character)</label>
              <input className="pfi" type="number" min={5} max={200} value={effectSpeed} onChange={e=>setEffectSpeed(parseInt(e.target.value)||34)}/>
            </div>
          )}
          <div className="pf">
            <label className="pfl">AUTO-ADVANCE (ms — 0 = wait for input)</label>
            <input className="pfi" type="number" min={0} value={autoAdvance} onChange={e=>setAutoAdvance(parseInt(e.target.value)||0)}/>
          </div>
          <EffectSelect value={fadeEffect} onChange={setFadeEffect} effects={FADE_EFFECTS} label="FADE / TRANSITION OUT"/>
        </>)}

        {/* ── CUT_CHOICE ── */}
        {t==='CUT_CHOICE'&&(<>
          <div style={{fontSize:'var(--fxs)',color:'var(--text2)',letterSpacing:'0.5px',lineHeight:1.7,marginBottom:4}}>
            Up to 3 options. Wire each output port (OPT A / B / C) to the next node. MUTED options are visible but greyed out — useful for lore hints the player can't quite reach yet.
          </div>
          {options.slice(0,3).map((o,i)=>(
            <div key={i} style={{background:'var(--raised)',border:'2px solid var(--brutal)',padding:'8px 10px',display:'flex',gap:8,alignItems:'flex-start',flexDirection:'column'}}>
              <div style={{display:'flex',gap:6,alignItems:'center',width:'100%'}}>
                <span style={{fontSize:'var(--fxs)',fontWeight:700,color:'var(--accent)',width:46,flexShrink:0}}>OPT {['A','B','C'][i]}</span>
                <input className="pfi" style={{flex:1}} value={o.text} placeholder={'Option '+(i+1)+' text…'} onChange={e=>uOpt(i,{text:e.target.value})}/>
                <label style={{display:'flex',alignItems:'center',gap:4,fontSize:'var(--fxs)',cursor:'pointer',flexShrink:0}}>
                  <input type="checkbox" checked={!!o.muted} onChange={e=>uOpt(i,{muted:e.target.checked})}/> muted
                </label>
              </div>
            </div>
          ))}
        </>)}

        {/* ── CUT_VIDEO media ── */}
        {t==='CUT_VIDEO'&&tab==='MEDIA'&&(<>
          <div className="pf">
            <label className="pfl">VIDEO FILE</label>
            <MediaPicker value={videoFile} onChange={setVideoFile} accept="video" label="VIDEO CLIP" hint="L:\Beauregarde_game\underneath\graphics\..."/>
          </div>
          <div className="pf-row">
            <div className="pf" style={{flex:1}}>
              <label className="pfl">DURATION (ms — 0 = full length)</label>
              <input className="pfi" type="number" min={0} value={duration} onChange={e=>setDuration(parseInt(e.target.value)||0)}/>
            </div>
            <div className="pf" style={{flex:1}}>
              <label className="pfl">LOOP</label>
              <label style={{display:'flex',alignItems:'center',gap:6,fontSize:'var(--fxs)',cursor:'pointer',marginTop:6,letterSpacing:'1px'}}>
                <input type="checkbox" checked={loop} onChange={e=>setLoop(e.target.checked)}/> LOOP VIDEO
              </label>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">OVERLAY TEXT (optional — appears over the video)</label>
            <input className="pfi" value={overlayText} onChange={e=>setOverlayText(e.target.value)} placeholder="THE VEIL — 4:17 AM"/>
          </div>
          {overlayText&&<EffectSelect value={overlayEffect} onChange={setOverlayEffect} effects={TEXT_EFFECTS} label="OVERLAY TEXT EFFECT" compact/>}
        </>)}

        {/* ── CUT_VIDEO effects ── */}
        {t==='CUT_VIDEO'&&tab==='EFFECTS'&&(<>
          <EffectSelect value={videoEffect} onChange={setVideoEffect} effects={VIDEO_EFFECTS} label="VIDEO ENTRY EFFECT"/>
          <EffectSelect value={fadeEffect} onChange={setFadeEffect} effects={FADE_EFFECTS} label="EXIT / TRANSITION OUT"/>
        </>)}

        {/* ── CUT_TITLE ── */}
        {t==='CUT_TITLE'&&(<>
          <div className="pf-row">
            <div className="pf" style={{flex:1}}>
              <label className="pfl">BACKGROUND COLOUR</label>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <input type="color" value={background} onChange={e=>setBackground(e.target.value)}
                  style={{width:40,height:32,border:'2px solid var(--brutal)',cursor:'pointer',padding:2}}/>
                <input className="pfi" value={background} onChange={e=>setBackground(e.target.value)} style={{flex:1}}/>
              </div>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">TITLE TEXT</label>
            <input className="pfi" value={titleText} onChange={e=>setTitleText(e.target.value)} placeholder="THE VEIL — FOUR YEARS EARLIER"/>
          </div>
          <div className="pf">
            <label className="pfl">SUBTITLE (optional)</label>
            <input className="pfi" value={titleSub} onChange={e=>setTitleSub(e.target.value)} placeholder="4:17 AM"/>
          </div>
          <div className="pf-row">
            <EffectSelect value={textEffect} onChange={setTextEffect} effects={TEXT_EFFECTS} label="TEXT EFFECT"/>
            <div className="pf" style={{flex:1}}>
              <label className="pfl">DISPLAY DURATION (ms)</label>
              <input className="pfi" type="number" min={500} value={duration} onChange={e=>setDuration(parseInt(e.target.value)||3000)}/>
            </div>
          </div>
          <EffectSelect value={fadeEffect} onChange={setFadeEffect} effects={FADE_EFFECTS} label="EXIT TRANSITION"/>
        </>)}

        {/* ── CUT_WAIT ── */}
        {t==='CUT_WAIT'&&(<>
          <div className="pf">
            <label className="pfl">PAUSE DURATION (ms)</label>
            <input className="pfi" type="number" min={100} value={waitMs} onChange={e=>setWaitMs(parseInt(e.target.value)||1000)}/>
            <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'0.5px',marginTop:2}}>Use to breathe between beats — holds on the current frame before the next node fires.</div>
          </div>
          <EffectSelect value={fadeEffect} onChange={setFadeEffect} effects={FADE_EFFECTS} label="FADE DURING WAIT (optional)"/>
        </>)}

        {/* ── CUT_ACTION ── */}
        {t==='CUT_ACTION'&&(<>
          <div className="pf">
            <label className="pfl">ACTION TYPE</label>
            <select className="pfi" value={action} onChange={e=>setAction(e.target.value)}>
              {CUT_ACTIONS.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
            </select>
          </div>
          {actDef.hasValue&&(
            <div className="pf">
              <label className="pfl">VALUE</label>
              <input className="pfi" value={actionValue} placeholder={actDef.valuePlaceholder} onChange={e=>setActionValue(e.target.value)}/>
              {action==='set_var'&&<div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'0.5px',marginTop:2}}>Format: varKey=value (e.g. met_charlie=true)</div>}
              {action==='dip_color'&&<div style={{display:'flex',gap:6,marginTop:4}}><input type="color" value={actionValue||'#000000'} onChange={e=>setActionValue(e.target.value)} style={{width:40,height:28,border:'2px solid var(--brutal)',padding:1}}/></div>}
            </div>
          )}
        </>)}

        {/* ── save / preset controls ── */}
        <div style={{display:'flex',gap:8,marginTop:4,paddingTop:6,borderTop:'2px solid var(--brutal)'}}>
          <button className="isave" style={{flex:2}} onClick={save}>SAVE NODE</button>
          {!presetNameMode
            ?<button className="isave" style={{flex:1,borderColor:'#d4a020',color:'#d4a020'}} onClick={()=>setPresetNameMode(true)}>&#9733; SAVE PRESET</button>
            :<>
              <input className="pfi" style={{flex:2}} value={presetName} placeholder="Preset name…"
                autoFocus onChange={e=>setPresetName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')savePreset();if(e.key==='Escape')setPresetNameMode(false);}}/>
              <button className="isave" style={{flex:1,borderColor:'#d4a020',color:'#d4a020'}} onClick={savePreset}>SAVE</button>
              <button className="ep-close" onClick={()=>setPresetNameMode(false)}>&#x2715;</button>
            </>
          }
        </div>

      </div>
    </PopoverModal>
  );
}

/* ── CONDITION ROW ───────────────────────────────────────────────── */
function ConditionRow({cond,outfits,chars,items,quests,vars,onChange,onRemove}){
  const btn={fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',fontWeight:700,padding:'2px 6px',cursor:'pointer',letterSpacing:'1px',border:'2px solid',flexShrink:0};
  const selVar=(vars||[]).find(v=>v.id===cond.varId);
  return(
    <div style={{display:'flex',gap:5,alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--dimmer)',flexWrap:'wrap'}}>
      <button style={{...btn,background:cond.negate?'var(--red)':'var(--raised)',borderColor:cond.negate?'var(--red)':'var(--brutal)',color:cond.negate?'var(--bg)':'var(--text)'}}
        onClick={()=>onChange({negate:!cond.negate})}>NOT</button>
      <select className="pfi" style={{flex:'0 0 auto',width:74,fontSize:'var(--fxt)',padding:'2px 4px'}}
        value={cond.type} onChange={e=>onChange({type:e.target.value,value:'',op:'is',charId:'',questId:'',questState:'complete',varId:''})}>
        <option value="var">VAR</option>
        <option value="outfit">OUTFIT</option>
        <option value="item">ITEM</option>
        <option value="trust">TRUST</option>
        <option value="scene">SCENE</option>
        <option value="quest">QUEST</option>
      </select>
      {cond.type==='var'&&(<>
        <select className="pfi" style={{flex:2,fontSize:'var(--fxt)',padding:'2px 4px',minWidth:80}}
          value={cond.varId||''} onChange={e=>{const v=(vars||[]).find(x=>x.id===e.target.value);const ops=VAR_OPS[v?.type||'flag'];onChange({varId:e.target.value,op:ops[0][0],value:v?.type==='enum'?(v.enumValues[0]||''):''});}}>
          <option value="">— variable —</option>
          {(vars||[]).map(v=><option key={v.id} value={v.id}>{v.name||v.key}</option>)}
        </select>
        {selVar&&(<select className="pfi" style={{width:64,fontSize:'var(--fxt)',padding:'2px 3px'}}
          value={cond.op||VAR_OPS[selVar.type][0][0]} onChange={e=>onChange({op:e.target.value})}>
          {VAR_OPS[selVar.type].map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>)}
        {selVar&&selVar.type==='int'&&(
          <input className="pfi" type="number" style={{width:48,fontSize:'var(--fxt)',padding:'2px 4px'}}
            value={cond.value||0} onChange={e=>onChange({value:parseInt(e.target.value)||0})}/>
        )}
        {selVar&&selVar.type==='enum'&&(
          <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
            value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
            {(selVar.enumValues||[]).map(v=><option key={v} value={v}>{v}</option>)}
          </select>
        )}
      </>)}
      {cond.type==='outfit'&&(
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
          <option value="">— outfit —</option>
          {(outfits||[]).filter(o=>o.id!=='any').map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
      )}
      {cond.type==='item'&&(
        (items||[]).length>0
          ?<select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
              value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
              <option value="">— item —</option>
              {(items||[]).map(i=><option key={i.id} value={i.key||i.id}>{i.name}</option>)}
            </select>
          :<input className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
              placeholder="item name" value={cond.value||''} onChange={e=>onChange({value:e.target.value})}/>
      )}
      {cond.type==='trust'&&(<>
        <select className="pfi" style={{width:40,fontSize:'var(--fxt)',padding:'2px 3px'}}
          value={cond.op||'gte'} onChange={e=>onChange({op:e.target.value})}>
          <option value="gte">≥</option><option value="lt">&lt;</option>
        </select>
        <input className="pfi" type="number" min={0} max={4} style={{width:38,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||0} onChange={e=>onChange({value:parseInt(e.target.value)||0})}/>
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.charId||''} onChange={e=>onChange({charId:e.target.value})}>
          <option value="">— char —</option>
          {(chars||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </>)}
      {cond.type==='scene'&&(
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
          <option value="">— scene —</option>
          {KNOWN_SCENES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      )}
      {cond.type==='quest'&&(<>
        <select className="pfi" style={{flex:2,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.questId||''} onChange={e=>onChange({questId:e.target.value})}>
          <option value="">— quest —</option>
          {(quests||[]).map(q=><option key={q.id} value={q.id}>{q.name}</option>)}
        </select>
        <select className="pfi" style={{width:76,fontSize:'var(--fxt)',padding:'2px 3px'}}
          value={cond.questState||'complete'} onChange={e=>onChange({questState:e.target.value})}>
          <option value="complete">DONE</option>
          <option value="active">ACTIVE</option>
          <option value="locked">LOCKED</option>
        </select>
      </>)}
      <span style={{color:'var(--red)',cursor:'pointer',fontSize:'11px',padding:'0 4px',flexShrink:0}} onClick={onRemove}>✕</span>
    </div>
  );
}

/* ── NPC DIALOGUE PREBUILDS ──────────────────────────────────────── */
function buildNPCDialogue(key,npc,lines){
  let c=0;
  const did=()=>'npc_'+key+'_'+(Date.now()+c++).toString(36);
  const cn=(s,sp,d,dp)=>({id:did(),src:s,srcPort:sp,dst:d,dstPort:dp});
  const ids=lines.map(()=>did());
  const nodes=lines.map((text,i)=>{
    const isLast=i===lines.length-1;
    return{id:ids[i],type:isLast?'END_CONVO':'STATEMENT',label:'L'+(i+1),x:100,y:80+i*130,text,speaker:npc,relDelta:'+0',emotion:'',voice:''};
  });
  const conns=ids.slice(0,-1).map((id,i)=>cn(id,'out',ids[i+1],'in'));
  const pid=did();
  return{id:pid,name:key,treeType:'dialogue',outfitCondition:'any',playCount:'always',playLimit:1,conditions:[],subCanvas:{nodes,conns}};
}

const NPC_PREBUILDS={
  raymond_browse:   ()=>buildNPCDialogue('raymond_browse','RAYMOND',["What can I get you?","Network moves quiet. Bureau's been two blocks over asking questions. Keep your head down and stay covered.","They don't ask names. They ask descriptions. Come here if you need anything. We take care of our own.","Take your time. Rain's good cover."]),
  raymond_pay:      ()=>buildNPCDialogue('raymond_pay','RAYMOND',["__TOTAL__ Stay warm.","Then you're on the network. Come here, eat something.","Network covers you. But — without money in the Veil you're desperate. Desperate people make mistakes. Find Diego, vendor two doors down. He'll set you up.","Move slow. Head down. You know what you are out here."]),
  raymond_caught:   ()=>buildNPCDialogue('raymond_caught','RAYMOND',["Hey. Where you going with that?","Counter.","Stay safe out there."]),
  raymond_broke:    ()=>buildNPCDialogue('raymond_broke','RAYMOND',["You don't have money, do you?","That's okay. Let me make you something.","Here. Sandwich, water. This is on the network — you're part of us now. Without money in the Veil, you're desperate. Desperate gets you caught.","Diego. Street vendor nearby. He'll set you up with work, food, connections. Tell him Raymond sent you.","People who watch and stay quiet. People who don't cooperate with the Bureau. People who remember what was taken from this neighborhood. The whole block, mostly.","You're why some of us are still here. We knew someone like you would come through eventually.","She's been gone a long time. Longer than you remember. That's all I can say right now — this isn't the place.","The network knows. But you have to move carefully to find out. Find Diego first.","Bureau. Asking questions two blocks over. Descriptions, not names. Keep the hoodie on. Don't run. Move like you belong.","Yeah. Move slow. You belong here. Because you do.","Go find Diego. He'll take care of you."]),
  store_cant_pay:   ()=>buildNPCDialogue('store_cant_pay','RAYMOND',["You don't have enough for that.","No problem. Come back when you're ready."]),
  street_passerby:  ()=>buildNPCDialogue('street_passerby','PASSERBY',["Watch yourself out here tonight. Bureau's been moving through."]),
  street_elder:     ()=>buildNPCDialogue('street_elder','ELDER',["Rain's coming hard, baby. Don't stay out too long."]),
  guard_talk:       ()=>buildNPCDialogue('guard_talk','GUARD',["Keep it moving."]),
  guard_blocked:    ()=>buildNPCDialogue('guard_blocked','GUARD',["You look suspicious. You can't enter.","The Bureau watches for anything unusual. Octopus mutations, neural integrations — all flagged on sight. If you walk in there like that, you're putting everyone here at risk.","Find a disguise. A hoodie, a coat, anything to cover the mutations. This is rule one in the Veil: cover what they're looking for. Come back when you're covered."]),
  pharmacist_browse:()=>buildNPCDialogue('pharmacist_browse','PHARMACIST',["What do you need today?","Four dollars for the painkillers.","Three dollars for the bandages.","Seven dollars — painkillers and bandages.","Come back when you can. Pharmacy is always open.","Of course. Anything else?","Keep those close. Stay safe out there.","You're safe here. No questions asked. There's a doctor three blocks up — Dr. Chen. Runs a clinic from her apartment. Knows about modifications.","Don't lose that. Could save your life."]),
  diego_browse:     ()=>buildNPCDialogue('diego_browse','DIEGO',["Come, child. Get warm. You look like you need real food, yeah?","I make something special. Come, eat.","Eat. First bowl is free. You need strength.","You new to the Veil? First time on the street?","I'm Diego. I been here twenty years. I seen things. I seen people like you — modifications, integration, all that. The network takes care of them. We take care of them.","Bureau raids two blocks away last week. Looking for someone. Someone modified. Looking for a girl with... something on her head.","Maybe. Maybe not. But you need to know: you're not the first. Others came before you. Lived in the Veil. Some stayed. Some moved on. Some got caught.","You need a safe place tonight? I got a friend. Runs a hostel. Hidden. Safe. Network protected. You want, I write down the address.","What's your name? Or do you not remember?","That's okay. They do that. They take memories. Names are first to go. You just remember: you're alive. You survived. That's your name right now — Survivor.","Hostel is safe. They got showers. They got food. They got quiet. You need to recover, you go there. Tell them Diego sent you. They'll know.","Come back tomorrow. I make you special food. Ingredients to help with healing. Help with integration. The network has knowledge about this.","The apartment you're in. There's a computer. Desktop. Old thing. It's locked — password protected. The woman who set up that place, she left the password with people she trusted. She trusted me.","The password is: COLLETTE","Don't write it down. Don't say it out loud once you're inside. Just use it and keep it in your head."]),
  chef_browse:      ()=>buildNPCDialogue('chef_browse','CHEF',["Kitchen's busy."]),
  charlie_first_meeting:()=>buildNPCDialogue('charlie_first_meeting','CHARLIE',["Don't see many new faces down this alley.","Mm. You know this neighborhood's name?","Most people just call it the Veil now. MOVE is the old name. This whole block is named after something that happened here. Long time ago.","I got footage. Real footage. You want to see it?","Check your phone. I'm sending it now."]),
};

/* ── OPENING TEMPLATES ───────────────────────────────────────────── */
function buildOpeningTemplates(){
  let _c=0;
  const tid=()=>'tpl_'+(Date.now()+_c++).toString(36);
  const conn=(src,sp,dst,dp)=>({id:tid(),src,srcPort:sp,dst,dstPort:dp});
  const line=(id,label,text,vc,x,y,aa=0)=>({
    id,type:'CUT_LINE',label,x,y,
    text,speaker:vc==='NARRATOR'?'':vc,
    voiceChannel:vc,textEffect:'typewriter',effectSpeed:28,autoAdvance:aa,fadeEffect:'none'
  });

  /* ── OPENING SEQUENCE (o0–o10) ── */
  const os0=tid();
  const os=[tid(),tid(),tid(),tid(),tid(),tid(),tid(),tid(),tid(),tid(),tid()];
  const osd=[
    ['NARRATOR','Sound: water. Loud. Cold. Already running.'],
    ['FEAR',    'Cold. You are cold. The water has been running for a while. You are standing in it.'],
    ['NARRATOR','Hypothermia is not a metaphor. Your clothes are soaked through. You are cooling.'],
    ['NARRATOR','That question has no answer yet. There is something else. Something on you. Warm. Moving. Alive.'],
    ['FEAR',    'Something alive. On your body. On your head. You can feel it — warm against the cold water. You do not know what it is.'],
    ['NARRATOR','It is not yours. But it is on your nervous system. You feel what it feels. Right now it feels the water. It needs the water.'],
    ['NARRATOR','Hunger but for water. Suffocation but in air. The closest word is need. Which is why you are standing fully clothed in a cold shower.'],
    ['FEAR',    'The cold is yours. The need for water belongs to whatever is on you. Both are real. Both are demanding something.'],
    ['MEMORY',  'There was a before. It is there the way a word is there when you cannot say it. Present. Inaccessible. A woman. Water. Surviving together. That is all.'],
    ['MEMORY',  'She mattered. She matters. You need to find her. But first: the water is cold. Something on you is alive. You are still standing in a shower.'],
    ['FEAR',    'It is waiting for you to decide.'],
  ];
  const osNodes=[
    {id:os0,type:'CUT_START',label:'Opening',x:100,y:60,background:'#080808',backgroundVideo:''},
    ...osd.map(([vc,txt],i)=>line(os[i],'o'+i,txt,vc,100,200+i*150))
  ];
  const osConns=[conn(os0,'first',os[0],'in'),...os.slice(0,-1).map((id,i)=>conn(id,'out',os[i+1],'in'))];

  /* ── SHOWER SEQUENCE ── */
  const sh0=tid(),sh1=tid(),sh2=tid(),sh3=tid(),shQ=tid();
  const shA=[tid(),tid(),tid()],shB=[tid(),tid(),tid()],shC=[tid(),tid(),tid()];
  const shNodes=[
    {id:sh0,type:'CUT_START',label:'Shower',x:100,y:60,background:'#0a1415',backgroundVideo:''},
    line(sh1,'cold',    "It's cold. You're freezing. Get out. Turn it off.",             'FEAR',    100,200),
    line(sh2,'risk',    'Hypothermia risk. Core temperature dropping.',                  'NARRATOR',100,350),
    line(sh3,'alive',   "Something is ON your body. Something ALIVE. Something that can make you FEEL its needs directly.",'NARRATOR',100,500),
    {id:shQ,type:'CUT_CHOICE',label:'What do you do?',x:100,y:660,options:[
      {text:'Turn off the water.',muted:false},
      {text:'Leave it running.',muted:false},
      {text:'Turn it down — something in between.',muted:false},
    ]},
    line(shA[0],'A1',"Water stops. That alien panic FLOODS your nervous system. Not your fear — its fear. Immediate. Drowning.",'NARRATOR',-330,880),
    line(shA[1],'A2',"Turn it back on. NOW. It's dying. Please. PLEASE.",                                               'FEAR',   -330,1030),
    line(shA[2],'A3',"It wasn't your choice. You don't owe it anything.",                                              'NARRATOR',-330,1180),
    line(shB[0],'B1',"You're getting colder. But the alien distress has stopped.",                                     'NARRATOR', 100,880),
    line(shB[1],'B2',"It needed the water. You stayed in the cold for it. It knows that now.",                         'NARRATOR', 100,1030),
    line(shB[2],'B3',"A woman. In water. She understood this. She chose the creature's survival too.",                 'MEMORY',   100,1180),
    line(shC[0],'C1',"Water reduced. Temperature stabilizing. Its panic shifts from drowning to manageable.",          'NARRATOR', 540,880),
    line(shC[1],'C2',"Neither of you gets everything. But neither of you dies. That's partnership.",                   'NARRATOR', 540,1030),
    line(shC[2],'C3',"You have responsibility to something now. That changes everything going forward.",               'NARRATOR', 540,1180),
  ];
  const shConns=[
    conn(sh0,'first',sh1,'in'),conn(sh1,'out',sh2,'in'),conn(sh2,'out',sh3,'in'),conn(sh3,'out',shQ,'in'),
    conn(shQ,'a',shA[0],'in'),conn(shA[0],'out',shA[1],'in'),conn(shA[1],'out',shA[2],'in'),
    conn(shQ,'b',shB[0],'in'),conn(shB[0],'out',shB[1],'in'),conn(shB[1],'out',shB[2],'in'),
    conn(shQ,'c',shC[0],'in'),conn(shC[0],'out',shC[1],'in'),conn(shC[1],'out',shC[2],'in'),
  ];

  /* ── MIRROR SEQUENCE ── */
  const mi0=tid(),miQ=tid(),miSee=tid(),miSub=tid();
  const miA1=[tid(),tid()],miA2=[tid(),tid()],miA3=[tid(),tid()],miB=tid();
  const mirNodes=[
    {id:mi0,type:'CUT_START',label:'Mirror',x:100,y:60,background:'#0e0b08',backgroundVideo:''},
    {id:miQ,type:'CUT_CHOICE',label:'Mirror — look?',x:100,y:200,options:[
      {text:'Look at the mirror.',muted:false},
      {text:"Don't look. One problem at a time.",muted:false},
      {text:'',muted:true},
    ]},
    line(miSee,'see','Tentacles. Red. Living. On your head. On your shoulders. Real.','NARRATOR',-200,400),
    {id:miSub,type:'CUT_CHOICE',label:'Touch it?',x:-200,y:560,options:[
      {text:'Try to pull it off.',muted:false},
      {text:'Touch it gently.',muted:false},
      {text:'Back away.',muted:false},
    ]},
    line(miA1[0],'A1a','PAIN. The tentacle grips your wrist — hard. Holding you in place.',                 'FEAR',   -490,760),
    line(miA1[1],'A1b',"It won't come off. And it will fight back. Don't try that again.",                  'NARRATOR',-490,910),
    line(miA2[0],'A2a','Warm. Wet. Alive. It curls around your fingers. Joy — alien, but real.',            'NARRATOR',-200,760),
    line(miA2[1],'A2b',"It's not a weapon. It's alive. And it wanted to be acknowledged.",                  'NARRATOR',-200,910),
    line(miA3[0],'A3a',"You back away. The tentacles tense — withdraw. It felt your rejection.",            'NARRATOR',  90,760),
    line(miA3[1],'A3b',"It's separate. You're keeping it separate. That's safer.",                          'NARRATOR',  90,910),
    line(miB,    'B',  'One problem at a time.',                                                             'NARRATOR', 400,400),
  ];
  const mirConns=[
    conn(mi0,'first',miQ,'in'),
    conn(miQ,'a',miSee,'in'),conn(miSee,'out',miSub,'in'),
    conn(miSub,'a',miA1[0],'in'),conn(miA1[0],'out',miA1[1],'in'),
    conn(miSub,'b',miA2[0],'in'),conn(miA2[0],'out',miA2[1],'in'),
    conn(miSub,'c',miA3[0],'in'),conn(miA3[0],'out',miA3[1],'in'),
    conn(miQ,'b',miB,'in'),
  ];

  const mk=o=>({outfitCondition:'any',playCount:'once',playLimit:1,conditions:[],...o});
  return[
    mk({id:tid(),name:'opening_sequence',treeType:'cutscene',subCanvas:{nodes:osNodes,conns:osConns}}),
    mk({id:tid(),name:'shower_sequence', treeType:'cutscene',subCanvas:{nodes:shNodes, conns:shConns}}),
    mk({id:tid(),name:'mirror_sequence', treeType:'cutscene',subCanvas:{nodes:mirNodes,conns:mirConns}}),
  ];
}

/* ── APP ─────────────────────────────────────────────────────────── */
function App(){
  const [pal,setPal]=useState('void');
  const [textSize,setTextSize]=useState('sm');
  const [showAI,setShowAI]=useState(false);
  useEffect(()=>{
    const cls=[];
    if(pal!=='void')cls.push(`pal-${pal}`);
    if(textSize!=='sm')cls.push(`fs-${textSize}`);
    document.body.className=cls.join(' ');
  },[pal,textSize]);

  /* entity state */
  const init=useMemo(()=>{
    const s=loadState();
    if(s)return{chars:s.chars,dtrees:s.dtrees,quests:s.quests,mt:s.mt,amid:s.amid,outfits:s.outfits||OUTFITS_DEFAULT,audio:s.audio||AUDIO_DEFAULT,items:s.items||[],vars:s.vars||[],cutPresets:s.cutPresets||[]};
    return{chars:SEED_CHARS,dtrees:SEED_TREES,quests:SEED_QUESTS,
      mt:[
        {id:'z1',name:'THE VEIL',zoneColor:'#5090d0',treeType:'general',nodes:[],conns:[]},
        {id:'z2',name:'MOVE',zoneColor:'#e05030',treeType:'general',nodes:[],conns:[]},
        {id:'z3',name:'HARBOR',zoneColor:'#1a7870',treeType:'general',nodes:[],conns:[]},
      ],amid:'z1',outfits:OUTFITS_DEFAULT,audio:AUDIO_DEFAULT,items:[],vars:[],cutPresets:[]};
  },[]);
  const [chars,setChars]=useState(init.chars);
  const [dtrees,setDtrees]=useState(init.dtrees);
  const [quests,setQuests]=useState(init.quests);
  const [mt,setMt]=useState(init.mt); /* master trees */
  const [amid,setAmid]=useState(init.amid); /* active master tree id */
  const [outfits,setOutfits]=useState(init.outfits||OUTFITS_DEFAULT);
  const [audio,setAudio]=useState(init.audio||AUDIO_DEFAULT);
  const [items,setItems]=useState(init.items||[]);
  const [itemEdit,setItemEdit]=useState(null); /* {item, isNew} */
  const [vars,setVars]=useState(init.vars||[]);
  const [varEdit,setVarEdit]=useState(null); /* {variable, isNew} */
  const [cutPresets,setCutPresets]=useState(init.cutPresets||[]);

  useEffect(()=>{ saveState({chars,dtrees,quests,mt,amid,outfits,audio,items,vars,cutPresets}); },[chars,dtrees,quests,mt,amid,outfits,audio,items,vars,cutPresets]);

  /* view stack */
  const [vStack,setVStack]=useState([{type:'master',id:null}]);
  const view=vStack[vStack.length-1];
  const pushView=(type,id)=>setVStack(p=>[...p,{type,id}]);
  const popView=()=>setVStack(p=>p.length>1?p.slice(0,-1):p);

  /* accordion */
  const [openAcc,setOpenAcc]=useState('locs');
  const [openOutfits,setOpenOutfits]=useState(false);
  const [openAudio,setOpenAudio]=useState(false);
  const [showGuide,setShowGuide]=useState(false);
  const [openTip,setOpenTip]=useState(null);

  /* popover */
  const [popover,setPopover]=useState(null);

  /* search */
  const [search,setSearch]=useState('');

  /* all nodes across all master trees (for library) */
  const allLibNodes=useMemo(()=>mt.flatMap(t=>t.nodes||[]),[mt]);

  /* rename tree tab */
  const [renamingTab,setRenamingTab]=useState(null);
  const [renamingTree,setRenamingTree]=useState(null);
  const renameTree=(id,newName)=>{
    const name=newName.trim()||'Untitled';
    setDtrees(p=>p.map(x=>x.id===id?{...x,name}:x));
    setMt(p=>p.map(mt=>({...mt,nodes:(mt.nodes||[]).map(n=>n.entityId===id?{...n,label:name}:n)})));
  };

  /* reset view state on navigation */
  useEffect(()=>{ setOffset({x:80,y:40}); setZoom(1); setSelectedId(null); setPopover(null); },[view]);

  /* ── ACTIVE CANVAS ─────────────────────────────────────────────── */
  const activeCanvas=useMemo(()=>{
    if(view.type==='master'){
      const t=mt.find(t=>t.id===amid)||mt[0]||{nodes:[],conns:[]};
      return{nodes:t.nodes||[],conns:t.conns||[]};
    }
    const map={character:chars,dialogue:dtrees,quest:quests,cutscene:dtrees};
    const ent=(map[view.type]||[]).find(e=>e.id===view.id);
    return{nodes:ent?.subCanvas?.nodes||[],conns:ent?.subCanvas?.conns||[]};
  },[view,mt,amid,chars,dtrees,quests]);

  const setNodes=useCallback(fn=>{
    if(view.type==='master'){
      setMt(prev=>prev.map(t=>t.id===amid?{...t,nodes:typeof fn==='function'?fn(t.nodes):fn}:t));
    }else{
      const setter={character:setChars,dialogue:setDtrees,quest:setQuests,cutscene:setDtrees}[view.type];
      if(setter)setter(prev=>prev.map(e=>e.id===view.id?{...e,subCanvas:{...e.subCanvas,nodes:typeof fn==='function'?fn(e.subCanvas.nodes||[]):fn}}:e));
    }
  },[view,amid]);

  const setConns=useCallback(fn=>{
    if(view.type==='master'){
      setMt(prev=>prev.map(t=>t.id===amid?{...t,conns:typeof fn==='function'?fn(t.conns):fn}:t));
    }else{
      const setter={character:setChars,dialogue:setDtrees,quest:setQuests,cutscene:setDtrees}[view.type];
      if(setter)setter(prev=>prev.map(e=>e.id===view.id?{...e,subCanvas:{...e.subCanvas,conns:typeof fn==='function'?fn(e.subCanvas.conns||[]):fn}}:e));
    }
  },[view,amid]);

  const nodes=activeCanvas.nodes;
  const conns=activeCanvas.conns;

  /* master tree management */
  const newMT=()=>{const id=uid();setMt(p=>{const color=mkZoneColor(p);return[...p,{id,name:'New Zone',zoneColor:color,treeType:'general',nodes:[],conns:[]}];});setAmid(id);setRenamingTab(id);};
  const delMT=id=>{if(mt.length<=1)return;setMt(p=>p.filter(t=>t.id!==id));if(amid===id)setAmid(mt.find(t=>t.id!==id)?.id||null);};
  const renMT=(id,name)=>setMt(p=>p.map(t=>t.id===id?{...t,name:name||t.name}:t));
  const cycleMT=id=>setMt(p=>p.map(t=>{if(t.id!==id)return t;const types=TREE_TYPES;const next=types[(types.indexOf(t.treeType||'general')+1)%types.length];return{...t,treeType:next};}));

  /* canvas pan/zoom */
  const [offset,setOffset]=useState({x:80,y:40});
  const [zoom,setZoom]=useState(1);
  const canvasRef=useRef();
  const isPanning=useRef(false);
  /* always-current dtrees ref so stable callbacks can route correctly */
  const dtreesRef=useRef(dtrees);
  useEffect(()=>{dtreesRef.current=dtrees;},[dtrees]);
  const panStart=useRef({x:0,y:0,ox:0,oy:0});

  /* port positions */
  const portPos=useRef(new Map());
  const [,rerender]=useState(0);
  useLayoutEffect(()=>{
    const wrap=canvasRef.current;
    if(!wrap)return;
    const nm=new Map();
    const wR=wrap.getBoundingClientRect();
    wrap.querySelectorAll('.pd[data-port]').forEach(el=>{
      const r=el.getBoundingClientRect();
      // store in viewport-relative coords (canvas-wrap space) — SVG draws in the same space
      nm.set(el.getAttribute('data-port'),{
        x:r.left+r.width/2-wR.left,
        y:r.top+r.height/2-wR.top,
      });
    });
    let changed=nm.size!==portPos.current.size;
    if(!changed)nm.forEach((v,k)=>{const o=portPos.current.get(k);if(!o||Math.abs(o.x-v.x)>0.5||Math.abs(o.y-v.y)>0.5)changed=true;});
    portPos.current=nm;
    if(changed)rerender(n=>n+1);
  });

  /* wire draft */
  const [draft,setDraft]=useState(null);
  const draftRef=useRef(null);

  /* selected */
  const [selectedId,setSelectedId]=useState(null);

  /* context menu */
  const [ctx,setCtx]=useState(null);

  /* toast */
  const [toast,setToast]=useState(null);
  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),2200);},[]);

  /* place node on canvas */
  const placeNode=useCallback((type,label,extra,atPos)=>{
    const wrap=canvasRef.current;
    let x=80+nodes.length*28,y=80+nodes.length*18;
    if(atPos&&wrap){const r=wrap.getBoundingClientRect();x=(atPos.x-r.left)/zoom-offset.x;y=(atPos.y-r.top)/zoom-offset.y;}
    const id=uid();
    setNodes(prev=>[...prev,{id,type,label,x,y,...extra}]);
    setSelectedId(id);
  },[zoom,offset,nodes.length,setNodes]);

  /* node drag */
  const dragNode=useRef(null);
  const onHdr=(nodeId,e)=>{
    if(e.button!==0)return;
    e.stopPropagation();
    setSelectedId(nodeId);
    const nd=nodes.find(n=>n.id===nodeId);
    if(!nd)return;
    dragNode.current={id:nodeId,sx:e.clientX,sy:e.clientY,ox:nd.x,oy:nd.y};
    window.addEventListener('mousemove',onNodeMove);
    window.addEventListener('mouseup',onNodeUp);
  };
  const onNodeMove=useCallback(e=>{
    if(!dragNode.current)return;
    const dx=(e.clientX-dragNode.current.sx)/zoom;
    const dy=(e.clientY-dragNode.current.sy)/zoom;
    setNodes(prev=>prev.map(n=>n.id===dragNode.current.id?{...n,x:Math.max(0,dragNode.current.ox+dx),y:Math.max(0,dragNode.current.oy+dy)}:n));
  },[zoom,setNodes]);
  const onNodeUp=useCallback(()=>{
    dragNode.current=null;
    window.removeEventListener('mousemove',onNodeMove);
    window.removeEventListener('mouseup',onNodeUp);
  },[onNodeMove]);

  /* canvas events */
  const onCMD=e=>{
    if(e.button===1||(e.button===0&&e.altKey)){
      isPanning.current=true;
      panStart.current={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};
      e.preventDefault();
    }else if(e.button===0){setSelectedId(null);setCtx(null);}
  };
  const onCMM=e=>{
    if(isPanning.current)setOffset({x:panStart.current.ox+(e.clientX-panStart.current.x)/zoom,y:panStart.current.oy+(e.clientY-panStart.current.y)/zoom});
    if(draftRef.current){
      const r=canvasRef.current?.getBoundingClientRect();
      if(r)setDraft(p=>p?{...p,toPos:{x:e.clientX-r.left,y:e.clientY-r.top}}:null);
    }
  };
  const onCMU=e=>{
    isPanning.current=false;
    if(draftRef.current){
      let el=document.elementFromPoint(e.clientX,e.clientY);
      while(el&&!el.dataset.port)el=el.parentElement;
      if(el&&el.dataset.port&&el.dataset.side==='in'){
        const[dstNode,dstPort]=el.dataset.port.split('::');
        const d=draftRef.current;
        if(dstNode!==d.srcNodeId&&!conns.some(c=>c.src===d.srcNodeId&&c.srcPort===d.srcPortId&&c.dst===dstNode&&c.dstPort===dstPort)){
          const sn=nodes.find(n=>n.id===d.srcNodeId);
          setConns(p=>[...p,{id:uid(),src:d.srcNodeId,srcPort:d.srcPortId,srcType:sn?.type,dst:dstNode,dstPort}]);
        }
      }
      draftRef.current=null;
      setDraft(null);
    }
  };
  const onCW=e=>{e.preventDefault();setZoom(z=>Math.min(3,Math.max(0.2,z*(e.deltaY<0?1.1:0.9))));};

  /* port drag start / disconnect */
  const onPortMD=(nodeId,port,side,e)=>{
    if(side==='in'){
      /* click connected input port → disconnect */
      const key=nodeId+'::'+port.id;
      if(cPorts.has(key)){
        setConns(p=>p.filter(c=>!(c.dst===nodeId&&c.dstPort===port.id)));
      }
      return;
    }
    const pos=portPos.current.get(nodeId+'::'+port.id);
    if(!pos)return;
    draftRef.current={srcNodeId:nodeId,srcPortId:port.id,fromPos:pos};
    setDraft({fromPos:pos,toPos:pos});
  };

  /* delete node */

  /* ── DIALOGUE SERIALIZER ── converts kit node graph → game flat format */
  const serializeDialogueTree=useCallback(tree=>{
    const {nodes:ns,conns:cs}=(tree.subCanvas||{nodes:[],conns:[]});
    if(!ns.length)return[];
    // build adjacency: nodeId → {portId → targetNodeId}
    const adj={};
    ns.forEach(n=>{adj[n.id]={};});
    cs.forEach(c=>{if(adj[c.src])adj[c.src][c.srcPort]=c.dst;});
    // find root: node with no incoming flow connections
    const hasPredecessor=new Set(cs.map(c=>c.dst));
    const roots=ns.filter(n=>!hasPredecessor.has(n.id));
    const start=roots[0]||ns[0];
    // walk in order, BFS to collect all nodes reachable
    const visited=new Set();
    const ordered=[];
    const queue=[start];
    while(queue.length){
      const n=queue.shift();
      if(!n||visited.has(n.id))continue;
      visited.add(n.id);
      ordered.push(n);
      const outs=adj[n.id]||{};
      // push out ports in a stable order
      ['out','opt_a','opt_b','opt_c','returns_to','if_met','if_not'].forEach(p=>{
        if(outs[p]){const next=ns.find(x=>x.id===outs[p]);if(next&&!visited.has(next.id))queue.push(next);}
      });
    }
    // map each node to game format
    return ordered.map(n=>{
      const outs=adj[n.id]||{};
      const next=id=>id||null;
      if(n.type==='STATEMENT')return{id:n.id,speaker:n.speaker||null,npc:n.text||'',opts:[{t:'(continue)',next:next(outs.out)}]};
      if(n.type==='QUESTION')return{id:n.id,npc:n.text||'',opts:[
        {t:n.optA||'Option A',next:next(outs.opt_a),...(n.actA?{act:n.actA}:{}),...(n.mutedA?{muted:true}:{})},
        {t:n.optB||'Option B',next:next(outs.opt_b),...(n.actB?{act:n.actB}:{}),...(n.mutedB?{muted:true}:{})},
        ...(n.optC?[{t:n.optC,next:next(outs.opt_c),...(n.actC?{act:n.actC}:{}),...(n.mutedC?{muted:true}:{})}]:[]),
      ]};
      if(n.type==='THOUGHTS')return{id:n.id,internal:true,emotion:n.emotion||n.voice||'FEAR',voice:n.emotion||n.voice||'FEAR',npc:n.text||'',opts:[{t:'',next:next(outs.out)}]};
      if(n.type==='DEAD_END')return{id:n.id,npc:n.text||'',opts:[]};
      if(n.type==='END_CONVO')return{id:n.id,npc:n.text||'',relDelta:n.relDelta||'+0',opts:[{t:'(continue)',next:null,...(n.act?{act:n.act}:{})}]};
      if(n.type==='LOOP')return{id:n.id,npc:n.text||'',condition:n.condition||'',opts:[{t:'(loop)',next:next(outs.returns_to)}]};
      if(n.type==='ITEMS')return{id:n.id,itemCheck:true,action:n.action||'give',item:n.item||'',opts:[
        {t:'if_met',next:next(outs.if_met)},
        {t:'if_not',next:next(outs.if_not)},
      ]};
      if(n.type==='OUTFIT_CHECK')return{id:n.id,outfitCheck:true,opts:[
        {t:'hoodie',next:next(outs.hoodie)},
        {t:'regular',next:next(outs.regular)},
        {t:'other',next:next(outs.other)},
      ]};
      return{id:n.id,npc:n.text||n.label||'',opts:[]};
    });
  },[]);

  /* ── FILE HANDLE PERSISTENCE (IndexedDB) ─────────────────────── */
  const _fhDB=useRef(null);
  const _fhHandle=useRef(null);
  const getDB=useCallback(()=>new Promise((res,rej)=>{
    if(_fhDB.current)return res(_fhDB.current);
    const req=indexedDB.open('beau_kit_fs',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('h');
    req.onsuccess=e=>{_fhDB.current=e.target.result;res(e.target.result);};
    req.onerror=e=>rej(e);
  }),[]);
  const dbGet=useCallback(async k=>{const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction('h','readonly').objectStore('h').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});},[getDB]);
  const dbPut=useCallback(async(k,v)=>{const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction('h','readwrite').objectStore('h').put(v,k);r.onsuccess=res;r.onerror=rej;});},[getDB]);

  const writePayload=useCallback(async(json)=>{
    const tryHandle=async h=>{
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){const r=await h.requestPermission({mode:'readwrite'});if(r!=='granted')throw new Error('denied');}
      const w=await h.createWritable();await w.write(json);await w.close();
      return h.name||'beauregarde_data.json';
    };
    // try in-memory handle first (same session)
    if(_fhHandle.current){
      try{const name=await tryHandle(_fhHandle.current);return name;}
      catch(e){_fhHandle.current=null;}
    }
    // try persisted handle (IndexedDB)
    try{
      const stored=await dbGet('exportHandle');
      if(stored){const name=await tryHandle(stored);_fhHandle.current=stored;return name;}
    }catch(e){}
    // first time: show picker
    if(!window.showSaveFilePicker)throw new Error('no-api');
    const h=await window.showSaveFilePicker({
      suggestedName:'beauregarde_data.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}],
    });
    await tryHandle(h);
    _fhHandle.current=h;
    try{await dbPut('exportHandle',h);}catch(idbErr){} // best-effort; real handles are cloneable, mocks may not be
    return h.name;
  },[dbGet,dbPut]);

  /* export — outputs game-compatible beauregarde_data.json */
  const exportGame=async()=>{
    // 1. PEOPLE (mapped to game's PEOPLE_DB format)
    const people=chars.filter(c=>c.id!=='c1').map(c=>({
      id:c.id, name:(c.name||'').toUpperCase(), role:c.role||'',
      handle:c.handle||'', status:(c.status||'contact').toUpperCase(),
      // portrait: if it already contains a path separator use as-is; otherwise apply legacy prefix
      portrait:c.portrait?(c.portrait.includes('/')||c.portrait.includes('\\')?c.portrait:'../graphics/portraits/npc/'+c.portrait):'',
      portrait360:c.portrait360||'',
      info:c.info||'', discovered:c.discovered!==false,
      category:c.category||null,
      // gameplay-only fields (not in PEOPLE_DB but used by game logic)
      trust:c.trust||0, tags:c.tags||[], alignment:c.alignment||'neutral',
      enemyType:c.enemyType||'weak', hitPoints:c.hitPoints||10,
      lootable:c.lootable||false, lootItems:c.lootItems||[],
      pickpocketable:c.pickpocketable||false,
      pickpocketDifficulty:c.pickpocketDifficulty||'medium',
      pickpocketItems:c.pickpocketItems||[],
      caughtConsequence:c.caughtConsequence||'',
    }));
    // pre-compute master tree nodes + connections (used by quests, scenes, levels)
    const allMtConns=mt.flatMap(t=>(t.conns||[]));
    const allMtNodes=mt.flatMap(t=>(t.nodes||[]));
    // 2. QUESTS — metadata + step graph + master-canvas wire connections
    const serQ=q=>{
      const qn=allMtNodes.find(n=>n.type==='QUEST'&&n.entityId===q.id);
      let assignedBy=null,linkedScene=null,linkedDialogue=null,nextQuest=null;
      if(qn){
        const ac=allMtConns.find(c=>c.dst===qn.id&&c.dstPort==='from_char');
        const an=allMtNodes.find(n=>n.id===ac?.src);assignedBy=an?.entityId||null;
        const sc=allMtConns.find(c=>c.src===qn.id&&c.srcPort==='to_scene');
        const sn=allMtNodes.find(n=>n.id===sc?.dst);linkedScene=sn?.label||null;
        const dc=allMtConns.find(c=>c.src===qn.id&&c.srcPort==='to_dialogue');
        const dn=allMtNodes.find(n=>n.id===dc?.dst);
        linkedDialogue=dn?(dn.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''):null;
        const nc=allMtConns.find(c=>c.src===qn.id&&c.srcPort==='next_quest');
        const nn=allMtNodes.find(n=>n.id===nc?.dst);nextQuest=nn?.entityId||null;
      }
      const mkItemRef=id=>{const r=items.find(x=>x.id===id);return{id,key:r?.key||id,name:r?.name||id};};
      return{id:q.id,name:q.name,status:(q.status||'active').toUpperCase(),progress:q.progress||'',info:q.info||'',category:q.category||'',assignedBy,linkedScene,linkedDialogue,nextQuest,requiredItems:(q.requiredItems||[]).map(mkItemRef),rewardItems:(q.rewardItems||[]).map(mkItemRef),steps:serializeQuestSteps(q)};
    };
    const questsOut={
      major:quests.filter(q=>q.major).map(serQ),
      minor:quests.filter(q=>!q.major).map(serQ),
    };
    // resolve var conditions → attach stable varKey so the game can look them up
    const resolveConds=conds=>(conds||[]).map(c=>{
      if(c.type!=='var')return c;
      const v=vars.find(x=>x.id===c.varId);
      return{...c,varKey:v?(v.key||slugifyKey(v.name)):'',varType:v?.type||'flag'};
    });
    // 3. DIALOGUE (serialized node graphs)
    const dialogueOut={};
    dtrees.forEach(t=>{
      const key=t.name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
      dialogueOut[key]={id:t.id,name:t.name,treeType:t.treeType,outfitCondition:t.outfitCondition||'any',nodes:serializeDialogueTree(t),playCount:t.playCount||'always',playLimit:t.playLimit||1,conditions:resolveConds(t.conditions)};
    });
    // 4. SCENES (from SCENE nodes in all master trees)
    const sceneNodes=allMtNodes.filter(n=>n.type==='SCENE');
    const scenesOut=sceneNodes.map(n=>{
      // find any DIALOGUE_TREE wired from this scene's to_dialogue output
      const dlgConn=allMtConns.find(c=>c.src===n.id&&c.srcPort==='to_dialogue');
      let dialogueTrigger=null;
      if(dlgConn){
        const dlgNode=allMtNodes.find(x=>x.id===dlgConn.dst);
        if(dlgNode&&dlgNode.type==='DIALOGUE_TREE'){
          const key=(dlgNode.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
          dialogueTrigger={key,worldX:n.triggerWorldX!==undefined?n.triggerWorldX:null};
        }
      }
      return{
        id:n.id, name:n.label||'Scene', atmosphere:n.atmosphere||'',
        sceneType:n.sceneType||'neutral', octaviaWorldX:n.octaviaWorldX||400,
        elevatorFloor:n.elevatorFloor||null,
        chars:(n.sceneChars||[]).map(sc=>({charId:sc.charId,worldX:sc.worldX,alignment:sc.alignment})),
        storeItems:(n.storeItems||[]),
        dialogueTrigger,
      };
    });
    // 5. SPAWN POINTS
    const spawnNodes=allMtNodes.filter(n=>n.type==='SPAWN_POINT');
    const spawnsOut=spawnNodes.map(n=>({id:n.id,charId:n.charId||null,worldX:n.worldX||400}));
    // 6. LEVELS (from LEVEL_CONNECTOR nodes)
    const levelNodes=allMtNodes.filter(n=>n.type==='LEVEL_CONNECTOR');
    const levelsOut={};
    levelNodes.forEach(n=>{
      if(!n.label)return;
      levelsOut[n.label]={
        background:n.mapFile||'',
        mapWidth:n.mapW||3200,mapHeight:n.mapH||900,scale:n.mapScale||1.0,
        sceneType:n.sceneType||'neutral',atmosphere:n.atmosphere||'',musicCue:n.musicCue||'',
        playerSpawn:n.playerSpawn||{x:400,y:620,facing:'right'},
        npcSpawns:(n.npcSpawns||[]).map(s=>({charId:s.charId,x:s.x,y:s.y,facing:s.facing||'left',scale:(s.scaleOverride||100)/100})),
        exits:(n.exits||[]).map(ex=>({id:ex.id,label:ex.label,x:ex.x,direction:ex.direction,linksTo:ex.linksTo||null})),
      };
    });
    // assemble
    const itemsOut=items.map(i=>({id:i.id,name:i.name,key:i.key||i.name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''),category:i.category||'misc',unique:i.unique||false,description:i.description||'',source:i.source||'scene',icon:i.icon||'',restore:i.restore||0,equippable:i.equippable||false}));
    const varsOut=vars.map(v=>({id:v.id,key:v.key||slugifyKey(v.name),name:v.name,type:v.type||'flag',category:v.category||'story',initial:v.type==='int'?(parseInt(v.initial)||0):v.initial,enumValues:v.enumValues||[],description:v.description||''}));
    // cutscenes — dialogue trees with treeType:'cutscene'
    const cutsceneOut={};
    dtrees.filter(t=>t.treeType==='cutscene').forEach(t=>{
      const key=t.name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
      cutsceneOut[key]={id:t.id,name:t.name,nodes:serializeCutscene(t)};
    });
    const payload={people,quests:questsOut,dialogue:dialogueOut,scenes:scenesOut,spawns:spawnsOut,levels:levelsOut,items:itemsOut,vars:varsOut,cutscenes:cutsceneOut,outfits:outfits.filter(o=>o.id!=='any'),audio};
    const json=JSON.stringify(payload,null,2);
    try{
      const name=await writePayload(json);
      showToast('WRITTEN → '+name);
    }catch(e){
      if(e.name==='AbortError')return; // user cancelled picker
      if(e.message==='no-api'){
        // browser doesn't support File System Access API — fall back to download
        const blob=new Blob([json],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beauregarde_data.json';a.click();
        showToast('EXPORTED (download)');
      } else {
        showToast('EXPORT FAILED — check console');
        console.error('[Kit] export error',e);
      }
    }
  };
