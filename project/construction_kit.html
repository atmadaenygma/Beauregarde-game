<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEAUREGARDE — Construction Kit</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face {
      font-family: 'TheMurk';
      src: url('../graphics/assets/fonts/TheMurk-GrungeMatrix.otf') format('opentype');
      font-weight: normal;
    }
    :root {
      --bg:#68bfb8; --surface:#f0ebe0; --raised:#e4ddd0;
      --text:#0e0b08; --text2:#5a4838;
      --dim:#9a9080; --dimmer:#d0cabb; --border:#c0b8a8;
      --accent:#1a7870; --accent2:#b84818; --red:#c43028;
      --muted:#887868; --tag-bg:#e8e2d3; --input-bg:#ffffff; --scroll:#9a9080;
      --brutal:#0e0b08;
      --fxt:10px; --fxs:11px; --fxb:13px; --fxh:14px;
    }
    body.fs-md  { --fxt:12px; --fxs:13px; --fxb:15px; --fxh:16px; }
    body.fs-lg  { --fxt:14px; --fxs:15px; --fxb:17px; --fxh:18px; }
    body.fs-xl  { --fxt:16px; --fxs:17px; --fxb:19px; --fxh:20px; }
    body.fs-xxl { --fxt:18px; --fxs:19px; --fxb:21px; --fxh:22px; }
    body.pal-chalk {
      --bg:#f0ebe0; --surface:#ffffff; --raised:#e8e2d4;
      --text:#1a1208; --text2:#6a5840; --dim:#b0988a; --dimmer:#d8d0c0; --border:#c8c0b0;
      --accent:#d44414; --accent2:#a83210; --red:#c43028;
      --muted:#8a7868; --tag-bg:#ede8dc; --input-bg:#ffffff; --scroll:#b0988a;
      --brutal:#1a1208;
    }
    body.pal-northside {
      --bg:#12082a; --surface:#1e1040; --raised:#281850;
      --text:#c8f0dc; --text2:#7890a8; --dim:#5040a0; --dimmer:#2a1860; --border:#381e60;
      --accent:#a030e0; --accent2:#28cc80; --red:#e03068;
      --muted:#6050a0; --tag-bg:#201040; --input-bg:#1e1040; --scroll:#5040a0;
      --brutal:#5040a0;
    }
    body.pal-chromakopia {
      --bg:#090c07; --surface:#121810; --raised:#1a2018;
      --text:#d8e0c0; --text2:#788058; --dim:#3a5030; --dimmer:#1e2a18; --border:#253020;
      --accent:#4a9038; --accent2:#88c840; --red:#c43028;
      --muted:#587048; --tag-bg:#151c12; --input-bg:#121810; --scroll:#3a5030;
      --brutal:#3a5030;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:'TheMurk',monospace; }

    /* SHELL */
    .shell { display:flex; flex-direction:column; height:100vh; }

    /* NAV */
    .nav { display:flex; align-items:center; gap:8px; background:var(--surface); border-bottom:3px solid var(--brutal); padding:0 14px; height:48px; flex-shrink:0; z-index:300; }
    .nav-title { color:var(--accent); font-size:var(--fxh); font-weight:700; letter-spacing:3px; white-space:nowrap; }
    .nav-spacer { flex:1; }
    .nav-btn { background:var(--raised); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); font-weight:700; letter-spacing:1px; padding:5px 12px; cursor:pointer; white-space:nowrap; box-shadow:3px 3px 0 var(--brutal); transition:box-shadow .06s,transform .06s; }
    .nav-btn:hover { border-color:var(--accent); color:var(--accent); box-shadow:none; transform:translate(3px,3px); }
    .nav-btn.back-btn { border-color:var(--brutal); color:var(--text2); box-shadow:2px 2px 0 var(--brutal); }
    .nav-btn.back-btn:hover { color:var(--text); box-shadow:none; transform:translate(2px,2px); }
    .nav-btn.save-btn { border-color:var(--accent2); color:var(--accent2); box-shadow:3px 3px 0 var(--accent2); }
    .nav-btn.save-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    .nav-btn.export-btn { border-color:var(--accent); color:var(--accent); box-shadow:3px 3px 0 var(--accent); }
    .nav-btn.export-btn:hover { background:var(--accent); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    .pal-sel { background:var(--raised); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:4px 6px; cursor:pointer; }

    /* TREE / BREADCRUMB BAR */
    .tree-bar { display:flex; align-items:center; background:var(--surface); border-bottom:2px solid var(--brutal); height:34px; overflow-x:auto; overflow-y:hidden; flex-shrink:0; }
    .tree-bar::-webkit-scrollbar { height:0; }
    .tree-tab { display:flex; align-items:center; gap:5px; padding:0 12px; height:100%; border-right:2px solid var(--brutal); cursor:pointer; flex-shrink:0; user-select:none; }
    .tree-tab:hover { background:var(--raised); }
    .tree-tab.active { background:var(--raised); border-bottom:3px solid var(--accent); }
    .tree-tab-name { font-size:var(--fxb); color:var(--text2); letter-spacing:1px; }
    .tree-tab.active .tree-tab-name { color:var(--accent); }
    .tree-tab-rename { font-size:var(--fxb); background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; padding:1px 4px; width:90px; }
    .tree-type-badge { font-size:var(--fxt); font-weight:700; letter-spacing:1px; padding:2px 4px; cursor:pointer; color:var(--bg); flex-shrink:0; user-select:none; }
    .tree-type-badge:hover { opacity:0.75; }
    .sb-item.sb-active { background:var(--raised); }
    .tree-tab-del { font-size:var(--fxh); color:var(--dim); cursor:pointer; }
    .tree-tab-del:hover { color:var(--red); }
    .tree-new { display:flex; align-items:center; padding:0 14px; cursor:pointer; font-size:var(--fxb); color:var(--text2); letter-spacing:1px; flex-shrink:0; }
    .tree-new:hover { color:var(--accent); }
    /* breadcrumb */
    .bc-item { display:flex; align-items:center; padding:0 12px; height:100%; cursor:pointer; font-size:var(--fxb); letter-spacing:1px; color:var(--text2); white-space:nowrap; }
    .bc-item:hover { color:var(--text); }
    .bc-item.active { color:var(--accent); font-weight:700; }
    .bc-sep { color:var(--dim); font-size:10px; flex-shrink:0; }

    /* BODY ROW */
    .body-row { display:flex; flex:1; overflow:hidden; }

    /* SIDEBAR */
    .sidebar { width:280px; flex-shrink:0; background:var(--surface); border-right:3px solid var(--brutal); overflow-y:auto; display:flex; flex-direction:column; }
    .sidebar::-webkit-scrollbar { width:4px; }
    .sidebar::-webkit-scrollbar-thumb { background:var(--scroll); }
    .acc-section { border-bottom:2px solid var(--brutal); }
    .acc-header { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; user-select:none; }
    .acc-header:hover { background:var(--raised); }
    .acc-arrow { font-size:var(--fxb); color:var(--text2); transition:transform .15s; }
    .acc-label { font-size:var(--fxb); font-weight:700; letter-spacing:2px; color:var(--text); flex:1; }
    .acc-add { font-size:var(--fxs); letter-spacing:1px; color:var(--accent2); background:none; border:2px solid var(--accent2); padding:3px 7px; cursor:pointer; font-family:'TheMurk',monospace; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .acc-add:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }
    .acc-body { background:var(--bg); }
    .sb-item { display:flex; align-items:center; gap:7px; padding:6px 12px; cursor:pointer; user-select:none; }
    .sb-item:hover { background:var(--raised); }
    .sb-item-icon { font-size:10px; }
    .sb-item-name { font-size:var(--fxb); color:var(--text); flex:1; }
    .sb-item-sub { font-size:var(--fxs); color:var(--text2); }
    .sb-sep { padding:5px 12px 3px; font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; }

    /* CANVAS AREA */
    .canvas-area { flex:1; display:flex; overflow:hidden; position:relative; }
    .canvas-wrap { flex:1; position:relative; overflow:hidden; background:var(--bg); }
    .canvas-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; pointer-events:none; }
    .canvas-empty-label { font-size:11px; letter-spacing:4px; color:var(--dimmer); }
    .canvas-empty-sub { font-size:var(--fxs); color:var(--dimmer); letter-spacing:1px; }

    /* WIRES */
    .wires-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
    .wire-path { fill:none; stroke-width:2; opacity:0.8; }
    .wire-draft { fill:none; stroke:#ffffff; stroke-width:1.5; stroke-dasharray:6 4; opacity:0.5; }

    /* CANVAS INNER */
    .canvas-inner { position:absolute; transform-origin:0 0; }

    /* NODES */
    .node { position:absolute; min-width:210px; background:var(--surface); border:2px solid var(--brutal); border-top-width:3px; user-select:none; z-index:2; box-shadow:4px 4px 0 var(--brutal); }
    .node.selected { border-color:var(--accent); box-shadow:4px 4px 0 var(--accent); z-index:3; }
    .node-header { display:flex; align-items:center; gap:5px; padding:5px 8px; cursor:grab; border-bottom:2px solid var(--brutal); }
    .node-header:active { cursor:grabbing; }
    .node-icon { font-size:10px; flex-shrink:0; }
    .node-type-lbl { font-size:var(--fxs); font-weight:700; letter-spacing:2px; flex-shrink:0; }
    .node-title { font-size:var(--fxb); color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .node-edit-btn { font-size:var(--fxs); color:var(--accent2); border:2px solid var(--accent2); padding:1px 5px; cursor:pointer; letter-spacing:1px; flex-shrink:0; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .node-edit-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }
    .node-open-btn { font-size:var(--fxh); color:var(--text2); cursor:pointer; flex-shrink:0; padding:0 2px; }
    .node-open-btn:hover { color:var(--accent); }
    .node-del { font-size:10px; color:var(--dim); cursor:pointer; flex-shrink:0; }
    .node-del:hover { color:var(--red); }
    .node-body { padding:4px 0; }
    /* port rows */
    .pr { display:flex; align-items:center; padding:3px 0; position:relative; min-height:20px; }
    .pr.in { padding-left:16px; padding-right:8px; }
    .pr.out { padding-left:8px; padding-right:16px; justify-content:flex-end; }
    .pd { position:absolute; width:10px; height:10px; border-radius:50%; border:2px solid var(--bg); cursor:crosshair; z-index:5; top:50%; transform:translateY(-50%); }
    .pr.in .pd { left:-5px; }
    .pr.out .pd { right:-5px; }
    .pl { font-size:var(--fxs); color:var(--text2); letter-spacing:1px; }
    .pr.connected .pd { border-color:var(--surface); }
    .pr.in.connected:hover .pd { background:var(--red) !important; cursor:pointer; }
    .pr.in.connected:hover .pl { color:var(--red); }
    /* node fields */
    .nf { padding:2px 10px; display:flex; align-items:center; gap:6px; }
    .nfl { font-size:var(--fxs); color:var(--text2); letter-spacing:1px; width:54px; flex-shrink:0; }
    .nfv { font-size:var(--fxb); color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nd { height:2px; background:var(--brutal); margin:3px 0; }

    /* EDIT PANEL */
    .edit-panel { width:280px; flex-shrink:0; background:var(--surface); border-left:2px solid var(--brutal); display:flex; flex-direction:column; z-index:10; }
    .ep-header { display:flex; align-items:center; padding:10px 12px; border-bottom:2px solid var(--brutal); gap:8px; }
    .ep-title { font-size:var(--fxh); font-weight:700; letter-spacing:2px; color:var(--accent); flex:1; }
    .ep-close { background:none; border:2px solid var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxs); padding:3px 8px; cursor:pointer; }
    .ep-close:hover { border-color:var(--red); color:var(--red); }
    .ep-body { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
    .ep-body::-webkit-scrollbar { width:4px; }
    .ep-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    .ep-field { display:flex; flex-direction:column; gap:4px; }
    .ep-label { font-size:var(--fxs); letter-spacing:2px; color:var(--text2); font-weight:700; }
    .ep-input { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; }
    .ep-input:focus { border-color:var(--accent); outline:none; }
    .ep-textarea { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; height:70px; resize:vertical; }
    .ep-textarea:focus { border-color:var(--accent); outline:none; }
    .ep-sep { font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; border-top:2px solid var(--brutal); padding-top:6px; }
    .ep-open-btn { background:var(--raised); border:2px solid var(--accent2); color:var(--accent2); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:6px; cursor:pointer; letter-spacing:1px; text-align:center; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .ep-open-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }

    /* POPOVER */
    .popover-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:600; display:flex; align-items:center; justify-content:center; }
    .popover-box { background:var(--surface); border:3px solid var(--brutal); box-shadow:8px 8px 0 var(--brutal); width:600px; max-width:96vw; max-height:85vh; display:flex; flex-direction:column; }
    .popover-header { display:flex; align-items:center; padding:12px 16px; border-bottom:2px solid var(--brutal); gap:10px; flex-shrink:0; }
    .popover-title { font-size:10px; font-weight:700; letter-spacing:3px; flex:1; }
    .popover-close { background:none; border:2px solid var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxs); padding:4px 10px; cursor:pointer; box-shadow:2px 2px 0 var(--brutal); transition:box-shadow .06s,transform .06s; }
    .popover-close:hover { border-color:var(--red); color:var(--red); box-shadow:none; transform:translate(2px,2px); }
    .popover-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .popover-body::-webkit-scrollbar { width:4px; }
    .popover-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    /* tabs inside popover */
    .pop-tabs { display:flex; border-bottom:2px solid var(--brutal); flex-shrink:0; }
    .pop-tab { padding:8px 16px; font-size:var(--fxb); letter-spacing:1px; cursor:pointer; color:var(--text2); border-bottom:3px solid transparent; margin-bottom:-2px; }
    .pop-tab:hover { color:var(--text); }
    .pop-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .pop-tab-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
    .pop-tab-body::-webkit-scrollbar { width:4px; }
    .pop-tab-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    /* fields */
    .pf { display:flex; flex-direction:column; gap:4px; }
    .pfl { font-size:var(--fxs); letter-spacing:2px; color:var(--text2); font-weight:700; }
    .pfi { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; }
    .pfi:focus { border-color:var(--accent); outline:none; box-shadow:2px 2px 0 var(--accent); }
    .pf-row { display:flex; gap:10px; }
    /* item table */
    .itbl { display:flex; flex-direction:column; gap:4px; }
    .itbl-hdr { display:flex; gap:6px; padding:2px 8px; opacity:0.45; }
    .itbl-hdr span { font-size:var(--fxs); letter-spacing:1px; }
    .irow { display:flex; gap:6px; align-items:center; padding:5px 8px; background:var(--raised); border:2px solid var(--brutal); }
    .ifield { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; }
    .ifield:focus { border-color:var(--accent); outline:none; }
    .ifield.fn { flex:2; }
    .ifield.fp { width:60px; }
    .ifield.ft { width:86px; }
    .ifield.fq { width:50px; }
    .isel { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 4px; font-family:'TheMurk',monospace; width:86px; }
    .idel { background:none; border:none; color:var(--dim); cursor:pointer; font-size:10px; padding:0 2px; flex-shrink:0; }
    .idel:hover { color:var(--red); }
    .iadd { background:var(--raised); border:2px dashed var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:7px; cursor:pointer; letter-spacing:1px; text-align:center; }
    .iadd:hover { border-color:var(--accent2); color:var(--accent2); }
    .isave { background:var(--raised); border:2px solid var(--accent); color:var(--accent); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:8px; cursor:pointer; letter-spacing:1px; text-align:center; margin-top:4px; box-shadow:3px 3px 0 var(--accent); transition:box-shadow .06s,transform .06s; }
    .isave:hover { background:var(--accent); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    /* list rows (scenes, spawn) */
    .lrow { display:flex; gap:6px; align-items:center; padding:5px 8px; background:var(--raised); border:2px solid var(--brutal); }
    .lfield-a { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; flex:1; min-width:0; }
    .lfield-a:focus { border-color:var(--accent); outline:none; }
    .lfield-b { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; flex:2; min-width:0; }
    .lfield-b:focus { border-color:var(--accent); outline:none; }
    .psec { font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; margin-top:6px; }

    /* ZONE TILES */
    .zone-tile { display:flex; align-items:center; gap:9px; padding:8px 10px 8px 0; cursor:pointer; -webkit-user-select:none; user-select:none; border-bottom:1px solid var(--border); border-left:3px solid transparent; }
    .zone-tile:hover { background:var(--raised); }
    .zone-tile.zone-active { background:var(--raised); }
    .zone-badge { width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; color:var(--bg); flex-shrink:0; letter-spacing:0.5px; cursor:pointer; margin-left:8px; }
    .zone-badge:hover { opacity:0.75; }
    .zone-indicator { display:flex; align-items:center; gap:8px; padding:0 14px; height:100%; border-right:2px solid var(--brutal); flex-shrink:0; }

    /* LOCATIONS SECTION */
    .loc-level { display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--dimmer); border-bottom:1px solid var(--border); }
    .loc-level-badge { font-size:7px; font-weight:700; padding:2px 6px; background:#3ab0c0; color:var(--bg); letter-spacing:1px; flex-shrink:0; }
    .loc-scene-row { display:flex; align-items:center; gap:7px; padding:5px 10px; cursor:pointer; border-bottom:1px solid var(--border); }
    .loc-scene-row:hover { background:var(--raised); }
    .loc-type-badge { font-size:7px; font-weight:700; padding:1px 5px; color:var(--bg); letter-spacing:0.5px; flex-shrink:0; }
    .loc-worldx { font-size:var(--fxt); color:#40e090; letter-spacing:0.5px; flex-shrink:0; font-weight:700; }

    /* CONTEXT MENU */
    .ctx-menu { position:fixed; background:var(--surface); border:2px solid var(--brutal); box-shadow:4px 4px 0 var(--brutal); z-index:1000; min-width:140px; }
    .ctx-item { padding:7px 14px; font-size:var(--fxb); cursor:pointer; letter-spacing:1px; }
    .ctx-item:hover { background:var(--raised); color:var(--accent); }
    .ctx-item.danger:hover { color:var(--red); }

    /* TOAST */
    .toast { position:fixed; bottom:20px; right:20px; background:var(--raised); border:2px solid var(--accent); box-shadow:4px 4px 0 var(--accent); color:var(--accent); font-size:var(--fxb); letter-spacing:2px; padding:8px 16px; z-index:9999; pointer-events:none; }

    /* SEARCH */
    .nav-search { display:flex; align-items:center; background:var(--raised); border:2px solid var(--brutal); padding:0 8px; gap:5px; flex:1; max-width:260px; }

/* ── CANVAS NODE ─────────────────────────────────────────────────── */
function CanvasNode({node,selected,onHdr,onDelete,onPortMouseDown,onOpen,onEdit,onDblClick,cPorts,conns}){
  const meta=NM[node.type]||{icon:'?',lbl:node.type,color:'#888'};
  const base=NP[node.type]||{inputs:[],outputs:[]};
  /* expand multi-ports: each occupied slot gets a new empty slot below it */
  const expandedInputs=base.inputs.flatMap(p=>{
    if(!p.multi)return[p];
    const used=(conns||[]).filter(c=>c.dst===node.id&&c.dstPort.startsWith(p.id+'_')).length;
    return Array.from({length:used+1},(_,i)=>({...p,id:`${p.id}_${i}`,label:i===0?p.label:p.label}));
  });
  const ports={inputs:expandedInputs,outputs:base.outputs};
  return(
    <div className={'node'+(selected?' selected':'')}
      style={{left:node.x,top:node.y,borderTopColor:meta.color}}>
      <div className="node-header" onMouseDown={e=>onHdr(node.id,e)}
        onDoubleClick={e=>{e.stopPropagation();onDblClick&&onDblClick(node.type,node.id,node.entityId);}}>
        <span className="node-icon">{meta.icon}</span>
        <span className="node-type-lbl" style={{color:meta.color}}>{meta.lbl}</span>
        <span className="node-title">{node.label||''}</span>
        {(node.type==='CHARACTER'||node.type==='OCTAVIA')&&onEdit&&(
          <span className="node-edit-btn" onClick={e=>{e.stopPropagation();onEdit(node.entityId||node.id);}}>EDIT</span>
        )}
        {meta.canOpen&&onOpen&&(
          <span className="node-open-btn" onClick={e=>{e.stopPropagation();onOpen(meta.ot,node.entityId||node.id);}} title="Open sub-canvas">&#x2197;</span>
        )}
        <span className="node-del" onClick={e=>{e.stopPropagation();onDelete(node.id);}}>&#x2715;</span>
      </div>
      <div className="node-body">
        {ports.inputs.map(p=>(
          <PortRow key={p.id} nodeId={node.id} port={p} side="in"
            onPortMouseDown={onPortMouseDown} cPorts={cPorts}/>
        ))}
        <NodeFields node={node}/>
        {ports.outputs.length>0&&<div className="nd"/>}
        {ports.outputs.map(p=>(
          <PortRow key={p.id} nodeId={node.id} port={p} side="out"
            onPortMouseDown={onPortMouseDown} cPorts={cPorts}/>
        ))}
      </div>
    </div>
  );
}

/* ── WIRE LAYER ──────────────────────────────────────────────────── */
function WireLayer({conns,nodes,portPositions,draft,zoom,offset}){
  const cp=80*(zoom||1); // bezier control point offset scales with zoom
  const getPos=(nodeId,portId,side)=>{
    const key=nodeId+'::'+portId;
    const p=portPositions.current.get(key);
    if(p)return p;
    // fallback: compute from node's canvas position → convert to viewport coords
    const n=nodes.find(x=>x.id===nodeId);
    if(!n)return{x:0,y:0};
    const ox=offset||{x:0,y:0};
    const z=zoom||1;
    return{x:(ox.x+n.x+(side==='out'?220:0))*z,y:(ox.y+n.y+40)*z};
  };
  const paths=conns.map(c=>{
    const sp=(NP[c.srcType]||{outputs:[]}).outputs;
    const baseId=c.srcPort.replace(/_\d+$/,'');
    const spt=sp.find(p=>p.id===c.srcPort||p.id===baseId);
    const color=spt?wc(spt.pt):'#888';
    const a=getPos(c.src,c.srcPort,'out');
    const b=getPos(c.dst,c.dstPort,'in');
    return(<path key={c.id} className="wire-path" stroke={color}
      d={'M'+a.x+','+a.y+' C'+(a.x+cp)+','+a.y+' '+(b.x-cp)+','+b.y+' '+b.x+','+b.y}/>);
  });
  let dp=null;
  if(draft&&draft.fromPos&&draft.toPos){
    const a=draft.fromPos,b=draft.toPos;
    dp=<path className="wire-draft" d={'M'+a.x+','+a.y+' C'+(a.x+cp)+','+a.y+' '+(b.x-cp)+','+b.y+' '+b.x+','+b.y}/>;
  }
  return(<svg className="wires-svg">{paths}{dp}</svg>);
}

  return(
    <div className="popover-backdrop" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="popover-box" onMouseDown={e=>e.stopPropagation()}>
        <div className="popover-header">

          <button className="popover-close" onClick={onClose}>&#x2715; CLOSE</button>

        {children}
      </div>
    </div>
  );
}

/* ── ITEM POPOVER (registry entry editor) ───────────────────────── */
const ITEM_CATS=['key','document','consumable','equipment','misc'];
const ITEM_SRCS=['scene','npc','quest-reward','store','loot'];
const ITEM_CAT_COLOR={key:'#e0a020',document:'#5090d0',consumable:'#40c080',equipment:'#a06890',misc:'#7a7090'};
const ITEM_SRC_COLOR={scene:'#5090d0',npc:'#40c080','quest-reward':'#d4a020',store:'#c47a10',loot:'#c43028'};

/* ── VARIABLE REGISTRY ───────────────────────────────────────────── */
/* One author-defined state store. flags/ints/enums/keywords gate everything.
   This replaces hardcoded condition kinds — the game runtime reads {varKey,op,value}
   from one object, so new variables NEVER need new game code. */
const VAR_TYPES=['flag','int','enum','keyword'];
const VAR_CATS=['story','relationship','world','skill','keyword'];
const VAR_TYPE_COLOR={flag:'#40c080',int:'#d4a020',enum:'#5090d0',keyword:'#a060c0'};
const VAR_CAT_COLOR={story:'#c47a10',relationship:'#40c080',world:'#5090d0',skill:'#d4a020',keyword:'#a060c0'};
const slugifyKey=s=>(s||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
const mkVar=o=>({id:uid(),name:'',key:'',type:'flag',category:'story',initial:false,enumValues:[],description:'',...o});
/* ops available per variable type */
const VAR_OPS={
  flag:    [['is_true','IS SET'],['is_false','IS NOT SET']],
  keyword: [['is_true','HAS'],['is_false','MISSING']],
  int:     [['gte','≥'],['gt','>'],['lte','≤'],['lt','<'],['eq','='],['neq','≠']],
  enum:    [['eq','IS'],['neq','IS NOT']],
};

/* ── VARIABLE POPOVER (registry entry editor) ───────────────────── */
function VarPopover({variable,onSave,onClose}){
  const [name,setName]=useState(variable.name||'');
  const [type,setType]=useState(variable.type||'flag');
  const [category,setCategory]=useState(variable.category||'story');
  const [initial,setInitial]=useState(variable.initial!==undefined?variable.initial:false);
  const [enumValues,setEnumValues]=useState(variable.enumValues||[]);
  const [description,setDescription]=useState(variable.description||'');
  const [enumDraft,setEnumDraft]=useState('');

  // when type changes, reset initial to a sane default for that type
  const changeType=t=>{
    setType(t);
    if(t==='flag'||t==='keyword')setInitial(false);
    else if(t==='int')setInitial(0);
    else if(t==='enum')setInitial(enumValues[0]||'');
  };
  const addEnum=()=>{const v=enumDraft.trim();if(v&&!enumValues.includes(v)){const nv=[...enumValues,v];setEnumValues(nv);if(!initial)setInitial(nv[0]);setEnumDraft('');}};

  const key=slugifyKey(name);
  const save=()=>{
    onSave({...variable,name,key,type,category,
      initial:type==='int'?(parseInt(initial)||0):initial,
      enumValues:type==='enum'?enumValues:[],description});
    onClose();
  };

  return(
    <PopoverModal title="&#9670; VARIABLE" color={VAR_TYPE_COLOR[type]||'#40c080'} onClose={onClose}>
      <div className="popover-body">
        <div className="pf-row">
          <div className="pf" style={{flex:3}}>
            <label className="pfl">VARIABLE NAME</label>
            <input className="pfi" value={name} onChange={e=>setName(e.target.value)} placeholder="told_raymond_about_collette"/>
          </div>
          <div className="pf" style={{flex:2}}>
            <label className="pfl">CATEGORY</label>
            <select className="pfi" value={category} onChange={e=>setCategory(e.target.value)}>
              {VAR_CATS.map(c=><option key={c} value={c}>{c.toUpperCase()}</option>)}
            </select>
          </div>
        </div>
        <div className="pf">
          <label className="pfl">TYPE</label>
          <div style={{display:'flex',gap:6,marginTop:4}}>
            {VAR_TYPES.map(t=>(
              <button key={t} style={{flex:1,padding:'7px 4px',fontSize:'var(--fxs)',letterSpacing:'1px',fontFamily:'inherit',cursor:'pointer',
                background:type===t?VAR_TYPE_COLOR[t]:'var(--raised)',
                border:'2px solid '+(type===t?'transparent':'var(--brutal)'),color:type===t?'var(--bg)':'var(--text2)'}}
                onClick={()=>changeType(t)}>{t.toUpperCase()}</button>
            ))}
          </div>
          <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'0.5px',marginTop:4,lineHeight:1.6}}>
            {type==='flag'&&'Boolean — on/off. The workhorse: "did X happen?"'}
            {type==='keyword'&&'A topic Octavia collects — can be asked about with anyone (Shadowrun-style).'}
            {type==='int'&&'A number — counters, suspicion levels, fragments collected.'}
            {type==='enum'&&'One of a fixed set of named states.'}
          </div>
        </div>
        {type==='enum'&&(
          <div className="pf">
            <label className="pfl">ENUM VALUES</label>
            <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:4}}>
              {enumValues.map(v=>(
                <span key={v} style={{fontSize:'var(--fxs)',padding:'2px 6px',background:'var(--raised)',border:'2px solid var(--brutal)',letterSpacing:'0.5px',display:'flex',gap:5,alignItems:'center'}}>
                  {v}<span style={{cursor:'pointer',color:'var(--red)'}} onClick={()=>setEnumValues(p=>p.filter(x=>x!==v))}>&#x2715;</span>
                </span>
              ))}
            </div>
            <div style={{display:'flex',gap:4}}>
              <input className="pfi" style={{flex:1}} value={enumDraft} placeholder="add a state…"
                onChange={e=>setEnumDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addEnum();}}}/>
              <button className="mpick-browse" onClick={addEnum}>+ ADD</button>
            </div>
          </div>
        )}
        <div className="pf">
          <label className="pfl">INITIAL VALUE (game start)</label>
          {(type==='flag'||type==='keyword')&&(
            <label style={{display:'flex',alignItems:'center',gap:6,fontSize:'var(--fxs)',cursor:'pointer',letterSpacing:'1px',marginTop:4}}>
              <input type="checkbox" checked={!!initial} onChange={e=>setInitial(e.target.checked)}/>
              {type==='keyword'?'OCTAVIA STARTS WITH THIS KEYWORD':'STARTS SET (TRUE)'}
            </label>
          )}
          {type==='int'&&(
            <input className="pfi" type="number" value={initial} onChange={e=>setInitial(e.target.value)}/>
          )}
          {type==='enum'&&(
            <select className="pfi" value={initial} onChange={e=>setInitial(e.target.value)}>
              {enumValues.length===0&&<option value="">— add values first —</option>}
              {enumValues.map(v=><option key={v} value={v}>{v}</option>)}
            </select>
          )}
        </div>
        <div className="pf">
          <label className="pfl">DESCRIPTION</label>
          <textarea className="pfi" style={{height:50,resize:'vertical'}} value={description}
            onChange={e=>setDescription(e.target.value)} placeholder="What does this track? Where is it set / checked?"/>
        </div>
        {name&&<div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'1px',marginTop:2}}>key: {key}</div>}
        <button className="isave" onClick={save}>SAVE VARIABLE</button>
      </div>
    </PopoverModal>
  );
}

        </div>}

      </div>
    </PopoverModal>
  );
}

/* ── LEVEL CONNECTOR POPOVER ─────────────────────────────────────── */
function LevelPopover({node,chars,audio,allLevelNodes,onSave,onClose}){
  const TABS=['MAP','SPAWNS','EXITS','SETTINGS'];
  const [tab,setTab]=useState('MAP');
  const [name,setName]=useState(node.label||'');
  const [mapFile,setMapFile]=useState(node.mapFile||'');
  const [mapW,setMapW]=useState(node.mapW||3200);
  const [mapH,setMapH]=useState(node.mapH||900);
  const [mapScale,setMapScale]=useState(node.mapScale||1.0);
  const [maskFile,setMaskFile]=useState(node.maskFile||'');
  const [playerSpawn,setPlayerSpawn]=useState(node.playerSpawn||{x:400,y:620,facing:'right'});
  const [npcSpawns,setNpcSpawns]=useState(node.npcSpawns||[]);
  const [exits,setExits]=useState(node.exits||[]);
  const [sceneType,setSceneType]=useState(node.sceneType||'neutral');
  const [atmosphere,setAtmosphere]=useState(node.atmosphere||'');
  const [musicCue,setMusicCue]=useState(node.musicCue||'');
  const [selSpawn,setSelSpawn]=useState(null);
  const cvRef=useRef(null);
  const dragRef=useRef(null);

  const CV_W=480;
  const cvH=mapW>0?Math.max(60,Math.round(CV_W*(mapH/mapW))):150;

  /* ── mini canvas draw ───────────────────────── */
  useEffect(()=>{
    const cv=cvRef.current;
    if(!cv||tab!=='SPAWNS')return;
    const ctx=cv.getContext('2d');
    ctx.clearRect(0,0,CV_W,cvH);
    // background
    ctx.fillStyle='#0e1a14';
    ctx.fillRect(0,0,CV_W,cvH);
    // ground line at 72%
    const gY=Math.round(cvH*0.72);
    ctx.strokeStyle='#2a4030';ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(0,gY);ctx.lineTo(CV_W,gY);ctx.stroke();
    ctx.setLineDash([]);
    // helper: world → canvas
    const wc=(wx,wy)=>({x:Math.round((wx/mapW)*CV_W),y:Math.round((wy/mapH)*cvH)});
    // exits edge markers
    exits.forEach(ex=>{
      ctx.fillStyle='#e0a020';
      if(ex.direction==='left'){ctx.fillRect(0,cvH/2-10,7,20);}
      else if(ex.direction==='right'){ctx.fillRect(CV_W-7,cvH/2-10,7,20);}
      else if(ex.direction==='up'){const ex2=Math.round(((ex.x||0)/mapW)*CV_W);ctx.fillRect(ex2-10,0,20,7);}
      else{const ex2=Math.round(((ex.x||0)/mapW)*CV_W);ctx.fillRect(ex2-10,cvH-7,20,7);}
    });
    // NPC spawns
    npcSpawns.forEach(sp=>{
      const p=wc(sp.x,sp.y);
      const ch=chars.find(c=>c.id===sp.charId);
      const col=ch?.alignment==='foe'?'#e04040':'#40c080';
      const isSelected=selSpawn===sp.id;
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);
      ctx.fillStyle=isSelected?'#ffffff':col;ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
      // facing indicator
      const ax=sp.facing==='right'?p.x+12:p.x-12;
      ctx.strokeStyle=col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ax,p.y);ctx.stroke();
      if(ch){ctx.fillStyle='#7a9888';ctx.font='6px monospace';ctx.fillText(ch.name.slice(0,8).toUpperCase(),p.x-14,p.y-10);}
    });
    // player spawn
    const pp=wc(playerSpawn.x,playerSpawn.y);
    const pSel=selSpawn==='player';
    ctx.beginPath();ctx.arc(pp.x,pp.y,9,0,Math.PI*2);
    ctx.fillStyle=pSel?'#ffffff':'#40e090';ctx.fill();
    ctx.strokeStyle='#40e090';ctx.lineWidth=2;ctx.stroke();
    const pax=playerSpawn.facing==='right'?pp.x+14:pp.x-14;
    ctx.strokeStyle='#40e090';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(pp.x,pp.y);ctx.lineTo(pax,pp.y);ctx.stroke();
    ctx.fillStyle='#0e1a14';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('P',pp.x,pp.y);ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });

  /* ── drag interaction ───────────────────────── */
  const onCvDown=e=>{
    const r=cvRef.current.getBoundingClientRect();
    const cx=e.clientX-r.left,cy=e.clientY-r.top;
    const wc=(wx,wy)=>({x:Math.round((wx/mapW)*CV_W),y:Math.round((wy/mapH)*cvH)});
    const pp=wc(playerSpawn.x,playerSpawn.y);
    if(Math.hypot(cx-pp.x,cy-pp.y)<14){setSelSpawn('player');dragRef.current={id:'player'};e.preventDefault();return;}
    for(const sp of npcSpawns){
      const p=wc(sp.x,sp.y);
      if(Math.hypot(cx-p.x,cy-p.y)<12){setSelSpawn(sp.id);dragRef.current={id:sp.id};e.preventDefault();return;}
    }
    setSelSpawn(null);
  };

  useEffect(()=>{
    const onMove=e=>{
      if(!dragRef.current)return;
      const r=cvRef.current?.getBoundingClientRect();
      if(!r)return;
      const cx=Math.max(0,Math.min(CV_W,e.clientX-r.left));
      const cy=Math.max(0,Math.min(cvH,e.clientY-r.top));
      const wx=Math.round((cx/CV_W)*mapW);
      const wy=Math.round((cy/cvH)*mapH);
      if(dragRef.current.id==='player'){setPlayerSpawn(p=>({...p,x:wx,y:wy}));}
      else{setNpcSpawns(p=>p.map(s=>s.id===dragRef.current.id?{...s,x:wx,y:wy}:s));}
    };
    const onUp=()=>{dragRef.current=null;};
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[mapW,mapH,cvH]);

  const addNpc=()=>setNpcSpawns(p=>[...p,{id:uid(),charId:'',x:600,y:620,facing:'left',scaleOverride:100}]);
  const uNpc=(id,f)=>setNpcSpawns(p=>p.map(s=>s.id===id?{...s,...f}:s));
  const dNpc=id=>{setNpcSpawns(p=>p.filter(s=>s.id!==id));if(selSpawn===id)setSelSpawn(null);};

  const addExit=()=>setExits(p=>[...p,{id:uid(),label:'Exit',x:3100,y:450,direction:'right',linksTo:''}]);
  const uExit=(id,f)=>setExits(p=>p.map(s=>s.id===id?{...s,...f}:s));
  const dExit=id=>setExits(p=>p.filter(s=>s.id!==id));

  const save=()=>{
    const tr=(audio||[]).find(a=>a.id===musicCue);
    onSave({...node,label:name,mapFile,mapW,mapH,mapScale,maskFile,
      playerSpawn,npcSpawns,exits,sceneType,atmosphere,
      musicCue,musicCueLabel:tr?tr.label:''});
    onClose();
  };

            <label className="pfl" htmlFor={'loop_'+track.id} style={{cursor:'pointer',margin:0}}>LOOP</label>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',marginTop:2}}>
            <span style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'1px',flex:1}}>ID: {track.id}</span>
            {onDelete&&<button style={{padding:'4px 8px',fontSize:'var(--fxt)',letterSpacing:'1px',fontFamily:'inherit',cursor:'pointer',background:'none',border:'1px solid var(--red)',color:'var(--red)'}}
              onClick={onDelete}>DELETE</button>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── AI REFERENCE LIBRARY + HISTORY (IndexedDB) ─────────────────── */
const openRefDB=()=>new Promise((res,rej)=>{
  const req=indexedDB.open('beau_ai_refs',2);
  req.onupgradeneeded=e=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains('refs'))db.createObjectStore('refs',{keyPath:'id'});
    if(!db.objectStoreNames.contains('history'))db.createObjectStore('history',{keyPath:'id'});
  };
  req.onsuccess=e=>res(e.target.result);req.onerror=rej;
});
const loadRefs=async()=>{try{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readonly').objectStore('refs').getAll();r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}catch(e){return[];}};
const saveRef=async ref=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readwrite').objectStore('refs').put(ref);r.onsuccess=res;r.onerror=rej;});};
const deleteRef=async id=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readwrite').objectStore('refs').delete(id);r.onsuccess=res;r.onerror=rej;});};
const loadHistory=async()=>{try{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('history','readonly').objectStore('history').getAll();r.onsuccess=e=>res((e.target.result||[]).sort((a,b)=>b.updatedAt-a.updatedAt));r.onerror=rej;});}catch(e){return[];}};
const saveConv=async conv=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('history','readwrite').objectStore('history').put(conv);r.onsuccess=res;r.onerror=rej;});};
const deleteConv=async id=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('history','readwrite').objectStore('history').delete(id);r.onsuccess=res;r.onerror=rej;});};

/* ── AI ASSISTANT ────────────────────────────────────────────────── */
const AI_MODEL='claude-sonnet-4-6';
const QUICK_PROMPTS=[
  {label:'Character dialogue',prompt:'Write 4–6 dialogue lines for one of my characters that feels authentic to The Veil. Ground it in the cyberpunk setting, the underground network, and the character\'s role.'},
  {label:'Character backstory',prompt:'Develop a backstory for one of my characters that connects their past to the themes in my reference material and the Beauregarde world.'},
  {label:'World detail',prompt:'Give me a small, specific world-building detail about The Veil neighborhood — something that would make the setting feel lived-in and real.'},
  {label:'Quest idea',prompt:'Suggest a quest narrative that fits my existing characters and draws on themes in my reference material.'},
  {label:'NPC bark lines',prompt:'Write 6–8 short ambient NPC bark lines that might be heard on The Veil streets. Keep them brief, atmospheric, grounded in survival and community.'},
  {label:'Dialogue tree',prompt:'Write a branching dialogue tree for an NPC encounter. Include the NPC\'s opening line, 2–3 player response options, and a follow-up for each branch.'},
];

const WELCOME_MSG={role:'assistant',content:'Hello! I\'m your Beauregarde writing assistant. Upload reference material in the REFERENCES tab, then ask me anything — character dialogue, world-building, backstories, quest ideas. What are you working on?'};

function AIAssistant({chars,dtrees,quests,onClose}){
  const [tab,setTab]=useState('chat');
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem('beau_ai_key')||'');
  const [keyDraft,setKeyDraft]=useState(()=>localStorage.getItem('beau_ai_key')||'');
  const [refs,setRefs]=useState([]);
  const [msgs,setMsgs]=useState([WELCOME_MSG]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [uploadStatus,setUploadStatus]=useState('');
  const [convId]=useState(()=>'conv_'+Date.now());
  const convCreatedAt=useRef(Date.now());
  const [chatHistory,setChatHistory]=useState([]);
  const [histView,setHistView]=useState(null);
  const chatEndRef=useRef(null);
  const fileRef=useRef(null);

  useEffect(()=>{loadRefs().then(setRefs);},[]);
  useEffect(()=>{loadHistory().then(setChatHistory);},[]);
  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:'smooth'});},[msgs]);

  /* auto-save conversation whenever msgs change (debounced 600ms) */
  useEffect(()=>{
    if(msgs.length<=1)return;
    const timer=setTimeout(()=>{
      const firstUser=msgs.find(m=>m.role==='user');
      const title=firstUser?(firstUser.content.slice(0,55)+(firstUser.content.length>55?'…':'')):
        'Session '+new Date(convCreatedAt.current).toLocaleDateString();
      const conv={id:convId,title,messages:msgs,savedAt:convCreatedAt.current,updatedAt:Date.now()};
      saveConv(conv);
      setChatHistory(p=>{const idx=p.findIndex(c=>c.id===convId);if(idx>=0){const n=[...p];n[idx]=conv;return n;}return[conv,...p];});
    },600);
    return()=>clearTimeout(timer);
  },[msgs,convId]);

  const saveKey=()=>{localStorage.setItem('beau_ai_key',keyDraft);setApiKey(keyDraft);setUploadStatus('API key saved.');setTimeout(()=>setUploadStatus(''),2000);};

  const buildSystem=()=>{
    const charList=chars.map(c=>`${c.name} (${c.role}${c.tags?.length?' — '+c.tags.join(', '):''})`).join('\n  ');
    const questList=quests.map(q=>`${q.major?'◆':'◇'} ${q.name}: ${q.info||''}`).join('\n  ');
    const treeList=dtrees.map(t=>t.name).join(', ');
    // text reference content — first 6000 chars each, with cache marker (PDFs go as document blocks separately)
    const textRefs=refs.filter(r=>!r.type||r.type==='text');
    const refBlock=textRefs.length?'\n\nREFERENCE MATERIAL (use these for tone, themes, world detail):\n'+
      textRefs.map(r=>`=== ${r.name} ===\n${r.content.slice(0,6000)}${r.content.length>6000?'\n[truncated — '+Math.round(r.content.length/1000)+'KB total]':''}`).join('\n\n'):'';
    return `You are a creative writing assistant for BEAUREGARDE — a cyberpunk RPG set in The Veil, a dystopian urban neighborhood where body modification is common and an underground network operates in the shadows. The protagonist is Octavia: a modified survivor waking up after 7 missing days.

GAME WORLD:
- Tone: neo-noir, grounded, community-focused. Not neon-glamour cyberpunk — survival cyberpunk.
- Themes: identity, modification, surveillance, loss, mutual aid, found family, memory.
- Factions: The Network (community protection), The Bureau (state surveillance).
- Key locations: The Veil street, Corner Store (Raymond), Pharmacy, Restaurant (Diego), Alley video store (Charlie).

CURRENT CHARACTERS:
  ${charList||'(none yet)'}

ACTIVE QUESTS:
  ${questList||'(none yet)'}

DIALOGUE TREES: ${treeList||'(none yet)'}

When writing dialogue: use short, clipped lines. Characters speak from lived experience, not exposition. NPCs are tired, careful, warm beneath the caution.${refBlock}`;
  };

  const send=async(text)=>{
    if(!text.trim())return;
    if(!apiKey){setTab('key');return;}
    const userMsg={role:'user',content:text};
    const history=[...msgs.filter(m=>m.role!=='assistant'||msgs.indexOf(m)>0),userMsg];
    setMsgs(p=>[...p,userMsg]);setInput('');setLoading(true);
    try{
      const pdfRefs=refs.filter(r=>r.type==='pdf');
      const systemBlocks=[
        {type:'text',text:buildSystem(),cache_control:{type:'ephemeral'}},
        ...pdfRefs.map(r=>({type:'document',source:{type:'base64',media_type:'application/pdf',data:r.data},title:r.name,cache_control:{type:'ephemeral'}})),
      ];
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'x-api-key':apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-beta':'prompt-caching-2024-07-31',
          'content-type':'application/json',
          'anthropic-dangerous-allow-browser':'true',
        },
        body:JSON.stringify({
          model:AI_MODEL,max_tokens:2048,
          system:systemBlocks,
          messages:history,
        }),
      });
      if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API error '+res.status);}
      const d=await res.json();
      setMsgs(p=>[...p,{role:'assistant',content:d.content[0].text}]);
    }catch(e){
      setMsgs(p=>[...p,{role:'assistant',content:`⚠️ ${e.message}`,error:true}]);
    }finally{setLoading(false);}
  };

  const uploadFile=async e=>{
    const file=e.target.files[0];if(!file)return;
    const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    setUploadStatus('Reading '+file.name+'...');
    const reader=new FileReader();
    if(isPdf){
      reader.onload=async ev=>{
        const base64=ev.target.result.split(',')[1];
        const ref={id:uid(),name:file.name,type:'pdf',data:base64,size:file.size,addedAt:Date.now()};
        await saveRef(ref);
        setRefs(p=>[...p,ref]);
        setUploadStatus('✓ '+file.name+' added ('+Math.round(file.size/1024)+'KB PDF)');
        setTimeout(()=>setUploadStatus(''),3000);
      };
      reader.onerror=()=>{setUploadStatus('✗ Could not read file.');setTimeout(()=>setUploadStatus(''),3000);};
      reader.readAsDataURL(file);
    }else{
      reader.onload=async ev=>{
        const ref={id:uid(),name:file.name,type:'text',content:ev.target.result,size:file.size,addedAt:Date.now()};
        await saveRef(ref);
        setRefs(p=>[...p,ref]);
        setUploadStatus('✓ '+file.name+' added ('+Math.round(file.size/1024)+'KB)');
        setTimeout(()=>setUploadStatus(''),3000);
      };
      reader.onerror=()=>{setUploadStatus('✗ Could not read file.');setTimeout(()=>setUploadStatus(''),3000);};
      reader.readAsText(file);
    }
    e.target.value='';
  };

  const removeRef=async id=>{await deleteRef(id);setRefs(p=>p.filter(r=>r.id!==id));};

  const newSession=()=>{setMsgs([WELCOME_MSG]);setHistView(null);setTab('chat');};

  const removeConv=async id=>{
    await deleteConv(id);
    setChatHistory(p=>p.filter(c=>c.id!==id));
    if(histView?.id===id)setHistView(null);
  };

  const panelStyle={position:'fixed',top:0,right:0,bottom:0,width:420,zIndex:600,
    display:'flex',flexDirection:'column',background:'var(--surface)',
    borderLeft:'3px solid var(--brutal)',boxShadow:'-6px 0 0 var(--brutal)',
    fontFamily:"'TheMurk',monospace",
  };
  const TABS=[['chat','CHAT'],['refs','REFERENCES'],['history','HISTORY'],['key','API KEY']];

  return(
    <div style={panelStyle}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'0 14px',height:48,borderBottom:'3px solid var(--brutal)',background:'var(--raised)',flexShrink:0}}>
        <span style={{color:'var(--accent)',fontSize:'var(--fxh)',fontWeight:700,letterSpacing:2,flex:1}}>✦ AI ASSISTANT</span>
        {TABS.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:tab===id?'var(--accent)':'none',color:tab===id?'var(--bg)':'var(--text2)',border:'2px solid '+(tab===id?'var(--accent)':'var(--brutal)'),fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'3px 8px',cursor:'pointer',letterSpacing:'1px'}}>
            {label}
          </button>
        ))}
        <span style={{cursor:'pointer',fontSize:12,color:'var(--dim)',padding:'0 4px'}} onClick={onClose}>✕</span>
      </div>

      {/* CHAT tab */}
      {tab==='chat'&&(<>
        {/* quick prompts */}
        <div style={{padding:'8px 10px',borderBottom:'2px solid var(--brutal)',display:'flex',flexWrap:'wrap',gap:5,flexShrink:0}}>
          {QUICK_PROMPTS.map(q=>(
            <button key={q.label} onClick={()=>send(q.prompt)}
              style={{background:'var(--raised)',border:'2px solid var(--brutal)',color:'var(--text)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'3px 8px',cursor:'pointer',letterSpacing:'0.5px',boxShadow:'2px 2px 0 var(--brutal)',transition:'all .06s'}}
              onMouseEnter={e=>{e.target.style.transform='translate(2px,2px)';e.target.style.boxShadow='none';}}
              onMouseLeave={e=>{e.target.style.transform='';e.target.style.boxShadow='2px 2px 0 var(--brutal)';}}>
              {q.label}
            </button>
          ))}
        </div>
        {/* session status bar */}
        {msgs.length>1&&(
          <div style={{padding:'4px 10px',borderBottom:'1px solid var(--brutal)',display:'flex',alignItems:'center',gap:8,flexShrink:0,background:'var(--bg)'}}>
            <span style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'1px',flex:1}}>
              &#x25CF; {msgs.filter(m=>m.role==='user').length} exchange{msgs.filter(m=>m.role==='user').length!==1?'s':''} · auto-saved to history
            </span>
            <button onClick={newSession}
              style={{background:'none',border:'1px solid var(--dim)',color:'var(--text2)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'2px 7px',cursor:'pointer',letterSpacing:'1px'}}>
              NEW SESSION
            </button>
          </div>
        )}
        {/* messages */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12,scrollbarWidth:'thin'}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{
              alignSelf:m.role==='user'?'flex-end':'flex-start',
              maxWidth:'88%',padding:'10px 13px',
              background:m.role==='user'?'var(--accent)':m.error?'#c4302822':'var(--raised)',
              color:m.role==='user'?'var(--bg)':m.error?'var(--red)':'var(--text)',
              border:'2px solid '+(m.role==='user'?'var(--accent)':m.error?'var(--red)':'var(--brutal)'),
              fontSize:'var(--fxb)',lineHeight:1.7,whiteSpace:'pre-wrap',
              boxShadow:m.role==='user'?'none':'3px 3px 0 var(--brutal)',
            }}>{m.content}</div>
          ))}
          {loading&&<div style={{alignSelf:'flex-start',padding:'10px 14px',background:'var(--raised)',border:'2px solid var(--brutal)',fontSize:'var(--fxb)',color:'var(--accent)',letterSpacing:2,boxShadow:'3px 3px 0 var(--brutal)'}}>THINKING...</div>}
          <div ref={chatEndRef}/>
        </div>
        {/* input */}
        <div style={{borderTop:'3px solid var(--brutal)',padding:'10px 12px',display:'flex',gap:8,flexShrink:0,background:'var(--raised)'}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input);}}}
            placeholder="Ask anything... (Enter to send, Shift+Enter for new line)"
            style={{flex:1,background:'var(--input-bg)',border:'2px solid var(--brutal)',color:'var(--text)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',padding:'7px 9px',resize:'none',height:60,lineHeight:1.5}}/>
          <button onClick={()=>send(input)} disabled={loading}
            style={{background:'var(--accent)',border:'2px solid var(--brutal)',color:'var(--bg)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',fontWeight:700,padding:'0 12px',cursor:'pointer',boxShadow:'3px 3px 0 var(--brutal)',alignSelf:'stretch',letterSpacing:1}}>
            SEND
          </button>
        </div>
      </>)}

      {/* REFERENCES tab */}
      {tab==='refs'&&(
        <div style={{flex:1,overflowY:'auto',padding:'14px 14px',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:'var(--fxs)',color:'var(--text2)',lineHeight:1.7,letterSpacing:'0.5px'}}>
            Upload reference files — books, scripts, worldbuilding docs, articles, design documents. Text files are included as context excerpts. PDFs are sent to the AI natively and read in full.
          </div>
          <input ref={fileRef} type="file" accept=".txt,.md,.csv,.pdf" style={{display:'none'}} onChange={uploadFile}/>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>fileRef.current?.click()}
              style={{flex:1,background:'var(--raised)',border:'2px solid var(--accent2)',color:'var(--accent2)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',fontWeight:700,padding:'9px',cursor:'pointer',letterSpacing:1,boxShadow:'3px 3px 0 var(--accent2)',textAlign:'center'}}>
              + ADD TO LIBRARY
            </button>
          </div>
          <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'1px',marginTop:-4}}>
            .txt · .md · .csv · .pdf — all saved to your local library
          </div>
          {uploadStatus&&<div style={{fontSize:'var(--fxs)',color:'var(--accent)',letterSpacing:1}}>{uploadStatus}</div>}
          {refs.length===0&&<div style={{color:'var(--muted)',fontSize:'var(--fxs)',letterSpacing:1}}>Library is empty. Add files above.</div>}
          {refs.map(r=>{
            const isPdf=r.type==='pdf';
            return(
              <div key={r.id} style={{background:'var(--raised)',border:'2px solid var(--brutal)',padding:'10px 12px',display:'flex',alignItems:'flex-start',gap:8,boxShadow:'3px 3px 0 var(--brutal)'}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                    <span style={{fontSize:'var(--fxt)',fontWeight:700,letterSpacing:'1px',padding:'1px 5px',
                      background:isPdf?'#e05030':'var(--accent)',color:'var(--bg)',flexShrink:0}}>
                      {isPdf?'PDF':'TXT'}
                    </span>
                    <span style={{fontSize:'var(--fxb)',fontWeight:700,letterSpacing:1}}>{r.name}</span>
                  </div>
                  {isPdf
                    ?<div style={{fontSize:'var(--fxt)',color:'var(--text2)',letterSpacing:1}}>{Math.round(r.size/1024)}KB · sent to AI as native document</div>
                    :<>
                      <div style={{fontSize:'var(--fxt)',color:'var(--text2)',letterSpacing:1}}>{Math.round(r.size/1024)}KB · {(r.content||'').split(/\s+/).filter(Boolean).length.toLocaleString()} words</div>
                      {(r.content||'').length>6000&&<div style={{fontSize:'var(--fxt)',color:'var(--accent2)',letterSpacing:1}}>&#x26A0; truncated to 6KB in context</div>}
                    </>
                  }
                </div>
                <span style={{cursor:'pointer',color:'var(--red)',fontSize:12,padding:'2px 4px',flexShrink:0}} onClick={()=>removeRef(r.id)}>&#x2715;</span>
              </div>
            );
          })}
          {refs.length>0&&(()=>{
            const textRefs2=refs.filter(r=>!r.type||r.type==='text');
            const pdfRefs2=refs.filter(r=>r.type==='pdf');
            return(
              <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:1,marginTop:4,lineHeight:1.8}}>
                {refs.length} file{refs.length!==1?'s':''} in library
                {textRefs2.length>0&&<> · {textRefs2.length} text (~{Math.round(textRefs2.reduce((a,r)=>a+Math.min((r.content||'').length,6000),0)/1000)}KB in context)</>}
                {pdfRefs2.length>0&&<> · {pdfRefs2.length} PDF{pdfRefs2.length!==1?'s':''} (native)</>}
              </div>
            );
          })()}
        </div>
      )}

      {/* HISTORY tab */}
      {tab==='history'&&(
        <div style={{flex:1,overflowY:'auto',padding:'14px',display:'flex',flexDirection:'column',gap:10}}>
          {histView?(
            /* ── viewing a past conversation ── */
            <>
              <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
                <button onClick={()=>setHistView(null)}
                  style={{background:'var(--raised)',border:'2px solid var(--brutal)',color:'var(--text2)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'4px 10px',cursor:'pointer',letterSpacing:'1px',boxShadow:'2px 2px 0 var(--brutal)'}}>
                  &#x2190; BACK
                </button>
                <span style={{flex:1,fontSize:'var(--fxs)',letterSpacing:'1px',color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{histView.title}</span>
                <button onClick={()=>{setMsgs(histView.messages);setHistView(null);setTab('chat');}}
                  style={{background:'var(--accent)',border:'2px solid var(--accent)',color:'var(--bg)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'4px 10px',cursor:'pointer',letterSpacing:'1px',boxShadow:'2px 2px 0 var(--brutal)',flexShrink:0}}>
                  RESTORE
                </button>
              </div>
              <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:'1px'}}>
                {new Date(histView.updatedAt).toLocaleString()} · {histView.messages.filter(m=>m.role==='user').length} exchanges
              </div>
              {histView.messages.map((m,i)=>(
                <div key={i} style={{
                  alignSelf:m.role==='user'?'flex-end':'flex-start',
                  maxWidth:'92%',padding:'8px 11px',
                  background:m.role==='user'?'var(--accent)':'var(--raised)',
                  color:m.role==='user'?'var(--bg)':'var(--text)',
                  border:'2px solid '+(m.role==='user'?'var(--accent)':'var(--brutal)'),
                  fontSize:'var(--fxs)',lineHeight:1.7,whiteSpace:'pre-wrap',
                  boxShadow:m.role==='user'?'none':'2px 2px 0 var(--brutal)',
                }}>{m.content}</div>
              ))}
            </>
          ):(
            /* ── conversation list ── */
            <>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{flex:1,fontSize:'var(--fxs)',color:'var(--text2)',letterSpacing:'1px'}}>
                  {chatHistory.length} saved session{chatHistory.length!==1?'s':''}
                </span>
                <button onClick={()=>{newSession();setTab('chat');}}
                  style={{background:'var(--raised)',border:'2px solid var(--accent2)',color:'var(--accent2)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'4px 10px',cursor:'pointer',letterSpacing:'1px',boxShadow:'2px 2px 0 var(--accent2)'}}>
                  + NEW SESSION
                </button>
              </div>
              {chatHistory.length===0&&(
                <div style={{color:'var(--muted)',fontSize:'var(--fxs)',letterSpacing:'1px',padding:'12px 0'}}>No history yet. Start chatting and your sessions will be saved here automatically.</div>
              )}
              {chatHistory.map(conv=>(
                <div key={conv.id}
                  style={{background:'var(--raised)',border:'2px solid var(--brutal)',padding:'10px 12px',display:'flex',alignItems:'flex-start',gap:8,boxShadow:'3px 3px 0 var(--brutal)',cursor:'pointer'}}
                  onClick={()=>setHistView(conv)}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:'var(--fxb)',fontWeight:700,letterSpacing:'1px',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{conv.title}</div>
                    <div style={{fontSize:'var(--fxt)',color:'var(--text2)',letterSpacing:'1px'}}>
                      {new Date(conv.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
                      {' · '}{conv.messages.filter(m=>m.role==='user').length} exchange{conv.messages.filter(m=>m.role==='user').length!==1?'s':''}

  const [optA,setOptA]=useState(node.optA||'');
  const [actA,setActA]=useState(node.actA||'');
  const [mutedA,setMutedA]=useState(node.mutedA||false);
  const [optB,setOptB]=useState(node.optB||'');
  const [actB,setActB]=useState(node.actB||'');
  const [mutedB,setMutedB]=useState(node.mutedB||false);
  const [optC,setOptC]=useState(node.optC||'');
  const [actC,setActC]=useState(node.actC||'');
  const [mutedC,setMutedC]=useState(node.mutedC||false);
  const [condition,setCondition]=useState(node.condition||'');

  const [action,setAction]=useState(node.action||'give');
  const [item,setItem]=useState(node.item||'');

  const save=()=>{
    const base={...node,text};
    if(t==='THOUGHTS') onSave({...base,emotion,voice:emotion});

    else if(t==='LOOP') onSave({...base,condition});
    else if(t==='ITEMS') onSave({...base,action,item});

/* ── MEDIA PATH UTILITIES ────────────────────────────────────────── */
// Converts absolute Windows paths → relative paths usable by the game.
// Base: L:\Beauregarde_game\underneath\ (game root one level up from project\)
const MEDIA_GAME_ROOT='L:\\Beauregarde_game\\underneath\\';

function toRelPath(raw){
  if(!raw)return'';
  const norm=(raw||'').trim().replace(/\//g,'\\');
  if(norm.toLowerCase().startsWith(MEDIA_GAME_ROOT.toLowerCase()))
    return'../'+norm.slice(MEDIA_GAME_ROOT.length).replace(/\\/g,'/');
  // already relative (starts with ../ or ./) — just normalise slashes
  return raw.replace(/\\/g,'/');
}
function toPreviewUrl(relPath){
  if(!relPath)return null;
  try{return new URL(relPath.replace(/\\/g,'/'),document.baseURI).href;}catch{return null;}
}

/* ── MEDIA PICKER ─────────────────────────────────────────────────── */
function MediaPicker({value,onChange,accept,label,hint}){
  const [draft,setDraft]=useState(value||'');
  const [objUrl,setObjUrl]=useState(null);
  const fileRef=useRef(null);

  useEffect(()=>{setDraft(value||'');setObjUrl(null);},[value]);

  const ext=(draft||'').split('.').pop().toLowerCase();
  const isVideo=['webm','mp4','mov'].includes(ext);
  const isImage=['png','jpg','jpeg','gif','webp'].includes(ext);
  const previewUrl=objUrl||(draft?toPreviewUrl(toRelPath(draft)):null);

  const commit=raw=>{
    setDraft(raw);
    onChange(toRelPath(raw));
    setObjUrl(null);
  };

  const browse=async()=>{
    try{
      const types=accept==='video'
        ?[{description:'Video',accept:{'video/*':['.webm','.mp4','.mov']}}]
        :accept==='image'
        ?[{description:'Image',accept:{'image/*':['.png','.jpg','.jpeg','.webp','.gif']}}]
        :[{description:'Media',accept:{'image/*':['.png','.jpg','.jpeg','.webp','.gif'],'video/*':['.webm','.mp4','.mov']}}];
      const [handle]=await window.showOpenFilePicker({types});
      const file=await handle.getFile();
      setObjUrl(URL.createObjectURL(file));
      // path input stays as-is — user pastes the full path separately,
      // but the preview now shows the picked file so they can visually confirm.
    }catch(e){/* cancelled or not supported */}
  };

  const convertedPath=draft?toRelPath(draft):'';
  const showConverted=draft&&convertedPath!==draft.replace(/\\/g,'/');

  return(
    <div className="mpick">
      {previewUrl&&isImage&&<img className="mpick-preview" src={previewUrl} alt="preview"/>}
      {previewUrl&&isVideo&&<video className="mpick-preview" src={previewUrl} autoPlay loop muted playsInline/>}
      {!previewUrl&&<div className="mpick-empty">{isVideo?'▶ VIDEO':isImage?'◻ IMAGE':'◻ '+(label||'NO FILE')}</div>}
      <div className="mpick-row">
        <input className="pfi" value={draft}
          onChange={e=>commit(e.target.value)}
          placeholder={hint||'L:\\Beauregarde_game\\underneath\\graphics\\...'}/>
        <button type="button" className="mpick-browse" onClick={browse} title="Browse for file (preview only — paste the full path above)">&#128193;</button>
      </div>
      {showConverted&&<div className="mpick-hint">&#x2192; {convertedPath}</div>}
    </div>
  );
}

/* ── CUTSCENE SERIALIZER ─────────────────────────────────────────── */
function serializeCutscene(tree){
  const{nodes:ns,conns:cs}=(tree.subCanvas||{nodes:[],conns:[]});
  if(!ns.length)return[];
  const adj={};
  ns.forEach(n=>{adj[n.id]={};});
  cs.forEach(c=>{if(adj[c.src])adj[c.src][c.srcPort]=c.dst;});
  const hasPred=new Set(cs.map(c=>c.dst));
  const root=ns.find(n=>n.type==='CUT_START')||ns.find(n=>!hasPred.has(n.id))||ns[0];
  if(!root)return[];
  const visited=new Set();const ordered=[];const queue=[root];
  while(queue.length){
    const n=queue.shift();if(!n||visited.has(n.id))continue;
    visited.add(n.id);ordered.push(n);
    const outs=adj[n.id]||{};
    ['first','out','a','b','c'].forEach(p=>{
      if(outs[p]){const nxt=ns.find(x=>x.id===outs[p]);if(nxt&&!visited.has(nxt.id))queue.push(nxt);}
    });
  }
  return ordered.map(n=>{
    const outs=adj[n.id]||{};const nxt=id=>id||null;
    if(n.type==='CUT_START')return{id:n.id,type:'start',background:n.background||'#060a08',backgroundVideo:n.backgroundVideo||''};
    if(n.type==='CUT_LINE')return{id:n.id,type:'line',speaker:n.speaker||'NARRATOR',voiceChannel:n.voiceChannel||'NARRATOR',text:n.text||'',textEffect:n.textEffect||'typewriter',effectSpeed:n.effectSpeed||34,autoAdvance:n.autoAdvance||0,fadeEffect:n.fadeEffect||'none',next:nxt(outs.out)};
    if(n.type==='CUT_CHOICE')return{id:n.id,type:'choice',opts:(n.options||[]).map((o,i)=>({t:o.text||'',muted:!!o.muted,next:nxt(outs[['a','b','c'][i]])})).filter(o=>o.t)};
    if(n.type==='CUT_VIDEO')return{id:n.id,type:'video',file:n.videoFile||'',videoEffect:n.videoEffect||'none',fadeEffect:n.fadeEffect||'none',loop:!!n.loop,duration:n.duration||0,overlayText:n.overlayText||'',overlayEffect:n.overlayEffect||'instant',next:nxt(outs.out)};
    if(n.type==='CUT_TITLE')return{id:n.id,type:'title',title:n.titleText||'',sub:n.titleSub||'',textEffect:n.textEffect||'fade_in',background:n.background||'#000000',duration:n.duration||3000,next:nxt(outs.out)};
    if(n.type==='CUT_WAIT')return{id:n.id,type:'wait',ms:n.waitMs||1000,fadeEffect:n.fadeEffect||'none',next:nxt(outs.out)};
    if(n.type==='CUT_ACTION')return{id:n.id,type:'action',action:n.action||'',actionValue:n.actionValue||''};
    return null;
  }).filter(Boolean);
}

/* ── QUEST STEP SERIALIZER ───────────────────────────────────────── */
function serializeQuestSteps(quest){
  const {nodes:ns,conns:cs}=(quest.subCanvas||{nodes:[],conns:[]});
  if(!ns.length)return[];
  const adj={};
  ns.forEach(n=>{adj[n.id]={};});
  cs.forEach(c=>{if(adj[c.src])adj[c.src][c.srcPort]=c.dst;});
  const hasPredecessor=new Set(cs.map(c=>c.dst));
  const root=ns.find(n=>n.type==='QUEST_INFO')||ns.find(n=>!hasPredecessor.has(n.id))||ns[0];
  if(!root)return[];
  const visited=new Set();
  const ordered=[];
  const queue=[root];
  while(queue.length){
    const n=queue.shift();
    if(!n||visited.has(n.id))continue;
    visited.add(n.id);
    ordered.push(n);
    const outs=adj[n.id]||{};
    ['first_step','out','if_met','if_not'].forEach(p=>{
      if(outs[p]){const nxt=ns.find(x=>x.id===outs[p]);if(nxt&&!visited.has(nxt.id))queue.push(nxt);}
    });
  }
  return ordered.map(n=>{
    const outs=adj[n.id]||{};
    const nxt=id=>id||null;
    if(n.type==='QUEST_INFO')return null;
    if(n.type==='QUEST_STEP')return{id:n.id,type:'step',label:n.label||'',notes:n.notes||'',dialogue:n.dialogueKey||null,atPlace:n.atPlace||null,next:nxt(outs.out)};
    if(n.type==='QUEST_COLLECTABLE')return{id:n.id,type:'collectable',item:n.item||n.label||'',notes:n.notes||'',next:nxt(outs.out)};
    if(n.type==='QUEST_CONDITION')return{id:n.id,type:'condition',condition:n.condition||n.label||'',notes:n.notes||'',ifMet:nxt(outs.if_met),ifNot:nxt(outs.if_not)};
    if(n.type==='QUEST_END')return{id:n.id,type:'end',notes:n.notes||''};
    return null;
  }).filter(Boolean);
}
