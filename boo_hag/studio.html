            <span className="doc-name" title={doc.name}>{doc.name}</span>
            <span className="doc-size">{fmt(doc.size)}</span>
            <button className="doc-delete" onClick={e => { e.stopPropagation(); deleteDoc(doc.id); }}>✕</button>
          </div>
          <div className={`doc-preview${expanded[doc.id] ? ' open' : ''}`}>
            <div className="doc-preview-text">{doc.content.slice(0, 600)}{doc.content.length > 600 ? '\n…' : ''}</div>
          </div>
        </div>
      ))}

      {docs.length > 0 && (
        <button className="add-btn" style={{marginTop:8}} onClick={() => {
          const next = JSON.parse(JSON.stringify(store));
          next.importedDocs = next.importedDocs.map(d => ({ ...d, enabled: true }));
          onStoreChange(next, 'Enabled all docs');
        }}>Enable All</button>
      )}
    </div>
  );
}

// ── GAME BIBLE SIDEBAR ─────────────────────────────────────────────────
function GameBibleSidebar({ store, onStoreChange, onAddCanon, onJumpToNode }) {
  const [tab, setTab] = useState('SCENES');

  const setVar = useCallback((name, value) => {
    const next = JSON.parse(JSON.stringify(store));
    next.variables[name] = { ...next.variables[name], value };
    onStoreChange(next, `Edited variable: ${name}=${value}`);
  }, [store, onStoreChange]);

  const addVariable = useCallback(() => {
    const name = prompt('New variable name (lowercase, underscores):');
    if (!name || !name.trim()) return;
    const key = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
    if (store.variables[key]) { alert(`Variable "${key}" already exists.`); return; }
    const isInt = confirm('OK = integer (with range), Cancel = boolean');
    const next = JSON.parse(JSON.stringify(store));
    if (isInt) {
      next.variables[key] = { type: 'int', initial: 0, value: 0, range: [0, 100] };
    } else {
      next.variables[key] = { type: 'bool', initial: false, value: false };
    }
    onStoreChange(next, `Added variable: ${key}`);
  }, [store, onStoreChange]);

  const deleteCanon = useCallback((id) => {
    const next = JSON.parse(JSON.stringify(store));
    next.canon = next.canon.filter(c => c.id !== id);
    onStoreChange(next, 'Deleted canon entry');
  }, [store, onStoreChange]);

  const setActiveScene = useCallback((id) => {
    const next = JSON.parse(JSON.stringify(store));
    next.activeScene = id;
    onStoreChange(next, null);
  }, [store, onStoreChange]);

  const setSceneLocation = useCallback((sceneId, locationId) => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === sceneId);
    if (!sc) return;
    sc.locationId = locationId;
    const loc = next.locations.find(l => l.id === locationId);
    onStoreChange(next, `Scene "${sc.name}" location → ${loc ? loc.name : 'none'}`);
  }, [store, onStoreChange]);

  const cycleStatus = useCallback((id, e) => {
    e.stopPropagation();
    const cycle = ['draft','in_progress','canon'];
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === id);
    if (!sc) return;
    const idx = cycle.indexOf(sc.status);
    sc.status = cycle[(idx + 1) % cycle.length];
    onStoreChange(next, `Status: ${sc.name} → ${sc.status}`);
  }, [store, onStoreChange]);

  const renameScene = useCallback((id) => {
    const sc = store.scenes.find(s => s.id === id);
    const name = prompt('Rename scene:', sc?.name || '');
    if (!name || !name.trim()) return;
    const next = JSON.parse(JSON.stringify(store));
    const s2 = next.scenes.find(s => s.id === id);
    if (s2) s2.name = name.trim();
    onStoreChange(next, `Renamed scene: ${name.trim()}`);
  }, [store, onStoreChange]);

  const deleteScene = useCallback((id, e) => {
    e.stopPropagation();
    const sc = store.scenes.find(s => s.id === id);
    if (!confirm(`Delete scene "${sc?.name}"? This cannot be undone.`)) return;
    const next = JSON.parse(JSON.stringify(store));
    next.scenes = next.scenes.filter(s => s.id !== id);
    if (next.activeScene === id) next.activeScene = next.scenes[0]?.id || null;
    onStoreChange(next, `Deleted scene: ${sc?.name}`);
  }, [store, onStoreChange]);

  return (
    <div className="bible-sidebar">
      <div className="bible-tabs">
        {['SCENES','LOC','QST','VARS','FX','CANON','DOCS','CHAR'].map(t => (
          <button key={t} className={`bible-tab${tab===t?' active':''}`} onClick={() => setTab(t)}>{t}</button>
        ))}
      </div>
      <div className="bible-content">
        {tab === 'SCENES' && (
          <>
            {store.scenes.map(s => (
              <div key={s.id} className={`scene-item${s.id===store.activeScene?' active-scene':''}`}
                onClick={() => setActiveScene(s.id)}>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                    <div className="scene-name" style={{flex:1}}>{s.name}</div>
                    <button onClick={e => { e.stopPropagation(); renameScene(s.id); }}
                      title="Rename" style={{background:'none',border:'none',color:'var(--text-dim)',fontSize:'11px',cursor:'pointer',padding:'0 2px',lineHeight:1,opacity:0.6}}>✎</button>
                    <button onClick={e => deleteScene(s.id, e)}
                      title="Delete" style={{background:'none',border:'none',color:'var(--text-dim)',fontSize:'12px',cursor:'pointer',padding:'0 2px',lineHeight:1,opacity:0.6}}>✕</button>
                  </div>
                  <div style={{display:'flex',gap:4,marginTop:5,flexWrap:'wrap',alignItems:'center'}}>
                    <span className={`scene-badge badge-${s.branch}`}>{s.branch}</span>
                    <span className={`scene-badge badge-${s.type}`}>{s.type}</span>
                    <span className={`scene-badge badge-${s.status}`} style={{cursor:'pointer'}}
                      onClick={e => cycleStatus(s.id, e)} title="Click to cycle status">
                      {s.status}
                    </span>
                    <span style={{color:'var(--text-dim)',fontSize:'10px',marginLeft:'auto'}}>
                      {s.nodes.length} nodes
                    </span>
                  </div>
                  {(store.locations || []).length > 0 && (
                    <select
                      value={s.locationId || ''}
                      onClick={e => e.stopPropagation()}
                      onChange={e => setSceneLocation(s.id, e.target.value || null)}
                      title="Location this scene plays in"
                      style={{width:'100%',marginTop:5,background:'var(--surface)',border:'1px solid var(--border)',
                        color: s.locationId ? 'var(--steel)' : 'var(--text-dim)',
                        fontFamily:'inherit',fontSize:'9px',padding:'2px 4px',borderRadius:3,outline:'none'}}>
                      <option value="">⌖ no location</option>
                      {store.locations.map(l => <option key={l.id} value={l.id}>⌖ {l.name}</option>)}
                    </select>
                  )}
                </div>
              </div>
            ))}
          </>
        )}
        {tab === 'LOC' && (
          <LocationsTab store={store} onStoreChange={onStoreChange} />
        )}
        {tab === 'QST' && (
          <QuestsTab store={store} onStoreChange={onStoreChange} />
        )}
        {tab === 'VARS' && (
          <VariablesTab variables={store.variables} scenes={store.scenes} onSet={setVar} onAdd={addVariable} onJumpToNode={onJumpToNode} />
        )}
        {tab === 'FX' && (
          <ConsequencesTab consequences={store.consequences || []} store={store} onStoreChange={onStoreChange} />
        )}
        {tab === 'CANON' && (
          <>
            {store.canon.length === 0 && (
              <div style={{color:'var(--text-dim)',fontSize:'11px',marginBottom:12}}>No canon decisions yet. Use "Lock to Canon" on any Claude response.</div>
            )}
            {store.canon.map(c => (
              <div key={c.id} className="canon-entry">
                <button className="canon-delete" onClick={() => deleteCanon(c.id)}>✕</button>
                <div className="canon-entry-title">{c.title}</div>
                <div className="canon-entry-body">{c.body}</div>
                <div className="canon-entry-date">{new Date(c.createdAt).toLocaleDateString()}</div>
              </div>
            ))}
            <button className="add-btn" onClick={onAddCanon}>+ Add Canon Note</button>
          </>
        )}
        {tab === 'DOCS' && (
          <DocsTab store={store} onStoreChange={onStoreChange} />
        )}
        {tab === 'CHAR' && (
          <>
            <div className="bible-card">
              <div className="bible-card-title">The Protagonist</div>
              <div className="bible-card-body">
                <strong>TWO beings conjoined</strong> by 3-7-9 alignment.<br/><br/>
                <strong>BOO HAG</strong> — ancient, pre-Bureau, feral. Power. Body. Hunger.<br/><br/>
                <strong>THE GIRL</strong> — Arceneaux family. College student. Died March 3, 2003. Consciousness transferred inside instead of dispersing.<br/><br/>
                <strong>Conjunction:</strong> July 25, 9:09 PM. Father killed. Mother witnessed. Girl became player.
              </div>
            </div>
            <div className="bible-card">
              <div className="bible-card-title">The Face</div>
              <div className="bible-card-body">
                Symbiotic. Always present. Cannot be lost.<br/>SHED retracts it — it stays inside.<br/><br/>
                <strong>CALM breeds control.</strong> FEAR breeds chaos.<br/>Anchors: phone, keepsake, familiar smells.
              </div>
            </div>
            <div className="bible-card">
              <div className="bible-card-title">Attitudes</div>
              <div className="bible-card-body">
                <strong>RETICENCE</strong> — denial, mechanically hardest<br/>
                <strong>ANGER</strong> — claiming while furious<br/>
                <strong>CURIOSITY</strong> — accepts to understand<br/>
                <strong>JOY</strong> — unlocks after first power use<br/>
                <strong>GREED</strong> — unlocks after joy
              </div>
            </div>
            <div className="bible-card">
              <div className="bible-card-title">Consciousness</div>
              <div className="bible-card-body">
                0 · FERAL — no words, instinct only<br/>
                1 · WAKING — groping for language<br/>
                2 · CLEAR — full sentences, sparse<br/>
                3 · GRIOTTE — both integrated, authoritative
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── CHAT VIEW ─────────────────────────────────────────────────────────
function ChatView({ store, onStoreChange, history, onSwitchToTree, pendingNodeContext, onJumpToNode }) {
  const [input, setInput] = useState('');
  const [streaming, setStreaming] = useState(false);
  const [canonModal, setCanonModal] = useState(null);
  const [showSessionMenu, setShowSessionMenu] = useState(false);
  const [renamingSession, setRenamingSession] = useState(false);
  const [renameVal, setRenameVal] = useState('');
  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);
  const sessionMenuRef = useRef(null);

  const session = store.chatSessions[store.activeSession] || { name: 'Session', messages: [] };
  const messages = session.messages;
  const allSessions = Object.entries(store.chatSessions);

  // Close session menu on outside click
  useEffect(() => {
    if (!showSessionMenu) return;
    const handler = (e) => { if (!sessionMenuRef.current?.contains(e.target)) setShowSessionMenu(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showSessionMenu]);

  const switchSession = (id) => {
    const next = JSON.parse(JSON.stringify(store));
    next.activeSession = id;
    onStoreChange(next, null);
    setShowSessionMenu(false);
  };

  const newSession = () => {
    const id = `session_${Date.now()}`;
    const name = `Session ${allSessions.length + 1}`;
    const next = JSON.parse(JSON.stringify(store));
    next.chatSessions[id] = { name, messages: [] };
    next.activeSession = id;
    onStoreChange(next, null);
    setShowSessionMenu(false);
  };

  const deleteSession = (id) => {
    if (Object.keys(store.chatSessions).length <= 1) return;
    const sess = store.chatSessions[id];
    if (!confirm(`Delete session "${sess?.name}" (${sess?.messages.length || 0} messages)? This cannot be undone from here — use History to recover.`)) return;
    const next = JSON.parse(JSON.stringify(store));
    delete next.chatSessions[id];
    if (next.activeSession === id) {
      next.activeSession = Object.keys(next.chatSessions)[0];
    }
    onStoreChange(next, `Deleted session: ${sess?.name}`);
    setShowSessionMenu(false);
  };

  const clearSession = () => {
    if (messages.length && !confirm(`Clear all ${messages.length} messages in "${session.name}"?`)) return;
    const next = JSON.parse(JSON.stringify(store));
    next.chatSessions[next.activeSession].messages = [];
    onStoreChange(next, 'Cleared chat session');
    setShowSessionMenu(false);
  };

  const renameSession = () => {
    if (!renameVal.trim()) { setRenamingSession(false); return; }
    const next = JSON.parse(JSON.stringify(store));
    if (!next.chatSessions[next.activeSession]) return;
    next.chatSessions[next.activeSession].name = renameVal.trim();
    onStoreChange(next, null);
    setRenamingSession(false);
  };

  const scrollToBottom = useCallback(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, []);

  useEffect(() => { scrollToBottom(); }, [messages.length, streaming]);

  // Pre-fill input when "Ask Claude" is clicked on a node in TREE
  useEffect(() => {
    if (!pendingNodeContext) return;
    setInput(prev => pendingNodeContext.str + (prev ? prev : ''));
    inputRef.current?.focus();
  }, [pendingNodeContext]);

  const updateMessages = useCallback((newMessages, snapshotLabel) => {
    const next = JSON.parse(JSON.stringify(store));
    if (!next.chatSessions[next.activeSession]) {
      next.chatSessions[next.activeSession] = { name: 'Session', messages: [] };
    }
    next.chatSessions[next.activeSession].messages = newMessages;
    onStoreChange(next, snapshotLabel);
  }, [store, onStoreChange]);

  const send = useCallback(async () => {
    const text = input.trim();
    if (!text || streaming) return;
    setInput('');

    const userMsg = { role: 'user', content: text, id: Date.now() };
    const newMessages = [...messages, userMsg];
    updateMessages(newMessages, null);
    setStreaming(true);

    try {
      const apiMessages = newMessages.map(m => ({ role: m.role, content: m.content }));
      const gameContext = buildGameContext(store);

      const res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: apiMessages, gameContext }),
      });

      if (!res.ok) throw new Error(`API ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let accumulated = '';
      const assistantId = Date.now() + 1;

      const streamMessages = [...newMessages, { role: 'assistant', content: '', id: assistantId, streaming: true }];
      updateMessages(streamMessages, null);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value).split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            if (parsed.text) {
              accumulated += parsed.text;
              const updatedMsgs = [...newMessages, { role: 'assistant', content: accumulated, id: assistantId, streaming: true }];
              updateMessages(updatedMsgs, null);
            }
            if (parsed.error) throw new Error(parsed.error);
          } catch {}
        }
      }

      // Parse NODE_JSON from final response
      const nj = extractNodeJson(accumulated);
      let finalStore = JSON.parse(JSON.stringify(store));
      finalStore.chatSessions[finalStore.activeSession].messages = [
        ...newMessages,
        { role: 'assistant', content: accumulated, id: assistantId, nodeJson: nj }
      ];
      if (nj) finalStore = applyNodeJson(finalStore, nj);
      onStoreChange(finalStore, `Claude: ${nj ? `added ${nj.nodes?.length||0} nodes to ${nj.scene}` : 'response'}`);

    } catch (err) {
      const errMessages = [...newMessages, {
        role: 'assistant', content: `Error: ${err.message}\n\nCheck your API connection and that /api/claude is deployed.`,
        id: Date.now() + 1, isError: true
      }];
      updateMessages(errMessages, null);
    } finally {
      setStreaming(false);
    }
  }, [input, streaming, messages, store, updateMessages, onStoreChange]);

  const handleKeyDown = useCallback((e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }, [send]);

  const lockToCanon = useCallback((msg, prefill) => {
    setCanonModal({ msg, prefill });
  }, []);

  const saveCanon = useCallback((title, body) => {
    const next = JSON.parse(JSON.stringify(store));
    next.canon.unshift({ id: Date.now().toString(), title, body, createdAt: Date.now() });
    onStoreChange(next, `Locked to canon: ${title}`);
    setCanonModal(null);
  }, [store, onStoreChange]);

  const undoLastNodes = useCallback((msgId) => {
    const msg = messages.find(m => m.id === msgId);
    if (!msg?.nodeJson) return;
    // Find the exact snapshot created when this message's nodes were applied,
    // then restore whatever came immediately before it — not just "one back
    // from wherever history currently sits" (which would undo unrelated
    // edits made after this message instead of this message's nodes).
    const snaps = history.snapshots;
    const idx = snaps.findIndex(s => {
      const sess = s.state?.chatSessions?.[s.state.activeSession];
      return sess?.messages?.some(m => m.id === msgId);
    });
    if (idx > 0) {
      onStoreChange(snaps[idx - 1].state, null);
    } else if (idx === 0) {
      alert("Can't undo — this is the earliest recorded change.");
    } else {
      alert("Couldn't find this change in history — it may be too old (history keeps the last 50 actions).");
    }
  }, [messages, history, onStoreChange]);

  return (
    <div className="chat-layout">
      <GameBibleSidebar
        store={store}
        onStoreChange={onStoreChange}
        onAddCanon={() => setCanonModal({ msg: null, prefill: '' })}
        onJumpToNode={onJumpToNode}
      />

      <div className="chat-main">
        <div className="chat-session-bar" style={{position:'relative'}}>
          <span className="session-label">SESSION</span>
          {renamingSession ? (
            <input
              autoFocus
              value={renameVal}
              onChange={e => setRenameVal(e.target.value)}
              onBlur={renameSession}
              onKeyDown={e => { if (e.key==='Enter') renameSession(); if (e.key==='Escape') setRenamingSession(false); }}
              style={{background:'var(--surface2)',border:'1px solid var(--amber-dim)',color:'var(--text)',fontFamily:'inherit',fontSize:'11px',padding:'2px 6px',borderRadius:3,outline:'none',width:130}}
            />
          ) : (
            <button className="session-name-btn" onClick={() => setShowSessionMenu(v => !v)}>
              {session.name} ▾
            </button>
          )}
          <span style={{color:'var(--text-dim)',fontSize:'10px',marginLeft:'auto'}}>
            {store.scenes.find(s=>s.id===store.activeScene)?.name || '—'}
          </span>

          {showSessionMenu && (
            <div ref={sessionMenuRef} style={{
              position:'absolute',top:'100%',left:0,zIndex:50,
              background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,
              boxShadow:'0 8px 24px rgba(0,0,0,0.5)',minWidth:220,padding:'4px 0',
            }}>
              {allSessions.map(([id, s]) => (
                <div key={id} style={{display:'flex',alignItems:'center',gap:4,padding:'5px 12px',cursor:'pointer',
                  background: id===store.activeSession ? 'rgba(200,136,10,0.08)' : 'none'}}
                  onClick={() => switchSession(id)}>
                  <span style={{flex:1,color:id===store.activeSession?'var(--amber)':'var(--bone-dim)',fontSize:'11px'}}>{s.name}</span>
                  <span style={{color:'var(--text-dim)',fontSize:'9px'}}>{s.messages.length} msg</span>
                  {allSessions.length > 1 && (
                    <button onClick={e => { e.stopPropagation(); deleteSession(id); }}
                      style={{background:'none',border:'none',color:'var(--text-dim)',fontSize:'12px',cursor:'pointer',lineHeight:1,padding:'0 2px'}}>✕</button>
                  )}
                </div>
              ))}
              <div style={{borderTop:'1px solid var(--border)',margin:'4px 0'}} />
              <div style={{padding:'4px 8px',display:'flex',gap:4}}>
                <button onClick={newSession} style={{flex:1,background:'none',border:'1px dashed var(--border)',color:'var(--text-dim)',fontFamily:'inherit',fontSize:'10px',padding:'4px',cursor:'pointer',borderRadius:3}}>+ New Session</button>
                <button onClick={() => { setRenameVal(session.name); setRenamingSession(true); setShowSessionMenu(false); }}
                  style={{flex:1,background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',fontFamily:'inherit',fontSize:'10px',padding:'4px',cursor:'pointer',borderRadius:3}}>Rename</button>
                <button onClick={clearSession}
                  style={{flex:1,background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',fontFamily:'inherit',fontSize:'10px',padding:'4px',cursor:'pointer',borderRadius:3}}>Clear</button>
              </div>
            </div>
          )}
        </div>

        <div className="chat-messages">
          {messages.length === 0 && (
            <div style={{color:'var(--text-dim)',fontSize:'12px',textAlign:'center',marginTop:40}}>
              <div style={{color:'var(--amber)',marginBottom:8,letterSpacing:'0.08em'}}>BOO HAG STUDIO</div>
              <div>Ask Claude to write a scene, create dialogue, design a quest.</div>
              <div style={{marginTop:8,fontSize:'11px'}}>Example: "write the waitress scene in the diner"</div>
            </div>
          )}
          {messages.map(msg => (
            <div key={msg.id} className={`msg msg-${msg.role}`}>
              <div className="msg-bubble" style={msg.isError ? {borderColor:'var(--red)',color:'#c86060'} : {}}>
                {msg.role === 'assistant' ? stripNodeJson(msg.content) : msg.content}
                {msg.streaming && <span className="typing-indicator"> ▋</span>}
              </div>
              {msg.role === 'assistant' && !msg.streaming && (
                <>
                  <div className="msg-actions">
                    <button className="msg-action-btn"
                      onClick={() => lockToCanon(msg, msg.content.slice(0, 200))}>
                      Lock to Canon
                    </button>
                    {!msg.nodeJson && (
                      <button className="msg-action-btn" onClick={() => {
                        // Add response as a NARRATION node
                        const nj = {
                          action: 'add_nodes', scene: store.activeScene,
                          nodes: [{ id: `narration_${Date.now()}`, type: 'NARRATION', text: stripNodeJson(msg.content).slice(0,400), media: null, next: null }]
                        };
                        const next = applyNodeJson(JSON.parse(JSON.stringify(store)), nj);
                        onStoreChange(next, 'Manually added narration node');
                      }}>Add to Tree</button>
                    )}
                    {msg.nodeJson && (
                      <button className="msg-action-btn danger" onClick={() => undoLastNodes(msg.id)}>
                        Undo Last Nodes
                      </button>
                    )}
                  </div>
                  {msg.nodeJson && (
                    <div className="node-banner">
                      <span>✓ Claude added {msg.nodeJson.nodes?.length || 0} nodes to {msg.nodeJson.scene}</span>
                      <div className="node-banner-btns">
                        {onSwitchToTree && (
                          <button className="node-banner-btn" onClick={() => {
                            const next = JSON.parse(JSON.stringify(store));
                            next.activeScene = msg.nodeJson.scene || next.activeScene;
                            onStoreChange(next, null);
                            onSwitchToTree(true);
                          }}>View in Tree</button>
                        )}
                        <button className="node-banner-btn" onClick={() => undoLastNodes(msg.id)}>Undo</button>
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          ))}
          <div ref={messagesEndRef} />
        </div>

        <div className="chat-input-area">
          <textarea
            ref={inputRef}
            className="chat-input"
            placeholder="Ask Claude to write a scene, expand dialogue, design a quest…  (Enter to send, Shift+Enter for newline)"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            rows={2}
          />
          <button className="send-btn" onClick={send} disabled={streaming || !input.trim()}>
            {streaming ? '…' : 'SEND'}
          </button>
        </div>
      </div>

      {canonModal && (
        <CanonModal
          initial={{ title: '', body: canonModal.prefill || '' }}
          onSave={saveCanon}
          onClose={() => setCanonModal(null)}
        />
      )}
    </div>
  );
}

// ── NODE CONSTANTS ─────────────────────────────────────────────────────
const NODE_COLORS = {
  NARRATION:          { bg: '#2a2820', border: '#4a4438', header: '#3a3628', text: '#e8e0d4' },
  CHOICE:             { bg: '#2a1e08', border: '#7a5206', header: '#3a2808', text: '#e8a820' },
  HUB:                { bg: '#2a1e08', border: '#7a5206', header: '#3a2808', text: '#e8a820' },
  CHECK:              { bg: '#0e1e1c', border: '#1a7870', header: '#122420', text: '#40c8b8' },
  CONDITION:          { bg: '#0e1e1c', border: '#1a7870', header: '#122420', text: '#40c8b8' },
  VAR_SET:            { bg: '#121e10', border: '#4a7840', header: '#182818', text: '#90c870' },
  ATTITUDE_BRANCH:    { bg: '#1a0e22', border: '#6a3a8a', header: '#220e2e', text: '#c080e0' },
  CONSCIOUSNESS_GATE: { bg: '#0e1822', border: '#3a5878', header: '#121e2c', text: '#70a8d8' },
  SCENE_TRANSITION:   { bg: '#1e0a08', border: '#8a1a10', header: '#280e0a', text: '#e06050' },
  SECTION_LABEL:      { bg: '#161210', border: '#3a3028', header: '#1e1814', text: '#786e66' },
  ANCHOR_USE:         { bg: '#221a06', border: '#a87820', header: '#2c2208', text: '#d8a830' },
};

const NODE_W  = 220;   // full-card width (selected node)
const NODE_H  = 90;    // full-card height (selected node)
const PILL_H  = 34;    // compact pill height (default node rendering)
const X_PITCH = 300;   // horizontal distance between depth columns (LR layout)
const Y_PITCH = 60;    // vertical distance between sibling rows

const TIER_LABELS = ['FERAL','WAKING','CLEAR','GRIOTTE'];

// ── SPEAKER / ROLE COLOR SYSTEM ───────────────────────────────────────
// Node color = who is "speaking" (Disco Elysium style), not mechanical
// type. Type still exists as a badge; explicit node.speaker overrides
// the type-derived default.
const SPEAKERS = {
  npc:    { label: 'NPC',           fill: '#2f3a48', border: '#1f2833', text: '#f2ead6' },
  player: { label: 'Player choice', fill: '#c8880a', border: '#8a5e06', text: '#1a1512' },
  inner:  { label: 'Inner voice',   fill: '#fdf8ec', border: '#3c4a5c', text: '#2c3540' },
  check:  { label: 'Check / gate',  fill: '#1a7870', border: '#0f4a45', text: '#eaf4f2' },
  system: { label: 'System',        fill: '#b9ad93', border: '#8a7f6c', text: '#241f18' },
};

function speakerOf(node) {
  if (node.speaker && SPEAKERS[node.speaker]) return node.speaker;
  switch (node.type) {
    case 'CHOICE': case 'HUB': case 'ANCHOR_USE':
      return 'player';
    case 'CONDITION': case 'CHECK': case 'CONSCIOUSNESS_GATE': case 'ATTITUDE_BRANCH':
      return 'check';
    case 'VAR_SET': case 'SCENE_TRANSITION': case 'SECTION_LABEL':
      return 'system';
    default:
      return 'inner'; // NARRATION and anything unknown
  }
}

function pillLabelOf(node) {
  const t = (nodePreview(node) || node.type || '').replace(/\s+/g, ' ');
  return t.length > 36 ? t.slice(0, 36) + '…' : t;
}

// Deterministic pill width from label length — no DOM measuring, so wire
// endpoints can be computed in the same pass.
function pillWOf(node) {
  return Math.min(262, Math.max(84, 28 + pillLabelOf(node).length * 6.6));
}

// Deterministic pseudo-random hash so each node's wiggle phase/speed stays
// stable across re-renders instead of resetting (which would look jittery).
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function hexToRgba(hex, alpha) {
  const h = (hex || '#4a4438').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

function nodePreview(node) {
  if (node.type === 'CHECK') {
    const dot = node.check_kind === 'red' ? '●' : '○';
    return `${dot} ${node.variable || '?'} vs ${node.difficulty ?? 10}${node.text ? ' — ' + node.text.slice(0, 60) : ''}`;
  }
  if (node.text) return node.text.length > 110 ? node.text.slice(0, 110) + '…' : node.text;
  switch (node.type) {
    case 'HUB': {
      const n = (node.options || []).length;
      return `⟳ hub — ${n} option${n !== 1 ? 's' : ''}`;
    }
    case 'CONDITION':
      if (node.variable) return `${node.variable} ${node.operator || '>='} ${node.threshold ?? 0}`;
      break;
    case 'VAR_SET': {
      const op = node.operation === 'add' ? '+=' : node.operation === 'subtract' ? '-=' : '=';
      if (node.variable) return `${node.variable} ${op} ${node.value ?? 0}`;
      break;
    }
    case 'CONSCIOUSNESS_GATE':
      return `tier ≥ ${TIER_LABELS[node.min_tier ?? 0]}`;
    case 'ATTITUDE_BRANCH': {
      const keys = Object.keys(node.branches || {});
      return keys.length ? keys.join(' / ') : 'attitude → …';
    }
    case 'SCENE_TRANSITION':
      return node.target_scene ? `→ ${node.target_scene}` : '→ scene';
    case 'SECTION_LABEL':
      return node.label || '── section ──';
    case 'ANCHOR_USE':
      return `calm +${node.calm_gain ?? 5}`;
    default:
      break;
  }
  return null;
}

// ── TREE LAYOUT ───────────────────────────────────────────────────────
// Left→right tidy tree: depth = x column, siblings stack on y. Leaves claim
// consecutive rows; each parent centers on its children — the classic
// "table of contents" look from the reference flow maps. The DAG becomes a
// tree by first visit; extra parents just draw edges to the placed node.
function computeLayout(nodes) {
  if (!nodes || nodes.length === 0) return {};
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });
  const inDegree = {};
  nodes.forEach(n => { inDegree[n.id] = 0; });
  nodes.forEach(n => {
    getNextIds(n).forEach(id => { if (inDegree[id] !== undefined) inDegree[id]++; });
  });
  const roots = nodes.filter(n => inDegree[n.id] === 0);
  const startIds = roots.length ? roots.map(r => r.id) : [nodes[0].id];

  const positions = {};
  const visited = new Set();
  let nextRow = 0;

  const place = (id, depth) => {
    if (!nodeMap[id] || visited.has(id)) return null;
    visited.add(id);
    const kids = getNextIds(nodeMap[id]).filter(k => nodeMap[k] && !visited.has(k));
    let y;
    if (kids.length === 0) {
      y = nextRow * Y_PITCH;
      nextRow++;
    } else {
      const ys = kids.map(k => place(k, depth + 1)).filter(v => v !== null);
      if (ys.length) y = (Math.min(...ys) + Math.max(...ys)) / 2;
      else { y = nextRow * Y_PITCH; nextRow++; }
    }
    positions[id] = { x: depth * X_PITCH, y };
    return y;
  };
  startIds.forEach(id => place(id, 0));

  // Orphans (unreached nodes) stack below everything at column 0
  nodes.forEach(n => {
    if (!visited.has(n.id)) { positions[n.id] = { x: 0, y: nextRow * Y_PITCH }; nextRow++; }
  });

  // Center the whole tree vertically around y = 0
  const ys = Object.values(positions).map(p => p.y);
  const mid = (Math.min(...ys) + Math.max(...ys)) / 2;
  Object.values(positions).forEach(p => { p.y -= mid; });
  return positions;
}

function getNextIds(node) {
  if (!node) return [];
  const ids = [];
  if (node.next && node.next !== 'END') ids.push(node.next);
  if (node.options) node.options.forEach(o => { if (o.next && o.next !== 'END') ids.push(o.next); });
  if (node.true_next)  ids.push(node.true_next);
  if (node.false_next) ids.push(node.false_next);
  if (node.branches) Object.values(node.branches).forEach(id => { if (id && id !== 'END') ids.push(id); });
  if (node.pass_next) ids.push(node.pass_next);
  if (node.fail_next) ids.push(node.fail_next);
  if (node.success_next) ids.push(node.success_next);
  return [...new Set(ids)];
}

// ── EDIT PANEL ────────────────────────────────────────────────────────
function EditPanel({ node, store, onStoreChange, onClose, onAskClaude, onJumpToNode }) {
  const [text, setText]   = useState(node.text || '');
  const [type, setType]   = useState(node.type || 'NARRATION');
  const [speaker, setSpeaker] = useState(node.speaker || '');
  const [nextId, setNextId] = useState(node.next || '');
  const [options, setOptions] = useState(node.options ? JSON.parse(JSON.stringify(node.options)) : []);
  const [extra, setExtra] = useState(() => ({
    variable:     node.variable    || '',
    operator:     node.operator    || '>=',
    threshold:    node.threshold   ?? 0,
    true_next:    node.true_next   || '',
    false_next:   node.false_next  || '',
    operation:    node.operation   || 'set',
    value:        node.value       ?? 0,
    min_tier:     node.min_tier    ?? 0,
    pass_next:    node.pass_next   || '',
    fail_next:    node.fail_next   || '',
    branches:     node.branches    ? { ...node.branches } : {},
    target_scene: node.target_scene || '',
    calm_gain:    node.calm_gain   ?? 5,
    label:        node.label       || '',
    note:         node.note        || '',
    check_kind:   node.check_kind  || 'white',
    difficulty:   node.difficulty  ?? 10,
    success_next: node.success_next || '',
  }));
  const setE = (field, val) => setExtra(x => ({ ...x, [field]: val }));
  const fileRef = useRef(null);

  // Popover drag — click-and-hold the header to move the panel anywhere on
  // screen. Tracked as a translate() delta from the default anchored
  // position, so it's independent of whatever coordinate space .edit-panel
  // is positioned in.
  const [dragDelta, setDragDelta] = useState({ x: 0, y: 0 });
  const dragRef = useRef(null);

  const onHeaderMouseDown = useCallback((e) => {
    if (e.target.closest('button')) return;
    dragRef.current = { mx: e.clientX, my: e.clientY, baseX: dragDelta.x, baseY: dragDelta.y };
    const onMove = (ev) => {
      if (!dragRef.current) return;
      const { mx, my, baseX, baseY } = dragRef.current;
      setDragDelta({ x: baseX + (ev.clientX - mx), y: baseY + (ev.clientY - my) });
    };
    const onUp = () => {
      dragRef.current = null;
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }, [dragDelta]);

  const scene = store.scenes.find(s => s.id === store.activeScene);
  const allIds = (scene?.nodes || []).map(n => n.id);
  const allVarKeys = Object.keys(store.variables);
  const consequences = (store.consequences || []).filter(c => JSON.stringify(c).includes(node.id));

  // Cross-scene references — other nodes (in any scene) that touch this variable
  const getCrossSceneRefs = (varName) => {
    if (!varName) return [];
    const hits = [];
    store.scenes.forEach(sc => {
      (sc.nodes || []).forEach(n => {
        if (n.id === node.id) return;
        if (JSON.stringify(n).includes(`"${varName}"`)) {
          hits.push({ sceneId: sc.id, sceneName: sc.name, nodeId: n.id, type: n.type });
        }
      });
    });
    return hits;
  };
  const CrossSceneRefs = ({ varName }) => {
    const hits = getCrossSceneRefs(varName);
    if (!varName || !hits.length) return null;
    return (
      <div style={{marginTop:4,marginBottom:8,borderLeft:'2px solid var(--border)',paddingLeft:8}}>
        <div style={{fontSize:'9px',color:'var(--text-dim)',marginBottom:2}}>Also referenced by:</div>
        {hits.slice(0, 8).map((h, i) => (
          <div key={i} style={{fontSize:'9px',color:'var(--text-dim)',lineHeight:1.7,cursor: onJumpToNode ? 'pointer' : 'default'}}
            onClick={() => onJumpToNode && onJumpToNode(h.sceneId, h.nodeId)}
            title={onJumpToNode ? 'Click to jump to this node' : ''}>
            <span style={{color:'var(--amber-dim)'}}>{h.sceneName}</span>
            {' · '}<span style={{fontFamily:'monospace',opacity:0.7}}>{h.nodeId}</span>
            {' '}<span style={{fontSize:'8px',opacity:0.5}}>[{h.type}]</span>
          </div>
        ))}
        {hits.length > 8 && <div style={{fontSize:'9px',color:'var(--text-dim)',opacity:0.5}}>+{hits.length - 8} more</div>}
      </div>
    );
  };

  const save = () => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    const idx = sc.nodes.findIndex(n => n.id === node.id);
    if (idx >= 0) {
      const updated = { ...sc.nodes[idx], text, type };
      if (speaker) updated.speaker = speaker; else delete updated.speaker;
      if (extra.note && extra.note.trim()) updated.note = extra.note.trim(); else delete updated.note;
      updated.next = nextId || null;
      if (type === 'CHOICE' || type === 'HUB') { updated.options = options; }
      if (type === 'CHECK') {
        updated.check_kind = extra.check_kind;
        updated.variable = extra.variable;
        updated.difficulty = Number(extra.difficulty);
        updated.success_next = extra.success_next || null;
        updated.fail_next = extra.fail_next || null;
      }
      if (type === 'CONDITION') {
        updated.variable = extra.variable; updated.operator = extra.operator;
        updated.threshold = Number(extra.threshold);
        updated.true_next = extra.true_next || null; updated.false_next = extra.false_next || null;
      }
      if (type === 'VAR_SET') {
        updated.variable = extra.variable; updated.operation = extra.operation;
        updated.value = extra.value;
      }
      if (type === 'CONSCIOUSNESS_GATE') {
        updated.min_tier = Number(extra.min_tier);
        updated.pass_next = extra.pass_next || null; updated.fail_next = extra.fail_next || null;
      }
      if (type === 'ATTITUDE_BRANCH') { updated.branches = extra.branches; }
      if (type === 'SCENE_TRANSITION') { updated.target_scene = extra.target_scene; }
      if (type === 'ANCHOR_USE') { updated.calm_gain = Number(extra.calm_gain); }
      if (type === 'SECTION_LABEL') { updated.label = extra.label; }
      sc.nodes[idx] = updated;
    }
    onStoreChange(next, `Edited node: ${node.id}`);
    onClose();
  };

  const deleteNode = () => {
    if (!confirm(`Delete node "${node.id}"?`)) return;
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    sc.nodes = sc.nodes.filter(n => n.id !== node.id);
    onStoreChange(next, `Deleted node: ${node.id}`);
    onClose();
  };

  const uploadMedia = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const next = JSON.parse(JSON.stringify(store));
      const sc = next.scenes.find(s => s.id === next.activeScene);
      if (!sc) return;
      const idx = sc.nodes.findIndex(n => n.id === node.id);
      if (idx >= 0) sc.nodes[idx].media = ev.target.result;
      onStoreChange(next, `Media added: ${node.id}`);
    };
    reader.readAsDataURL(file);
  };

  const clearMedia = () => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    const idx = sc.nodes.findIndex(n => n.id === node.id);
    if (idx >= 0) delete sc.nodes[idx].media;
    onStoreChange(next, `Media cleared: ${node.id}`);
  };

  const updateOption = (i, field, val) =>
    setOptions(opts => opts.map((o, j) => j === i ? { ...o, [field]: val } : o));

  const addOptionSet = (i) => {
    const k = prompt('Variable name to set:');
    if (!k) return;
    setOptions(opts => opts.map((o, j) => j !== i ? o : { ...o, sets: { ...(o.sets || {}), [k]: false } }));
  };
  const removeOptionSet = (i, k) =>
    setOptions(opts => opts.map((o, j) => {
      if (j !== i) return o;
      const s = { ...(o.sets || {}) }; delete s[k]; return { ...o, sets: s };
    }));
  const updateOptionSet = (i, k, raw) => {
    const vv = store.variables[k];
    const val = vv?.type === 'bool' ? (raw === 'true' || raw === true)
              : vv?.type === 'int'  ? Number(raw)
              : raw;
    setOptions(opts => opts.map((o, j) => j !== i ? o : { ...o, sets: { ...(o.sets || {}), [k]: val } }));
  };

  return (
    <div className="edit-panel"
      style={(dragDelta.x || dragDelta.y) ? { transform: `translate(${dragDelta.x}px, ${dragDelta.y}px)` } : undefined}>
      <div className="edit-panel-header" onMouseDown={onHeaderMouseDown} title="Drag to move">
        <h4>EDIT NODE</h4>
        <button className="close-btn" onClick={onClose}>✕</button>
      </div>
      <div className="edit-panel-body">
        <div className="edit-field-label">ID</div>
        <div style={{color:'var(--text-dim)',fontSize:'10px',fontFamily:'monospace',wordBreak:'break-all',marginBottom:8}}>{node.id}</div>

        <div className="edit-field-label">Type</div>
        <select className="edit-select" value={type} onChange={e => setType(e.target.value)}>
          {Object.keys(NODE_COLORS).map(t => <option key={t} value={t}>{t}</option>)}
        </select>

        <div className="edit-field-label">Speaker</div>
        <select className="edit-select" value={speaker} onChange={e => setSpeaker(e.target.value)}>
          <option value="">auto — {SPEAKERS[speakerOf({ type })].label}</option>
          {Object.entries(SPEAKERS).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}
        </select>

        <div className="edit-field-label">Text</div>
        <textarea className="edit-textarea" value={text} onChange={e => setText(e.target.value)} rows={4} />

        <div className="edit-field-label">Design Note (not shown to player)</div>
        <textarea className="edit-textarea" style={{minHeight: 44, fontSize: '10px', color: 'var(--text-dim)'}}
          value={extra.note} onChange={e => setE('note', e.target.value)} rows={2}
          placeholder="stage directions, camera notes, reminders…" />

        <div className="edit-field-label">Next Node ID</div>
        <div className="edit-next-field">
          <input className="edit-next-input" style={{flex:1}}
            list={`next-list-${node.id}`}
            value={nextId} onChange={e => setNextId(e.target.value)} placeholder="node_id or END" />
          {nextId && (
            <button onClick={() => setNextId('')}
              style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'3px 7px',cursor:'pointer',fontSize:'10px'}}
              title="Disconnect">×</button>
          )}
        </div>
        <datalist id={`next-list-${node.id}`}>
          {allIds.filter(id => id !== node.id).map(id => <option key={id} value={id} />)}
        </datalist>

        <div className="edit-field-label">Media</div>
        {node.media ? (
          <div style={{position:'relative',marginBottom:8}}>
            {node.media.startsWith('data:video') ? (
              <video src={node.media} style={{width:'100%',maxHeight:90,borderRadius:4,objectFit:'cover'}} muted />
            ) : (
              <img src={node.media} style={{width:'100%',maxHeight:90,borderRadius:4,objectFit:'cover'}} alt="" />
            )}
            <button onClick={clearMedia}
              style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,0.75)',border:'none',color:'#fff',borderRadius:3,padding:'2px 6px',cursor:'pointer',fontSize:'10px'}}>
              ✕
            </button>
          </div>
        ) : (
          <button className="edit-btn"
            style={{marginBottom:8,marginTop:4,background:'var(--surface2)',border:'1px dashed var(--border)',color:'var(--text-dim)',boxShadow:'none'}}
            onClick={() => fileRef.current?.click()}>
            + Upload Image / Video
          </button>
        )}
        <input ref={fileRef} type="file" accept="image/*,video/webm,video/mp4" style={{display:'none'}} onChange={uploadMedia} />

        {(type === 'CHOICE' || type === 'HUB') && (
          <>
            <div className="edit-field-label">{type === 'HUB' ? 'Hub Options (loop back until exhausted)' : 'Options'}</div>
            {options.map((o, i) => (
              <div key={i} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:4,padding:'6px',marginBottom:4}}>
                <div style={{display:'flex',gap:4,marginBottom:4}}>
                  <input className="edit-select" style={{flex:1,height:'auto',padding:'3px 5px',fontSize:'10px'}}
                    value={o.label || ''} onChange={e => updateOption(i,'label',e.target.value)} placeholder="Option label" />
                  <button onClick={() => setOptions(opts => opts.filter((_,j) => j !== i))}
                    style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'2px 6px',cursor:'pointer',fontSize:'10px'}}>✕</button>
                </div>
                <input className="edit-select" style={{width:'100%',height:'auto',padding:'3px 5px',fontSize:'10px'}}
                  list={`opt-list-${node.id}-${i}`}
                  value={o.next || ''} onChange={e => updateOption(i,'next',e.target.value)} placeholder="→ next node id" />
                <datalist id={`opt-list-${node.id}-${i}`}>
                  {allIds.filter(id => id !== node.id).map(id => <option key={id} value={id} />)}
                </datalist>
                {/* Variable sets for this option */}
                {Object.entries(o.sets || {}).map(([k, v]) => (
                  <div key={k} style={{display:'flex',gap:4,marginTop:4,alignItems:'center'}}>
                    <span style={{fontSize:'9px',color:'var(--text-dim)',minWidth:80,flexShrink:0}}>{k} =</span>
                    {store.variables[k]?.type === 'bool' ? (
                      <select style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',fontFamily:'inherit',fontSize:'10px',padding:'2px 4px',borderRadius:3}}
                        value={String(v)} onChange={e => updateOptionSet(i, k, e.target.value)}>
                        <option value="true">true</option>
                        <option value="false">false</option>
                      </select>
                    ) : (
                      <input style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',fontFamily:'inherit',fontSize:'10px',padding:'2px 4px',borderRadius:3}}
                        value={v} onChange={e => updateOptionSet(i, k, e.target.value)} />
                    )}
                    <button onClick={() => removeOptionSet(i, k)}
                      style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'1px 5px',cursor:'pointer',fontSize:'10px',flexShrink:0}}>×</button>
                  </div>
                ))}
                <button onClick={() => addOptionSet(i)}
                  style={{background:'none',border:'none',color:'var(--text-dim)',fontFamily:'inherit',fontSize:'9px',cursor:'pointer',padding:'3px 0 0',textAlign:'left'}}>
                  + set var
                </button>
                {type === 'HUB' && (
                  <div style={{display:'flex',gap:12,marginTop:5,paddingTop:5,borderTop:'1px solid var(--border)'}}>
                    <label style={{display:'flex',alignItems:'center',gap:4,fontSize:'9px',color:'var(--text-dim)',cursor:'pointer'}}
                      title="Grays out after being picked once">
                      <input type="checkbox" checked={o.once !== false}
                        onChange={e => updateOption(i, 'once', e.target.checked ? true : false)} />
                      once
                    </label>
                    <label style={{display:'flex',alignItems:'center',gap:4,fontSize:'9px',color:'var(--text-dim)',cursor:'pointer'}}
                      title="Choosing this leaves the hub for good (no return)">
                      <input type="checkbox" checked={!!o.exit}
                        onChange={e => updateOption(i, 'exit', e.target.checked)} />
                      exit
                    </label>
                  </div>
                )}
              </div>
            ))}
            <button className="edit-btn"
              style={{background:'none',border:'1px dashed var(--border)',color:'var(--text-dim)',boxShadow:'none',marginBottom:4}}
              onClick={() => setOptions(opts => [...opts, { label:'New option', next:'' }])}>
              + Add Option
            </button>
            {type === 'HUB' && (
              <div style={{fontSize:'9px',color:'var(--text-dim)',lineHeight:1.6,marginBottom:4}}>
                Branches that dead-end return to this hub automatically.
                "Next Node ID" above = where flow goes once every once-option is used up.
              </div>
            )}
          </>
        )}

        {/* ── CHECK (Disco Elysium skill check) ── */}
        {type === 'CHECK' && (<>
          <div className="edit-field-label">Check Kind</div>
          <select className="edit-select" value={extra.check_kind} onChange={e => setE('check_kind', e.target.value)}>
            <option value="white">○ White — retryable (re-rolls each visit)</option>
            <option value="red">● Red — one-shot (result is locked in)</option>
          </select>
          <div className="edit-field-label">Variable (rolled: variable + 2d6)</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="check-var-list" value={extra.variable} onChange={e => setE('variable', e.target.value)} placeholder="calm / consciousness…" />
          <datalist id="check-var-list">{allVarKeys.map(k => <option key={k} value={k} />)}</datalist>
          <div className="edit-field-label">Difficulty (roll must reach this)</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}} type="number"
            value={extra.difficulty} onChange={e => setE('difficulty', e.target.value)} />
          <div className="edit-field-label">Success → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="check-succ-list" value={extra.success_next} onChange={e => setE('success_next', e.target.value)} placeholder="node_id" />
          <datalist id="check-succ-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <div className="edit-field-label">Failure → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="check-fail-list" value={extra.fail_next} onChange={e => setE('fail_next', e.target.value)} placeholder="node_id" />
          <datalist id="check-fail-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <CrossSceneRefs varName={extra.variable} />
        </>)}

        {/* ── CONDITION ── */}
        {type === 'CONDITION' && (<>
          <div className="edit-field-label">Variable</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-var-list" value={extra.variable} onChange={e => setE('variable', e.target.value)} placeholder="variable name" />
          <datalist id="cond-var-list">{allVarKeys.map(k => <option key={k} value={k} />)}</datalist>
          <div className="edit-field-label">Operator</div>
          <select className="edit-select" value={extra.operator} onChange={e => setE('operator', e.target.value)}>
            {['>=','<=','>','<','=='].map(op => <option key={op} value={op}>{op}</option>)}
          </select>
          <div className="edit-field-label">Threshold</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}} type="number"
            value={extra.threshold} onChange={e => setE('threshold', e.target.value)} />
          <div className="edit-field-label">True → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-true-list" value={extra.true_next} onChange={e => setE('true_next', e.target.value)} placeholder="node_id" />
          <datalist id="cond-true-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <div className="edit-field-label">False → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-false-list" value={extra.false_next} onChange={e => setE('false_next', e.target.value)} placeholder="node_id" />
          <datalist id="cond-false-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <CrossSceneRefs varName={extra.variable} />
        </>)}

        {/* ── VAR_SET ── */}
        {type === 'VAR_SET' && (<>
          <div className="edit-field-label">Variable</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="varset-var-list" value={extra.variable} onChange={e => setE('variable', e.target.value)} placeholder="variable name" />
          <datalist id="varset-var-list">{allVarKeys.map(k => <option key={k} value={k} />)}</datalist>
          <div className="edit-field-label">Operation</div>
          <select className="edit-select" value={extra.operation} onChange={e => setE('operation', e.target.value)}>
            <option value="set">set =</option>
            <option value="add">add +=</option>
            <option value="subtract">subtract -=</option>
          </select>
          <div className="edit-field-label">Value</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            value={extra.value} onChange={e => setE('value', e.target.value)} placeholder="value" />
          <CrossSceneRefs varName={extra.variable} />
        </>)}

        {/* ── CONSCIOUSNESS_GATE ── */}
        {type === 'CONSCIOUSNESS_GATE' && (<>
          <div className="edit-field-label">Minimum Tier</div>
          <select className="edit-select" value={extra.min_tier} onChange={e => setE('min_tier', e.target.value)}>
            <option value={0}>0 — FERAL</option>
            <option value={1}>1 — WAKING</option>
            <option value={2}>2 — CLEAR</option>
            <option value={3}>3 — GRIOTTE</option>
          </select>
          <div className="edit-field-label">Pass → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="gate-pass-list" value={extra.pass_next} onChange={e => setE('pass_next', e.target.value)} placeholder="node_id" />
          <datalist id="gate-pass-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <div className="edit-field-label">Fail → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="gate-fail-list" value={extra.fail_next} onChange={e => setE('fail_next', e.target.value)} placeholder="node_id" />
          <datalist id="gate-fail-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
        </>)}

        {/* ── ATTITUDE_BRANCH ── */}
        {type === 'ATTITUDE_BRANCH' && (<>
          {['reticence','anger','curiosity','joy','greed'].map(att => (
            <React.Fragment key={att}>
              <div className="edit-field-label" style={{textTransform:'capitalize'}}>{att} →</div>
              <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
                list={`att-list-${att}`}
                value={extra.branches[att] || ''}
                onChange={e => setE('branches', { ...extra.branches, [att]: e.target.value })}
                placeholder="node_id" />
              <datalist id={`att-list-${att}`}>{allIds.map(id => <option key={id} value={id} />)}</datalist>
            </React.Fragment>
          ))}
        </>)}

        {/* ── SCENE_TRANSITION ── */}
        {type === 'SCENE_TRANSITION' && (<>
          <div className="edit-field-label">Target Scene</div>
          <select className="edit-select" value={extra.target_scene} onChange={e => setE('target_scene', e.target.value)}>
            <option value="">— none —</option>
            {store.scenes.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </>)}

        {/* ── ANCHOR_USE ── */}
        {type === 'ANCHOR_USE' && (<>
          <div className="edit-field-label">Calm Gain</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}} type="number" min={0} max={100}
            value={extra.calm_gain} onChange={e => setE('calm_gain', e.target.value)} />
        </>)}

        {/* ── SECTION_LABEL ── */}
        {type === 'SECTION_LABEL' && (<>
          <div className="edit-field-label">Label</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            value={extra.label} onChange={e => setE('label', e.target.value)} placeholder="Section I" />
        </>)}

        {consequences.length > 0 && (
          <>
            <div className="edit-field-label">Consequences</div>
            {consequences.map(c => (
              <div key={c.id} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:4,padding:'6px',marginBottom:4,fontSize:'10px'}}>
                <strong style={{color:'var(--amber)'}}>{c.id}</strong><br/>
                {c.downstream?.map(d => <div key={d.scene} style={{color:'var(--text-dim)',marginTop:2}}>→ {d.scene}: {d.effect}</div>)}
              </div>
            ))}
          </>
        )}

        {/* Quest links — visiting this node in PLAY ticks the objective */}
        {(store.quests || []).length > 0 && (() => {
          const ref = `${store.activeScene}:${node.id}`;
          const linked = [];
          store.quests.forEach(q => (q.objectives || []).forEach(o => {
            if ((o.nodeIds || []).includes(ref)) linked.push({ q, o });
          }));
          const linkable = [];
          store.quests.forEach(q => (q.objectives || []).forEach(o => {
            if (!(o.nodeIds || []).includes(ref)) linkable.push({ q, o });
          }));
          const linkObjective = (val) => {
            if (!val) return;
            const [qid, oid] = val.split('|');
            const next = JSON.parse(JSON.stringify(store));
            const o = next.quests.find(x => x.id === qid)?.objectives.find(x => x.id === oid);
            if (o) {
              o.nodeIds = [...(o.nodeIds || []), ref];
              onStoreChange(next, `Linked node to quest objective`);
            }
          };
          const unlink = (qid, oid) => {
            const next = JSON.parse(JSON.stringify(store));
            const o = next.quests.find(x => x.id === qid)?.objectives.find(x => x.id === oid);
            if (o) {
              o.nodeIds = (o.nodeIds || []).filter(r => r !== ref);
              onStoreChange(next, `Unlinked node from quest objective`);
            }
          };
          return (
            <>
              <div className="edit-field-label">Quest Links</div>
              {linked.map(({ q, o }) => (
                <div key={q.id + o.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:'10px',marginBottom:3}}>
                  <span style={{color:'var(--amber)',flexShrink:0}}>◆</span>
                  <span style={{flex:1,color:'var(--bone-dim)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                    title={`${q.name} — ${o.text}`}>
                    {q.name}: {o.text}
                  </span>
                  <button onClick={() => unlink(q.id, o.id)}
                    style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'1px 5px',cursor:'pointer',fontSize:'10px',flexShrink:0}}>×</button>
                </div>
              ))}
              {linkable.length > 0 && (
                <select className="edit-select" style={{height:'auto',padding:'4px 6px',color:'var(--text-dim)'}}
                  value="" onChange={e => linkObjective(e.target.value)}>
                  <option value="">+ link to objective…</option>
                  {linkable.map(({ q, o }) => (
                    <option key={q.id + o.id} value={`${q.id}|${o.id}`}>{q.name}: {o.text.slice(0, 40)}</option>
                  ))}
                </select>
              )}
            </>
          );
        })()}

        <button className="edit-btn" onClick={save}>Save Changes</button>
        <button className="edit-btn edit-btn-secondary" style={{marginTop:4}}
          onClick={() => { onAskClaude(node); }}>Ask Claude About This</button>
        <button className="edit-btn edit-btn-danger" onClick={deleteNode}>Delete Node</button>
      </div>
    </div>
  );
}

// ── TREE VIEW ─────────────────────────────────────────────────────────
function TreeView({ store, onStoreChange, onSwitchToChat, onNodeContext, centerTrigger, jumpToNode, onJumpToNode }) {
  const [offset, setOffset] = useState({ x: 0, y: 80 });
  const [zoom, setZoom]     = useState(1);
  const [panning, setPanning] = useState(false);
  const [panStart, setPanStart] = useState(null);
  const [selected, setSelected] = useState(null);
  const [draggingNode, setDraggingNode] = useState(null);
  const [resizingNode, setResizingNode] = useState(null); // { id, startW, startH, startMX, startMY }
  const [manualPos, setManualPos] = useState({});
  const [manualSize, setManualSize] = useState({});
  const [collapsed, setCollapsed] = useState(() => new Set()); // node ids whose subtrees are hidden
  const [noteDrag, setNoteDrag] = useState(null); // { id, startX, startY, startMX, startMY, dx, dy }
  const [fontSize, setFontSize] = useState(11);
  const [search, setSearch]     = useState('');
  const [drawingWire, setDrawingWire] = useState(null); // { fromId, curX, curY } world coords
  const [ctxMenu, setCtxMenu]   = useState(null);        // { px, py, wx, wy } screen+world
  const wrapRef = useRef(null);

  const scene = store.scenes.find(s => s.id === store.activeScene);
  const nodes = scene?.nodes || [];
  const autoPos = useMemo(() => computeLayout(nodes), [nodes]);

  const getPos = useCallback(id => manualPos[id] || autoPos[id] || { x: 0, y: 0 }, [manualPos, autoPos]);
  const getSize = useCallback(id => manualSize[id] || { w: NODE_W, h: NODE_H }, [manualSize]);

  const nodeMapMemo = useMemo(() => {
    const m = {};
    nodes.forEach(n => { m[n.id] = n; });
    return m;
  }, [nodes]);

  // Nodes in this scene linked to a quest objective (◆ badge)
  const questLinkedIds = useMemo(() => {
    const s = new Set();
    (store.quests || []).forEach(q => (q.objectives || []).forEach(o =>
      (o.nodeIds || []).forEach(ref => {
        const ix = ref.indexOf(':');
        if (ix > 0 && ref.slice(0, ix) === store.activeScene) s.add(ref.slice(ix + 1));
      })));
    return s;
  }, [store.quests, store.activeScene]);

  const sceneNotes = scene?.notes || [];

  // Visual size — what the node actually occupies on screen right now:
  // compact pill by default, full card when selected. Wires, hit tests,
  // minimap, and fit-all must all use this, not the raw card size.
  const getVis = useCallback((id) => {
    const n = nodeMapMemo[id];
    if (!n) return { w: NODE_W, h: NODE_H };
    if (selected === id) return manualSize[id] || { w: NODE_W, h: NODE_H };
    return { w: pillWOf(n), h: PILL_H };
  }, [nodeMapMemo, selected, manualSize]);

  // Collapsed subtrees: hidden = nodes reachable from the roots ONLY through
  // a collapsed node. Computed as (reachable ignoring collapse) minus
  // (reachable stopping at collapsed nodes); orphans/cycles outside the
  // reachable set are never hidden.
  const hiddenIds = useMemo(() => {
    if (!collapsed.size) return new Set();
    const inDeg = {};
    nodes.forEach(n => { inDeg[n.id] = 0; });
    nodes.forEach(n => getNextIds(n).forEach(id => { if (inDeg[id] !== undefined) inDeg[id]++; }));
    const roots = nodes.filter(n => inDeg[n.id] === 0).map(n => n.id);
    const startIds = roots.length ? roots : (nodes[0] ? [nodes[0].id] : []);
    const walk = (stopAtCollapsed) => {
      const seen = new Set();
      const queue = [...startIds];
      while (queue.length) {
        const id = queue.pop();
        if (seen.has(id) || !nodeMapMemo[id]) continue;
        seen.add(id);
        if (stopAtCollapsed && collapsed.has(id)) continue;
        getNextIds(nodeMapMemo[id]).forEach(nid => queue.push(nid));
      }
      return seen;
    };
    const full = walk(false);
    const vis = walk(true);
    const hidden = new Set();
    full.forEach(id => { if (!vis.has(id)) hidden.add(id); });
    return hidden;
  }, [collapsed, nodes, nodeMapMemo]);

  const collapsedCountOf = useCallback((id) => {
    const seen = new Set();
    const queue = getNextIds(nodeMapMemo[id]);
    while (queue.length) {
      const nid = queue.pop();
      if (seen.has(nid) || nid === id || !nodeMapMemo[nid]) continue;
      seen.add(nid);
      getNextIds(nodeMapMemo[nid]).forEach(x => queue.push(x));
    }
    return seen.size;
  }, [nodeMapMemo]);

  const toggleCollapse = useCallback((id) => {
    setCollapsed(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }, []);

  // Section frames: each SECTION_LABEL boxes the nodes it reaches, stopping
  // at the next SECTION_LABEL — the "I. THE ROAD" containment look.
  const frames = useMemo(() => {
    const out = [];
    nodes.forEach(lab => {
      if (lab.type !== 'SECTION_LABEL' || hiddenIds.has(lab.id)) return;
      const members = new Set([lab.id]);
      const queue = getNextIds(lab);
      while (queue.length) {
        const id = queue.pop();
        if (members.has(id) || !nodeMapMemo[id]) continue;
        if (nodeMapMemo[id].type === 'SECTION_LABEL') continue;
        members.add(id);
        getNextIds(nodeMapMemo[id]).forEach(x => queue.push(x));
      }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, count = 0;
      members.forEach(id => {
        if (hiddenIds.has(id)) return;
        const p = getPos(id);
        const s = getVis(id);
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x + s.w); maxY = Math.max(maxY, p.y + s.h);
        count++;
      });
      if (count < 2) return; // a frame around just the label is noise
      const PAD = 16, TOP = 24;
      out.push({
        id: lab.id,
        label: lab.label || lab.text || 'Section',
        x: minX - PAD, y: minY - TOP,
        w: (maxX - minX) + PAD * 2, h: (maxY - minY) + TOP + PAD,
      });
    });
    return out;
  }, [nodes, hiddenIds, nodeMapMemo, getPos, getVis]);

  // END terminals: nodes with an explicit -> END link get a black END pill
  const endMarkers = useMemo(() => {
    const out = [];
    nodes.forEach(n => {
      if (hiddenIds.has(n.id) || collapsed.has(n.id)) return;
      const links = [n.next, n.true_next, n.false_next, n.pass_next, n.fail_next, n.success_next,
        ...(n.options || []).map(o => o.next),
        ...Object.values(n.branches || {})];
      if (!links.some(l => l === 'END')) return;
      const p = getPos(n.id);
      const s = getVis(n.id);
      out.push({ id: n.id, x: p.x + s.w + 46, y: p.y + s.h / 2 - 10, lineY: p.y + s.h / 2, lineX: p.x + s.w });
    });
    return out;
  }, [nodes, hiddenIds, collapsed, getPos, getVis]);

  const centerCanvas = useCallback(() => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    setOffset({ x: 70, y: rect.height / 2 });
    setZoom(1);
  }, []);

  const fitAll = useCallback(() => {
    if (!nodes.length || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const boxes = nodes.map(n => ({ p: getPos(n.id), s: getVis(n.id) }));
    const xs = boxes.map(b => b.p.x), ys = boxes.map(b => b.p.y);
    const xs2 = boxes.map(b => b.p.x + b.s.w), ys2 = boxes.map(b => b.p.y + b.s.h);
    const minX = Math.min(...xs), maxX = Math.max(...xs2);
    const minY = Math.min(...ys), maxY = Math.max(...ys2);
    const worldW = maxX - minX || 1, worldH = maxY - minY || 1;
    const pad = 60;
    const z = Math.min((rect.width - pad*2) / worldW, (rect.height - pad*2) / worldH, 1.5);
    setZoom(z);
    setOffset({
      x: rect.width/2  - (minX + worldW/2) * z,
      y: rect.height/2 - (minY + worldH/2) * z,
    });
  }, [nodes, getPos, getVis]);

  useEffect(() => { centerCanvas(); }, []);

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(centerCanvas);
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, [centerCanvas]);

  // Clear positions + selection + collapse when scene changes
  useEffect(() => {
    setManualPos({});
    setSelected(null);
    setCollapsed(new Set());
  }, [store.activeScene]);

  // Center view when requested externally (e.g. "View in Tree" from chat banner)
  useEffect(() => {
    if (!centerTrigger) return;
    setTimeout(centerCanvas, 50);
  }, [centerTrigger, centerCanvas]);

  // Jump to and select a specific node (e.g. from cross-scene provenance link).
  // Scene switch (if needed) happens in the caller before this fires, so by
  // the time this effect runs `nodes` should already reflect the target scene.
  useEffect(() => {
    if (!jumpToNode?.nodeId) return;
    const hit = nodes.find(n => n.id === jumpToNode.nodeId);
    if (!hit) return;
    const t = setTimeout(() => {
      const pos = getPos(hit.id);
      const rect = wrapRef.current?.getBoundingClientRect();
      if (rect) setOffset({ x: rect.width/2 - pos.x * zoom, y: rect.height/2 - pos.y * zoom - 40 });
      setSelected(hit.id);
    }, 60);
    return () => clearTimeout(t);
  }, [jumpToNode, nodes, getPos, zoom]);

  // Keyboard shortcuts: Delete=remove node, Escape=deselect, Ctrl+D=duplicate,
  // C=collapse/expand subtree
  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'Escape') { setSelected(null); return; }
      if (!selected) return;
      if (e.key === 'c' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        toggleCollapse(selected);
        return;
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        const next = JSON.parse(JSON.stringify(store));
        const sc = next.scenes.find(s => s.id === next.activeScene);
        if (!sc) return;
        sc.nodes = sc.nodes.filter(n => n.id !== selected);
        onStoreChange(next, `Deleted node: ${selected}`);
        setSelected(null);
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault();
        const sc = store.scenes.find(s => s.id === store.activeScene);
        const src = sc?.nodes.find(n => n.id === selected);
        if (!src) return;
        const newId = `${src.type.toLowerCase()}_${Date.now()}`;
        const copy = { ...JSON.parse(JSON.stringify(src)), id: newId, next: null };
        const pos = getPos(selected);
        const next = JSON.parse(JSON.stringify(store));
        const sc2 = next.scenes.find(s => s.id === next.activeScene);
        sc2.nodes.push(copy);
        setManualPos(p => ({ ...p, [newId]: { x: pos.x + 30, y: pos.y + 30 } }));
        onStoreChange(next, `Duplicated: ${selected}`);
        setSelected(newId);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [selected, store, onStoreChange, getPos, toggleCollapse]);

  // Wheel zoom at cursor — must be non-passive to call preventDefault
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const handler = (e) => {
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      setZoom(z => {
        const nz = Math.min(3, Math.max(0.1, z * factor));
        setOffset(o => ({
          x: mx - (mx - o.x) * (nz / z),
          y: my - (my - o.y) * (nz / z),
        }));
        return nz;
      });
    };
    el.addEventListener('wheel', handler, { passive: false });
    return () => el.removeEventListener('wheel', handler);
  }, []);

  // Close context menu on outside click
  useEffect(() => {
    if (!ctxMenu) return;
    const h = () => setCtxMenu(null);
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [ctxMenu]);

  const screenToWorld = useCallback((sx, sy) => {
    const rect = wrapRef.current?.getBoundingClientRect();
    if (!rect) return { wx: 0, wy: 0 };
    return { wx: (sx - rect.left - offset.x) / zoom, wy: (sy - rect.top - offset.y) / zoom };
  }, [offset, zoom]);

  const onMouseDown = useCallback((e) => {
    if (e.target.closest('.tree-node') || e.target.closest('.tree-note') || e.button !== 0) return;
    setCtxMenu(null);
    setPanning(true);
    setPanStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
  }, [offset]);

  const onMouseMove = useCallback((e) => {
    if (panning && panStart) {
      setOffset({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
    }
    if (draggingNode) {
      const { id, startX, startY, startMX, startMY } = draggingNode;
      const dx = (e.clientX - startMX) / zoom;
      const dy = (e.clientY - startMY) / zoom;
      setManualPos(p => ({ ...p, [id]: { x: startX + dx, y: startY + dy } }));
    }
    if (resizingNode) {
      const { id, startW, startH, startMX, startMY } = resizingNode;
      const dw = (e.clientX - startMX) / zoom;
      const dh = (e.clientY - startMY) / zoom;
      setManualSize(s => ({ ...s, [id]: { w: Math.max(140, startW + dw), h: Math.max(70, startH + dh) } }));
    }
    if (noteDrag) {
      setNoteDrag(d => d ? { ...d, dx: (e.clientX - d.startMX) / zoom, dy: (e.clientY - d.startMY) / zoom } : null);
    }
    if (drawingWire) {
      const { wx, wy } = screenToWorld(e.clientX, e.clientY);
      setDrawingWire(w => w ? { ...w, curX: wx, curY: wy } : null);
    }
  }, [panning, panStart, draggingNode, resizingNode, noteDrag, zoom, drawingWire, screenToWorld]);

  const onMouseUp = useCallback((e) => {
    if (noteDrag) {
      // Commit the note's new position to the store once, at drop
      if (noteDrag.dx || noteDrag.dy) {
        const next = JSON.parse(JSON.stringify(store));
        const sc = next.scenes.find(s => s.id === next.activeScene);
        const note = (sc?.notes || []).find(n => n.id === noteDrag.id);
        if (note) {
          note.x = noteDrag.startX + noteDrag.dx;
          note.y = noteDrag.startY + noteDrag.dy;
          onStoreChange(next, null);
        }
      }
      setNoteDrag(null);
    }
    if (drawingWire) {
      const { wx, wy } = screenToWorld(e.clientX, e.clientY);
      const target = nodes.find(n => {
        const p = getPos(n.id);
        const s = getVis(n.id);
        return wx >= p.x && wx <= p.x + s.w && wy >= p.y && wy <= p.y + s.h;
      });
      if (target && target.id !== drawingWire.fromId) {
        const next = JSON.parse(JSON.stringify(store));
        const sc = next.scenes.find(s => s.id === next.activeScene);
        const src = sc?.nodes.find(n => n.id === drawingWire.fromId);
        if (src) {
          if (src.type === 'CHOICE' || src.type === 'HUB') {
            if (!src.options) src.options = [];
            src.options.push({ label: 'Option ' + (src.options.length + 1), next: target.id });
          } else if (src.type === 'CHECK') {
            if (!src.success_next) src.success_next = target.id;
            else if (!src.fail_next) src.fail_next = target.id;
            else src.success_next = target.id;
          } else if (src.type === 'CONDITION') {
            if (!src.true_next) src.true_next = target.id;
            else if (!src.false_next) src.false_next = target.id;
            else src.true_next = target.id;
          } else if (src.type === 'ATTITUDE_BRANCH') {
            if (!src.branches) src.branches = {};
            const open = ['reticence','anger','curiosity','joy','greed'].find(k => !src.branches[k]);
            if (open) src.branches[open] = target.id;
          } else {
            src.next = target.id;
          }
        }
        onStoreChange(next, `Connected: ${drawingWire.fromId} → ${target.id}`);
      }
      setDrawingWire(null);
    }
    setPanning(false);
    setPanStart(null);
    setDraggingNode(null);
    setResizingNode(null);
  }, [drawingWire, noteDrag, nodes, getPos, getVis, store, onStoreChange, screenToWorld]);

  const onContextMenu = useCallback((e) => {
    if (e.target.closest('.tree-node') || e.target.closest('.tree-note')) return;
    e.preventDefault();
    const rect = wrapRef.current?.getBoundingClientRect();
    if (!rect) return;
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const wx = (px - offset.x) / zoom;
    const wy = (py - offset.y) / zoom;
    setCtxMenu({ px, py, wx, wy });
  }, [offset, zoom]);

  const addNodeAt = useCallback((type, wx, wy) => {
    const id = `${type.toLowerCase()}_${Date.now()}`;
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    sc.nodes.push({ id, type, text: '', media: null, next: null });
    setManualPos(p => ({ ...p, [id]: { x: wx - 60, y: wy - PILL_H / 2 } }));
    onStoreChange(next, `Added ${type} node`);
    setCtxMenu(null);
    setSelected(id);
  }, [store, onStoreChange]);

  const addNoteAt = useCallback((wx, wy) => {
    const next = JSON.parse(JSON.stringify(store));
