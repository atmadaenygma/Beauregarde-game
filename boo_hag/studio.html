              {msg.role === 'assistant' && !msg.streaming && (
                <>
                  <div className="msg-actions">
                    <button className="msg-action-btn"
                      onClick={() => lockToCanon(msg, msg.content.slice(0, 200))}>
                      Lock to Canon
                    </button>
                    {!msg.nodeJson && (
                      <button className="msg-action-btn" onClick={() => {
                        // Add response as a NARRATION node
                        const nj = {
                          action: 'add_nodes', scene: store.activeScene,
                          nodes: [{ id: `narration_${Date.now()}`, type: 'NARRATION', text: stripNodeJson(msg.content).slice(0,400), media: null, next: null }]
                        };
                        const next = applyNodeJson(JSON.parse(JSON.stringify(store)), nj);
                        onStoreChange(next, 'Manually added narration node');
                      }}>Add to Tree</button>
                    )}
                    {msg.nodeJson && (
                      <button className="msg-action-btn danger" onClick={() => undoLastNodes(msg.id)}>
                        Undo Last Nodes
                      </button>
                    )}
                  </div>
                  {msg.nodeJson && (
                    <div className="node-banner">
                      <span>✓ Claude added {msg.nodeJson.nodes?.length || 0} nodes to {msg.nodeJson.scene}</span>
                      <div className="node-banner-btns">
                        {onSwitchToTree && (
                          <button className="node-banner-btn" onClick={() => {
                            const next = JSON.parse(JSON.stringify(store));
                            next.activeScene = msg.nodeJson.scene || next.activeScene;
                            onStoreChange(next, null);
                            onSwitchToTree(true);
                          }}>View in Tree</button>
                        )}
                        <button className="node-banner-btn" onClick={() => undoLastNodes(msg.id)}>Undo</button>
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          ))}
          <div ref={messagesEndRef} />
        </div>

        <div className="chat-input-area">
          <textarea
            ref={inputRef}
            className="chat-input"
            placeholder="Ask Claude to write a scene, expand dialogue, design a quest…  (Enter to send, Shift+Enter for newline)"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            rows={2}
          />
          <button className="send-btn" onClick={send} disabled={streaming || !input.trim()}>
            {streaming ? '…' : 'SEND'}
          </button>
        </div>
      </div>

      {canonModal && (
        <CanonModal
          initial={{ title: '', body: canonModal.prefill || '' }}
          onSave={saveCanon}
          onClose={() => setCanonModal(null)}
        />
      )}
    </div>
  );
}

// ── NODE CONSTANTS ─────────────────────────────────────────────────────
const NODE_COLORS = {
  NARRATION:          { bg: '#2a2820', border: '#4a4438', header: '#3a3628', text: '#e8e0d4' },
  CHOICE:             { bg: '#2a1e08', border: '#7a5206', header: '#3a2808', text: '#e8a820' },
  CONDITION:          { bg: '#0e1e1c', border: '#1a7870', header: '#122420', text: '#40c8b8' },
  VAR_SET:            { bg: '#121e10', border: '#4a7840', header: '#182818', text: '#90c870' },
  ATTITUDE_BRANCH:    { bg: '#1a0e22', border: '#6a3a8a', header: '#220e2e', text: '#c080e0' },
  CONSCIOUSNESS_GATE: { bg: '#0e1822', border: '#3a5878', header: '#121e2c', text: '#70a8d8' },
  SCENE_TRANSITION:   { bg: '#1e0a08', border: '#8a1a10', header: '#280e0a', text: '#e06050' },
  SECTION_LABEL:      { bg: '#161210', border: '#3a3028', header: '#1e1814', text: '#786e66' },
  ANCHOR_USE:         { bg: '#221a06', border: '#a87820', header: '#2c2208', text: '#d8a830' },
};

const NODE_W = 220;
const NODE_H = 90;
const V_GAP  = 110;
const H_GAP  = 70;

const TIER_LABELS = ['FERAL','WAKING','CLEAR','GRIOTTE'];

// Deterministic pseudo-random hash so each node's wiggle phase/speed stays
// stable across re-renders instead of resetting (which would look jittery).
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function hexToRgba(hex, alpha) {
  const h = (hex || '#4a4438').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

function nodePreview(node) {
  if (node.text) return node.text.length > 110 ? node.text.slice(0, 110) + '…' : node.text;
  switch (node.type) {
    case 'CONDITION':
      if (node.variable) return `${node.variable} ${node.operator || '>='} ${node.threshold ?? 0}`;
      break;
    case 'VAR_SET': {
      const op = node.operation === 'add' ? '+=' : node.operation === 'subtract' ? '-=' : '=';
      if (node.variable) return `${node.variable} ${op} ${node.value ?? 0}`;
      break;
    }
    case 'CONSCIOUSNESS_GATE':
      return `tier ≥ ${TIER_LABELS[node.min_tier ?? 0]}`;
    case 'ATTITUDE_BRANCH': {
      const keys = Object.keys(node.branches || {});
      return keys.length ? keys.join(' / ') : 'attitude → …';
    }
    case 'SCENE_TRANSITION':
      return node.target_scene ? `→ ${node.target_scene}` : '→ scene';
    case 'SECTION_LABEL':
      return node.label || '── section ──';
    case 'ANCHOR_USE':
      return `calm +${node.calm_gain ?? 5}`;
    default:
      break;
  }
  return null;
}

// ── TREE LAYOUT ───────────────────────────────────────────────────────
function computeLayout(nodes) {
  if (!nodes || nodes.length === 0) return {};
  const inDegree = {};
  nodes.forEach(n => { inDegree[n.id] = 0; });
  nodes.forEach(n => {
    const nexts = getNextIds(n);
    nexts.forEach(id => { if (inDegree[id] !== undefined) inDegree[id]++; });
  });
  const roots = nodes.filter(n => inDegree[n.id] === 0);
  const startId = roots.length ? roots[0].id : nodes[0].id;
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // BFS to assign levels
  const levels = {};
  const queue = [{ id: startId, level: 0 }];
  const visited = new Set();
  while (queue.length) {
    const { id, level } = queue.shift();
    if (visited.has(id)) continue;
    visited.add(id);
    if (!levels[level]) levels[level] = [];
    levels[level].push(id);
    const node = nodeMap[id];
    if (node) getNextIds(node).forEach(nid => { if (!visited.has(nid)) queue.push({ id: nid, level: level + 1 }); });
  }
  // Add any unvisited nodes
  nodes.forEach(n => { if (!visited.has(n.id)) { const l = Object.keys(levels).length; if (!levels[l]) levels[l] = []; levels[l].push(n.id); } });

  const positions = {};
  Object.entries(levels).forEach(([lvl, ids]) => {
    const totalW = ids.length * NODE_W + (ids.length - 1) * H_GAP;
    const startX = -totalW / 2 + NODE_W / 2;
    ids.forEach((id, i) => {
      positions[id] = { x: startX + i * (NODE_W + H_GAP), y: Number(lvl) * (NODE_H + V_GAP) };
    });
  });
  return positions;
}

function getNextIds(node) {
  if (!node) return [];
  const ids = [];
  if (node.next && node.next !== 'END') ids.push(node.next);
  if (node.options) node.options.forEach(o => { if (o.next && o.next !== 'END') ids.push(o.next); });
  if (node.true_next)  ids.push(node.true_next);
  if (node.false_next) ids.push(node.false_next);
  if (node.branches) Object.values(node.branches).forEach(id => { if (id && id !== 'END') ids.push(id); });
  if (node.pass_next) ids.push(node.pass_next);
  if (node.fail_next) ids.push(node.fail_next);
  return [...new Set(ids)];
}

// ── EDIT PANEL ────────────────────────────────────────────────────────
function EditPanel({ node, store, onStoreChange, onClose, onAskClaude, onJumpToNode }) {
  const [text, setText]   = useState(node.text || '');
  const [type, setType]   = useState(node.type || 'NARRATION');
  const [nextId, setNextId] = useState(node.next || '');
  const [options, setOptions] = useState(node.options ? JSON.parse(JSON.stringify(node.options)) : []);
  const [extra, setExtra] = useState(() => ({
    variable:     node.variable    || '',
    operator:     node.operator    || '>=',
    threshold:    node.threshold   ?? 0,
    true_next:    node.true_next   || '',
    false_next:   node.false_next  || '',
    operation:    node.operation   || 'set',
    value:        node.value       ?? 0,
    min_tier:     node.min_tier    ?? 0,
    pass_next:    node.pass_next   || '',
    fail_next:    node.fail_next   || '',
    branches:     node.branches    ? { ...node.branches } : {},
    target_scene: node.target_scene || '',
    calm_gain:    node.calm_gain   ?? 5,
    label:        node.label       || '',
  }));
  const setE = (field, val) => setExtra(x => ({ ...x, [field]: val }));
  const fileRef = useRef(null);

  const scene = store.scenes.find(s => s.id === store.activeScene);
  const allIds = (scene?.nodes || []).map(n => n.id);
  const allVarKeys = Object.keys(store.variables);
  const consequences = (store.consequences || []).filter(c => JSON.stringify(c).includes(node.id));

  // Cross-scene references — other nodes (in any scene) that touch this variable
  const getCrossSceneRefs = (varName) => {
    if (!varName) return [];
    const hits = [];
    store.scenes.forEach(sc => {
      (sc.nodes || []).forEach(n => {
        if (n.id === node.id) return;
        if (JSON.stringify(n).includes(`"${varName}"`)) {
          hits.push({ sceneId: sc.id, sceneName: sc.name, nodeId: n.id, type: n.type });
        }
      });
    });
    return hits;
  };
  const CrossSceneRefs = ({ varName }) => {
    const hits = getCrossSceneRefs(varName);
    if (!varName || !hits.length) return null;
    return (
      <div style={{marginTop:4,marginBottom:8,borderLeft:'2px solid var(--border)',paddingLeft:8}}>
        <div style={{fontSize:'9px',color:'var(--text-dim)',marginBottom:2}}>Also referenced by:</div>
        {hits.slice(0, 8).map((h, i) => (
          <div key={i} style={{fontSize:'9px',color:'var(--text-dim)',lineHeight:1.7,cursor: onJumpToNode ? 'pointer' : 'default'}}
            onClick={() => onJumpToNode && onJumpToNode(h.sceneId, h.nodeId)}
            title={onJumpToNode ? 'Click to jump to this node' : ''}>
            <span style={{color:'var(--amber-dim)'}}>{h.sceneName}</span>
            {' · '}<span style={{fontFamily:'monospace',opacity:0.7}}>{h.nodeId}</span>
            {' '}<span style={{fontSize:'8px',opacity:0.5}}>[{h.type}]</span>
          </div>
        ))}
        {hits.length > 8 && <div style={{fontSize:'9px',color:'var(--text-dim)',opacity:0.5}}>+{hits.length - 8} more</div>}
      </div>
    );
  };

  const save = () => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    const idx = sc.nodes.findIndex(n => n.id === node.id);
    if (idx >= 0) {
      const updated = { ...sc.nodes[idx], text, type };
      updated.next = nextId || null;
      if (type === 'CHOICE') { updated.options = options; }
      if (type === 'CONDITION') {
        updated.variable = extra.variable; updated.operator = extra.operator;
        updated.threshold = Number(extra.threshold);
        updated.true_next = extra.true_next || null; updated.false_next = extra.false_next || null;
      }
      if (type === 'VAR_SET') {
        updated.variable = extra.variable; updated.operation = extra.operation;
        updated.value = extra.value;
      }
      if (type === 'CONSCIOUSNESS_GATE') {
        updated.min_tier = Number(extra.min_tier);
        updated.pass_next = extra.pass_next || null; updated.fail_next = extra.fail_next || null;
      }
      if (type === 'ATTITUDE_BRANCH') { updated.branches = extra.branches; }
      if (type === 'SCENE_TRANSITION') { updated.target_scene = extra.target_scene; }
      if (type === 'ANCHOR_USE') { updated.calm_gain = Number(extra.calm_gain); }
      if (type === 'SECTION_LABEL') { updated.label = extra.label; }
      sc.nodes[idx] = updated;
    }
    onStoreChange(next, `Edited node: ${node.id}`);
    onClose();
  };

  const deleteNode = () => {
    if (!confirm(`Delete node "${node.id}"?`)) return;
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    sc.nodes = sc.nodes.filter(n => n.id !== node.id);
    onStoreChange(next, `Deleted node: ${node.id}`);
    onClose();
  };

  const uploadMedia = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const next = JSON.parse(JSON.stringify(store));
      const sc = next.scenes.find(s => s.id === next.activeScene);
      if (!sc) return;
      const idx = sc.nodes.findIndex(n => n.id === node.id);
      if (idx >= 0) sc.nodes[idx].media = ev.target.result;
      onStoreChange(next, `Media added: ${node.id}`);
    };
    reader.readAsDataURL(file);
  };

  const clearMedia = () => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    const idx = sc.nodes.findIndex(n => n.id === node.id);
    if (idx >= 0) delete sc.nodes[idx].media;
    onStoreChange(next, `Media cleared: ${node.id}`);
  };

  const updateOption = (i, field, val) =>
    setOptions(opts => opts.map((o, j) => j === i ? { ...o, [field]: val } : o));

  const addOptionSet = (i) => {
    const k = prompt('Variable name to set:');
    if (!k) return;
    setOptions(opts => opts.map((o, j) => j !== i ? o : { ...o, sets: { ...(o.sets || {}), [k]: false } }));
  };
  const removeOptionSet = (i, k) =>
    setOptions(opts => opts.map((o, j) => {
      if (j !== i) return o;
      const s = { ...(o.sets || {}) }; delete s[k]; return { ...o, sets: s };
    }));
  const updateOptionSet = (i, k, raw) => {
    const vv = store.variables[k];
    const val = vv?.type === 'bool' ? (raw === 'true' || raw === true)
              : vv?.type === 'int'  ? Number(raw)
              : raw;
    setOptions(opts => opts.map((o, j) => j !== i ? o : { ...o, sets: { ...(o.sets || {}), [k]: val } }));
  };

  return (
    <div className="edit-panel">
      <div className="edit-panel-header">
        <h4>EDIT NODE</h4>
        <button className="close-btn" onClick={onClose}>✕</button>
      </div>
      <div className="edit-panel-body">
        <div className="edit-field-label">ID</div>
        <div style={{color:'var(--text-dim)',fontSize:'10px',fontFamily:'monospace',wordBreak:'break-all',marginBottom:8}}>{node.id}</div>

        <div className="edit-field-label">Type</div>
        <select className="edit-select" value={type} onChange={e => setType(e.target.value)}>
          {Object.keys(NODE_COLORS).map(t => <option key={t} value={t}>{t}</option>)}
        </select>

        <div className="edit-field-label">Text</div>
        <textarea className="edit-textarea" value={text} onChange={e => setText(e.target.value)} rows={4} />

        <div className="edit-field-label">Next Node ID</div>
        <div className="edit-next-field">
          <input className="edit-next-input" style={{flex:1}}
            list={`next-list-${node.id}`}
            value={nextId} onChange={e => setNextId(e.target.value)} placeholder="node_id or END" />
          {nextId && (
            <button onClick={() => setNextId('')}
              style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'3px 7px',cursor:'pointer',fontSize:'10px'}}
              title="Disconnect">×</button>
          )}
        </div>
        <datalist id={`next-list-${node.id}`}>
          {allIds.filter(id => id !== node.id).map(id => <option key={id} value={id} />)}
        </datalist>

        <div className="edit-field-label">Media</div>
        {node.media ? (
          <div style={{position:'relative',marginBottom:8}}>
            {node.media.startsWith('data:video') ? (
              <video src={node.media} style={{width:'100%',maxHeight:90,borderRadius:4,objectFit:'cover'}} muted />
            ) : (
              <img src={node.media} style={{width:'100%',maxHeight:90,borderRadius:4,objectFit:'cover'}} alt="" />
            )}
            <button onClick={clearMedia}
              style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,0.75)',border:'none',color:'#fff',borderRadius:3,padding:'2px 6px',cursor:'pointer',fontSize:'10px'}}>
              ✕
            </button>
          </div>
        ) : (
          <button className="edit-btn"
            style={{marginBottom:8,marginTop:4,background:'var(--surface2)',border:'1px dashed var(--border)',color:'var(--text-dim)',boxShadow:'none'}}
            onClick={() => fileRef.current?.click()}>
            + Upload Image / Video
          </button>
        )}
        <input ref={fileRef} type="file" accept="image/*,video/webm,video/mp4" style={{display:'none'}} onChange={uploadMedia} />

        {type === 'CHOICE' && (
          <>
            <div className="edit-field-label">Options</div>
            {options.map((o, i) => (
              <div key={i} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:4,padding:'6px',marginBottom:4}}>
                <div style={{display:'flex',gap:4,marginBottom:4}}>
                  <input className="edit-select" style={{flex:1,height:'auto',padding:'3px 5px',fontSize:'10px'}}
                    value={o.label || ''} onChange={e => updateOption(i,'label',e.target.value)} placeholder="Option label" />
                  <button onClick={() => setOptions(opts => opts.filter((_,j) => j !== i))}
                    style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'2px 6px',cursor:'pointer',fontSize:'10px'}}>✕</button>
                </div>
                <input className="edit-select" style={{width:'100%',height:'auto',padding:'3px 5px',fontSize:'10px'}}
                  list={`opt-list-${node.id}-${i}`}
                  value={o.next || ''} onChange={e => updateOption(i,'next',e.target.value)} placeholder="→ next node id" />
                <datalist id={`opt-list-${node.id}-${i}`}>
                  {allIds.filter(id => id !== node.id).map(id => <option key={id} value={id} />)}
                </datalist>
                {/* Variable sets for this option */}
                {Object.entries(o.sets || {}).map(([k, v]) => (
                  <div key={k} style={{display:'flex',gap:4,marginTop:4,alignItems:'center'}}>
                    <span style={{fontSize:'9px',color:'var(--text-dim)',minWidth:80,flexShrink:0}}>{k} =</span>
                    {store.variables[k]?.type === 'bool' ? (
                      <select style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',fontFamily:'inherit',fontSize:'10px',padding:'2px 4px',borderRadius:3}}
                        value={String(v)} onChange={e => updateOptionSet(i, k, e.target.value)}>
                        <option value="true">true</option>
                        <option value="false">false</option>
                      </select>
                    ) : (
                      <input style={{flex:1,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',fontFamily:'inherit',fontSize:'10px',padding:'2px 4px',borderRadius:3}}
                        value={v} onChange={e => updateOptionSet(i, k, e.target.value)} />
                    )}
                    <button onClick={() => removeOptionSet(i, k)}
                      style={{background:'none',border:'1px solid var(--border)',color:'var(--text-dim)',borderRadius:3,padding:'1px 5px',cursor:'pointer',fontSize:'10px',flexShrink:0}}>×</button>
                  </div>
                ))}
                <button onClick={() => addOptionSet(i)}
                  style={{background:'none',border:'none',color:'var(--text-dim)',fontFamily:'inherit',fontSize:'9px',cursor:'pointer',padding:'3px 0 0',textAlign:'left'}}>
                  + set var
                </button>
              </div>
            ))}
            <button className="edit-btn"
              style={{background:'none',border:'1px dashed var(--border)',color:'var(--text-dim)',boxShadow:'none',marginBottom:4}}
              onClick={() => setOptions(opts => [...opts, { label:'New option', next:'' }])}>
              + Add Option
            </button>
          </>
        )}

        {/* ── CONDITION ── */}
        {type === 'CONDITION' && (<>
          <div className="edit-field-label">Variable</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-var-list" value={extra.variable} onChange={e => setE('variable', e.target.value)} placeholder="variable name" />
          <datalist id="cond-var-list">{allVarKeys.map(k => <option key={k} value={k} />)}</datalist>
          <div className="edit-field-label">Operator</div>
          <select className="edit-select" value={extra.operator} onChange={e => setE('operator', e.target.value)}>
            {['>=','<=','>','<','=='].map(op => <option key={op} value={op}>{op}</option>)}
          </select>
          <div className="edit-field-label">Threshold</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}} type="number"
            value={extra.threshold} onChange={e => setE('threshold', e.target.value)} />
          <div className="edit-field-label">True → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-true-list" value={extra.true_next} onChange={e => setE('true_next', e.target.value)} placeholder="node_id" />
          <datalist id="cond-true-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <div className="edit-field-label">False → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="cond-false-list" value={extra.false_next} onChange={e => setE('false_next', e.target.value)} placeholder="node_id" />
          <datalist id="cond-false-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <CrossSceneRefs varName={extra.variable} />
        </>)}

        {/* ── VAR_SET ── */}
        {type === 'VAR_SET' && (<>
          <div className="edit-field-label">Variable</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="varset-var-list" value={extra.variable} onChange={e => setE('variable', e.target.value)} placeholder="variable name" />
          <datalist id="varset-var-list">{allVarKeys.map(k => <option key={k} value={k} />)}</datalist>
          <div className="edit-field-label">Operation</div>
          <select className="edit-select" value={extra.operation} onChange={e => setE('operation', e.target.value)}>
            <option value="set">set =</option>
            <option value="add">add +=</option>
            <option value="subtract">subtract -=</option>
          </select>
          <div className="edit-field-label">Value</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            value={extra.value} onChange={e => setE('value', e.target.value)} placeholder="value" />
          <CrossSceneRefs varName={extra.variable} />
        </>)}

        {/* ── CONSCIOUSNESS_GATE ── */}
        {type === 'CONSCIOUSNESS_GATE' && (<>
          <div className="edit-field-label">Minimum Tier</div>
          <select className="edit-select" value={extra.min_tier} onChange={e => setE('min_tier', e.target.value)}>
            <option value={0}>0 — FERAL</option>
            <option value={1}>1 — WAKING</option>
            <option value={2}>2 — CLEAR</option>
            <option value={3}>3 — GRIOTTE</option>
          </select>
          <div className="edit-field-label">Pass → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="gate-pass-list" value={extra.pass_next} onChange={e => setE('pass_next', e.target.value)} placeholder="node_id" />
          <datalist id="gate-pass-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
          <div className="edit-field-label">Fail → Node</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            list="gate-fail-list" value={extra.fail_next} onChange={e => setE('fail_next', e.target.value)} placeholder="node_id" />
          <datalist id="gate-fail-list">{allIds.map(id => <option key={id} value={id} />)}</datalist>
        </>)}

        {/* ── ATTITUDE_BRANCH ── */}
        {type === 'ATTITUDE_BRANCH' && (<>
          {['reticence','anger','curiosity','joy','greed'].map(att => (
            <React.Fragment key={att}>
              <div className="edit-field-label" style={{textTransform:'capitalize'}}>{att} →</div>
              <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
                list={`att-list-${att}`}
                value={extra.branches[att] || ''}
                onChange={e => setE('branches', { ...extra.branches, [att]: e.target.value })}
                placeholder="node_id" />
              <datalist id={`att-list-${att}`}>{allIds.map(id => <option key={id} value={id} />)}</datalist>
            </React.Fragment>
          ))}
        </>)}

        {/* ── SCENE_TRANSITION ── */}
        {type === 'SCENE_TRANSITION' && (<>
          <div className="edit-field-label">Target Scene</div>
          <select className="edit-select" value={extra.target_scene} onChange={e => setE('target_scene', e.target.value)}>
            <option value="">— none —</option>
            {store.scenes.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </>)}

        {/* ── ANCHOR_USE ── */}
        {type === 'ANCHOR_USE' && (<>
          <div className="edit-field-label">Calm Gain</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}} type="number" min={0} max={100}
            value={extra.calm_gain} onChange={e => setE('calm_gain', e.target.value)} />
        </>)}

        {/* ── SECTION_LABEL ── */}
        {type === 'SECTION_LABEL' && (<>
          <div className="edit-field-label">Label</div>
          <input className="edit-select" style={{height:'auto',padding:'4px 6px'}}
            value={extra.label} onChange={e => setE('label', e.target.value)} placeholder="Section I" />
        </>)}

        {consequences.length > 0 && (
          <>
            <div className="edit-field-label">Consequences</div>
            {consequences.map(c => (
              <div key={c.id} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:4,padding:'6px',marginBottom:4,fontSize:'10px'}}>
                <strong style={{color:'var(--amber)'}}>{c.id}</strong><br/>
                {c.downstream?.map(d => <div key={d.scene} style={{color:'var(--text-dim)',marginTop:2}}>→ {d.scene}: {d.effect}</div>)}
              </div>
            ))}
          </>
        )}

        <button className="edit-btn" onClick={save}>Save Changes</button>
        <button className="edit-btn edit-btn-secondary" style={{marginTop:4}}
          onClick={() => { onAskClaude(node); }}>Ask Claude About This</button>
        <button className="edit-btn edit-btn-danger" onClick={deleteNode}>Delete Node</button>
      </div>
    </div>
  );
}

// ── TREE VIEW ─────────────────────────────────────────────────────────
function TreeView({ store, onStoreChange, onSwitchToChat, onNodeContext, centerTrigger, jumpToNode, onJumpToNode }) {
  const [offset, setOffset] = useState({ x: 0, y: 80 });
  const [zoom, setZoom]     = useState(1);
  const [panning, setPanning] = useState(false);
  const [panStart, setPanStart] = useState(null);
  const [selected, setSelected] = useState(null);
  const [draggingNode, setDraggingNode] = useState(null);
  const [resizingNode, setResizingNode] = useState(null); // { id, startW, startH, startMX, startMY }
  const [manualPos, setManualPos] = useState({});
  const [manualSize, setManualSize] = useState({});
  const [fontSize, setFontSize] = useState(11);
  const [search, setSearch]     = useState('');
  const [drawingWire, setDrawingWire] = useState(null); // { fromId, curX, curY } world coords
  const [ctxMenu, setCtxMenu]   = useState(null);        // { px, py, wx, wy } screen+world
  const wrapRef = useRef(null);

  const scene = store.scenes.find(s => s.id === store.activeScene);
  const nodes = scene?.nodes || [];
  const autoPos = useMemo(() => computeLayout(nodes), [nodes]);

  const getPos = useCallback(id => manualPos[id] || autoPos[id] || { x: 0, y: 0 }, [manualPos, autoPos]);
  const getSize = useCallback(id => manualSize[id] || { w: NODE_W, h: NODE_H }, [manualSize]);

  const centerCanvas = useCallback(() => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    setOffset({ x: rect.width / 2, y: 80 });
    setZoom(1);
  }, []);

  const fitAll = useCallback(() => {
    if (!nodes.length || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const boxes = nodes.map(n => ({ p: getPos(n.id), s: getSize(n.id) }));
    const xs = boxes.map(b => b.p.x), ys = boxes.map(b => b.p.y);
    const xs2 = boxes.map(b => b.p.x + b.s.w), ys2 = boxes.map(b => b.p.y + b.s.h);
    const minX = Math.min(...xs), maxX = Math.max(...xs2);
    const minY = Math.min(...ys), maxY = Math.max(...ys2);
    const worldW = maxX - minX || 1, worldH = maxY - minY || 1;
    const pad = 60;
    const z = Math.min((rect.width - pad*2) / worldW, (rect.height - pad*2) / worldH, 1.5);
    setZoom(z);
    setOffset({
      x: rect.width/2  - (minX + worldW/2) * z,
      y: rect.height/2 - (minY + worldH/2) * z,
    });
  }, [nodes, getPos, getSize]);

  useEffect(() => { centerCanvas(); }, []);

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(centerCanvas);
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, [centerCanvas]);

  // Clear positions + selection when scene changes
  useEffect(() => {
    setManualPos({});
    setSelected(null);
  }, [store.activeScene]);

  // Center view when requested externally (e.g. "View in Tree" from chat banner)
  useEffect(() => {
    if (!centerTrigger) return;
    setTimeout(centerCanvas, 50);
  }, [centerTrigger, centerCanvas]);

  // Jump to and select a specific node (e.g. from cross-scene provenance link).
  // Scene switch (if needed) happens in the caller before this fires, so by
  // the time this effect runs `nodes` should already reflect the target scene.
  useEffect(() => {
    if (!jumpToNode?.nodeId) return;
    const hit = nodes.find(n => n.id === jumpToNode.nodeId);
    if (!hit) return;
    const t = setTimeout(() => {
      const pos = getPos(hit.id);
      const rect = wrapRef.current?.getBoundingClientRect();
      if (rect) setOffset({ x: rect.width/2 - pos.x * zoom, y: rect.height/2 - pos.y * zoom - 40 });
      setSelected(hit.id);
    }, 60);
    return () => clearTimeout(t);
  }, [jumpToNode, nodes, getPos, zoom]);

  // Keyboard shortcuts: Delete=remove node, Escape=deselect, Ctrl+D=duplicate
  useEffect(() => {
    const handler = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'Escape') { setSelected(null); return; }
      if (!selected) return;
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        const next = JSON.parse(JSON.stringify(store));
        const sc = next.scenes.find(s => s.id === next.activeScene);
        if (!sc) return;
        sc.nodes = sc.nodes.filter(n => n.id !== selected);
        onStoreChange(next, `Deleted node: ${selected}`);
        setSelected(null);
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault();
        const sc = store.scenes.find(s => s.id === store.activeScene);
        const src = sc?.nodes.find(n => n.id === selected);
        if (!src) return;
        const newId = `${src.type.toLowerCase()}_${Date.now()}`;
        const copy = { ...JSON.parse(JSON.stringify(src)), id: newId, next: null };
        const pos = getPos(selected);
        const next = JSON.parse(JSON.stringify(store));
        const sc2 = next.scenes.find(s => s.id === next.activeScene);
        sc2.nodes.push(copy);
        setManualPos(p => ({ ...p, [newId]: { x: pos.x + 30, y: pos.y + 30 } }));
        onStoreChange(next, `Duplicated: ${selected}`);
        setSelected(newId);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [selected, store, onStoreChange, getPos]);

  // Wheel zoom at cursor — must be non-passive to call preventDefault
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const handler = (e) => {
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      setZoom(z => {
        const nz = Math.min(3, Math.max(0.1, z * factor));
        setOffset(o => ({
          x: mx - (mx - o.x) * (nz / z),
          y: my - (my - o.y) * (nz / z),
        }));
        return nz;
      });
    };
    el.addEventListener('wheel', handler, { passive: false });
    return () => el.removeEventListener('wheel', handler);
  }, []);

  // Close context menu on outside click
  useEffect(() => {
    if (!ctxMenu) return;
    const h = () => setCtxMenu(null);
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [ctxMenu]);

  const screenToWorld = useCallback((sx, sy) => {
    const rect = wrapRef.current?.getBoundingClientRect();
    if (!rect) return { wx: 0, wy: 0 };
    return { wx: (sx - rect.left - offset.x) / zoom, wy: (sy - rect.top - offset.y) / zoom };
  }, [offset, zoom]);

  const onMouseDown = useCallback((e) => {
    if (e.target.closest('.tree-node') || e.button !== 0) return;
    setCtxMenu(null);
    setPanning(true);
    setPanStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
  }, [offset]);

  const onMouseMove = useCallback((e) => {
    if (panning && panStart) {
      setOffset({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
    }
    if (draggingNode) {
      const { id, startX, startY, startMX, startMY } = draggingNode;
      const dx = (e.clientX - startMX) / zoom;
      const dy = (e.clientY - startMY) / zoom;
      setManualPos(p => ({ ...p, [id]: { x: startX + dx, y: startY + dy } }));
    }
    if (resizingNode) {
      const { id, startW, startH, startMX, startMY } = resizingNode;
      const dw = (e.clientX - startMX) / zoom;
      const dh = (e.clientY - startMY) / zoom;
      setManualSize(s => ({ ...s, [id]: { w: Math.max(140, startW + dw), h: Math.max(70, startH + dh) } }));
    }
    if (drawingWire) {
      const { wx, wy } = screenToWorld(e.clientX, e.clientY);
      setDrawingWire(w => w ? { ...w, curX: wx, curY: wy } : null);
    }
  }, [panning, panStart, draggingNode, resizingNode, zoom, drawingWire, screenToWorld]);

  const onMouseUp = useCallback((e) => {
    if (drawingWire) {
      const { wx, wy } = screenToWorld(e.clientX, e.clientY);
      const target = nodes.find(n => {
        const p = getPos(n.id);
        const s = getSize(n.id);
        return wx >= p.x && wx <= p.x + s.w && wy >= p.y && wy <= p.y + s.h;
      });
      if (target && target.id !== drawingWire.fromId) {
        const next = JSON.parse(JSON.stringify(store));
        const sc = next.scenes.find(s => s.id === next.activeScene);
        const src = sc?.nodes.find(n => n.id === drawingWire.fromId);
        if (src) {
          if (src.type === 'CHOICE') {
            if (!src.options) src.options = [];
            src.options.push({ label: 'Option ' + (src.options.length + 1), next: target.id });
          } else if (src.type === 'CONDITION') {
            if (!src.true_next) src.true_next = target.id;
            else if (!src.false_next) src.false_next = target.id;
            else src.true_next = target.id;
          } else if (src.type === 'ATTITUDE_BRANCH') {
            if (!src.branches) src.branches = {};
            const open = ['reticence','anger','curiosity','joy','greed'].find(k => !src.branches[k]);
            if (open) src.branches[open] = target.id;
          } else {
            src.next = target.id;
          }
        }
        onStoreChange(next, `Connected: ${drawingWire.fromId} → ${target.id}`);
      }
      setDrawingWire(null);
    }
    setPanning(false);
    setPanStart(null);
    setDraggingNode(null);
    setResizingNode(null);
  }, [drawingWire, nodes, getPos, getSize, store, onStoreChange, screenToWorld]);

  const onContextMenu = useCallback((e) => {
    if (e.target.closest('.tree-node')) return;
    e.preventDefault();
    const rect = wrapRef.current?.getBoundingClientRect();
    if (!rect) return;
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const wx = (px - offset.x) / zoom;
    const wy = (py - offset.y) / zoom;
    setCtxMenu({ px, py, wx, wy });
  }, [offset, zoom]);

  const addNodeAt = useCallback((type, wx, wy) => {
    const id = `${type.toLowerCase()}_${Date.now()}`;
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    sc.nodes.push({ id, type, text: '', media: null, next: null });
    setManualPos(p => ({ ...p, [id]: { x: wx - NODE_W / 2, y: wy } }));
    onStoreChange(next, `Added ${type} node`);
    setCtxMenu(null);
    setSelected(id);
  }, [store, onStoreChange]);

  const startDragNode = useCallback((e, id) => {
    e.stopPropagation();
    const pos = getPos(id);
    setDraggingNode({ id, startX: pos.x, startY: pos.y, startMX: e.clientX, startMY: e.clientY });
  }, [getPos]);

  const startResizeNode = useCallback((e, id) => {
    e.stopPropagation();
    e.preventDefault();
    const size = getSize(id);
    setResizingNode({ id, startW: size.w, startH: size.h, startMX: e.clientX, startMY: e.clientY });
  }, [getSize]);

  // Wire paths in world space (nodes positioned at pos.x, pos.y; SVG overflow:visible)
  const wires = useMemo(() => {
    const paths = [];
    nodes.forEach(node => {
      const from = getPos(node.id);
      const fromSize = getSize(node.id);
      const fx = from.x + fromSize.w / 2;
      const fy = from.y + fromSize.h;
      const col = NODE_COLORS[node.type]?.border || '#4a4438';

      const addWire = (toId, label) => {
        if (!toId || toId === 'END') return;
        const toNode = nodes.find(n => n.id === toId);
        if (!toNode) return;
        const to = getPos(toId);
        const toSize = getSize(toId);
        const tx = to.x + toSize.w / 2;
        const ty = to.y;
        const span = Math.abs(ty - fy);
        const cy1 = fy + span * 0.4;
        const cy2 = ty - span * 0.4;
        paths.push({
          d: `M${fx},${fy} C${fx},${cy1} ${tx},${cy2} ${tx},${ty}`,
          col,
          key: `${node.id}→${toId}${label ? '-'+label : ''}`,
          label,
          lx: (fx + tx) / 2,
          ly: (fy + ty) / 2,
        });
      };

      if (node.options) {
        node.options.forEach(o => addWire(o.next, o.label));
      } else {
        addWire(node.next, null);
        addWire(node.true_next, 'TRUE');
        addWire(node.false_next, 'FALSE');
        addWire(node.pass_next, 'PASS');
        addWire(node.fail_next, 'FAIL');
        if (node.branches) Object.entries(node.branches).forEach(([k,v]) => addWire(v, k));
      }
    });
    return paths;
  }, [nodes, manualPos, autoPos, getPos, getSize]);

  return (
    <div className="tree-layout">
      {/* Horizontal controls bar */}
      <div className="tree-controls">
        <button className="tree-ctrl-btn" onClick={() => setZoom(z => Math.min(3, z * 1.2))}>+</button>
        <button className="tree-ctrl-btn" onClick={() => setZoom(z => Math.max(0.1, z * 0.85))}>−</button>
        <button className="tree-ctrl-btn" onClick={centerCanvas} title="Reset view">↺</button>
        <button className="tree-ctrl-btn" onClick={fitAll} title="Fit all nodes in view">⊡</button>
        <button className="tree-ctrl-btn" onClick={() => { setManualPos({}); setManualSize({}); }} title="Auto-layout (clear manual positions and sizes)">⊞</button>
        <span style={{color:'var(--text-dim)',fontSize:'10px',minWidth:36,letterSpacing:'0.02em'}}>{Math.round(zoom*100)}%</span>
        <input
          type="text" placeholder="find node…" value={search}
          onChange={e => {
            const q = e.target.value;
            setSearch(q);
            if (!q) return;
            const hit = nodes.find(n =>
              n.id.toLowerCase().includes(q.toLowerCase()) ||
              (n.text || '').toLowerCase().includes(q.toLowerCase())
            );
            if (hit) {
              const pos = getPos(hit.id);
              const rect = wrapRef.current?.getBoundingClientRect();
              if (rect) {
                setOffset({ x: rect.width/2 - pos.x * zoom, y: rect.height/2 - pos.y * zoom - 40 });
              }
              setSelected(hit.id);
            }
          }}
          style={{
            background:'var(--surface2)', border:'1px solid var(--border)', color:'var(--text)',
            fontFamily:'inherit', fontSize:'10px', padding:'3px 8px', borderRadius:4,
            outline:'none', width:120,
          }}
        />
        <div className="font-slider-wrap" style={{marginLeft:'auto'}}>
          <span style={{color:'var(--text-dim)',fontSize:'9px'}}>Aa</span>
          <input type="range" className="font-slider" min={8} max={16} step={1}
            value={fontSize} onChange={e => setFontSize(Number(e.target.value))} />
          <span style={{color:'var(--text-dim)',fontSize:'12px'}}>Aa</span>
        </div>
        <span style={{color:'var(--text-dim)',fontSize:'9px',marginLeft:8,opacity:0.6}}
          title="Del=delete · Ctrl+D=duplicate · Esc=deselect · drag ●=connect · ⊡=fit all · ⊞=auto-layout">?</span>
      </div>

      {/* Squigglevision filters — hand-tremor line displacement for node
          borders (Dr. Katz style). Several variants with different timing
          so nodes don't all jitter in perfect lockstep. */}
      <svg width="0" height="0" style={{position:'absolute'}}>
        <defs>
          {[0,1,2].map(i => (
            <filter key={i} id={`squiggle-filter-${i}`} x="-40%" y="-40%" width="180%" height="180%">
              <feTurbulence type="fractalNoise" numOctaves="2" seed={i * 7 + 3} result="noise">
                <animate attributeName="baseFrequency"
                  dur={`${0.8 + i * 0.25}s`}
                  values="0.06;0.1;0.07;0.12;0.08;0.06"
                  calcMode="discrete" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          ))}
        </defs>
      </svg>

      <div
        className={`tree-canvas-wrap${panning ? ' panning' : ''}${drawingWire ? ' wiring' : ''}`}
        ref={wrapRef}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onContextMenu={onContextMenu}
      >
        {/* Info overlay */}
        <div style={{position:'absolute',top:8,left:12,color:'var(--text-dim)',fontSize:'10px',pointerEvents:'none',zIndex:2,letterSpacing:'0.04em'}}>
          {scene?.name || 'No scene'} · {nodes.length} nodes
        </div>

        {/* Transformed world canvas */}
        <div
          className="tree-canvas-inner"
          style={{ transform: `translate(${offset.x}px,${offset.y}px) scale(${zoom})`, transformOrigin: '0 0' }}
        >
          {/* SVG wires — overflow:visible so beziers draw past the 1×1 box */}
          <svg style={{position:'absolute',left:0,top:0,width:1,height:1,overflow:'visible',pointerEvents:'none'}}>
            <defs>
              <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#4a4438" opacity="0.8" />
              </marker>
            </defs>
            {wires.map(w => (
              <g key={w.key}>
                <path d={w.d} fill="none" stroke={w.col} strokeWidth="1.5" opacity="0.6"
                  markerEnd="url(#arrowhead)" />
                {w.label && (
                  <text x={w.lx} y={w.ly} fontSize="9" fill={w.col} textAnchor="middle" opacity="0.9"
                    style={{paintOrder:'stroke',stroke:'#0d0c0b',strokeWidth:'3px',strokeLinejoin:'round'}}>
                    {w.label.length > 22 ? w.label.slice(0,22)+'…' : w.label}
                  </text>
                )}
              </g>
            ))}

            {/* In-progress wire while dragging from connector dot */}
            {drawingWire && (() => {
              const fp = getPos(drawingWire.fromId);
              const fs = getSize(drawingWire.fromId);
              return (
                <line
                  x1={fp.x + fs.w / 2} y1={fp.y + fs.h + 7}
                  x2={drawingWire.curX}   y2={drawingWire.curY}
                  stroke="#c8880a" strokeWidth="2" strokeDasharray="6 4" opacity="0.85"
                  markerEnd="url(#arrowhead)"
                />
              );
            })()}
          </svg>

          {/* Nodes */}
          {nodes.length === 0 ? (
            <div style={{position:'absolute',width:360,left:-180,top:40,textAlign:'center'}}>
              <div style={{color:'var(--amber)',fontSize:'12px',letterSpacing:'0.1em',marginBottom:8}}>NO NODES YET</div>
              <div style={{color:'var(--text-dim)',fontSize:'11px'}}>Ask Claude in CHAT, or right-click here to add a node manually.</div>
            </div>
          ) : (() => {
            const nodeIdSet = new Set(nodes.map(n => n.id));
            const isBroken = (id) => id && id !== 'END' && !nodeIdSet.has(id);
            return nodes.map((node, seqIdx) => {
            const pos = getPos(node.id);
            const size = getSize(node.id);
            const col = NODE_COLORS[node.type] || NODE_COLORS.NARRATION;
            const isSelected = selected === node.id;
            const isBeingMoved = (draggingNode && draggingNode.id === node.id) || (resizingNode && resizingNode.id === node.id);
            const targets = [node.next, node.true_next, node.false_next, node.pass_next, node.fail_next,
              ...(node.options || []).map(o => o.next),
              ...Object.values(node.branches || {})].filter(Boolean);
            const hasBrokenLink = targets.some(isBroken);
            const h = hashStr(node.id);
            const squiggleFilter = isBeingMoved ? 'none' : `url(#squiggle-filter-${h % 3})`;
            return (
              <div
                key={node.id}
                className={`tree-node${isSelected ? ' selected' : ''}`}
                style={{
                  left: pos.x,
                  top:  pos.y,
                  width: size.w,
                  height: size.h,
                  borderColor: isSelected ? 'var(--amber)' : col.border,
                  '--squiggle-filter': squiggleFilter,
                }}
                onClick={() => setSelected(isSelected ? null : node.id)}
                onMouseDown={e => {
                  if (!e.target.closest('.tree-node-ask') && !e.target.closest('button'))
                    startDragNode(e, node.id);
                }}
              >
                <div className="tree-node-seq" style={{borderColor: col.border, color: col.border}}>{seqIdx + 1}</div>

                {/* Connector dot — drag to another node to set next */}
                <div
                  className="node-conn-out"
                  onMouseDown={e => {
                    e.stopPropagation();
                    e.preventDefault();
                    const pos = getPos(node.id);
                    const sz = getSize(node.id);
                    setDrawingWire({ fromId: node.id, curX: pos.x + sz.w / 2, curY: pos.y + sz.h });
                  }}
                  title="Drag to connect → next node"
                />

                <div className="tree-node-inner">
                  <div className="tree-node-header" style={{background: hexToRgba(col.border, 0.12), borderBottom: `1px solid ${hexToRgba(col.border, 0.3)}`}}>
                    <span className="tree-node-type" style={{color: col.border}}>{node.type}</span>
                    {hasBrokenLink && (
                      <span title="Points to a node that doesn't exist"
                        style={{color:'#c0392b',fontSize:'10px',marginLeft:4,lineHeight:1}}>⚠</span>
                    )}
                    <button className="tree-node-ask"
                      onClick={e => { e.stopPropagation(); onNodeContext && onNodeContext(node); }}>
                      Ask Claude
                    </button>
                  </div>

                  {/* Media zone — click opens edit panel to upload */}
                  <div className="tree-node-media-zone"
                    style={node.media ? {border:'none',padding:0,height:48,margin:'0 10px 8px'} : {}}
                    onClick={e => { e.stopPropagation(); setSelected(node.id); }}>
                    {node.media ? (
                      node.media.startsWith('data:video') ? (
                        <video src={node.media} style={{width:'100%',height:'100%',objectFit:'cover'}} muted loop />
                      ) : (
                        <img src={node.media} style={{width:'100%',height:'100%',objectFit:'cover'}} alt="" />
                      )
                    ) : '+ media'}
                  </div>

                  <div className="tree-node-body" style={{fontSize:`${fontSize}px`}}>
                    {(() => {
                      const preview = nodePreview(node);
                      return preview
                        ? preview
                        : <em style={{color:'var(--text-dim)'}}>no content</em>;
                    })()}
                  </div>

                  {node.options && node.options.length > 0 && (
                    <div className="tree-node-footer">
                      {node.options.slice(0,3).map((o,i) => (
                        <span key={i} className="tree-node-option">{o.label}</span>
                      ))}
                      {node.options.length > 3 && (
                        <span className="tree-node-option">+{node.options.length-3} more</span>
                      )}
                    </div>
                  )}
                </div>

                {/* Resize handle — drag to change card size */}
                <div className="tree-node-resize-handle"
                  onMouseDown={e => startResizeNode(e, node.id)}
                  title="Drag to resize" />
              </div>
            );
          });
          })()}
        </div>

        {/* Minimap — overview of all nodes */}
        {nodes.length > 1 && (() => {
          const MM_W = 140, MM_H = 100;
          const pads = 8;
          const boxes = nodes.map(n => ({ p: getPos(n.id), s: getSize(n.id) }));
          const xs = boxes.map(b => b.p.x);
          const ys = boxes.map(b => b.p.y);
          const minX = Math.min(...xs), maxX = Math.max(...boxes.map(b => b.p.x + b.s.w));
          const minY = Math.min(...ys), maxY = Math.max(...boxes.map(b => b.p.y + b.s.h));
          const worldW = maxX - minX || 1, worldH = maxY - minY || 1;
          const scaleX = (MM_W - pads*2) / worldW;
          const scaleY = (MM_H - pads*2) / worldH;
          const sc = Math.min(scaleX, scaleY);
          const ox = pads + ((MM_W - pads*2) - worldW * sc) / 2 - minX * sc;
          const oy = pads + ((MM_H - pads*2) - worldH * sc) / 2 - minY * sc;
          const ww = wrapRef.current?.clientWidth || 800;
          const wh = wrapRef.current?.clientHeight || 600;
          const vpX = (-offset.x / zoom) * sc + ox;
          const vpY = (-offset.y / zoom) * sc + oy;
          const vpW = (ww / zoom) * sc;
          const vpH = (wh / zoom) * sc;
          return (
            <div style={{
              position:'absolute', bottom:8, right:8, width:MM_W, height:MM_H, zIndex:20,
              background:'rgba(13,12,11,0.9)', border:'1px solid var(--border)',
              borderRadius:4, overflow:'hidden', pointerEvents:'none',
            }}>
              <svg width={MM_W} height={MM_H}>
                {nodes.map(n => {
                  const p = getPos(n.id);
                  const s = getSize(n.id);
                  const col = NODE_COLORS[n.type] || NODE_COLORS.NARRATION;
                  return <rect key={n.id}
                    x={p.x * sc + ox} y={p.y * sc + oy}
                    width={Math.max(2, s.w * sc)} height={Math.max(1.5, s.h * sc)}
                    fill="#fdf8ec" stroke={n.id === selected ? '#c8880a' : col.border} strokeWidth="0.5" />;
                })}
                <rect x={vpX} y={vpY} width={vpW} height={vpH}
                  fill="none" stroke="rgba(200,136,10,0.4)" strokeWidth="1" />
              </svg>
            </div>
          );
        })()}

        {/* Right-click context menu */}
        {ctxMenu && (
          <div className="tree-ctx-menu" style={{left: ctxMenu.px, top: ctxMenu.py}}
            onMouseDown={e => e.stopPropagation()}>
            <div style={{padding:'3px 12px 5px',color:'var(--text-dim)',fontSize:'9px',letterSpacing:'0.1em',borderBottom:'1px solid var(--border)'}}>
              ADD NODE
            </div>
            {['NARRATION','CHOICE','CONDITION','VAR_SET','SECTION_LABEL','SCENE_TRANSITION','ANCHOR_USE'].map(t => (
              <div key={t} className="tree-ctx-item" onClick={() => addNodeAt(t, ctxMenu.wx, ctxMenu.wy)}>
                <span className="tree-ctx-dot" style={{background: NODE_COLORS[t]?.border || '#4a4438'}} />
                {t}
              </div>
            ))}
          </div>
        )}
      </div>

      {selected && nodes.find(n => n.id === selected) && (
        <EditPanel
          key={selected}
          node={nodes.find(n => n.id === selected)}
          store={store}
          onStoreChange={onStoreChange}
          onClose={() => setSelected(null)}
          onAskClaude={node => { onNodeContext && onNodeContext(node); setSelected(null); }}
          onJumpToNode={onJumpToNode}
        />
      )}
    </div>
  );
}

// ── STORY VIEW ────────────────────────────────────────────────────────
function StoryView({ store, onStoreChange, onSwitchTab }) {
  const lanes = ['shared', 'shed', 'run', 'go'];
  const laneLabels = { shared: '── SHARED ──', shed: '── SHED ──', run: '── RUN ──', go: '── GO ──' };

  const canvasRef = useRef(null);
  const cardRefs = useRef({});
  const [cardRects, setCardRects] = useState({});
  const [canvasSize, setCanvasSize] = useState({ w: 0, h: 0 });

  const measure = useCallback(() => {
    if (!canvasRef.current) return;
    const rects = {};
    Object.entries(cardRefs.current).forEach(([id, el]) => {
      if (!el) return;
      rects[id] = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    });
    setCardRects(rects);
    setCanvasSize({ w: canvasRef.current.scrollWidth, h: canvasRef.current.scrollHeight });
  }, []);

  useEffect(() => {
    measure();
    const t = setTimeout(measure, 60); // catch late layout from thumbnail images loading
    return () => clearTimeout(t);
  }, [store.scenes, measure]);

  useEffect(() => {
    if (!canvasRef.current) return;
    const ro = new ResizeObserver(measure);
    ro.observe(canvasRef.current);
    return () => ro.disconnect();
  }, [measure]);

  // Scene-to-scene edges derived from SCENE_TRANSITION nodes
  const edges = useMemo(() => {
    const seen = new Set();
    const list = [];
    store.scenes.forEach(sc => {
      (sc.nodes || []).forEach(n => {
        if (n.type === 'SCENE_TRANSITION' && n.target_scene && n.target_scene !== sc.id
            && store.scenes.some(s => s.id === n.target_scene)) {
          const key = `${sc.id}->${n.target_scene}`;
          if (!seen.has(key)) { seen.add(key); list.push({ from: sc.id, to: n.target_scene }); }
        }
      });
    });
    return list;
  }, [store.scenes]);

  const addScene = (branch) => {
    const name = prompt(`Scene name for ${branch} branch:`);
    if (!name) return;
    const base = name.toLowerCase().replace(/[^a-z0-9_]/g, '_');
    const existingIds = new Set(store.scenes.map(s => s.id));
    let id = base, n = 2;
    while (existingIds.has(id)) { id = `${base}_${n}`; n++; }
    const next = JSON.parse(JSON.stringify(store));
    next.scenes.push({ id, name, branch, type: 'playable', status: 'draft', nodes: [], wires: [] });
    onStoreChange(next, `Added scene: ${name}`);
  };

  return (
    <div className="story-layout">
      <div className="story-canvas" ref={canvasRef}>
        <div style={{color:'var(--text-dim)',fontSize:'10px',marginBottom:16,letterSpacing:'0.06em'}}>
          STORY MAP · {store.scenes.length} scenes · Click a scene to open in TREE
        </div>

        {canvasSize.w > 0 && (
          <svg className="story-arrows-svg" width={canvasSize.w} height={canvasSize.h}>
            <defs>
              <marker id="story-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#c8880a" opacity="0.7" />
              </marker>
            </defs>
            {edges.map(({ from, to }) => {
              const f = cardRects[from], t = cardRects[to];
              if (!f || !t) return null;
              const fx = f.x + f.w, fy = f.y + f.h / 2;
              const tx = t.x, ty = t.y + t.h / 2;
              const curve = Math.max(30, Math.abs(tx - fx) / 2);
              const d = `M${fx},${fy} C${fx + curve},${fy} ${tx - curve},${ty} ${tx},${ty}`;
              return (
                <path key={`${from}->${to}`} d={d} fill="none" stroke="#c8880a" strokeWidth="1.5"
                  strokeDasharray="5 4" opacity="0.55" markerEnd="url(#story-arrowhead)" />
              );
            })}
          </svg>
        )}

        <div className="story-lanes">
          {lanes.map(lane => {
            const laneScenes = store.scenes.filter(s => s.branch === lane);
            return (
              <div key={lane} className="story-lane">
                <div className="story-lane-header">{laneLabels[lane]}</div>
                {laneScenes.map(s => {
                  const thumbNode = s.nodes.find(n => n.media);
                  return (
                    <div key={s.id} className="story-card"
                      ref={el => { cardRefs.current[s.id] = el; }}
                      onClick={() => { const next = JSON.parse(JSON.stringify(store)); next.activeScene = s.id; onStoreChange(next, null); onSwitchTab && onSwitchTab('TREE'); }}>
                      <button className="story-card-play" onClick={e => {
                        e.stopPropagation();
                        const next = JSON.parse(JSON.stringify(store));
                        next.activeScene = s.id;
                        onStoreChange(next, null);
                        onSwitchTab && onSwitchTab('PLAY');
                      }}>▶ Play</button>
                      {thumbNode && (
                        thumbNode.media.startsWith('data:video')
                          ? <video src={thumbNode.media} className="story-card-thumb" muted onLoadedData={measure} />
                          : <img src={thumbNode.media} className="story-card-thumb" alt="" onLoad={measure} />
                      )}
                      <div className="story-card-name">{s.name}</div>
                      <div className="story-card-badges">
                        <span className={`scene-badge badge-${s.branch}`}>{s.branch}</span>
                        <span className={`scene-badge badge-${s.type}`}>{s.type}</span>
                        <span className={`scene-badge badge-${s.status}`}>{s.status}</span>
                      </div>
                      <div className="story-card-stats">
                        {s.nodes.length} nodes · {s.nodes.filter(n=>n.media).length} media
                      </div>
                    </div>
                  );
                })}
                <button className="story-add-btn" onClick={() => addScene(lane)}>+ New Scene</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── INK EXPORT ────────────────────────────────────────────────────────
function exportToInk(scene) {
  const nodes = scene.nodes;
  if (!nodes.length) return '// No nodes in this scene.\n';
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // Find root node (zero in-degree)
  const inDeg = {};
  nodes.forEach(n => { inDeg[n.id] = 0; });
  nodes.forEach(n => getNextIds(n).forEach(id => { if (inDeg[id] !== undefined) inDeg[id]++; }));
  const root = nodes.find(n => inDeg[n.id] === 0) || nodes[0];

  const visited = new Set();
  const chunks = [];

  chunks.push(`// ═══════════════════════════════════════════════════════\n// ${scene.name}\n// ═══════════════════════════════════════════════════════\n`);
  chunks.push(`INCLUDE variables.ink\n\n-> ${root.id}\n\n`);

  const render = (id) => {
    if (!id || id === 'END' || visited.has(id) || !nodeMap[id]) return;
    visited.add(id);
    const n = nodeMap[id];
    let c = `=== ${id} ===\n`;

    switch (n.type) {
      case 'SECTION_LABEL':
        c += `// ── ${n.text || n.label || ''} ──\n-> ${n.next || 'END'}\n`;
        break;
      case 'NARRATION':
        c += `${n.text || ''}\n-> ${n.next || 'END'}\n`;
        break;
      case 'CHOICE':
        if (n.text) c += `${n.text}\n`;
        (n.options || []).forEach(o => {
          c += `+ [${o.label || 'Choice'}]\n`;
          if (o.sets) Object.entries(o.sets).forEach(([k,v]) => { c += `  ~ ${k} = ${JSON.stringify(v)}\n`; });
          c += `  -> ${o.next || 'END'}\n`;
        });
        break;
      case 'VAR_SET': {
        const op = n.operation === 'add' ? '+=' : n.operation === 'subtract' ? '-=' : '=';
        c += `~ ${n.variable} ${op} ${JSON.stringify(n.value ?? 0)}\n-> ${n.next || 'END'}\n`;
        break;
      }
      case 'CONDITION': {
        const op = n.operator || '>=';
        c += `{ ${n.variable} ${op} ${n.threshold}: -> ${n.true_next || 'END'} - else: -> ${n.false_next || 'END'} }\n`;
        break;
      }
      case 'ATTITUDE_BRANCH':
        ['reticence','anger','curiosity','joy','greed'].forEach(a => {
          const dest = n.branches?.[a];
          if (dest) c += `{ att_${a}: -> ${dest} }\n`;
        });
        if (n.next) c += `-> ${n.next}\n`;
        break;
      case 'CONSCIOUSNESS_GATE':
        c += `{ consciousness >= ${n.min_tier ?? 0}: -> ${n.pass_next || 'END'} - else: -> ${n.fail_next || 'END'} }\n`;
        break;
      case 'ANCHOR_USE':
        c += `~ calm += ${n.calm_gain ?? 5}\n-> ${n.next || 'END'}\n`;
        break;
      case 'SCENE_TRANSITION':
        c += `// → ${n.target_scene || n.text || 'next scene'}\n-> END\n`;
        break;
      default:
        c += n.text ? `${n.text}\n` : '';
        c += `-> ${n.next || 'END'}\n`;
    }

    chunks.push(c + '\n');

    // Recurse
    getNextIds(n).forEach(nid => render(nid));
    if (n.options) n.options.forEach(o => render(o.next));
    if (n.branches) Object.values(n.branches).forEach(v => render(v));
  };

  render(root.id);
  // Render any orphaned nodes
  nodes.forEach(n => render(n.id));

  return chunks.join('');
}

function InkExportModal({ store, onClose }) {
  const scene = store.scenes.find(s => s.id === store.activeScene);
  const ink = useMemo(() => scene ? exportToInk(scene) : '// No active scene', [store.activeScene, scene]);

  const download = () => {
    const blob = new Blob([ink], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${scene?.id || 'scene'}.ink`;
    a.click();
  };

  return (
    <div className="ink-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="ink-modal">
        <div className="ink-modal-header">
          <h3>EXPORT — {scene?.name || 'Scene'}.ink</h3>
          <button className="topbar-btn" onClick={download}>⬇ Download .ink</button>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <pre className="ink-modal-pre">{ink}</pre>
      </div>
    </div>
  );
}

function VarsInkModal({ store, onClose }) {
  const ink = useMemo(() => {
    const vars = store.variables;
    const groups = {
      core: ['calm','consciousness','face_worn','face_stable'],
      attitudes: ['att_reticence','att_anger','att_curiosity','att_joy','att_greed'],
      branches: ['branch_shed','branch_run','branch_go'],
      world: [],
    };
    const known = new Set([...groups.core, ...groups.attitudes, ...groups.branches]);
    Object.keys(vars).forEach(k => { if (!known.has(k)) groups.world.push(k); });

    const fmt = (k, v) => {
      const vv = vars[k];
      if (!vv) return null;
      const init = vv.initial !== undefined ? vv.initial : vv.value !== undefined ? vv.value : false;
      const val = typeof init === 'boolean' ? (init ? 'true' : 'false') : init;
      const comment = vv.range ? `// ${vv.range[0]}-${vv.range[1]}` : '';
      return `VAR ${k} = ${val}${comment ? '  ' + comment : ''}`;
    };

    let out = `// ═══════════════════════════════════════════════════════════════
// BOO HAG — MASTER VARIABLE REGISTRY
// INCLUDE this file at the top of every scene .ink file.
// NEVER reset variables between scenes — state carries forward.
// Generated: ${new Date().toISOString().slice(0,10)}
// ═══════════════════════════════════════════════════════════════

// ── CORE STATE ────────────────────────────────────────────────
`;
    groups.core.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    out += `\n// ── ATTITUDES ─────────────────────────────────────────────────\n`;
    groups.attitudes.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    out += `\n// ── BRANCH FLAGS ──────────────────────────────────────────────\n`;
    groups.branches.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    if (groups.world.length) {
      out += `\n// ── WORLD / CUSTOM ────────────────────────────────────────────\n`;
      groups.world.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    }
    return out;
  }, [store.variables]);

  const download = () => {
    const blob = new Blob([ink], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'variables.ink';
    a.click();
  };

  return (
    <div className="ink-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="ink-modal">
        <div className="ink-modal-header">
          <h3>EXPORT — variables.ink</h3>
          <button className="topbar-btn" onClick={download}>⬇ Download variables.ink</button>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <pre className="ink-modal-pre">{ink}</pre>
      </div>
    </div>
  );
}

// ── PLAY VIEW ─────────────────────────────────────────────────────────
const CONSCIOUSNESS_LABELS = ['FERAL', 'WAKING', 'CLEAR', 'GRIOTTE'];

function PlayView({ store, onStoreChange }) {
  // playSceneId is independent of store.activeScene so scene transitions
  // during play don't reset vars (vars are local play state, not design state)
  const [playSceneId, setPlaySceneId] = useState(store.activeScene);
  const [currentId, setCurrentId] = useState(null);
  const [vars, setVars] = useState(() => {
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    return v;
  });
  const [path, setPath] = useState([]);
  const [flash, setFlash] = useState(null);
  const [showVars, setShowVars] = useState(true);
  const [flashedVar, setFlashedVar] = useState(null);
  const [showCheckpoints, setShowCheckpoints] = useState(false);
  const checkpointMenuRef = useRef(null);

  const scene = store.scenes.find(s => s.id === playSceneId) || store.scenes.find(s => s.id === store.activeScene);
  const nodes = scene?.nodes || [];

  // When user navigates to a different scene externally (not via SCENE_TRANSITION),
  // reset play state fully
  useEffect(() => {
    setPlaySceneId(store.activeScene);
    const sc = store.scenes.find(s => s.id === store.activeScene);
    setCurrentId(sc?.nodes?.[0]?.id || null);
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    setVars(v);
    setPath([]);
    setFlash(null);
  }, [store.activeScene]);

  // Set initial node once scene is known
  useEffect(() => {
    if (currentId === null && nodes.length > 0) {
      setCurrentId(nodes[0].id);
    }
  }, [nodes.length]);

  const node = nodes.find(n => n.id === currentId);

  const showFlash = (msg) => {
    setFlash(msg);
    setTimeout(() => setFlash(null), 2000);
  };

  const goto = useCallback((id, msg) => {
    if (msg) showFlash(msg);
    setPath(p => currentId ? [...p, currentId] : p);
    setCurrentId(id || null);
  }, [currentId]);

  const applyVar = (variable, operation, value) => {
    setVars(v => {
      const cur = typeof v[variable] === 'number' ? v[variable] : 0;
      const next = { ...v };
      if (operation === 'set') next[variable] = value;
      else if (operation === 'add') next[variable] = cur + Number(value);
      else if (operation === 'subtract') next[variable] = cur - Number(value);
      return next;
    });
    setFlashedVar(variable);
    setTimeout(() => setFlashedVar(null), 1400);
  };

  // Auto-resolve non-interactive nodes
  useEffect(() => {
    if (!node) return;
    let timer;
    const delay = (fn, ms) => { timer = setTimeout(fn, ms); };

    if (node.type === 'SECTION_LABEL') {
      delay(() => goto(node.next, null), 1400);

    } else if (node.type === 'VAR_SET') {
      applyVar(node.variable, node.operation || 'set', node.value ?? 0);
      const op = node.operation === 'add' ? '+=' : node.operation === 'subtract' ? '-=' : '=';
      delay(() => goto(node.next, `${node.variable} ${op} ${node.value}`), 900);

    } else if (node.type === 'CONDITION') {
      const v = typeof vars[node.variable] === 'number' ? vars[node.variable] : (vars[node.variable] ? 1 : 0);
      const t = Number(node.threshold ?? 0);
      const op = node.operator || '>=';
      let result;
      if (op === '>=') result = v >= t;
      else if (op === '<=') result = v <= t;
      else if (op === '>') result = v > t;
      else if (op === '<') result = v < t;
      else if (op === '==' || op === '=') result = v == t;
      else result = Boolean(v);
      const branch = result ? node.true_next : node.false_next;
      delay(() => goto(branch, `${node.variable}=${v} ${op} ${t} → ${result ? 'TRUE' : 'FALSE'}`), 1200);

    } else if (node.type === 'ATTITUDE_BRANCH') {
      const active = ['reticence','anger','curiosity','joy','greed'].find(a => vars[`att_${a}`]);
      const branch = (active && node.branches?.[active]) || node.branches?.reticence || node.next;
      delay(() => goto(branch, `attitude: ${active || 'none'}`), 1200);

    } else if (node.type === 'CONSCIOUSNESS_GATE') {
      const tier = vars.consciousness ?? 0;
      const pass = tier >= (node.min_tier ?? 0);
      delay(() => goto(pass ? node.pass_next : node.fail_next,
        `consciousness ${CONSCIOUSNESS_LABELS[tier]} ${pass ? '≥' : '<'} tier ${node.min_tier} → ${pass ? 'PASS' : 'FAIL'}`
      ), 1200);

    } else if (node.type === 'ANCHOR_USE') {
      applyVar('calm', 'add', node.calm_gain ?? 5);
      delay(() => goto(node.next, `anchor — calm +${node.calm_gain ?? 5}`), 700);
    }

    return () => clearTimeout(timer);
  }, [currentId]);

  const back = () => {
    if (!path.length) return;
    setCurrentId(path[path.length - 1]);
    setPath(p => p.slice(0, -1));
    setFlash(null);
  };

  const reset = () => {
    setPlaySceneId(store.activeScene);
    const sc = store.scenes.find(s => s.id === store.activeScene);
    setCurrentId(sc?.nodes?.[0]?.id || null);
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    setVars(v);
    setPath([]);
    setFlash(null);
  };

  // Close checkpoint dropdown on outside click
  useEffect(() => {
    if (!showCheckpoints) return;
    const handler = (e) => { if (!checkpointMenuRef.current?.contains(e.target)) setShowCheckpoints(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showCheckpoints]);

  const saveCheckpoint = () => {
    const defaultLabel = `${scene.name} @ ${currentId || 'start'}`;
    const label = prompt('Checkpoint label:', defaultLabel);
    if (label === null) return;
    const next = JSON.parse(JSON.stringify(store));
    if (!next.checkpoints) next.checkpoints = [];
    next.checkpoints.push({
      id: `cp_${Date.now()}`,
      label: label.trim() || defaultLabel,
      sceneId: playSceneId,
      currentId,
      vars: { ...vars },
      path: [...path],
      timestamp: Date.now(),
    });
    onStoreChange(next, `Checkpoint saved: ${label.trim() || defaultLabel}`);
    showFlash('Checkpoint saved');
  };

  const loadCheckpoint = (cp) => {
    setPlaySceneId(cp.sceneId);
    setCurrentId(cp.currentId);
    setVars(cp.vars);
    setPath(cp.path || []);
    setFlash(null);
    setShowCheckpoints(false);
    showFlash(`Loaded: ${cp.label}`);
  };

  const deleteCheckpoint = (id, e) => {
    e.stopPropagation();
    const next = JSON.parse(JSON.stringify(store));
    next.checkpoints = (next.checkpoints || []).filter(c => c.id !== id);
    onStoreChange(next, null);
  };

  const exportPlaythrough = () => {
    const fullPath = [...path, currentId].filter(Boolean);
    const lines = fullPath.map((id, i) => {
      const n = nodes.find(x => x.id === id);
      if (!n) return `${i + 1}. [missing node: ${id}]`;
      const preview = (n.text || nodePreview(n) || n.type || '').replace(/\s+/g, ' ').slice(0, 90);
      return `${i + 1}. [${n.type}] ${id}${preview ? ' — ' + preview : ''}`;
    });
    const finalVars = Object.entries(vars).map(([k, v]) => `${k}=${v}`).join('\n');
    const content = `PLAYTHROUGH LOG — ${scene.name}\nGenerated: ${new Date().toISOString()}\n\n${lines.join('\n')}\n\n── FINAL VARIABLES ──\n${finalVars}\n`;
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `playthrough_${scene.id}_${Date.now()}.txt`;
    a.click();
  };

  const checkpoints = store.checkpoints || [];

  // No scene
  if (!scene) {
    return (
      <div className="play-layout">
        <div className="play-empty">Select a scene in the STORY tab.</div>
      </div>
    );
  }

  const col = node ? (NODE_COLORS[node.type] || NODE_COLORS.NARRATION) : NODE_COLORS.NARRATION;
  const isAutoNode = node && ['SECTION_LABEL','VAR_SET','CONDITION','ATTITUDE_BRANCH','CONSCIOUSNESS_GATE','ANCHOR_USE'].includes(node.type);

  return (
    <div className="play-layout">
      <div className="play-ctrl-bar">
        <span className="play-scene-title">{scene.name}</span>
        {path.length > 0 && <span style={{color:'var(--text-dim)',fontSize:'10px'}}>node {path.length + 1}</span>}
        <button className="play-ctrl-btn" onClick={back} disabled={!path.length}>◀ Back</button>
        <button className="play-ctrl-btn" onClick={reset}>↺ Reset</button>
        <button className="play-ctrl-btn" onClick={saveCheckpoint} title="Save current playthrough position — reloadable">📍 Checkpoint</button>
        <div style={{position:'relative'}} ref={checkpointMenuRef}>
          <button className="play-ctrl-btn" onClick={() => setShowCheckpoints(v => !v)}
            title="Load a saved checkpoint">📂 Load ({checkpoints.length})</button>
          {showCheckpoints && (
            <div style={{
              position:'absolute', top:'100%', left:0, marginTop:4, zIndex:30, minWidth:220, maxWidth:320,
              background:'var(--surface)', border:'1px solid var(--border)', borderRadius:6,
              boxShadow:'0 8px 24px rgba(0,0,0,0.5)', padding:'4px 0', maxHeight:280, overflowY:'auto',
            }}>
              {checkpoints.length === 0 && (
                <div style={{padding:'8px 12px',color:'var(--text-dim)',fontSize:'10px'}}>No checkpoints saved yet.</div>
              )}
              {[...checkpoints].reverse().map(cp => {
                const cpScene = store.scenes.find(s => s.id === cp.sceneId);
                return (
                  <div key={cp.id} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',cursor:'pointer'}}
                    onClick={() => loadCheckpoint(cp)}>
                    <div style={{flex:1,overflow:'hidden'}}>
                      <div style={{color:'var(--bone-dim)',fontSize:'11px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cp.label}</div>
                      <div style={{color:'var(--text-dim)',fontSize:'9px'}}>{cpScene?.name || cp.sceneId} · {new Date(cp.timestamp).toLocaleString()}</div>
                    </div>
                    <button onClick={e => deleteCheckpoint(cp.id, e)}
                      style={{background:'none',border:'none',color:'var(--text-dim)',fontSize:'12px',cursor:'pointer',padding:'0 2px',flexShrink:0}}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <button className="play-ctrl-btn" onClick={exportPlaythrough} title="Download the path taken as a test log">⬇ Export Log</button>
        <button className={`play-ctrl-btn${showVars ? ' active' : ''}`}
          style={{marginLeft:'auto'}} onClick={() => setShowVars(v => !v)}>
          Variables
        </button>
      </div>

      <div className="play-body">
        <div className="play-stage">
          {flash && <div className="play-flash">{flash}</div>}

          {node?.media && (
            <div className="play-media">
              {node.media.startsWith('data:video') ? (
                <video src={node.media} className="play-media-el" autoPlay muted loop />
              ) : (
                <img src={node.media} className="play-media-el" alt="" />
              )}
            </div>
          )}

          {node ? (
            <>
              <div className="play-node-type" style={{color:col.text,borderColor:col.border}}>
                {node.type}
              </div>

              {node.text && node.type !== 'SECTION_LABEL' && (
                <div className="play-node-text">{node.text}</div>
              )}

              {node.type === 'SECTION_LABEL' && (
                <div className="play-section-label">
                  {node.label || node.text || 'Section'}
