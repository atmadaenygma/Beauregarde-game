    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc) return;
    if (!sc.notes) sc.notes = [];
    sc.notes.push({ id: `note_${Date.now()}`, text: '', x: wx - 92, y: wy - 20 });
    onStoreChange(next, 'Added sticky note');
    setCtxMenu(null);
  }, [store, onStoreChange]);

  const updateNote = useCallback((id, text) => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    const note = (sc?.notes || []).find(n => n.id === id);
    if (!note) return;
    note.text = text;
    onStoreChange(next, null);
  }, [store, onStoreChange]);

  const deleteNote = useCallback((id) => {
    const next = JSON.parse(JSON.stringify(store));
    const sc = next.scenes.find(s => s.id === next.activeScene);
    if (!sc?.notes) return;
    sc.notes = sc.notes.filter(n => n.id !== id);
    onStoreChange(next, 'Deleted sticky note');
  }, [store, onStoreChange]);

  const startDragNode = useCallback((e, id) => {
    e.stopPropagation();
    const pos = getPos(id);
    setDraggingNode({ id, startX: pos.x, startY: pos.y, startMX: e.clientX, startMY: e.clientY });
  }, [getPos]);

  const startResizeNode = useCallback((e, id) => {
    e.stopPropagation();
    e.preventDefault();
    const size = getSize(id);
    setResizingNode({ id, startW: size.w, startH: size.h, startMX: e.clientX, startMY: e.clientY });
  }, [getSize]);

  // Wire paths in world space — rounded elbow connectors like the reference
  // flow maps. Edges leave the source's right edge and enter the target's
  // left edge; backward edges (loops) fall back to a smooth return arc.
  const wires = useMemo(() => {
    const paths = [];
    const R = 8; // corner radius
    nodes.forEach(node => {
      if (hiddenIds.has(node.id) || collapsed.has(node.id)) return;
      const from = getPos(node.id);
      const fs = getVis(node.id);
      const fx = from.x + fs.w;
      const fy = from.y + fs.h / 2;
      const col = SPEAKERS[speakerOf(node)].border;
      let outIdx = 0;

      const addWire = (toId, label) => {
        if (!toId || toId === 'END') return;
        if (hiddenIds.has(toId)) return;
        const toNode = nodes.find(n => n.id === toId);
        if (!toNode) return;
        const to = getPos(toId);
        const ts = getVis(toId);
        const tx = to.x;
        const ty = to.y + ts.h / 2;
        let d, lx, ly, dash = false;
        if (tx - fx >= R * 2 + 12) {
          // Forward elbow — horizontal, rounded turn, vertical, rounded turn,
          // horizontal into the target. Fan siblings apart at the bend.
          const mx = fx + Math.max(16, (tx - fx) / 2) + outIdx * 9;
          if (Math.abs(ty - fy) < 3) {
            d = `M${fx},${fy} L${tx},${ty}`;
            lx = (fx + tx) / 2; ly = fy - 6;
          } else {
            const s = ty > fy ? 1 : -1;
            d = `M${fx},${fy} L${mx - R},${fy} Q${mx},${fy} ${mx},${fy + R * s} L${mx},${ty - R * s} Q${mx},${ty} ${mx + R},${ty} L${tx},${ty}`;
            lx = mx; ly = (fy + ty) / 2;
          }
        } else {
          // Backward / same-column edge — dashed return arc (hub loop-backs)
          d = `M${fx},${fy} C${fx + 80},${fy} ${tx - 80},${ty} ${tx},${ty}`;
          lx = (fx + tx) / 2; ly = Math.min(fy, ty) - 10;
          dash = true;
        }
        outIdx++;
        paths.push({ d, col, key: `${node.id}→${toId}${label ? '-'+label : ''}`, label, lx, ly, dash });
      };

      if (node.options) {
        node.options.forEach(o => addWire(o.next, o.label));
        if (node.type === 'HUB') addWire(node.next, 'when exhausted');
      } else {
        addWire(node.next, null);
        addWire(node.true_next, 'TRUE');
        addWire(node.false_next, 'FALSE');
        addWire(node.pass_next, 'PASS');
        addWire(node.fail_next, node.type === 'CHECK' ? 'FAIL ✗' : 'FAIL');
        addWire(node.success_next, 'PASS ✓');
        if (node.branches) Object.entries(node.branches).forEach(([k,v]) => addWire(v, k));
      }
    });
    return paths;
  }, [nodes, manualPos, autoPos, getPos, getVis, hiddenIds, collapsed]);

  return (
    <div className="tree-layout">
      {/* Horizontal controls bar */}
      <div className="tree-controls">
        <button className="tree-ctrl-btn" onClick={() => setZoom(z => Math.min(3, z * 1.2))}>+</button>
        <button className="tree-ctrl-btn" onClick={() => setZoom(z => Math.max(0.1, z * 0.85))}>−</button>
        <button className="tree-ctrl-btn" onClick={centerCanvas} title="Reset view">↺</button>
        <button className="tree-ctrl-btn" onClick={fitAll} title="Fit all nodes in view">⊡</button>
        <button className="tree-ctrl-btn" onClick={() => { setManualPos({}); setManualSize({}); }} title="Auto-layout (clear manual positions and sizes)">⊞</button>
        <span style={{color:'var(--text-dim)',fontSize:'10px',minWidth:36,letterSpacing:'0.02em'}}>{Math.round(zoom*100)}%</span>
        <input
          type="text" placeholder="find node…" value={search}
          onChange={e => {
            const q = e.target.value;
            setSearch(q);
            if (!q) return;
            const hit = nodes.find(n =>
              !hiddenIds.has(n.id) && (
                n.id.toLowerCase().includes(q.toLowerCase()) ||
                (n.text || '').toLowerCase().includes(q.toLowerCase())
              )
            );
            if (hit) {
              const pos = getPos(hit.id);
              const rect = wrapRef.current?.getBoundingClientRect();
              if (rect) {
                setOffset({ x: rect.width/2 - pos.x * zoom, y: rect.height/2 - pos.y * zoom - 40 });
              }
              setSelected(hit.id);
            }
          }}
          style={{
            background:'var(--surface2)', border:'1px solid var(--border)', color:'var(--text)',
            fontFamily:'inherit', fontSize:'10px', padding:'3px 8px', borderRadius:4,
            outline:'none', width:120,
          }}
        />
        <div className="font-slider-wrap" style={{marginLeft:'auto'}}>
          <span style={{color:'var(--text-dim)',fontSize:'9px'}}>Aa</span>
          <input type="range" className="font-slider" min={8} max={16} step={1}
            value={fontSize} onChange={e => setFontSize(Number(e.target.value))} />
          <span style={{color:'var(--text-dim)',fontSize:'12px'}}>Aa</span>
        </div>
        <span style={{color:'var(--text-dim)',fontSize:'9px',marginLeft:8,opacity:0.6}}
          title="Del=delete · Ctrl+D=duplicate · Esc=deselect · drag ●=connect · ⊡=fit all · ⊞=auto-layout">?</span>
      </div>

      {/* Squigglevision filters — hand-tremor line displacement for node
          borders (Dr. Katz style). Several variants with different timing
          so nodes don't all jitter in perfect lockstep. */}
      <svg width="0" height="0" style={{position:'absolute'}}>
        <defs>
          {[0,1,2].map(i => (
            <filter key={i} id={`squiggle-filter-${i}`} x="-40%" y="-40%" width="180%" height="180%">
              <feTurbulence type="fractalNoise" numOctaves="2" seed={i * 7 + 3} result="noise">
                <animate attributeName="baseFrequency"
                  dur={`${0.8 + i * 0.25}s`}
                  values="0.06;0.1;0.07;0.12;0.08;0.06"
                  calcMode="discrete" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          ))}
        </defs>
      </svg>

      <div
        className={`tree-canvas-wrap${panning ? ' panning' : ''}${drawingWire ? ' wiring' : ''}`}
        ref={wrapRef}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onContextMenu={onContextMenu}
      >
        {/* Info overlay */}
        <div style={{position:'absolute',top:8,left:12,color:'var(--text-dim)',fontSize:'10px',pointerEvents:'none',zIndex:2,letterSpacing:'0.04em'}}>
          {scene?.name || 'No scene'} · {nodes.length} nodes
        </div>

        {/* Transformed world canvas */}
        <div
          className="tree-canvas-inner"
          style={{ transform: `translate(${offset.x}px,${offset.y}px) scale(${zoom})`, transformOrigin: '0 0' }}
        >
          {/* Section frames — behind everything */}
          {frames.map(f => (
            <div key={f.id} className="tree-frame" style={{left: f.x, top: f.y, width: f.w, height: f.h}}>
              <div className="tree-frame-label">{f.label}</div>
            </div>
          ))}
          {/* SVG wires — overflow:visible so beziers draw past the 1×1 box */}
          <svg style={{position:'absolute',left:0,top:0,width:1,height:1,overflow:'visible',pointerEvents:'none'}}>
            <defs>
              <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#4a4438" opacity="0.8" />
              </marker>
            </defs>
            {wires.map(w => (
              <g key={w.key}>
                <path d={w.d} fill="none" stroke={w.col} strokeWidth="1.5" opacity="0.6"
                  strokeDasharray={w.dash ? '5 4' : undefined}
                  markerEnd="url(#arrowhead)" />
                {w.label && (
                  <text x={w.lx} y={w.ly} fontSize="9" fill={w.col} textAnchor="middle" opacity="0.9"
                    style={{paintOrder:'stroke',stroke:'#efe7d2',strokeWidth:'3px',strokeLinejoin:'round'}}>
                    {w.label.length > 22 ? w.label.slice(0,22)+'…' : w.label}
                  </text>
                )}
              </g>
            ))}

            {/* In-progress wire while dragging from connector dot */}
            {drawingWire && (() => {
              const fp = getPos(drawingWire.fromId);
              const fs = getVis(drawingWire.fromId);
              return (
                <line
                  x1={fp.x + fs.w + 7} y1={fp.y + fs.h / 2}
                  x2={drawingWire.curX}   y2={drawingWire.curY}
                  stroke="#c8880a" strokeWidth="2" strokeDasharray="6 4" opacity="0.85"
                  markerEnd="url(#arrowhead)"
                />
              );
            })()}

            {/* Short leads into END terminals */}
            {endMarkers.map(m => (
              <line key={`end-${m.id}`}
                x1={m.lineX} y1={m.lineY} x2={m.x} y2={m.lineY}
                stroke="#1a1512" strokeWidth="1.5" opacity="0.55" />
            ))}
          </svg>

          {/* END terminal pills */}
          {endMarkers.map(m => (
            <div key={`endpill-${m.id}`} className="tree-end-pill" style={{left: m.x, top: m.y}}>END</div>
          ))}

          {/* Sticky notes — free-floating design annotations */}
          {sceneNotes.map(note => {
            const dragging = noteDrag?.id === note.id;
            const nx = dragging ? noteDrag.startX + (noteDrag.dx || 0) : note.x;
            const ny = dragging ? noteDrag.startY + (noteDrag.dy || 0) : note.y;
            const tilt = ((hashStr(note.id) % 5) - 2) * 0.6; // −1.2°…1.2°
            return (
              <div key={note.id} className={`tree-note${dragging ? ' dragging' : ''}`}
                style={{left: nx, top: ny, transform: `rotate(${tilt}deg)`}}
                onMouseDown={e => {
                  if (e.target.closest('textarea') || e.target.closest('button')) return;
                  e.stopPropagation();
                  setNoteDrag({ id: note.id, startX: note.x, startY: note.y, startMX: e.clientX, startMY: e.clientY, dx: 0, dy: 0 });
                }}>
                <div className="tree-note-head">
                  <span className="tree-note-title">NOTE</span>
                  <button className="tree-note-del" onClick={() => deleteNote(note.id)} title="Delete note">✕</button>
                </div>
                <textarea className="tree-note-textarea" value={note.text}
                  placeholder="design note…"
                  onChange={e => updateNote(note.id, e.target.value)}
                  onMouseDown={e => e.stopPropagation()} />
              </div>
            );
          })}

          {/* Nodes — compact speaker-colored pills; selected node expands
              into the full card (media, body, options, resize) */}
          {nodes.length === 0 ? (
            <div style={{position:'absolute',width:360,left:20,top:-34,textAlign:'left'}}>
              <div style={{color:'var(--amber)',fontSize:'12px',letterSpacing:'0.1em',marginBottom:8}}>NO NODES YET</div>
              <div style={{color:'var(--text-dim)',fontSize:'11px'}}>Ask Claude in CHAT, or right-click here to add a node manually.</div>
            </div>
          ) : (() => {
            const nodeIdSet = new Set(nodes.map(n => n.id));
            const isBroken = (id) => id && id !== 'END' && !nodeIdSet.has(id);
            return nodes.map((node, seqIdx) => {
            if (hiddenIds.has(node.id)) return null;
            const pos = getPos(node.id);
            const vis = getVis(node.id);
            const spk = SPEAKERS[speakerOf(node)];
            const isSelected = selected === node.id;
            const isCollapsed = collapsed.has(node.id);
            const isBeingMoved = (draggingNode && draggingNode.id === node.id) || (resizingNode && resizingNode.id === node.id);
            const targets = [node.next, node.true_next, node.false_next, node.pass_next, node.fail_next, node.success_next,
              ...(node.options || []).map(o => o.next),
              ...Object.values(node.branches || {})].filter(Boolean);
            const hasBrokenLink = targets.some(isBroken);
            const h = hashStr(node.id);
            const squiggleFilter = isBeingMoved ? 'none' : `url(#squiggle-filter-${h % 3})`;
            const isRedCheck = node.type === 'CHECK' && node.check_kind === 'red';
            return (
              <div
                key={node.id}
                className={`tree-node${isSelected ? ' selected' : ' pill'}`}
                title={isSelected ? undefined : `${node.type} · ${spk.label} · double-click: collapse/expand subtree`}
                style={{
                  left: pos.x,
                  top:  pos.y,
                  width: vis.w,
                  height: vis.h,
                  borderColor: isSelected ? 'var(--amber)' : (isRedCheck ? '#8a1a10' : spk.border),
                  background: isSelected ? '#fdf8ec' : spk.fill,
                  zIndex: isSelected ? 6 : undefined,
                  '--squiggle-filter': squiggleFilter,
                }}
                onClick={() => setSelected(isSelected ? null : node.id)}
                onDoubleClick={e => { e.stopPropagation(); toggleCollapse(node.id); }}
                onMouseDown={e => {
                  if (!e.target.closest('.tree-node-ask') && !e.target.closest('button'))
                    startDragNode(e, node.id);
                }}
              >
                <div className="tree-node-seq" style={{borderColor: spk.border, color: spk.border}}>{seqIdx + 1}</div>

                {/* Connector dot — drag to another node to set next */}
                <div
                  className="node-conn-out"
                  onMouseDown={e => {
                    e.stopPropagation();
                    e.preventDefault();
                    const pos = getPos(node.id);
                    const sz = getVis(node.id);
                    setDrawingWire({ fromId: node.id, curX: pos.x + sz.w, curY: pos.y + sz.h / 2 });
                  }}
                  title="Drag to connect → next node"
                />

                {!isSelected ? (
                  <div className="tree-pill-label" style={{color: spk.text}}>
                    {node.media && <span className="tree-pill-media">▣</span>}
                    {pillLabelOf(node) || <em style={{opacity:0.6}}>empty</em>}
                    {questLinkedIds.has(node.id) && <span style={{marginLeft:5,opacity:0.9}} title="Linked to a quest objective">◆</span>}
                    {isCollapsed && <span style={{marginLeft:6,fontWeight:'bold',opacity:0.85}} title="Subtree collapsed">▸{collapsedCountOf(node.id)}</span>}
                    {hasBrokenLink && <span style={{color:'#c0392b',marginLeft:5}}>⚠</span>}
                  </div>
                ) : (
                  <>
                  <div className="tree-node-inner">
                    <div className="tree-node-header" style={{background: hexToRgba(spk.border, 0.12), borderBottom: `1px solid ${hexToRgba(spk.border, 0.3)}`}}>
                      <span className="tree-node-type" style={{color: spk.border}}>{node.type}</span>
                      <span style={{fontSize:'8px',color:spk.border,opacity:0.65,letterSpacing:'0.06em'}}>{spk.label}</span>
                      {hasBrokenLink && (
                        <span title="Points to a node that doesn't exist"
                          style={{color:'#c0392b',fontSize:'10px',marginLeft:4,lineHeight:1}}>⚠</span>
                      )}
                      <button className="tree-node-ask"
                        onClick={e => { e.stopPropagation(); onNodeContext && onNodeContext(node); }}>
                        Ask Claude
                      </button>
                    </div>

                    {/* Media zone — click opens edit panel to upload */}
                    <div className="tree-node-media-zone"
                      style={node.media ? {border:'none',padding:0,height:48,margin:'0 10px 8px'} : {}}
                      onClick={e => { e.stopPropagation(); setSelected(node.id); }}>
                      {node.media ? (
                        node.media.startsWith('data:video') ? (
                          <video src={node.media} style={{width:'100%',height:'100%',objectFit:'cover'}} muted loop />
                        ) : (
                          <img src={node.media} style={{width:'100%',height:'100%',objectFit:'cover'}} alt="" />
                        )
                      ) : '+ media'}
                    </div>

                    <div className="tree-node-body" style={{fontSize:`${fontSize}px`}}>
                      {(() => {
                        const preview = nodePreview(node);
                        return preview
                          ? preview
                          : <em style={{color:'var(--text-dim)'}}>no content</em>;
                      })()}
                    </div>

                    {node.options && node.options.length > 0 && (
                      <div className="tree-node-footer">
                        {node.options.slice(0,3).map((o,i) => (
                          <span key={i} className="tree-node-option">{o.label}</span>
                        ))}
                        {node.options.length > 3 && (
                          <span className="tree-node-option">+{node.options.length-3} more</span>
                        )}
                      </div>
                    )}
                  </div>

                  {/* Resize handle — drag to change card size */}
                  <div className="tree-node-resize-handle"
                    onMouseDown={e => startResizeNode(e, node.id)}
                    title="Drag to resize" />
                  </>
                )}
              </div>
            );
          });
          })()}
        </div>

        {/* Minimap — overview of all nodes */}
        {nodes.length > 1 && (() => {
          const MM_W = 140, MM_H = 100;
          const pads = 8;
          const boxes = nodes.map(n => ({ p: getPos(n.id), s: getVis(n.id) }));
          const xs = boxes.map(b => b.p.x);
          const ys = boxes.map(b => b.p.y);
          const minX = Math.min(...xs), maxX = Math.max(...boxes.map(b => b.p.x + b.s.w));
          const minY = Math.min(...ys), maxY = Math.max(...boxes.map(b => b.p.y + b.s.h));
          const worldW = maxX - minX || 1, worldH = maxY - minY || 1;
          const scaleX = (MM_W - pads*2) / worldW;
          const scaleY = (MM_H - pads*2) / worldH;
          const sc = Math.min(scaleX, scaleY);
          const ox = pads + ((MM_W - pads*2) - worldW * sc) / 2 - minX * sc;
          const oy = pads + ((MM_H - pads*2) - worldH * sc) / 2 - minY * sc;
          const ww = wrapRef.current?.clientWidth || 800;
          const wh = wrapRef.current?.clientHeight || 600;
          const vpX = (-offset.x / zoom) * sc + ox;
          const vpY = (-offset.y / zoom) * sc + oy;
          const vpW = (ww / zoom) * sc;
          const vpH = (wh / zoom) * sc;
          return (
            <div style={{
              position:'absolute', bottom:8, right:8, width:MM_W, height:MM_H, zIndex:20,
              background:'rgba(247,241,224,0.94)', border:'1px solid var(--border)',
              borderRadius:4, overflow:'hidden', pointerEvents:'none',
            }}>
              <svg width={MM_W} height={MM_H}>
                {nodes.map(n => {
                  if (hiddenIds.has(n.id)) return null;
                  const p = getPos(n.id);
                  const s = getVis(n.id);
                  const spk = SPEAKERS[speakerOf(n)];
                  return <rect key={n.id}
                    x={p.x * sc + ox} y={p.y * sc + oy} rx={2}
                    width={Math.max(2, s.w * sc)} height={Math.max(1.5, s.h * sc)}
                    fill={spk.fill} stroke={n.id === selected ? '#c8880a' : spk.border} strokeWidth="0.5" />;
                })}
                <rect x={vpX} y={vpY} width={vpW} height={vpH}
                  fill="none" stroke="rgba(200,136,10,0.4)" strokeWidth="1" />
              </svg>
            </div>
          );
        })()}

        {/* Speaker legend */}
        {nodes.length > 0 && (
          <div className="tree-legend">
            {Object.entries(SPEAKERS).map(([k, s]) => (
              <div key={k} className="tree-legend-row">
                <span className="tree-legend-dot" style={{background: s.fill, borderColor: s.border}} />
                {s.label}
              </div>
            ))}
          </div>
        )}

        {/* Right-click context menu */}
        {ctxMenu && (
          <div className="tree-ctx-menu" style={{left: ctxMenu.px, top: ctxMenu.py}}
            onMouseDown={e => e.stopPropagation()}>
            <div style={{padding:'3px 12px 5px',color:'var(--text-dim)',fontSize:'9px',letterSpacing:'0.1em',borderBottom:'1px solid var(--border)'}}>
              ADD NODE
            </div>
            {['NARRATION','CHOICE','HUB','CHECK','CONDITION','VAR_SET','SECTION_LABEL','SCENE_TRANSITION','ANCHOR_USE'].map(t => (
              <div key={t} className="tree-ctx-item" onClick={() => addNodeAt(t, ctxMenu.wx, ctxMenu.wy)}>
                <span className="tree-ctx-dot" style={{background: SPEAKERS[speakerOf({ type: t })].fill, border: `1px solid ${SPEAKERS[speakerOf({ type: t })].border}`}} />
                {t}
              </div>
            ))}
            <div className="tree-ctx-item" style={{borderTop:'1px solid var(--border)',marginTop:3,paddingTop:7}}
              onClick={() => addNoteAt(ctxMenu.wx, ctxMenu.wy)}>
              <span className="tree-ctx-dot" style={{background:'#fbf3cf',border:'1px solid #b8935a'}} />
              STICKY NOTE
            </div>
          </div>
        )}
      </div>

      {selected && nodes.find(n => n.id === selected) && (
        <EditPanel
          key={selected}
          node={nodes.find(n => n.id === selected)}
          store={store}
          onStoreChange={onStoreChange}
          onClose={() => setSelected(null)}
          onAskClaude={node => { onNodeContext && onNodeContext(node); setSelected(null); }}
          onJumpToNode={onJumpToNode}
        />
      )}
    </div>
  );
}

// ── STORY VIEW ────────────────────────────────────────────────────────
function StoryView({ store, onStoreChange, onSwitchTab }) {
  const lanes = ['shared', 'shed', 'run', 'go'];
  const laneLabels = { shared: '── SHARED ──', shed: '── SHED ──', run: '── RUN ──', go: '── GO ──' };

  const canvasRef = useRef(null);
  const cardRefs = useRef({});
  const [cardRects, setCardRects] = useState({});
  const [canvasSize, setCanvasSize] = useState({ w: 0, h: 0 });

  const measure = useCallback(() => {
    if (!canvasRef.current) return;
    const rects = {};
    Object.entries(cardRefs.current).forEach(([id, el]) => {
      if (!el) return;
      rects[id] = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    });
    setCardRects(rects);
    setCanvasSize({ w: canvasRef.current.scrollWidth, h: canvasRef.current.scrollHeight });
  }, []);

  useEffect(() => {
    measure();
    const t = setTimeout(measure, 60); // catch late layout from thumbnail images loading
    return () => clearTimeout(t);
  }, [store.scenes, measure]);

  useEffect(() => {
    if (!canvasRef.current) return;
    const ro = new ResizeObserver(measure);
    ro.observe(canvasRef.current);
    return () => ro.disconnect();
  }, [measure]);

  // Scene-to-scene edges derived from SCENE_TRANSITION nodes
  const edges = useMemo(() => {
    const seen = new Set();
    const list = [];
    store.scenes.forEach(sc => {
      (sc.nodes || []).forEach(n => {
        if (n.type === 'SCENE_TRANSITION' && n.target_scene && n.target_scene !== sc.id
            && store.scenes.some(s => s.id === n.target_scene)) {
          const key = `${sc.id}->${n.target_scene}`;
          if (!seen.has(key)) { seen.add(key); list.push({ from: sc.id, to: n.target_scene }); }
        }
      });
    });
    return list;
  }, [store.scenes]);

  const addScene = (branch) => {
    const name = prompt(`Scene name for ${branch} branch:`);
    if (!name) return;
    const base = name.toLowerCase().replace(/[^a-z0-9_]/g, '_');
    const existingIds = new Set(store.scenes.map(s => s.id));
    let id = base, n = 2;
    while (existingIds.has(id)) { id = `${base}_${n}`; n++; }
    const next = JSON.parse(JSON.stringify(store));
    next.scenes.push({ id, name, branch, type: 'playable', status: 'draft', locationId: null, nodes: [], wires: [] });
    onStoreChange(next, `Added scene: ${name}`);
  };

  return (
    <div className="story-layout">
      <div className="story-canvas" ref={canvasRef}>
        <div style={{color:'var(--text-dim)',fontSize:'10px',marginBottom:16,letterSpacing:'0.06em'}}>
          STORY MAP · {store.scenes.length} scenes · Click a scene to open in TREE
        </div>

        {canvasSize.w > 0 && (
          <svg className="story-arrows-svg" width={canvasSize.w} height={canvasSize.h}>
            <defs>
              <marker id="story-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#c8880a" opacity="0.7" />
              </marker>
            </defs>
            {edges.map(({ from, to }) => {
              const f = cardRects[from], t = cardRects[to];
              if (!f || !t) return null;
              const fx = f.x + f.w, fy = f.y + f.h / 2;
              const tx = t.x, ty = t.y + t.h / 2;
              const curve = Math.max(30, Math.abs(tx - fx) / 2);
              const d = `M${fx},${fy} C${fx + curve},${fy} ${tx - curve},${ty} ${tx},${ty}`;
              return (
                <path key={`${from}->${to}`} d={d} fill="none" stroke="#c8880a" strokeWidth="1.5"
                  strokeDasharray="5 4" opacity="0.55" markerEnd="url(#story-arrowhead)" />
              );
            })}
          </svg>
        )}

        <div className="story-lanes">
          {lanes.map(lane => {
            const laneScenes = store.scenes.filter(s => s.branch === lane);
            return (
              <div key={lane} className="story-lane">
                <div className="story-lane-header">{laneLabels[lane]}</div>
                {laneScenes.map(s => {
                  const thumbNode = s.nodes.find(n => n.media);
                  return (
                    <div key={s.id} className="story-card"
                      ref={el => { cardRefs.current[s.id] = el; }}
                      onClick={() => { const next = JSON.parse(JSON.stringify(store)); next.activeScene = s.id; onStoreChange(next, null); onSwitchTab && onSwitchTab('TREE'); }}>
                      <button className="story-card-play" onClick={e => {
                        e.stopPropagation();
                        const next = JSON.parse(JSON.stringify(store));
                        next.activeScene = s.id;
                        onStoreChange(next, null);
                        onSwitchTab && onSwitchTab('PLAY');
                      }}>▶ Play</button>
                      {thumbNode && (
                        thumbNode.media.startsWith('data:video')
                          ? <video src={thumbNode.media} className="story-card-thumb" muted onLoadedData={measure} />
                          : <img src={thumbNode.media} className="story-card-thumb" alt="" onLoad={measure} />
                      )}
                      <div className="story-card-name">{s.name}</div>
                      <div className="story-card-badges">
                        <span className={`scene-badge badge-${s.branch}`}>{s.branch}</span>
                        <span className={`scene-badge badge-${s.type}`}>{s.type}</span>
                        <span className={`scene-badge badge-${s.status}`}>{s.status}</span>
                        {(() => {
                          const loc = (store.locations || []).find(l => l.id === s.locationId);
                          return loc ? <span className="scene-badge badge-loc" title={loc.description || loc.name}>⌖ {loc.name}</span> : null;
                        })()}
                      </div>
                      <div className="story-card-stats">
                        {s.nodes.length} nodes · {s.nodes.filter(n=>n.media).length} media
                      </div>
                    </div>
                  );
                })}
                <button className="story-add-btn" onClick={() => addScene(lane)}>+ New Scene</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── INK EXPORT ────────────────────────────────────────────────────────
function exportToInk(scene) {
  const nodes = scene.nodes;
  if (!nodes.length) return '// No nodes in this scene.\n';
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // Find root node (zero in-degree)
  const inDeg = {};
  nodes.forEach(n => { inDeg[n.id] = 0; });
  nodes.forEach(n => getNextIds(n).forEach(id => { if (inDeg[id] !== undefined) inDeg[id]++; }));
  const root = nodes.find(n => inDeg[n.id] === 0) || nodes[0];

  const visited = new Set();
  const chunks = [];

  chunks.push(`// ═══════════════════════════════════════════════════════\n// ${scene.name}\n// ═══════════════════════════════════════════════════════\n`);
  chunks.push(`INCLUDE variables.ink\n\n-> ${root.id}\n\n`);

  const render = (id) => {
    if (!id || id === 'END' || visited.has(id) || !nodeMap[id]) return;
    visited.add(id);
    const n = nodeMap[id];
    let c = `=== ${id} ===\n`;

    switch (n.type) {
      case 'SECTION_LABEL':
        c += `// ── ${n.text || n.label || ''} ──\n-> ${n.next || 'END'}\n`;
        break;
      case 'NARRATION':
        c += `${n.text || ''}\n-> ${n.next || 'END'}\n`;
        break;
      case 'CHOICE':
        if (n.text) c += `${n.text}\n`;
        (n.options || []).forEach(o => {
          c += `+ [${o.label || 'Choice'}]\n`;
          if (o.sets) Object.entries(o.sets).forEach(([k,v]) => { c += `  ~ ${k} = ${JSON.stringify(v)}\n`; });
          c += `  -> ${o.next || 'END'}\n`;
        });
        break;
      case 'HUB':
        // Hub: * options are once-only in ink, + options are sticky.
        // Dead-ended branches divert back here; when exhausted -> n.next.
        if (n.text) c += `${n.text}\n`;
        (n.options || []).forEach(o => {
          c += `${o.once === false || o.exit ? '+' : '*'} [${o.label || 'Option'}]\n`;
          if (o.sets) Object.entries(o.sets).forEach(([k,v]) => { c += `  ~ ${k} = ${JSON.stringify(v)}\n`; });
          c += `  -> ${o.next || 'END'}\n`;
        });
        if (n.next && n.next !== 'END') c += `- -> ${n.next}  // when hub exhausted\n`;
        break;
      case 'CHECK': {
        // Disco-style skill check: variable + 2d6 vs difficulty.
        const kind = n.check_kind === 'red' ? 'red (one-shot)' : 'white (retryable)';
        c += `// CHECK ${kind}: ${n.variable} + 2d6 vs ${n.difficulty ?? 10}\n`;
        c += `{ ${n.variable} + RANDOM(2, 12) >= ${n.difficulty ?? 10}: -> ${n.success_next || 'END'} - else: -> ${n.fail_next || 'END'} }\n`;
        break;
      }
      case 'VAR_SET': {
        const op = n.operation === 'add' ? '+=' : n.operation === 'subtract' ? '-=' : '=';
        c += `~ ${n.variable} ${op} ${JSON.stringify(n.value ?? 0)}\n-> ${n.next || 'END'}\n`;
        break;
      }
      case 'CONDITION': {
        const op = n.operator || '>=';
        c += `{ ${n.variable} ${op} ${n.threshold}: -> ${n.true_next || 'END'} - else: -> ${n.false_next || 'END'} }\n`;
        break;
      }
      case 'ATTITUDE_BRANCH':
        ['reticence','anger','curiosity','joy','greed'].forEach(a => {
          const dest = n.branches?.[a];
          if (dest) c += `{ att_${a}: -> ${dest} }\n`;
        });
        if (n.next) c += `-> ${n.next}\n`;
        break;
      case 'CONSCIOUSNESS_GATE':
        c += `{ consciousness >= ${n.min_tier ?? 0}: -> ${n.pass_next || 'END'} - else: -> ${n.fail_next || 'END'} }\n`;
        break;
      case 'ANCHOR_USE':
        c += `~ calm += ${n.calm_gain ?? 5}\n-> ${n.next || 'END'}\n`;
        break;
      case 'SCENE_TRANSITION':
        c += `// → ${n.target_scene || n.text || 'next scene'}\n-> END\n`;
        break;
      default:
        c += n.text ? `${n.text}\n` : '';
        c += `-> ${n.next || 'END'}\n`;
    }

    chunks.push(c + '\n');

    // Recurse
    getNextIds(n).forEach(nid => render(nid));
    if (n.options) n.options.forEach(o => render(o.next));
    if (n.branches) Object.values(n.branches).forEach(v => render(v));
  };

  render(root.id);
  // Render any orphaned nodes
  nodes.forEach(n => render(n.id));

  return chunks.join('');
}

function InkExportModal({ store, onClose }) {
  const scene = store.scenes.find(s => s.id === store.activeScene);
  const ink = useMemo(() => scene ? exportToInk(scene) : '// No active scene', [store.activeScene, scene]);

  const download = () => {
    const blob = new Blob([ink], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${scene?.id || 'scene'}.ink`;
    a.click();
  };

  return (
    <div className="ink-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="ink-modal">
        <div className="ink-modal-header">
          <h3>EXPORT — {scene?.name || 'Scene'}.ink</h3>
          <button className="topbar-btn" onClick={download}>⬇ Download .ink</button>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <pre className="ink-modal-pre">{ink}</pre>
      </div>
    </div>
  );
}

function VarsInkModal({ store, onClose }) {
  const ink = useMemo(() => {
    const vars = store.variables;
    const groups = {
      core: ['calm','consciousness','face_worn','face_stable'],
      attitudes: ['att_reticence','att_anger','att_curiosity','att_joy','att_greed'],
      branches: ['branch_shed','branch_run','branch_go'],
      world: [],
    };
    const known = new Set([...groups.core, ...groups.attitudes, ...groups.branches]);
    Object.keys(vars).forEach(k => { if (!known.has(k)) groups.world.push(k); });

    const fmt = (k, v) => {
      const vv = vars[k];
      if (!vv) return null;
      const init = vv.initial !== undefined ? vv.initial : vv.value !== undefined ? vv.value : false;
      const val = typeof init === 'boolean' ? (init ? 'true' : 'false') : init;
      const comment = vv.range ? `// ${vv.range[0]}-${vv.range[1]}` : '';
      return `VAR ${k} = ${val}${comment ? '  ' + comment : ''}`;
    };

    let out = `// ═══════════════════════════════════════════════════════════════
// BOO HAG — MASTER VARIABLE REGISTRY
// INCLUDE this file at the top of every scene .ink file.
// NEVER reset variables between scenes — state carries forward.
// Generated: ${new Date().toISOString().slice(0,10)}
// ═══════════════════════════════════════════════════════════════

// ── CORE STATE ────────────────────────────────────────────────
`;
    groups.core.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    out += `\n// ── ATTITUDES ─────────────────────────────────────────────────\n`;
    groups.attitudes.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    out += `\n// ── BRANCH FLAGS ──────────────────────────────────────────────\n`;
    groups.branches.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    if (groups.world.length) {
      out += `\n// ── WORLD / CUSTOM ────────────────────────────────────────────\n`;
      groups.world.forEach(k => { const l = fmt(k, vars[k]); if (l) out += l + '\n'; });
    }
    return out;
  }, [store.variables]);

  const download = () => {
    const blob = new Blob([ink], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'variables.ink';
    a.click();
  };

  return (
    <div className="ink-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="ink-modal">
        <div className="ink-modal-header">
          <h3>EXPORT — variables.ink</h3>
          <button className="topbar-btn" onClick={download}>⬇ Download variables.ink</button>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <pre className="ink-modal-pre">{ink}</pre>
      </div>
    </div>
  );
}

// ── INK IMPORT ────────────────────────────────────────────────────────
// Parses the subset of Ink used by this project's hand-written scripts
// (ink/cold_open.ink, ink/scene_2_shed.ink) into studio nodes:
//   === knots === / = stitches   → addressable entry points (with stitch
//                                   fallthrough inside a knot, per Ink)
//   plain text                   → NARRATION (paragraphs joined)
//   ~ var = value / += / -= /
//   ~ var = var + n              → option sets or VAR_SET chain nodes
//   * [label] + indented body    → CHOICE with per-option body chains
//   { expr: ... - else: ... }    → CONDITION with branch sub-chains that
//                                   fall through past the block if undiverted
//   -> target                    → links; unknown targets become
//                                   SCENE_TRANSITION nodes (cross-file)
//   // comments                  → design notes on the next node; ALL-CAPS
//                                   banner lines become SECTION_LABELs

function inkParseValue(raw) {
  const t = raw.trim();
  if (t === 'true') return true;
  if (t === 'false') return false;
  const n = Number(t);
  return isNaN(n) ? t.replace(/^"|"$/g, '') : n;
}

function inkParseExpr(expr) {
  const m = expr.match(/^(\w+)\s*(>=|<=|==|=|>|<)\s*(.+)$/);
  if (m) {
    const raw = m[3].trim();
    const num = raw === 'true' ? 1 : raw === 'false' ? 0 : Number(raw);
    return { variable: m[1], operator: m[2] === '=' ? '==' : m[2], threshold: isNaN(num) ? raw : num };
  }
  return { variable: expr.trim(), operator: '==', threshold: 1 };
}

function inkTokenize(lines, ctx) {
  const items = [];
  let i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (L.note !== undefined) { items.push({ kind: 'note', note: L.note }); i++; continue; }
    const t = L.t;
    let m;

    // Choice group — consume sibling choices with their indented bodies.
    // * = once-only, + = sticky (revisitable — marks the option once:false)
    if (/^[*+]+\s*\[/.test(t)) {
      const choices = [];
      while (i < lines.length) {
        const C = lines[i];
        if (C.note !== undefined) {
          if (choices.length) { choices[choices.length - 1].body.push(C); i++; continue; }
          i++; continue;
        }
        const cm = C.t.match(/^([*+])[*+]*\s*\[([^\]]*)\]\s*(.*)$/);
        if (!cm) break;
        const base = C.indent;
        const ch = { label: cm[2].trim(), trailing: cm[3].trim(), sticky: cm[1] === '+', body: [] };
        i++;
        while (i < lines.length) {
          const B = lines[i];
          if (B.note !== undefined) {
            if (B.indent > base) { ch.body.push(B); i++; continue; }
            break;
          }
          if (B.indent > base) { ch.body.push(B); i++; continue; }
          break;
        }
        choices.push(ch);
      }
      items.push({ kind: 'choices', choices });
      continue;
    }

    // Variable operation
    if ((m = t.match(/^~\s*(\w+)\s*(\+=|-=|=)\s*(.+)$/))) {
      const v = m[1];
      const expr = m[3].split('//')[0].trim();
      let op = 'set', val;
      if (m[2] === '+=') { op = 'add'; val = inkParseValue(expr); }
      else if (m[2] === '-=') { op = 'subtract'; val = inkParseValue(expr); }
      else {
        const em = expr.match(new RegExp('^' + v + '\\s*([+\\-])\\s*(\\d+)$'));
        if (em) { op = em[1] === '+' ? 'add' : 'subtract'; val = Number(em[2]); }
        else val = inkParseValue(expr);
      }
      items.push({ kind: 'set', variable: v, op, value: val });
      i++; continue;
    }

    // Divert
    if ((m = t.match(/^->\s*([\w.]+)/))) {
      items.push({ kind: 'divert', target: m[1] });
      i++; continue;
    }

    // Single-line conditional divert (the studio's own export format)
    if ((m = t.match(/^\{\s*(.+?):\s*->\s*([\w.]+)\s*-\s*else\s*:\s*->\s*([\w.]+)\s*\}$/))) {
      items.push({
        kind: 'cond', ...inkParseExpr(m[1]),
        trueItems: [{ kind: 'divert', target: m[2] }],
        falseItems: [{ kind: 'divert', target: m[3] }],
      });
      i++; continue;
    }

    // Multiline conditional block
    if ((m = t.match(/^\{\s*(.+?):\s*$/))) {
      const inner = [];
      let depth = 1;
      i++;
      while (i < lines.length && depth > 0) {
        const B = lines[i];
        const bt = B.note !== undefined ? null : B.t;
        if (bt && /^\{.*:\s*$/.test(bt)) depth++;
        else if (bt === '}') { depth--; if (depth === 0) { i++; break; } }
        inner.push(B); i++;
      }
      const elseIdx = inner.findIndex(B => B.note === undefined && /^-\s*else\s*:/.test(B.t));
      const trueLines = elseIdx >= 0 ? inner.slice(0, elseIdx) : inner;
      const falseLines = elseIdx >= 0 ? inner.slice(elseIdx + 1) : [];
      items.push({
        kind: 'cond', ...inkParseExpr(m[1]),
        trueItems: inkTokenize(trueLines, ctx),
        falseItems: inkTokenize(falseLines, ctx),
      });
      continue;
    }

    if (/^-\s*else\s*:/.test(t) || t === '}') {
      ctx.warnings.push(`Stray "${t}" ignored`);
      i++; continue;
    }

    items.push({ kind: 'text', text: t });
    i++;
  }
  return items;
}

// Builds a node chain from tokenized items. Returns { entry, tails }:
// entry = id/name of the first thing in the chain (or null if empty);
// tails = setters for dangling ends that should link to whatever follows.
function inkBuildBody(items, ctx) {
  let entry = null;
  let tails = [];
  let textBuf = [], noteBuf = [];

  const connect = (ref) => {
    if (entry === null) entry = ref;
    tails.forEach(fn => fn(ref));
    tails = [];
  };
  const addNode = (node) => {
    if (noteBuf.length) { node.note = noteBuf.join('\n'); noteBuf = []; }
    ctx.nodes.push(node);
    connect(node.id);
  };
  const flushText = () => {
    if (!textBuf.length) return;
    const node = { id: ctx.nextId(), type: 'NARRATION', text: textBuf.join('\n\n'), media: null, next: null };
    textBuf = [];
    addNode(node);
    tails = [ref => { node.next = ref; }];
  };

  for (const it of items) {
    if (it.kind === 'note') noteBuf.push(it.note);
    else if (it.kind === 'text') textBuf.push(it.text);
    else if (it.kind === 'set') {
      flushText();
      const node = { id: ctx.nextId(), type: 'VAR_SET', variable: it.variable, operation: it.op, value: it.value, text: '', media: null, next: null };
      addNode(node);
      tails = [ref => { node.next = ref; }];
    }
    else if (it.kind === 'divert') {
      flushText();
      connect(it.target);
    }
    else if (it.kind === 'cond') {
      flushText();
      const node = { id: ctx.nextId(), type: 'CONDITION', variable: it.variable, operator: it.operator, threshold: it.threshold, text: '', media: null, true_next: null, false_next: null };
      addNode(node);
      tails = [];
      const tb = inkBuildBody(it.trueItems, ctx);
      const fb = inkBuildBody(it.falseItems, ctx);
      if (tb.entry !== null) node.true_next = tb.entry; else tails.push(ref => { node.true_next = ref; });
      if (fb.entry !== null) node.false_next = fb.entry; else tails.push(ref => { node.false_next = ref; });
      tails.push(...tb.tails, ...fb.tails);
    }
    else if (it.kind === 'choices') {
      const node = { id: ctx.nextId(), type: 'CHOICE', text: textBuf.join('\n\n'), media: null, options: [] };
      textBuf = [];
      addNode(node);
      tails = [];
      for (const ch of it.choices) {
        const bodyItems = inkTokenize(ch.body, ctx);
        if (ch.trailing) bodyItems.unshift({ kind: 'text', text: ch.trailing });
        // Literal `~ var = value` sets ride on the option itself; expression
        // forms (calm = calm + 18) become VAR_SET nodes in the body chain.
        const sets = {};
        const rest = [];
        bodyItems.forEach(bi => {
          if (bi.kind === 'set' && bi.op === 'set') sets[bi.variable] = bi.value;
          else rest.push(bi);
        });
        const cb = inkBuildBody(rest, ctx);
        const opt = { label: ch.label, next: cb.entry !== null ? cb.entry : '' };
        if (ch.sticky) opt.once = false;
        if (Object.keys(sets).length) opt.sets = sets;
        if (cb.tails.length) {
          cb.tails.forEach(fn => fn(null));
          ctx.warnings.push(`Choice "${ch.label.slice(0, 32)}" body ends without a divert`);
        }
        if (cb.entry === null && !cb.tails.length) {
          ctx.warnings.push(`Choice "${ch.label.slice(0, 32)}" has no destination`);
        }
        node.options.push(opt);
      }
      // Choices own all their exits — nothing falls through past them.
    }
  }
  flushText();
  return { entry, tails };
}

function parseInk(source, baseId) {
  const warnings = [];
  const vars = [];
  const rawLines = source.split(/\r?\n/);

  // ── Pass 1: group into knots/stitches, harvest VARs and banner comments
  const knots = [];
  let curKnot = null, curSeg = null;
  let pendingComments = [];
  const isDecor = (s) => /^[═─=\-\s]*$/.test(s);
  const stripDecor = (s) => s.replace(/^[═─=\-\s]+|[═─=\-\s]+$/g, '');

  for (const raw of rawLines) {
    const t = raw.trim();
    if (!t) continue;
    const indent = raw.length - raw.replace(/^\s+/, '').length;

    if (t.startsWith('//')) {
      const c = stripDecor(t.slice(2).trim());
      if (c) pendingComments.push(c);
      continue;
    }
    let m;
    if ((m = t.match(/^VAR\s+(\w+)\s*=\s*(.+)$/))) {
      vars.push({ name: m[1], value: inkParseValue(m[2].split('//')[0]) });
      pendingComments = [];
      continue;
    }
    if (/^INCLUDE\s/.test(t)) {
      warnings.push(`Ignored: ${t} (variables come from the shared registry)`);
      pendingComments = [];
      continue;
    }
    if ((m = t.match(/^===\s*(\w+)\s*=*\s*$/))) {
      // Banner title: last mostly-uppercase short comment line before the knot
      const isTitle = (s) => {
        const up = (s.match(/[A-Z]/g) || []).length;
        const lo = (s.match(/[a-z]/g) || []).length;
        return up > 0 && s.length <= 48 && up / (up + lo || 1) >= 0.8;
      };
      const titles = pendingComments.filter(isTitle);
      const label = titles.length ? titles[titles.length - 1] : null;
      const note = pendingComments.filter(c => c !== label).join('\n') || null;
      curKnot = { name: m[1], label, note, segments: [] };
      curSeg = { name: m[1], lines: [] };
      curKnot.segments.push(curSeg);
      knots.push(curKnot);
      pendingComments = [];
      continue;
    }
    if ((m = t.match(/^=\s*(\w+)\s*$/))) {
      if (!curKnot) { warnings.push(`Stitch outside a knot: ${t}`); pendingComments = []; continue; }
      curSeg = { name: m[1], lines: [] };
      curKnot.segments.push(curSeg);
      if (pendingComments.length) {
        curSeg.lines.push({ note: pendingComments.join('\n'), indent: 0 });
        pendingComments = [];
      }
      continue;
    }
    if (!curSeg) { warnings.push(`Content before first knot ignored: "${t.slice(0, 40)}"`); continue; }
    if (pendingComments.length) {
      curSeg.lines.push({ note: pendingComments.join('\n'), indent });
      pendingComments = [];
    }
    curSeg.lines.push({ raw, t, indent });
  }

  if (!knots.length) throw new Error('No knots (=== name ===) found — is this an Ink file?');

  // ── Pass 2: build node chains per segment, with stitch fallthrough
  const ctx = { nodes: [], warnings, used: new Set(), counter: 0, prefix: '' };
  knots.forEach(k => k.segments.forEach(s => ctx.used.add(s.name)));
  ctx.nextId = () => {
    let id;
    do { id = `${ctx.prefix}_${++ctx.counter}`; } while (ctx.used.has(id));
    ctx.used.add(id);
    return id;
  };

  const alias = {};
  knots.forEach(k => {
    let labelNode = null;
    if (k.label) {
      const lid = `${k.name}_label`;
      ctx.used.add(lid);
      labelNode = { id: lid, type: 'SECTION_LABEL', label: k.label, text: '', media: null, next: null };
      if (k.note) labelNode.note = k.note;
      ctx.nodes.push(labelNode);
    }
    const segResults = k.segments.map(seg => {
      ctx.prefix = seg.name;
      const items = inkTokenize(seg.lines, ctx);
      return { seg, ...inkBuildBody(items, ctx) };
    });
    segResults.forEach((r, idx) => {
      const nextName = segResults[idx + 1] ? segResults[idx + 1].seg.name : null;
      if (r.tails.length) {
        if (nextName) r.tails.forEach(fn => fn(nextName));           // stitch fallthrough
        else {
          r.tails.forEach(fn => fn(null));
          warnings.push(`Knot "${k.name}" ends without a divert`);
        }
      }
      alias[r.seg.name] = r.entry !== null ? r.entry : (nextName || null);
    });
    if (labelNode) {
      labelNode.next = alias[k.name];
      alias[k.name] = labelNode.id;
    }
  });

  // ── Pass 3: resolve every link — alias names → node ids; unknown names
  // become SCENE_TRANSITION nodes (cross-file diverts like -> scene_2_shed)
  const idSet = new Set(ctx.nodes.map(n => n.id));
  const resolve = (ref, d = 0) => {
    if (!ref) return null;
    if (ref === 'END') return 'END';
    if (idSet.has(ref)) return ref;
    const r = ref.includes('.') ? ref.split('.').pop() : ref;
    if (r !== ref && idSet.has(r)) return r;
    if (alias[r] !== undefined && d < 25) {
      const a = alias[r];
      return a === null ? null : resolve(a, d + 1);
    }
    const tid = `goto_${r}`;
    if (!idSet.has(tid)) {
      ctx.nodes.push({ id: tid, type: 'SCENE_TRANSITION', target_scene: r, text: '', media: null, next: null });
      idSet.add(tid);
      warnings.push(`Divert "${r}" not found in this file — created a scene transition`);
    }
    return tid;
  };
  ctx.nodes.forEach(n => {
    ['next', 'true_next', 'false_next', 'pass_next', 'fail_next', 'success_next'].forEach(f => {
      if (n[f]) n[f] = resolve(n[f]);
    });
    (n.options || []).forEach(o => { if (o.next) o.next = resolve(o.next); });
  });

  const title = baseId.split(/[_\-]+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  const branch = /shed/.test(baseId) ? 'shed' : /run/.test(baseId) ? 'run' : /go/.test(baseId) ? 'go' : 'shared';
  return { baseId, title, branch, nodes: ctx.nodes, vars, warnings };
}

function InkImportModal({ store, onStoreChange, onClose, onImported }) {
  const [fileName, setFileName] = useState(null);
  const [parsed, setParsed] = useState(null);
  const [error, setError] = useState(null);
  const fileRef = useRef(null);

  const loadSource = (name, source) => {
    setError(null);
    setFileName(name);
    try {
      setParsed(parseInk(source, name.replace(/\.ink$/i, '').replace(/[^a-z0-9_]/gi, '_').toLowerCase()));
    } catch (err) {
      setParsed(null);
      setError(err.message);
    }
  };

  const quickLoad = (name) => {
    fetch('ink/' + name)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then(text => loadSource(name, text))
      .catch(err => { setError(`Couldn't fetch ink/${name} (${err.message}) — use the file picker instead.`); });
  };

  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => loadSource(file.name, ev.target.result);
    reader.readAsText(file);
    e.target.value = '';
  };

  const doImport = () => {
    if (!parsed) return;
    const next = JSON.parse(JSON.stringify(store));
    let id = parsed.baseId;
    while (next.scenes.some(s => s.id === id)) id += '_ink';
    parsed.vars.forEach(v => {
      if (!next.variables[v.name]) {
        next.variables[v.name] = typeof v.value === 'boolean'
          ? { type: 'bool', initial: v.value, value: v.value }
          : { type: 'int', initial: v.value, value: v.value, range: [0, Math.max(100, Number(v.value) || 0)] };
      }
    });
    next.scenes.push({
      id, name: parsed.title + (id !== parsed.baseId ? ' (Ink)' : ''),
      branch: parsed.branch, type: 'playable', status: 'draft', locationId: null,
      nodes: parsed.nodes, wires: [],
    });
    next.activeScene = id;
    onStoreChange(next, `Imported ink: ${fileName} (${parsed.nodes.length} nodes)`);
    onImported && onImported();
    onClose();
  };

  const typeCounts = parsed
    ? parsed.nodes.reduce((acc, n) => { acc[n.type] = (acc[n.type] || 0) + 1; return acc; }, {})
    : {};

  return (
    <div className="ink-modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="ink-modal" style={{width: 560}}>
        <div className="ink-modal-header">
          <h3>IMPORT — .ink → tree</h3>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div style={{padding: 16, overflowY: 'auto'}}>
          <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14}}>
            <button className="topbar-btn" onClick={() => fileRef.current?.click()}>⬆ Choose .ink file…</button>
            <button className="topbar-btn" onClick={() => quickLoad('cold_open.ink')}>Load project: cold_open.ink</button>
            <button className="topbar-btn" onClick={() => quickLoad('scene_2_shed.ink')}>Load project: scene_2_shed.ink</button>
            <input ref={fileRef} type="file" accept=".ink,.txt" style={{display: 'none'}} onChange={onFile} />
          </div>

          {error && (
            <div style={{color: '#c0392b', fontSize: 11, marginBottom: 10, lineHeight: 1.5}}>{error}</div>
          )}

          {parsed && (
            <>
              <div style={{fontSize: 12, color: 'var(--bone)', marginBottom: 6}}>
                <strong>{fileName}</strong> → scene "{parsed.title}" ({parsed.branch})
              </div>
              <div style={{fontSize: 11, color: 'var(--bone-dim)', marginBottom: 10}}>
                {parsed.nodes.length} nodes: {Object.entries(typeCounts).map(([t, c]) => `${c} ${t}`).join(' · ')}
                {parsed.vars.length > 0 && <><br/>{parsed.vars.length} VAR declarations (new ones added to the registry)</>}
              </div>
              {parsed.warnings.length > 0 && (
                <div style={{maxHeight: 140, overflowY: 'auto', background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 4, padding: '8px 10px', marginBottom: 12}}>
                  <div style={{fontSize: 9, color: 'var(--text-dim)', letterSpacing: '0.08em', marginBottom: 4}}>
                    {parsed.warnings.length} WARNING{parsed.warnings.length !== 1 ? 'S' : ''}
                  </div>
                  {parsed.warnings.map((w, i) => (
                    <div key={i} style={{fontSize: 10, color: 'var(--bone-dim)', lineHeight: 1.6}}>· {w}</div>
                  ))}
                </div>
              )}
              <button className="edit-btn" onClick={doImport}>
                Import as new scene{store.scenes.some(s => s.id === parsed.baseId) ? ` (id "${parsed.baseId}" taken — will suffix _ink)` : ''}
              </button>
            </>
          )}

          {!parsed && !error && (
            <div style={{fontSize: 11, color: 'var(--text-dim)', lineHeight: 1.7}}>
              Pick an .ink file, or load one of the project's scripts straight from the repo.
              Knots, stitches, choices, diverts, variable ops, conditionals, and comments
              (as design notes) all come across; the import is always added as a NEW scene —
              nothing existing is overwritten.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── PLAY VIEW ─────────────────────────────────────────────────────────
const CONSCIOUSNESS_LABELS = ['FERAL', 'WAKING', 'CLEAR', 'GRIOTTE'];

function PlayView({ store, onStoreChange }) {
  // playSceneId is independent of store.activeScene so scene transitions
  // during play don't reset vars (vars are local play state, not design state)
  const [playSceneId, setPlaySceneId] = useState(store.activeScene);
  const [currentId, setCurrentId] = useState(null);
  const [vars, setVars] = useState(() => {
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    return v;
  });
  const [path, setPath] = useState([]);
  const [flash, setFlash] = useState(null);
  const [showVars, setShowVars] = useState(true);
  const [flashedVar, setFlashedVar] = useState(null);
  const [showCheckpoints, setShowCheckpoints] = useState(false);
  const [hubVisited, setHubVisited] = useState({});   // { hubId: [optionIdx…] }
  const [hubStack, setHubStack] = useState([]);       // active conversation hubs
  const [checkResults, setCheckResults] = useState({}); // { checkNodeId: bool } — red checks lock in
  const [visitedRefs, setVisitedRefs] = useState([]); // "sceneId:nodeId" — drives the quest log
  const checkpointMenuRef = useRef(null);

  const scene = store.scenes.find(s => s.id === playSceneId) || store.scenes.find(s => s.id === store.activeScene);
  const nodes = scene?.nodes || [];

  // When user navigates to a different scene externally (not via SCENE_TRANSITION),
  // reset play state fully
  useEffect(() => {
    setPlaySceneId(store.activeScene);
    const sc = store.scenes.find(s => s.id === store.activeScene);
    setCurrentId(sc?.nodes?.[0]?.id || null);
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    setVars(v);
    setPath([]);
    setFlash(null);
    setHubVisited({});
    setHubStack([]);
    setCheckResults({});
    setVisitedRefs([]);
  }, [store.activeScene]);

  // Set initial node once scene is known
  useEffect(() => {
    if (currentId === null && nodes.length > 0) {
      setCurrentId(nodes[0].id);
    }
  }, [nodes.length]);

  const node = nodes.find(n => n.id === currentId);

  // Entering a HUB puts it on the conversation stack — dead-ended branches
  // return here until the hub is exhausted or an exit option is taken.
  useEffect(() => {
    if (node?.type === 'HUB') {
      setHubStack(s => (s[s.length - 1] === node.id ? s : [...s, node.id]));
    }
  }, [currentId]);

  // Record every node visited (scene-qualified) for quest-objective tracking
  useEffect(() => {
    if (!currentId) return;
    const ref = `${playSceneId}:${currentId}`;
    setVisitedRefs(v => (v.includes(ref) ? v : [...v, ref]));
  }, [currentId, playSceneId]);

  const showFlash = (msg) => {
    setFlash(msg);
    setTimeout(() => setFlash(null), 2000);
  };

  const goto = useCallback((id, msg) => {
    // A dead end (null/undefined next) inside an active hub conversation
    // returns to the hub instead of ending the scene. Explicit 'END' still
    // ends: authors opt out of the loop-back by diverting to END.
    let target = id;
    let note = msg;
    if (!target && target !== 'END' && hubStack.length) {
      target = hubStack[hubStack.length - 1];
      note = note || '↩ back to the conversation';
    }
    if (note) showFlash(note);
    setPath(p => currentId ? [...p, currentId] : p);
    setCurrentId(target === 'END' ? null : (target || null));
  }, [currentId, hubStack]);

  const applyVar = (variable, operation, value) => {
    setVars(v => {
      const cur = typeof v[variable] === 'number' ? v[variable] : 0;
      const next = { ...v };
      if (operation === 'set') next[variable] = value;
      else if (operation === 'add') next[variable] = cur + Number(value);
      else if (operation === 'subtract') next[variable] = cur - Number(value);
      return next;
    });
    setFlashedVar(variable);
    setTimeout(() => setFlashedVar(null), 1400);
  };

  // Auto-resolve non-interactive nodes
  useEffect(() => {
    if (!node) return;
    let timer;
    const delay = (fn, ms) => { timer = setTimeout(fn, ms); };

    if (node.type === 'SECTION_LABEL') {
      delay(() => goto(node.next, null), 1400);

    } else if (node.type === 'VAR_SET') {
      applyVar(node.variable, node.operation || 'set', node.value ?? 0);
      const op = node.operation === 'add' ? '+=' : node.operation === 'subtract' ? '-=' : '=';
      delay(() => goto(node.next, `${node.variable} ${op} ${node.value}`), 900);

    } else if (node.type === 'CONDITION') {
      const v = typeof vars[node.variable] === 'number' ? vars[node.variable] : (vars[node.variable] ? 1 : 0);
      const t = Number(node.threshold ?? 0);
      const op = node.operator || '>=';
      let result;
      if (op === '>=') result = v >= t;
      else if (op === '<=') result = v <= t;
      else if (op === '>') result = v > t;
      else if (op === '<') result = v < t;
      else if (op === '==' || op === '=') result = v == t;
      else result = Boolean(v);
      const branch = result ? node.true_next : node.false_next;
      delay(() => goto(branch, `${node.variable}=${v} ${op} ${t} → ${result ? 'TRUE' : 'FALSE'}`), 1200);

    } else if (node.type === 'ATTITUDE_BRANCH') {
      const active = ['reticence','anger','curiosity','joy','greed'].find(a => vars[`att_${a}`]);
      const branch = (active && node.branches?.[active]) || node.branches?.reticence || node.next;
      delay(() => goto(branch, `attitude: ${active || 'none'}`), 1200);

    } else if (node.type === 'CONSCIOUSNESS_GATE') {
      const tier = vars.consciousness ?? 0;
      const pass = tier >= (node.min_tier ?? 0);
      delay(() => goto(pass ? node.pass_next : node.fail_next,
        `consciousness ${CONSCIOUSNESS_LABELS[tier]} ${pass ? '≥' : '<'} tier ${node.min_tier} → ${pass ? 'PASS' : 'FAIL'}`
      ), 1200);

    } else if (node.type === 'ANCHOR_USE') {
      applyVar('calm', 'add', node.calm_gain ?? 5);
      delay(() => goto(node.next, `anchor — calm +${node.calm_gain ?? 5}`), 700);
    }

    return () => clearTimeout(timer);
  }, [currentId]);

  const back = () => {
    if (!path.length) return;
    setCurrentId(path[path.length - 1]);
    setPath(p => p.slice(0, -1));
    setFlash(null);
  };

  const reset = () => {
    setPlaySceneId(store.activeScene);
    const sc = store.scenes.find(s => s.id === store.activeScene);
    setCurrentId(sc?.nodes?.[0]?.id || null);
    const v = {};
    Object.entries(store.variables).forEach(([k, vv]) => { v[k] = vv.value !== undefined ? vv.value : vv; });
    setVars(v);
    setPath([]);
    setFlash(null);
    setHubVisited({});
    setHubStack([]);
    setCheckResults({});
    setVisitedRefs([]);
  };

  // Close checkpoint dropdown on outside click
  useEffect(() => {
    if (!showCheckpoints) return;
    const handler = (e) => { if (!checkpointMenuRef.current?.contains(e.target)) setShowCheckpoints(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showCheckpoints]);

  const saveCheckpoint = () => {
    const defaultLabel = `${scene.name} @ ${currentId || 'start'}`;
    const label = prompt('Checkpoint label:', defaultLabel);
    if (label === null) return;
    const next = JSON.parse(JSON.stringify(store));
    if (!next.checkpoints) next.checkpoints = [];
    next.checkpoints.push({
      id: `cp_${Date.now()}`,
      label: label.trim() || defaultLabel,
      sceneId: playSceneId,
      currentId,
      vars: { ...vars },
      path: [...path],
      timestamp: Date.now(),
    });
    onStoreChange(next, `Checkpoint saved: ${label.trim() || defaultLabel}`);
    showFlash('Checkpoint saved');
  };

  const loadCheckpoint = (cp) => {
    setPlaySceneId(cp.sceneId);
    setCurrentId(cp.currentId);
    setVars(cp.vars);
    setPath(cp.path || []);
    setFlash(null);
    setShowCheckpoints(false);
    showFlash(`Loaded: ${cp.label}`);
  };

  const deleteCheckpoint = (id, e) => {
    e.stopPropagation();
    const next = JSON.parse(JSON.stringify(store));
    next.checkpoints = (next.checkpoints || []).filter(c => c.id !== id);
    onStoreChange(next, null);
  };

  const exportPlaythrough = () => {
    const fullPath = [...path, currentId].filter(Boolean);
    const lines = fullPath.map((id, i) => {
      const n = nodes.find(x => x.id === id);
      if (!n) return `${i + 1}. [missing node: ${id}]`;
      const preview = (n.text || nodePreview(n) || n.type || '').replace(/\s+/g, ' ').slice(0, 90);
      return `${i + 1}. [${n.type}] ${id}${preview ? ' — ' + preview : ''}`;
    });
    const finalVars = Object.entries(vars).map(([k, v]) => `${k}=${v}`).join('\n');
    const content = `PLAYTHROUGH LOG — ${scene.name}\nGenerated: ${new Date().toISOString()}\n\n${lines.join('\n')}\n\n── FINAL VARIABLES ──\n${finalVars}\n`;
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `playthrough_${scene.id}_${Date.now()}.txt`;
    a.click();
  };

  const checkpoints = store.checkpoints || [];

  // No scene
  if (!scene) {
    return (
      <div className="play-layout">
        <div className="play-empty">Select a scene in the STORY tab.</div>
      </div>
    );
  }

  const col = node ? (NODE_COLORS[node.type] || NODE_COLORS.NARRATION) : NODE_COLORS.NARRATION;
  const isAutoNode = node && ['SECTION_LABEL','VAR_SET','CONDITION','ATTITUDE_BRANCH','CONSCIOUSNESS_GATE','ANCHOR_USE'].includes(node.type);

  return (
    <div className="play-layout">
      <div className="play-ctrl-bar">
        <span className="play-scene-title">{scene.name}</span>
        {path.length > 0 && <span style={{color:'var(--text-dim)',fontSize:'10px'}}>node {path.length + 1}</span>}
        <button className="play-ctrl-btn" onClick={back} disabled={!path.length}>◀ Back</button>
        <button className="play-ctrl-btn" onClick={reset}>↺ Reset</button>
        <button className="play-ctrl-btn" onClick={saveCheckpoint} title="Save current playthrough position — reloadable">📍 Checkpoint</button>
        <div style={{position:'relative'}} ref={checkpointMenuRef}>
          <button className="play-ctrl-btn" onClick={() => setShowCheckpoints(v => !v)}
            title="Load a saved checkpoint">📂 Load ({checkpoints.length})</button>
          {showCheckpoints && (
            <div style={{
              position:'absolute', top:'100%', left:0, marginTop:4, zIndex:30, minWidth:220, maxWidth:320,
              background:'var(--surface)', border:'1px solid var(--border)', borderRadius:6,
              boxShadow:'0 8px 24px rgba(0,0,0,0.5)', padding:'4px 0', maxHeight:280, overflowY:'auto',
            }}>
              {checkpoints.length === 0 && (
                <div style={{padding:'8px 12px',color:'var(--text-dim)',fontSize:'10px'}}>No checkpoints saved yet.</div>
              )}
              {[...checkpoints].reverse().map(cp => {
                const cpScene = store.scenes.find(s => s.id === cp.sceneId);
                return (
                  <div key={cp.id} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',cursor:'pointer'}}
                    onClick={() => loadCheckpoint(cp)}>
                    <div style={{flex:1,overflow:'hidden'}}>
                      <div style={{color:'var(--bone-dim)',fontSize:'11px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cp.label}</div>
                      <div style={{color:'var(--text-dim)',fontSize:'9px'}}>{cpScene?.name || cp.sceneId} · {new Date(cp.timestamp).toLocaleString()}</div>
                    </div>
                    <button onClick={e => deleteCheckpoint(cp.id, e)}
                      style={{background:'none',border:'none',color:'var(--text-dim)',fontSize:'12px',cursor:'pointer',padding:'0 2px',flexShrink:0}}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <button className="play-ctrl-btn" onClick={exportPlaythrough} title="Download the path taken as a test log">⬇ Export Log</button>
        <button className={`play-ctrl-btn${showVars ? ' active' : ''}`}
          style={{marginLeft:'auto'}} onClick={() => setShowVars(v => !v)}>
          Variables
        </button>
      </div>

      <div className="play-body">
        <div className="play-stage">
          {flash && <div className="play-flash">{flash}</div>}

          {node?.media && (
            <div className="play-media">
              {node.media.startsWith('data:video') ? (
                <video src={node.media} className="play-media-el" autoPlay muted loop />
              ) : (
                <img src={node.media} className="play-media-el" alt="" />
              )}
            </div>
          )}

          {node ? (
            <>
              <div className="play-node-type" style={{color:col.text,borderColor:col.border}}>
                {node.type}
              </div>

              {node.text && node.type !== 'SECTION_LABEL' && (
                <div className="play-node-text">{node.text}</div>
              )}

              {node.type === 'SECTION_LABEL' && (
                <div className="play-section-label">
                  {node.label || node.text || 'Section'}
                  {node.label && node.text && (
                    <div style={{fontSize:'12px',marginTop:8,color:'var(--bone-dim)',textTransform:'none',letterSpacing:'0.01em'}}>{node.text}</div>
                  )}
                </div>
              )}

              {node.type === 'NARRATION' && (() => {
                const deadEnd = !node.next || node.next === 'END';
                const returnsToHub = deadEnd && node.next !== 'END' && hubStack.length > 0;
                return (
                  <button className="play-continue-btn"
                    onClick={() => goto(node.next, null)}
                    disabled={deadEnd && !returnsToHub}>
                    {returnsToHub ? '↩ Return to conversation' : deadEnd ? '[ END OF SCENE ]' : 'Continue ▶'}
                  </button>
                );
              })()}

              {node.type === 'CHOICE' && node.options && (
                <div className="play-choices">
                  {node.options.map((o, i) => (
                    <button key={i} className="play-choice-btn" onClick={() => {
                      if (o.sets) Object.entries(o.sets).forEach(([k, v]) => applyVar(k, 'set', v));
                      goto(o.next, null);
                    }}>
                      {o.label}
                    </button>
                  ))}
                </div>
              )}

              {node.type === 'HUB' && (() => {
                const visited = hubVisited[node.id] || [];
                const opts = node.options || [];
                const isUsedUp = (o, i) => visited.includes(i) && o.once !== false && !o.exit;
                const exhausted = opts.every((o, i) => o.exit ? false : isUsedUp(o, i));
                const pickOption = (o, i) => {
                  setHubVisited(v => ({ ...v, [node.id]: [...(v[node.id] || []), i] }));
                  if (o.sets) Object.entries(o.sets).forEach(([k, val]) => applyVar(k, 'set', val));
                  if (o.exit) setHubStack(s => s.filter(id => id !== node.id));
                  goto(o.next, null);
                };
                return (
                  <div className="play-choices">
                    {opts.map((o, i) => {
                      const used = isUsedUp(o, i);
                      return (
                        <button key={i} className="play-choice-btn" disabled={used}
                          style={used ? {opacity: 0.35, textDecoration: 'line-through', cursor: 'default'} : (o.exit ? {borderColor: 'var(--amber-dim)'} : undefined)}
                          onClick={() => !used && pickOption(o, i)}>
                          {o.exit ? '➤ ' : ''}{o.label}
                        </button>
                      );
                    })}
                    {exhausted && node.next && node.next !== 'END' && (
                      <button className="play-continue-btn" style={{alignSelf: 'stretch'}}
                        onClick={() => { setHubStack(s => s.filter(id => id !== node.id)); goto(node.next, 'conversation exhausted'); }}>
                        Continue ▶
                      </button>
                    )}
                    {exhausted && (!node.next || node.next === 'END') && !opts.some(o => o.exit) && (
                      <div style={{color: 'var(--text-dim)', fontSize: '10px', textAlign: 'center'}}>
                        [ conversation exhausted — no exit wired ]
                      </div>
                    )}
                  </div>
                );
              })()}

              {node.type === 'CHECK' && (() => {
                const kind = node.check_kind === 'red' ? 'red' : 'white';
                const locked = kind === 'red' && checkResults[node.id] !== undefined;
                const attempt = () => {
                  let success;
                  const v = Number(vars[node.variable]) || 0;
                  if (locked) {
                    success = checkResults[node.id];
                    showFlash(`● red check already ${success ? 'passed' : 'failed'} — result stands`);
                  } else {
                    const d1 = 1 + Math.floor(Math.random() * 6);
                    const d2 = 1 + Math.floor(Math.random() * 6);
                    const total = v + d1 + d2;
                    success = total >= Number(node.difficulty ?? 10);
                    if (kind === 'red') setCheckResults(r => ({ ...r, [node.id]: success }));
                    showFlash(`${kind === 'red' ? '●' : '○'} ${node.variable} ${v} + 🎲${d1}+${d2} = ${total} vs ${node.difficulty ?? 10} → ${success ? 'SUCCESS' : 'FAILURE'}`);
                  }
                  setTimeout(() => goto(success ? node.success_next : node.fail_next, null), 650);
                };
                return (
                  <div className="play-choices">
                    <button className="play-choice-btn"
                      style={{borderColor: kind === 'red' ? 'var(--red)' : 'var(--teal)'}}
                      onClick={attempt}>
                      {kind === 'red' ? '●' : '○'} {kind.toUpperCase()} CHECK — {node.variable || '?'} + 2d6 vs {node.difficulty ?? 10}
                      {locked ? ' (locked)' : ''}
                    </button>
                  </div>
                );
              })()}

              {node.type === 'SCENE_TRANSITION' && (
                <div style={{textAlign:'center',marginTop:20}}>
                  <div style={{color:'var(--text-dim)',fontSize:'11px',marginBottom:14,letterSpacing:'0.06em'}}>
                    → {node.target_scene || node.text || 'next scene'}
                    {(() => {
                      const locs = store.locations || [];
                      const fromLoc = locs.find(l => l.id === scene?.locationId);
                      const targetScene = store.scenes.find(s => s.id === (node.target_scene || node.next));
                      const toLoc = locs.find(l => l.id === targetScene?.locationId);
                      if (!fromLoc && !toLoc) return null;
                      return (
                        <div style={{marginTop:6,fontSize:'10px',color:'var(--steel)'}}>
                          ⌖ {fromLoc ? fromLoc.name : '?'} → {toLoc ? toLoc.name : '?'}
                        </div>
                      );
                    })()}
                  </div>
                  <button className="play-continue-btn" onClick={() => {
                    const targetId = node.target_scene || node.next;
                    // Transition locally — vars carry forward, no store write
                    const newScene = store.scenes.find(s => s.id === targetId);
                    if (newScene) {
                      setPlaySceneId(targetId);
                      setCurrentId(newScene.nodes[0]?.id || null);
                      setPath([]);
                      setFlash(null);
                      setHubVisited({});
                      setHubStack([]);
                    }
                  }}>
                    Enter Scene ▶
                  </button>
                </div>
              )}

              {isAutoNode && !flash && (
                <div className="play-resolving">resolving…</div>
              )}
            </>
          ) : (
            <div className="play-empty" style={{flex:'none',paddingTop:40}}>
              {nodes.length === 0
                ? 'No nodes yet — build this scene in CHAT first.'
                : 'Scene complete.'}
            </div>
          )}

          {path.length > 0 && (
            <div className="play-breadcrumb">
              {path.slice(-4).map((id, i) => {
                const n = nodes.find(x => x.id === id);
                const label = n ? (n.text || n.label || n.type).slice(0, 28) : id.slice(0, 20);
                return <span key={id}>{i > 0 && ' › '}<span title={id}>{label}</span></span>;
              })}
              {' › '}<span style={{color:'var(--amber)'}} title={currentId}>
                {node ? (node.text || node.label || node.type).slice(0, 28) : currentId}
              </span>
            </div>
          )}
        </div>

        {showVars && (
          <div className="play-vars-panel">
            <div className="play-vars-title">Variables</div>
            <div className="play-var-row" style={{background: flashedVar === 'calm' ? 'rgba(200,136,10,0.12)' : 'transparent', transition:'background 0.3s', borderRadius:3}}>
              <span className="play-var-name">calm</span>
              <div className="play-calm-bar">
                <div className="play-calm-fill" style={{width:`${Math.min(100, Math.max(0, vars.calm ?? 10))}%`}} />
              </div>
              <span className="play-var-val">{vars.calm ?? 10}</span>
            </div>
            <div className="play-var-row" style={{background: flashedVar === 'consciousness' ? 'rgba(200,136,10,0.12)' : 'transparent', transition:'background 0.3s', borderRadius:3}}>
              <span className="play-var-name">consciousness</span>
              <span className="play-var-val" style={{color:'var(--amber)',fontSize:'9px'}}>
