// ── GAME DATA LOADER ─────────────────────────────────────────────
// Tries to load beauregarde_data.json exported from the Construction Kit.
// If the file exists, it replaces the hardcoded PEOPLE_DB and QUESTS_DB arrays.
// If not found, the hardcoded defaults above are used as-is.
(async()=>{
  try{
    const r=await fetch('beauregarde_data.json');
    if(r.ok){
      const d=await r.json();
      // store full payload on window so scene scripts can access dialogue/scenes/spawns
      window.BEAUREGARDE_DATA=d;
      // merge people → PEOPLE_DB
      if(d.people&&d.people.length){
        PEOPLE_DB.splice(0,PEOPLE_DB.length,...d.people.map(p=>({
          id:p.id, name:(p.name||'').toUpperCase(), role:p.role||'',
          handle:p.handle||'', status:(p.status||'CONTACT').toUpperCase(),
          portrait:p.portrait||'', portrait360:p.portrait360||'',
          info:p.info||'', discovered:p.discovered!==false, category:p.category||null,
        })));
        // seed trust values from character data (won't overwrite existing session trust)
        if(!window.__beau_trust)window.__beau_trust={};
        d.people.forEach(p=>{if(p.trust!==undefined&&window.__beau_trust[p.id]===undefined)window.__beau_trust[p.id]=p.trust||0;});
      }
      // merge quests → QUESTS_DB buckets — preserve all gate/reward/step data
      if(d.quests){
        ['major','minor','personal','opp'].forEach(bucket=>{
          if(d.quests[bucket]&&d.quests[bucket].length){
            QUESTS_DB[bucket].splice(0,QUESTS_DB[bucket].length,...d.quests[bucket].map(q=>({
              id:q.id, name:(q.name||'').toUpperCase(),
              status:(q.status||'ACTIVE').toUpperCase(),
              progress:q.progress||'', info:q.info||'',
              requiredItems:q.requiredItems||[], rewardItems:q.rewardItems||[],
              steps:q.steps||[], prerequisites:q.prerequisites||[],
              assignedBy:q.assignedBy||null, nextQuest:q.nextQuest||null,
              category:q.category||bucket,
            })));
          }
        });
      }
      // seed variable store from kit registry — one flat state object the game reads/writes.
      // Existing session values are preserved; only unseen vars get their initial value.
      if(d.vars&&d.vars.length){
        if(!window.__beau_vars)window.__beau_vars={};
        d.vars.forEach(v=>{
          if(v.key&&window.__beau_vars[v.key]===undefined){
            window.__beau_vars[v.key]=v.initial!==undefined?v.initial:(v.type==='int'?0:v.type==='enum'?(v.enumValues?.[0]||''):false);
          }
          // keywords also surface in a quick-lookup set for Shadowrun-style "ask about"
          if(v.type==='keyword'&&v.initial){
            window.__beau_keywords=window.__beau_keywords||new Set();
            window.__beau_keywords.add(v.key);
          }
        });
      }
      // merge items → ITEM_DEFS (kit registry items become game inventory items)
      if(d.items&&d.items.length){
        d.items.forEach(item=>{
          if(item.key&&!ITEM_DEFS[item.key]){
            ITEM_DEFS[item.key]={
              name:(item.name||'').toUpperCase(),
              category:item.category||'misc',
              desc:item.description||'',
              restore:item.restore||0,
              icon:item.icon||'',
              equippable:item.equippable||false,
              unique:item.unique||false,
            };
          }
        });
      }
      // merge dialogue trees into CONV — kit trees override hardcoded ones by key
      if(d.dialogue){
        Object.entries(d.dialogue).forEach(([key,tree])=>{
          if(!tree.nodes||!tree.nodes.length)return;
          const oc=tree.outfitCondition||'any';
          if(oc==='any'){
            CONV[key]=tree.nodes;
          } else {
            CONV[key+'__'+oc]=tree.nodes;       // outfit-specific variant
            if(!CONV[key]) CONV[key]=tree.nodes; // base fallback if none exists
          }
        });
      }
      // build scene trigger map: sceneName → [{key, worldX, treeType}]
      if(d.scenes){
        const trigMap={};
        d.scenes.forEach(s=>{
          if(s.dialogueTrigger&&s.dialogueTrigger.key&&s.dialogueTrigger.worldX!=null){
            if(!trigMap[s.name])trigMap[s.name]=[];
            const dlg=d.dialogue?d.dialogue[s.dialogueTrigger.key]:null;
            trigMap[s.name].push({key:s.dialogueTrigger.key,worldX:s.dialogueTrigger.worldX,treeType:dlg?.treeType||'dialogue',playCount:dlg?.playCount||'always',playLimit:dlg?.playLimit||1,conditions:dlg?.conditions||[]});
          }
        });
        window.__beau_scene_triggers=trigMap;
      }
      console.log('[Beauregarde] Loaded beauregarde_data.json — people:',d.people?.length||0,'quests:',Object.values(d.quests||{}).flat().length,'items:',d.items?.length||0,'dialogue:',Object.keys(d.dialogue||{}).length,'triggers:',Object.keys(window.__beau_scene_triggers||{}).length);
    }
  }catch(e){
    console.log('[Beauregarde] No beauregarde_data.json — using hardcoded defaults.');
  }

  // Helper: get the right dialogue tree for a given key + current outfit.
  // Usage: getDialogueTree('raymond_first_meeting', currentOutfit)
  // Returns the serialized node array, or null if not found.
  // Outfit matching: prefers an exact outfit match; falls back to 'any'; returns null if nothing found.
  window.getDialogueTree=(key, outfit='cyber_octavia')=>{
    const data=window.BEAUREGARDE_DATA;
    if(!data?.dialogue)return null;
    const all=Object.values(data.dialogue);
    const byKey=all.filter(t=>t.id===key||t.name?.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')=== key);
    if(!byKey.length)return null;
    const exact=byKey.find(t=>t.outfitCondition===outfit);
    if(exact)return exact.nodes;
    const any=byKey.find(t=>!t.outfitCondition||t.outfitCondition==='any');
    return any?any.nodes:null;
  };

  // fire-count tracker — persists across scene navigations (keyed by dialogue key)
  window.__beau_fire_counts=window.__beau_fire_counts||{};

  // condition evaluator — used by scene trigger system
  window.evalTriggerConditions=(trigger)=>{
    const{conditions=[],playCount='always',playLimit=1,key}=trigger;
    // check play count
    const fired=window.__beau_fire_counts[key]||0;
    if(playCount==='once'&&fired>0)return false;
    if(playCount==='limit'&&fired>=playLimit)return false;
    // evaluate each condition
    const outfit=window.__beau_outfit||'';
    const inv=window.__beau_inventory||[];
    const V=window.__beau_vars||{};
    return conditions.every(c=>{
      let result=false;
      if(c.type==='outfit')     result=outfit===c.value;
      else if(c.type==='item')  result=inv.includes(c.value);
      else if(c.type==='trust') {const t=(window.__beau_trust||{})[c.charId]||0;result=c.op==='gte'?t>=c.value:t<c.value;}
      else if(c.type==='scene') result=(window.__beau_visited_scenes||new Set()).has(c.value);
      else if(c.type==='quest') {const q=window.__beau_quest_status?.[c.questId]||'active';result=q===(c.questState||'complete');}
      else if(c.type==='var')   {
        // generic variable check — one branch covers every author-defined flag/int/enum/keyword.
        // NEW VARIABLES NEVER NEED NEW CODE HERE.
        const v=V[c.varKey];
        switch(c.op){
          case 'is_true':  result=!!v; break;
          case 'is_false': result=!v;  break;
          case 'eq':  result=String(v)===String(c.value); break;
          case 'neq': result=String(v)!==String(c.value); break;
          case 'gte': result=(+v)>=(+c.value); break;
          case 'gt':  result=(+v)>(+c.value);  break;
          case 'lte': result=(+v)<=(+c.value); break;
          case 'lt':  result=(+v)<(+c.value);  break;
          default:    result=!!v;
        }
      }
      return c.negate?!result:result;
    });
  };

  // helper for scene/dialogue scripts to mutate variables (effects come from the kit in step #2)
  window.setVar=(key,val)=>{window.__beau_vars=window.__beau_vars||{};window.__beau_vars[key]=val;};
  window.getVar=key=>(window.__beau_vars||{})[key];

  ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
})();
</script>
<script>
(function(){
  function scale(){const s=Math.min(window.innerWidth/1280,window.innerHeight/720);const w=document.getElementById('scale-wrap');w.style.transform=`scale(${s})`;w.style.marginLeft=((window.innerWidth-1280*s)/2)+'px';w.style.marginTop='0px';}
  scale();window.addEventListener('resize',scale);
})();
</script>
</body>
