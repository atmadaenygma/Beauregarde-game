<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HATCHLING</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000;
  display:flex; align-items:center; justify-content:center; }
#scale-wrap { width:1280px; height:720px; position:relative; transform-origin:top left; }
</style>
</head>
<body>
<div id="scale-wrap"><div id="root"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── CONSTANTS ──────────────────────────────────────────
const VW = 1280, VH = 720, SPEED = 4.5;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const sr = (i,n) => Math.abs(Math.sin(i*127.1+n*311.7)) % 1; // seeded pseudo-rand

const C = {
  bg:'#080604', red:'#c43028', gold:'#d4a020', text:'#e8d2a0',
  dim:'#7a6040', border:'#5a3a18', panel:'#0e0b07',
  nR:'#ff5030', nG:'#ffb020',
};

// ─── WORLD DATA ─────────────────────────────────────────
// screenX = (wx - playerX) * parallax + VW/2
function genLayer(tag, pax, n, step, x0, hLo, hHi, wLo, wHi) {
  const bc = tag==='f'?'#111009':tag==='m'?'#1c1610':'#281e12';
  const wc = tag==='f'?'#1f1b0d':tag==='m'?'#2e2518':'#402e1e';
  return Array.from({length:n},(_,i)=>({
    id:`${tag}${i}`, pax,
    wx: x0 + i*step + (sr(i,1)-.5)*step*.38,
    w:  wLo + sr(i,2)*(wHi-wLo),
    h:  hLo + sr(i,3)*(hHi-hLo),
    bc, wc,
    sign: null,
  }));
}

const FAR  = genLayer('f',0.13,22,215,-2300,200,340,150,240);
const MID  = genLayer('m',0.40,16,230,-1700,280,420,170,270);
const NEAR = genLayer('n',0.74,12,250,-1400,330,490,200,300);

// Named locations
const tag = (arr,i,txt,col)=>{ arr[i].sign={txt,col}; };
tag(MID, 2,'FAITH',C.text); tag(MID, 7,'JAZZ CLUB',C.nR); tag(MID,12,'BODEGA',C.nG);
tag(NEAR,2,'CORNER STORE',C.nG); tag(NEAR,7,'THE MARKET',C.nG); tag(NEAR,10,'THE CHURCH',C.text);

const NPCS = [
  { id:'tatum', wx:180, h:72, name:'MR. TATUM', col:'#6a5038',
    lines:["Been wondering when you'd come back around.",
           "Three weeks. That's how long you were gone.",
           "People been asking after you — I said I didn't know nothing.",
           "But I kept the door unlocked.",
           "Counter's been short-handed, if you're looking for work."] },
  { id:'delphine', wx:-220, h:84, name:'MISS DELPHINE', col:'#7a7050',
    lines:["Chile. You look like you been through something.",
           "Don't have to talk about it. I understand.",
           "Come by later. I got something on the stove.",
           "...Marcus hasn't been around in a while. You know Marcus?"] },
  { id:'kid', wx:560, h:52, name:'KID ON STEPS', col:'#604030',
    lines:["Hey. You're the lady from upstairs.",
           "My grandma said not to bother you.",
           "...Welcome back, I guess."] },
];

// ─── BUILDING ────────────────────────────────────────────
function Building({ d, px }) {
  const sx = (d.wx - px) * d.pax + VW/2;
  if (sx > VW+320 || sx+d.w < -320) return null;
  const cx = sx + d.w/2;
  const rotY = clamp((cx - VW/2) / (VW*.42) * 50, -52, 52);
  const cols = Math.floor(d.w/36), rows = Math.floor(d.h/46);

  return (
    <div style={{
      position:'absolute', left:sx, bottom:116,
      width:d.w, height:d.h,
      transform:`perspective(900px) rotateY(${rotY}deg)`,
      transformOrigin:'50% 100%',
      background:d.bc,
      borderTop:`1px solid ${d.wc}`,
    }}>
      <svg style={{position:'absolute',inset:0}} width={d.w} height={d.h}>
        {Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>{
          const lit = sr(r*17+c*31+d.wx*.1,7) > .36;
          return lit
            ? <rect key={`${r}-${c}`} x={c*36+7} y={r*46+9} width={20} height={28}
                fill={d.wc} opacity={.45+sr(r+c,d.wx*.01)*.45}/>
            : null;
        }))}
      </svg>
      {d.sign && (
        <div style={{
          position:'absolute', bottom:16, left:'50%', transform:'translateX(-50%)',
          color:d.sign.col, fontSize:10, letterSpacing:3,
          fontFamily:"'Space Mono',monospace",
          textShadow:`0 0 6px ${d.sign.col},0 0 20px ${d.sign.col}55`,
          whiteSpace:'nowrap', animation:'flicker 9s infinite',
        }}>{d.sign.txt}</div>
      )}
    </div>
  );
}

// ─── CHARACTER ────────────────────────────────────────────
function Character({ facing }) {
  return (
    <div style={{
      position:'absolute', bottom:116, left:VW/2-22, zIndex:100,
      transform:facing==='left'?'scaleX(-1)':'none',
      pointerEvents:'none',
    }}>
      <svg width={44} height={118} viewBox="0 0 44 118"
        style={{filter:'drop-shadow(0 6px 16px rgba(196,48,40,.55))'}}>
        {/* Afro */}
        <ellipse cx={22} cy={20} rx={20} ry={20} fill="#8a1010"/>
        <ellipse cx={11} cy={25} rx={11} ry={14} fill="#a01515"/>
        <ellipse cx={33} cy={23} rx={11} ry={13} fill="#a01515"/>
        <ellipse cx={22} cy={8}  rx={15} ry={11} fill="#981212"/>
        <ellipse cx={7}  cy={18} rx={7}  ry={9}  fill="#901010"/>
        <ellipse cx={37} cy={16} rx={7}  ry={8}  fill="#901010"/>
        {/* Head */}
        <ellipse cx={22} cy={37} rx={9} ry={11} fill="#3d2010"/>
        {/* Cyber eye glow */}
        <circle cx={27} cy={34} r={2.5} fill="#ff9030"/>
        <circle cx={27} cy={34} r={5}   fill="#ff9030" opacity={.2}/>
        {/* Body */}
        <rect x={14} y={47} width={16} height={24} rx={2} fill="#181412"/>
        {/* Heart tattoo */}
        <path d="M22 58 C21 55 18 55 18 59 C18 63 22 66 22 66 C22 66 26 63 26 59 C26 55 23 55 22 58Z"
          fill={C.red} opacity={.9}/>
        {/* Mech arm L */}
        <rect x={5}  y={47} width={9} height={7} rx={2} fill="#242018"/>
        <rect x={4}  y={52} width={8} height={16} rx={2} fill="#1e1c16"/>
        <circle cx={8} cy={70} r={3.5} fill="#2c2820"/>
        <rect x={6}  y={70} width={4} height={8} rx={1} fill="#242018"/>
        {/* Mech arm R */}
        <rect x={30} y={47} width={9} height={7} rx={2} fill="#242018"/>
        <rect x={32} y={52} width={8} height={16} rx={2} fill="#1e1c16"/>
        <circle cx={36} cy={70} r={3.5} fill="#2c2820"/>
        <rect x={34} y={70} width={4} height={8} rx={1} fill="#242018"/>
        {/* Belt + skirt */}
        <rect x={13} y={70} width={18} height={4} rx={1} fill="#3a3028"/>
        <rect x={12} y={73} width={20} height={14} rx={1} fill="#181412"/>
        {/* Mech legs */}
        <rect x={14} y={86} width={7} height={22} rx={2} fill="#1c1a16"/>
        <rect x={23} y={86} width={7} height={22} rx={2} fill="#1c1a16"/>
        <circle cx={17} cy={98} r={3} fill="#282620"/>
        <circle cx={26} cy={98} r={3} fill="#282620"/>
        {/* Boots */}
        <rect x={12} y={104} width={10} height={8} rx={2} fill="#141210"/>
        <rect x={22} y={104} width={10} height={8} rx={2} fill="#141210"/>
      </svg>
    </div>
  );
}

// ─── NPC ─────────────────────────────────────────────────
function Npc({ d, px, near }) {
  const sx = (d.wx - px) + VW/2;
  if (sx < -80 || sx > VW+80) return null;
  return (
    <div style={{position:'absolute', bottom:116, left:sx-18, zIndex:80}}>
      <svg width={36} height={d.h} viewBox={`0 0 36 ${d.h}`}>
        <ellipse cx={18} cy={12} rx={9} ry={10} fill={d.col}/>
        <rect x={11} y={20} width={14} height={20} rx={2} fill={d.col} opacity={.85}/>
        <rect x={11} y={38} width={6}  height={d.h-40} rx={2} fill={d.col} opacity={.8}/>
        <rect x={19} y={38} width={6}  height={d.h-40} rx={2} fill={d.col} opacity={.8}/>
      </svg>
      {near && (
        <div style={{
          position:'absolute', bottom:d.h+4, left:'50%',
          transform:'translateX(-50%)', whiteSpace:'nowrap',
          background:C.panel, border:`1px solid ${C.border}`,
          color:C.gold, fontSize:8, padding:'2px 8px', letterSpacing:2,
          fontFamily:"'Space Mono',monospace",
        }}>[ E ] TALK</div>
      )}
    </div>
  );
}

// ─── DIALOGUE ─────────────────────────────────────────────
function Dialogue({ npc, idx, onKey }) {
  const line = npc.lines[idx] || '';
  const last = idx >= npc.lines.length-1;
  return (
    <div style={{
      position:'absolute', bottom:0, left:0, right:0, height:152,
      background:'linear-gradient(to top,#080604f5 0%,#08060470 100%)',
      borderTop:`1px solid ${C.border}`, padding:'18px 52px 14px', zIndex:250,
      display:'flex', flexDirection:'column', gap:8,
    }}>
      <div style={{color:C.red, fontSize:10, letterSpacing:4,
        fontFamily:"'Space Mono',monospace", fontWeight:700}}>// {npc.name}</div>
      <div style={{color:C.text, fontSize:14, lineHeight:1.65,
        fontFamily:"'Space Mono',monospace", maxWidth:780}}>{line}</div>
      <div style={{display:'flex', gap:24, color:C.dim, fontSize:8,
        letterSpacing:2, fontFamily:"'Space Mono',monospace", marginTop:2}}>
        <span>[ E ] {last?'END CONVERSATION':'CONTINUE'}</span>
        <span>[ ESC / MOVE ] WALK AWAY</span>
      </div>
    </div>
  );
}

// ─── HEART ────────────────────────────────────────────────
function Heart({ state='red' }) {
  const col = {red:C.red,yellow:C.gold,blue:'#2070d0'}[state]||C.red;
  return (
    <div style={{position:'absolute',bottom:20,left:22,zIndex:300,
      display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
      <svg width={38} height={34} viewBox="0 0 38 34"
        style={{filter:`drop-shadow(0 0 8px ${col})`,animation:'beat 1.5s ease-in-out infinite'}}>
        <path d="M19 31C19 31 2 20 2 11 2 6 6 2 11 2 14 2 17 4 19 7 21 4 24 2 27 2 32 2 36 6 36 11 36 20 19 31Z"
          fill={col}/>
        <path d="M19 26C19 26 7 18 7 12 7 9 9 7 12 7 14 7 16 8.5 19 12 22 8.5 24 7 26 7 29 7 31 9 31 12 31 18 19 26Z"
          fill={col} opacity={.28}/>
      </svg>
      <span style={{color:col,fontSize:7,letterSpacing:2,
        fontFamily:"'Space Mono',monospace",textShadow:`0 0 6px ${col}`}}>VITALS</span>
    </div>
  );
}

// ─── THREADS PANEL ────────────────────────────────────────
const CATS = [
  {id:'personal',   label:'PERSONAL THREADS',      sub:'// fragments of self'},
  {id:'community',  label:'COMMUNITY THREADS',     sub:'// the veil speaks'},
  {id:'institute',  label:'INSTITUTIONAL THREADS', sub:'// evidence of the machine'},
  {id:'locations',  label:'LOCATIONS',             sub:'// mapped by foot'},
  {id:'people',     label:'PEOPLE',                sub:'// those who remain'},
];

function Threads({ onClose }) {
  const [cat, setCat] = useState('personal');
  const tabs = ['MAP','STATUS','EQUIPMENT','THREADS','PEOPLE'];
  return (
    <div style={{position:'absolute',inset:0,zIndex:500,
      background:'#08060490',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{width:1080,height:604,background:C.panel,
        border:`1px solid ${C.border}`,display:'grid',
        gridTemplateColumns:'210px 1fr 330px',gridTemplateRows:'44px 1fr',overflow:'hidden'}}>

        {/* Nav bar */}
        <div style={{gridColumn:'1/-1',display:'flex',alignItems:'center',
          borderBottom:`1px solid ${C.border}`,background:'#0c0a07'}}>
          {tabs.map((t,i)=>(
            <div key={i} style={{
              padding:'0 22px',height:44,display:'flex',alignItems:'center',
              color:t==='THREADS'?C.text:C.dim, fontSize:10,letterSpacing:3,
              fontFamily:"'Space Mono',monospace",
              background:t==='THREADS'?'#1a120a':'transparent',
              borderRight:`1px solid ${C.border}`,cursor:'default',
            }}>{t}</div>
          ))}
          <div style={{flex:1}}/>
          <div onClick={onClose} style={{
            padding:'0 20px',height:44,display:'flex',alignItems:'center',
            color:C.red,fontSize:9,letterSpacing:2,cursor:'pointer',
            borderLeft:`1px solid ${C.border}`,fontFamily:"'Space Mono',monospace",
          }}>[ ESC ] CLOSE</div>
        </div>

        {/* Sidebar */}
        <div style={{borderRight:`1px solid ${C.border}`,padding:'10px 0',background:'#0a0806',
          display:'flex',flexDirection:'column'}}>
          {CATS.map(c=>(
            <div key={c.id} onClick={()=>setCat(c.id)} style={{
              padding:'10px 14px',cursor:'pointer',marginBottom:1,
              borderLeft:cat===c.id?`3px solid ${C.red}`:'3px solid transparent',
              background:cat===c.id?'#180e08':'transparent',
            }}>
              <div style={{color:cat===c.id?C.text:C.dim,fontSize:9,
                letterSpacing:2,fontFamily:"'Space Mono',monospace"}}>{c.label}</div>
              <div style={{color:C.dim,fontSize:7,letterSpacing:1,marginTop:3,
                fontFamily:"'Space Mono',monospace"}}>{c.sub}</div>
              <div style={{color:`${C.dim}88`,fontSize:7,marginTop:2,
                fontFamily:"'Space Mono',monospace"}}>// 0 ENTRIES</div>
            </div>
          ))}
          <div style={{marginTop:'auto',padding:'10px 14px',
            color:`${C.dim}55`,fontSize:7,letterSpacing:1,
            fontFamily:"'Space Mono',monospace",borderTop:`1px solid ${C.border}40`}}>
            // NAVIGATE [ ↑↓ ]
          </div>
        </div>

        {/* Grid — empty */}
        <div style={{borderRight:`1px solid ${C.border}`,padding:20,
          display:'flex',flexDirection:'column',gap:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',
            flex:1,flexDirection:'column',gap:14}}>
            <div style={{border:`1px solid ${C.border}40`,padding:'28px 44px',textAlign:'center'}}>
              <svg width={22} height={22} viewBox="0 0 22 22" style={{marginBottom:8}}>
                <circle cx={11} cy={11} r={9} stroke={C.border} strokeWidth={1} fill="none"/>
                <line x1={11} y1={6} x2={11} y2={12} stroke={C.border} strokeWidth={1.5}/>
                <circle cx={11} cy={15} r={1} fill={C.border}/>
              </svg>
              <div style={{color:C.dim,fontSize:10,letterSpacing:3,
                fontFamily:"'Space Mono',monospace"}}>NO ENTRIES RECORDED</div>
              <div style={{color:`${C.dim}66`,fontSize:8,letterSpacing:1,marginTop:8,
                fontFamily:"'Space Mono',monospace",lineHeight:1.7}}>
                LISTEN. OBSERVE. REMEMBER.
              </div>
            </div>
          </div>
          {/* Placeholder grid slots */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:5}}>
            {Array.from({length:8},(_,i)=>(
              <div key={i} style={{height:52,border:`1px solid ${C.border}25`,
                background:`${C.panel}80`,display:'flex',alignItems:'center',
                justifyContent:'center'}}>
                <span style={{color:`${C.dim}33`,fontSize:7,
                  fontFamily:"'Space Mono',monospace"}}>/{String(i+1).padStart(3,'0')}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Detail panel */}
        <div style={{padding:22,display:'flex',flexDirection:'column',gap:10}}>
          <div style={{color:C.dim,fontSize:8,letterSpacing:3,
            fontFamily:"'Space Mono',monospace"}}>// SELECT AN ENTRY</div>
          <div style={{height:1,background:C.border}}/>
          <div style={{color:C.dim,fontSize:8,letterSpacing:1,lineHeight:1.9,
            fontFamily:"'Space Mono',monospace"}}>
            Threads are gathered<br/>through conversation<br/>and observation.<br/><br/>
            No entry will appear here<br/>until she discovers it<br/>herself.<br/><br/>
            She carries what she<br/>learns. Nowhere to<br/>write it down.
          </div>
          <div style={{marginTop:'auto'}}>
            <div style={{color:C.dim,fontSize:7,letterSpacing:2,marginBottom:5,
              fontFamily:"'Space Mono',monospace"}}>// AWARENESS LEVEL</div>
            <div style={{height:4,background:`${C.border}40`,position:'relative'}}>
              <div style={{position:'absolute',left:0,top:0,height:'100%',
                width:'0%',background:C.red}}/>
            </div>
            <div style={{color:C.dim,fontSize:7,marginTop:4,textAlign:'right',
              fontFamily:"'Space Mono',monospace"}}>0%</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── HUD ──────────────────────────────────────────────────
function Hud() {
  return (
    <>
      <div style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',
        color:C.dim,fontSize:9,letterSpacing:4,zIndex:300,
        fontFamily:"'Space Mono',monospace"}}>
        THE VEIL — DAY 09 — EVENING
      </div>
      <div style={{position:'absolute',bottom:18,right:20,zIndex:300,
        display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5}}>
        {[['← →','MOVE'],['E','INTERACT'],['TAB','THREADS']].map(([k,v])=>(
          <div key={k} style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{color:C.dim,fontSize:7,letterSpacing:2,
              fontFamily:"'Space Mono',monospace"}}>{v}</span>
            <span style={{color:C.text,fontSize:8,letterSpacing:1,
              fontFamily:"'Space Mono',monospace",
              border:`1px solid ${C.border}`,padding:'1px 7px',background:C.panel}}>{k}</span>
          </div>
        ))}
      </div>
    </>
  );
}

// ─── ATMOSPHERE ────────────────────────────────────────────
function Atmosphere({ px }) {
  const dust = useMemo(()=>Array.from({length:30},(_,i)=>({
    id:i, x:sr(i,1)*VW, y:sr(i,2)*VH,
    r:.7+sr(i,3)*1.6, spd:.12+sr(i,4)*.38, op:.12+sr(i,5)*.30,
  })),[]);
  const [t,setT]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setT(n=>n+1),80);return()=>clearInterval(id);},[]);
  const streetOff = -(px*.86)%100;

  return (
    <>
      {/* Sky */}
      <div style={{position:'absolute',inset:0,zIndex:2,pointerEvents:'none',
        background:'radial-gradient(ellipse 80% 55% at 50% 22%, #190d07 0%, #0a0704 50%, #060402 100%)'}}>
        <div style={{position:'absolute',top:'18%',left:'22%',width:300,height:200,
          background:'radial-gradient(ellipse,#c4302012 0%,transparent 70%)'}}/>
        <div style={{position:'absolute',top:'15%',left:'58%',width:220,height:160,
          background:'radial-gradient(ellipse,#d4a0200e 0%,transparent 70%)'}}/>
      </div>
      {/* Dust particles */}
      <svg style={{position:'absolute',inset:0,zIndex:46,pointerEvents:'none'}} width={VW} height={VH}>
        {dust.map(p=>{
          const y=((p.y - t*p.spd*3)%(VH+20)+VH+20)%(VH+20)-10;
          return <circle key={p.id} cx={p.x} cy={y} r={p.r} fill={C.gold} opacity={p.op}/>;
        })}
      </svg>
      {/* Street pools — light from street lamps */}
      {[-300,-50,220,480,730].map((wx,i)=>{
        const sx=(wx-px)*.72+VW/2;
        return <div key={i} style={{
          position:'absolute',bottom:0,zIndex:4,
          left:sx-70,width:140,height:116,pointerEvents:'none',
          background:'radial-gradient(ellipse 45% 38% at 50% 100%,#d4a02009 0%,transparent 100%)',
        }}/>;
      })}
      {/* Ground */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:116,zIndex:3}}>
        <svg width={VW} height={116} style={{position:'absolute',top:0,left:0}}>
          <defs>
            <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#0d0a06"/><stop offset="100%" stopColor="#060402"/>
            </linearGradient>
            <pattern id="glines" x={streetOff} y={0} width={100} height={116} patternUnits="userSpaceOnUse">
              <line x1={50} y1={0} x2={50} y2={116} stroke="#191408" strokeWidth={1}/>
            </pattern>
          </defs>
          <rect width={VW} height={116} fill="url(#gnd)"/>
          <rect width={VW} height={116} fill="url(#glines)" opacity={.45}/>
          <line x1={0} y1={0} x2={VW} y2={0} stroke={C.border} strokeWidth={1}/>
        </svg>
      </div>
      {/* Vignette */}
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',
        background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 38%,#060402a8 100%)'}}/>
      {/* Scanlines */}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',
        backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
    </>
  );
}

// ─── GAME ─────────────────────────────────────────────────
function Game() {
  const [px, setPx]         = useState(0);
  const [facing, setFacing] = useState('right');
  const [threads, setThreads] = useState(false);
  const [dlg, setDlg]       = useState(null); // {npc,idx}
  const keys = useRef({});
  const raf  = useRef(null);

  // Proximity (computed directly, no callbacks needed)
  const nearNpc = NPCS.find(n => Math.abs(n.wx - px) < 85);

  // Keys
  useEffect(()=>{
    const kd = e => {
      keys.current[e.code]=true;
      if(e.code==='Tab'){ e.preventDefault(); setThreads(s=>!s); }
      if(e.code==='KeyE'){
        if(dlg){
          const next=dlg.idx+1;
          next>=dlg.npc.lines.length ? setDlg(null) : setDlg(d=>({...d,idx:next}));
        } else if(nearNpc) {
          setDlg({npc:nearNpc,idx:0});
        }
      }
      if(e.code==='Escape') setDlg(null);
    };
    const ku = e => { delete keys.current[e.code]; };
    window.addEventListener('keydown',kd);
    window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[dlg, nearNpc]);

  // Game loop
  useEffect(()=>{
    const loop=()=>{
      const left  = keys.current['ArrowLeft']  || keys.current['KeyA'];
      const right = keys.current['ArrowRight'] || keys.current['KeyD'];
      if(!threads){
        if(left||right){ if(dlg) setDlg(null); }
        if(left){ setPx(x=>x-SPEED); setFacing('left');  }
        if(right){ setPx(x=>x+SPEED); setFacing('right'); }
      }
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf.current);
  },[dlg,threads]);

  const allB = [...FAR,...MID,...NEAR];

  return (
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:C.bg}}>
      <style>{`
        @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1.07)}45%{transform:scale(1.15)}}
        @keyframes flicker{0%,90%,100%{opacity:1}91%{opacity:.55}94%{opacity:.85}97%{opacity:.45}99%{opacity:1}}
      `}</style>

      <Atmosphere px={px}/>

      {/* Buildings */}
      <div style={{position:'absolute',inset:0,zIndex:10}}>
        {allB.map(b=><Building key={b.id} d={b} px={px}/>)}
      </div>

      {/* NPCs */}
      <div style={{position:'absolute',inset:0,zIndex:82}}>
        {NPCS.map(n=>(
          <Npc key={n.id} d={n} px={px} near={nearNpc?.id===n.id}/>
        ))}
      </div>

      {/* Character */}
      <Character facing={facing}/>

      {/* HUD + heart */}
      <Hud/>
      <Heart state="red"/>

      {/* Dialogue */}
      {dlg && !threads && (
        <Dialogue npc={dlg.npc} idx={dlg.idx}/>
      )}

      {/* Threads panel */}
      {threads && <Threads onClose={()=>setThreads(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game/>);
</script>
<script>
(function(){
  function scale(){
    const s=Math.min(window.innerWidth/1280,window.innerHeight/720);
    const w=document.getElementById('scale-wrap');
    w.style.transform=`scale(${s})`;
    w.style.marginLeft=((window.innerWidth-1280*s)/2)+'px';
    w.style.marginTop=((window.innerHeight-720*s)/2)+'px';
  }
  scale();
  window.addEventListener('resize',scale);
})();
</script>
</body>
</html>
