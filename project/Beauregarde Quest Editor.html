<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BEAUREGARDE — Quest Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080604; color: #e8d2a0; font-family: 'Space Mono', monospace; height: 100vh; overflow: hidden; }
    .editor-shell { display: flex; flex-direction: column; height: 100vh; }

    /* HEADER */
    .header { display: flex; align-items: center; background: #0e0b07; border-bottom: 1px solid #5a3a18; padding: 0 16px; height: 48px; flex-shrink: 0; }
    .header-title { color: #d4a020; font-size: 11px; font-weight: 700; letter-spacing: 3px; margin-right: 24px; white-space: nowrap; }
    .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: #7a6040; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; cursor: pointer; padding: 0 14px; height: 48px; transition: color 0.15s, border-color 0.15s; }
    .tab-btn:hover { color: #e8d2a0; }
    .tab-btn.active { color: #d4a020; border-bottom-color: #d4a020; }
    .header-spacer { flex: 1; }
    .export-btn { background: none; border: 1px solid #5a3a18; color: #7a6040; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; cursor: pointer; padding: 5px 12px; transition: all 0.15s; margin-left: 8px; }
    .export-btn:hover { border-color: #d4a020; color: #d4a020; }

    /* LAYOUT */
    .main { display: flex; flex: 1; overflow: hidden; }
    .list-panel { width: 220px; flex-shrink: 0; background: #0a0805; border-right: 1px solid #5a3a18; display: flex; flex-direction: column; overflow: hidden; }
    .list-panel-header { padding: 10px 12px; font-size: 9px; letter-spacing: 2px; color: #7a6040; border-bottom: 1px solid #2a1a08; flex-shrink: 0; }
    .list-scroll { flex: 1; overflow-y: auto; }
    .list-scroll::-webkit-scrollbar { width: 4px; }
    .list-scroll::-webkit-scrollbar-track { background: #080604; }
    .list-scroll::-webkit-scrollbar-thumb { background: #5a3a18; }
    .list-item { padding: 10px 12px; border-bottom: 1px solid #110d07; cursor: pointer; transition: background 0.1s; }
    .list-item:hover { background: #130f09; }
    .list-item.selected { background: #1a1108; border-left: 2px solid #d4a020; }
    .item-name { font-size: 11px; color: #e8d2a0; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item.selected .item-name { color: #d4a020; }
    .item-meta { font-size: 9px; color: #7a6040; }
    .list-add-btn { background: none; border: none; border-top: 1px solid #2a1a08; color: #7a6040; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; cursor: pointer; padding: 10px 12px; text-align: left; width: 100%; transition: color 0.15s; flex-shrink: 0; }
    .list-add-btn:hover { color: #d4a020; }

    /* FORM PANEL */
    .form-panel { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .form-panel::-webkit-scrollbar { width: 4px; }
    .form-panel::-webkit-scrollbar-track { background: #080604; }
    .form-panel::-webkit-scrollbar-thumb { background: #5a3a18; }
    .form-title { font-size: 13px; font-weight: 700; color: #d4a020; letter-spacing: 2px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .form-title .delete-btn { margin-left: auto; background: none; border: 1px solid #3a1a14; color: #7a3028; font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 1px; cursor: pointer; padding: 3px 8px; transition: all 0.15s; }
    .form-title .delete-btn:hover { border-color: #c43028; color: #c43028; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 9px; letter-spacing: 2px; color: #7a6040; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #1a1208; }
    .form-row { display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .form-label { font-size: 9px; letter-spacing: 1px; color: #7a6040; }
    .form-input, .form-select, .form-textarea { background: #0e0b07; border: 1px solid #2a1a08; color: #e8d2a0; font-family: 'Space Mono', monospace; font-size: 11px; padding: 6px 8px; outline: none; width: 100%; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #5a3a18; }
    .form-select { cursor: pointer; }
    .form-textarea { resize: vertical; min-height: 60px; }

    /* INLINE ITEMS */
    .inline-list { display: flex; flex-direction: column; gap: 6px; }
    .inline-item { background: #0e0b07; border: 1px solid #1a1208; padding: 10px 12px; }
    .inline-item-header { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .inline-item-id { font-size: 10px; color: #d4a020; flex: 1; font-weight: 700; }
    .inline-item-meta { font-size: 9px; color: #7a6040; }
    .expand-btn { background: none; border: none; color: #7a6040; font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; padding: 0; }
    .remove-btn { background: none; border: none; color: #3a1a14; font-family: 'Space Mono', monospace; font-size: 12px; cursor: pointer; padding: 0; line-height: 1; transition: color 0.15s; }
    .remove-btn:hover { color: #c43028; }
    .add-inline-btn { background: none; border: 1px dashed #2a1a08; color: #7a6040; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; cursor: pointer; padding: 6px 12px; text-align: left; width: 100%; transition: all 0.15s; margin-top: 6px; }
    .add-inline-btn:hover { border-color: #5a3a18; color: #d4a020; }

    /* TRUST BADGES */
    .trust-badge { display: inline-block; font-size: 8px; letter-spacing: 1px; padding: 2px 6px; border: 1px solid; white-space: nowrap; }
    .trust-0 { color: #7a6040; border-color: #3a2808; }
    .trust-1 { color: #a0802a; border-color: #5a4018; }
    .trust-2 { color: #d4a020; border-color: #7a5a10; }
    .trust-3 { color: #ff8020; border-color: #8a4a10; }
    .trust-4 { color: #ff5030; border-color: #8a2a18; }

    /* TAGS */
    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .tag { background: #1a1208; border: 1px solid #2a1a08; color: #a08060; font-size: 9px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; }
    .tag-remove { background: none; border: none; color: #5a3a18; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; transition: color 0.15s; }
    .tag-remove:hover { color: #c43028; }
    .tag-add-input { background: none; border: 1px dashed #2a1a08; color: #e8d2a0; font-family: 'Space Mono', monospace; font-size: 9px; padding: 2px 6px; outline: none; width: 100px; }
    .tag-add-input::placeholder { color: #3a2808; }

    /* TRUST STAGES (dialogue) */
    .trust-stage { border: 1px solid #1a1208; margin-bottom: 8px; }
    .trust-stage-header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; background: #0e0b07; }
    .trust-stage-body { padding: 12px; border-top: 1px solid #1a1208; display: flex; flex-direction: column; gap: 8px; }

    .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #3a2808; font-size: 11px; letter-spacing: 1px; }

    /* THOUGHTS TAB */
    .voice-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .thought-preview { font-size: 9px; color: #7a6040; font-style: italic; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }

    /* MAP TAB */
    .map-shell { display:flex; flex:1; overflow:hidden; }
    .map-canvas-wrap { flex:1; position:relative; overflow:hidden; background:#060402; cursor:default; }
    .map-canvas-wrap.panning { cursor:grabbing; }
    .map-grid-bg { position:absolute; inset:0; background-image: repeating-linear-gradient(0deg,#0f0b06 0,#0f0b06 1px,transparent 1px,transparent 40px), repeating-linear-gradient(90deg,#0f0b06 0,#0f0b06 1px,transparent 1px,transparent 40px); pointer-events:none; }
    .map-viewport { position:absolute; transform-origin:0 0; }
    .map-node { position:absolute; width:160px; min-height:80px; border:1px solid #3a2808; background:#0e0b07; padding:10px 12px; cursor:grab; -webkit-user-select:none; user-select:none; transition:border-color .1s,box-shadow .1s; }
    .map-node:hover { border-color:#5a3a18; }
    .map-node.selected { border-color:#d4a020; box-shadow:0 0 0 1px #d4a020; }
    .map-node.dragging { cursor:grabbing; box-shadow:0 4px 20px rgba(0,0,0,.6); z-index:100; }
    .map-node-id { font-size:8px; color:#5a3a18; letter-spacing:1px; margin-bottom:3px; }
    .map-node-name { font-size:11px; color:#e8d2a0; font-weight:700; margin-bottom:4px; }
    .map-node-type { font-size:8px; color:#7a6040; margin-bottom:6px; }
    .map-node-ports { display:flex; justify-content:space-between; margin-top:6px; }
    .map-port { width:10px; height:10px; border-radius:50%; border:1px solid #5a3a18; background:#0e0b07; cursor:crosshair; flex-shrink:0; transition:background .1s,border-color .1s; }
    .map-port:hover,.map-port.active { background:#d4a020; border-color:#d4a020; }
    .map-port.left { margin-left:-6px; }
    .map-port.right { margin-right:-6px; }
    .map-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .map-connection { stroke:#5a3a18; stroke-width:1.5; fill:none; }
    .map-connection.selected { stroke:#d4a020; }
    .map-detail { width:300px; flex-shrink:0; background:#0a0805; border-left:1px solid #2a1a08; overflow-y:auto; display:flex; flex-direction:column; }
    .map-detail::-webkit-scrollbar { width:4px; }
    .map-detail::-webkit-scrollbar-thumb { background:#3a2808; }
    .map-detail-header { padding:12px; border-bottom:1px solid #1a1208; font-size:9px; letter-spacing:2px; color:#7a6040; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
    .map-detail-body { padding:12px; flex:1; }
    .map-toolbar { position:absolute; bottom:12px; left:12px; display:flex; gap:6px; }
    .map-tool-btn { background:#0e0b07; border:1px solid #2a1a08; color:#7a6040; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1px; cursor:pointer; padding:5px 10px; transition:all .15s; }
    .map-tool-btn:hover { border-color:#5a3a18; color:#d4a020; }
    .map-minimap { position:absolute; bottom:12px; right:312px; width:160px; height:100px; background:#0a0805; border:1px solid #2a1a08; overflow:hidden; }
    .map-mini-node { position:absolute; width:12px; height:8px; background:#3a2808; border:1px solid #5a3a18; }

    /* TREE TAB */
    .tree-shell { display:flex; flex:1; overflow:hidden; }
    .tree-left { width:200px; flex-shrink:0; background:#0a0805; border-right:1px solid #2a1a08; display:flex; flex-direction:column; overflow:hidden; }
    .tree-left-header { padding:10px 12px; font-size:9px; letter-spacing:2px; color:#7a6040; border-bottom:1px solid #1a1208; flex-shrink:0; }
    .tree-canvas-wrap { flex:1; position:relative; overflow:hidden; background:#060402; }
    .tree-canvas-wrap.panning { cursor:grabbing; }
    .tree-viewport { position:absolute; transform-origin:0 0; }
    .tree-svg { position:absolute; inset:0; pointer-events:none; overflow:visible; }
    .tree-node { position:absolute; min-width:220px; max-width:280px; border-radius:2px; cursor:grab; -webkit-user-select:none; user-select:none; }
    .tree-node.dragging { cursor:grabbing; z-index:100; }
    .tree-node-header { padding:6px 10px; display:flex; align-items:center; gap:6px; font-size:9px; font-weight:700; letter-spacing:2px; }
    .tree-node-body { padding:8px 10px; font-size:10px; line-height:1.5; }
    .tree-node-footer { padding:4px 10px 8px; display:flex; gap:6px; flex-wrap:wrap; }
    .tree-port-row { display:flex; justify-content:space-between; align-items:center; padding:0 0 4px; }
    .tree-port { width:12px; height:12px; border-radius:50%; cursor:crosshair; flex-shrink:0; border:2px solid rgba(255,255,255,.2); }
    .tree-port:hover { border-color:rgba(255,255,255,.7); }
    .tree-port.in { margin-left:-6px; }
    .tree-port.out { margin-right:-6px; }
    .tree-out-label { font-size:8px; color:rgba(255,255,255,.5); letter-spacing:1px; flex:1; text-align:right; padding-right:6px; }
    .tree-palette-item { padding:8px 12px; display:flex; align-items:center; gap:8px; cursor:pointer; border-bottom:1px solid #110d07; transition:background .1s; font-size:9px; letter-spacing:1px; }
    .tree-palette-item:hover { background:#130f09; }
    .tree-palette-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .tree-detail { width:280px; flex-shrink:0; background:#0a0805; border-left:1px solid #2a1a08; overflow-y:auto; display:flex; flex-direction:column; }
    .tree-detail::-webkit-scrollbar { width:4px; }
    .tree-detail::-webkit-scrollbar-thumb { background:#3a2808; }
    .tree-detail-header { padding:12px; border-bottom:1px solid #1a1208; font-size:9px; letter-spacing:2px; flex-shrink:0; }
    .tree-detail-body { padding:12px; flex:1; display:flex; flex-direction:column; gap:10px; }
    .tree-toolbar { position:absolute; bottom:12px; left:12px; display:flex; gap:6px; }
    .tree-tool-btn { background:#0e0b07; border:1px solid #2a1a08; color:#7a6040; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1px; cursor:pointer; padding:5px 10px; transition:all .15s; }
    .tree-tool-btn:hover { border-color:#5a3a18; color:#d4a020; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const TRUST_LABELS = ['Stranger', 'Acquaintance', 'Contact', 'Ally', 'Confidant'];
const CATEGORIES = ['personal', 'community', 'institutional', 'location', 'mystery'];
const TRIGGER_TYPES = ['overhear', 'job', 'dream', 'npc_mention', 'location'];
const REWARD_TYPES = ['Information_Access', 'Location_Access', 'Relationship_Deepening', 'Job_Unlock', 'NPC_Access'];
const VOICE_NAMES = ['FEAR','BODY','SURVIVAL','INSTINCT','CONFUSION','DENIAL','MEMORY','TRAUMA','GRIEF','RAGE','GUILT','ACCEPTANCE','CURIOSITY','NUMBNESS','DISSOCIATION'];
const VOICE_COLORS = {FEAR:'#c43028',BODY:'#7a7a7a',SURVIVAL:'#d4802a',INSTINCT:'#2ab840',CONFUSION:'#8060c0',DENIAL:'#605060',MEMORY:'#3060b0',TRAUMA:'#802020',GRIEF:'#2040a8',RAGE:'#d05020',GUILT:'#b09020',ACCEPTANCE:'#4080c0',CURIOSITY:'#9060d0',NUMBNESS:'#507080',DISSOCIATION:'#b0c0d0'};
const THOUGHT_CATS = ['Survival Needs','Fear/Hypervigilance','Physical State','Memory/Realization','Investigation/Connections','Emotional/Moral Weight','Environment/Spatial','Decision-Making'];
const THOUGHT_TRIGGERS = ['context','narrative','random','npc','item','time','location','state','quest'];
const FREQ_OPTS = ['always','sometimes','rare'];
const uid = () => Math.random().toString(36).slice(2, 9);

// ── Factories ──────────────────────────────────────────────────
const newThread    = () => ({ id:'', content:'', sourceNPC:'', requiredTrust:2, location:'', trigger:'', unlocks:'', memoryNode:'' });
const newReward    = () => ({ type:'Information_Access', content:'', mechanicalResult:'', narrativeResult:'' });
const newConnection= () => ({ title:'', pieceA:'', pieceB:'', pieceC:'', result:'', unlocks:'' });
const newQuest     = () => ({ _id:uid(), id:'', name:'New Quest', category:'personal', description:'', startTrigger:{type:'overhear',location:'',condition:'',result:''}, threads:[], connections:[], completion:{requiredPieces:[],trigger:'',narrative:'',mechanicalResults:[]}, rewards:[], failureState:{timeline:'',result:'',consequence:''} });
const newCharacter = () => ({ _id:uid(), id:'', name:'New NPC', age:'', role:'', visualArchetype:'', threads:[], personality:{motivation:'',fear:'',strength:'',weakness:'',speechPattern:'',tags:[]}, relationships:[], arc: TRUST_LABELS.map(l=>({trust:l,description:''})) });
const newDialogue  = () => ({ _id:uid(), id:'', npcId:'', context:'', trigger:'', location:'', stages: TRUST_LABELS.map((l,i)=>({trust:i,label:l,text:'',behavior:'',subtext:'',infoShared:[],relationshipChange:0,nextNodes:[]})) });
const newPlace     = () => ({ _id:uid(), id:'', name:'New Location', type:'', district:'The Veil', accessType:'Public', description:'', atmosphere:'', fogDescription:'', npcs:[], threads:[], jobs:[], questTriggers:[] });
const newThought   = () => ({ _id:uid(), id:'', voice:'FEAR', category:'Survival Needs', triggerType:'context', triggerCondition:'', gameState:'', text:'', frequency:'sometimes', location:'', notes:'' });

// ── Seed Data ──────────────────────────────────────────────────
const SEED = {
  quests:[
    {
      _id:'q1', id:'marcus_investigation', name:'The Missing Supply Runner', category:'personal',
      description:"Marcus Bellamy disappeared. Supply chains. Bureau interest. The threads all connect. His grandmother still comes to the jazz club every Friday.",
      startTrigger:{ type:'overhear', location:'corner_store', condition:'Working store clerk shift, customer mentions Marcus', result:'Thread marcus_name unlocked' },
      threads:[
        { id:'marcus_name',    content:'Marcus is a real person who disappeared',                                                                                        sourceNPC:'anonymous_customer',  requiredTrust:0, location:'corner_store',     trigger:'random_conversation_during_shift',        unlocks:'ability_to_ask_about_marcus', memoryNode:'marcus_name' },
        { id:'marcus_job',     content:'Marcus worked in supply chains / logistics',                                                                                     sourceNPC:'raymond',             requiredTrust:2, location:'corner_store',     trigger:'direct_question_about_marcus',            unlocks:'thread_chain_continues',      memoryNode:'marcus_employment' },
        { id:'marcus_family',  content:"Marcus was someone's grandson — grandmother comes to the jazz club every Friday, sits near the stage, grieves alone",            sourceNPC:'marcus_grandmother',  requiredTrust:3, location:'jazz_club_main',   trigger:'observe_grandmother_at_friday_table',     unlocks:'emotional_weight_deepens',    memoryNode:'marcus_identity' },
        { id:'marcus_capture', content:'Marcus was captured by the Bureau program',                                                                                      sourceNPC:'mechanic',            requiredTrust:3, location:'mechanic_workshop', trigger:'discuss_modifications',                   unlocks:'program_connection',          memoryNode:'marcus_fate' },
        { id:'drain_location', content:'Marcus is being held underground in The Drain',                                                                                  sourceNPC:'maintenance_foreman', requiredTrust:3, location:'maintenance_access', trigger:'question_about_underground',             unlocks:'can_attempt_descent',         memoryNode:'marcus_location' },
      ],
      connections:[
        { title:'Marcus + Program Scope',   pieceA:'marcus_asked_about_modifications', pieceB:'modification_tracking_system', pieceC:'program_captures_modified_people', result:'Marcus was captured, not just missing', unlocks:'mechanic_job_access' },
        { title:'Marcus + Drain Location',  pieceA:'marcus_seen_underground',          pieceB:'drain_entrance_location',       pieceC:'infrastructure_maps',              result:'Player can attempt descent',            unlocks:'final_quest_stage' },
      ],
      completion:{ requiredPieces:['marcus_name','marcus_job','marcus_family','marcus_capture','drain_location'], trigger:"Player learns all major pieces OR reaches critical mass", narrative:"Player understands Marcus's fate", mechanicalResults:['Unlock descent_preparation','Unlock mechanic_job_final_stage','Unlock underground_network_contact'] },
      rewards:[
        { type:'Information_Access',     content:"Full understanding of Marcus's fate",          mechanicalResult:'Memory map shows completed thread',             narrativeResult:'Player knows what happened' },
        { type:'Location_Access',        content:'Drain entrance becomes navigable',              mechanicalResult:'Can attempt descent with preparation',          narrativeResult:'Physical access to rescue attempt' },

    {

      description:"She wakes in a shower. Something is on her. Everything she knows is gone. The apartment has answers. The neighborhood has more. Three mysteries. No map.",

        { id:'phone_call',         content:"Automated recording: mother has been gone a long time. Find the network. Medical precision. The message was RECORDED — prepared before everything.", sourceNPC:'automated_recording', requiredTrust:0, location:'apartment_studio', trigger:'smartphone_answered', unlocks:'street_entry', memoryNode:'automated_message' },
        { id:'descent_choice',     content:'Stairs (lights turn on ahead of her, guided descent) or elevator (person in darkness, silent protection)?',                                  sourceNPC:'',                 requiredTrust:0, location:'hallway_4f',         trigger:'stairs_or_elevator_choice',       unlocks:'lobby',                 memoryNode:'descent_path' },
        { id:'raymond_contact',    content:'Raymond at the corner store — first confirmed network contact. Money or no money changes the conversation.',                                  sourceNPC:'raymond',          requiredTrust:0, location:'corner_store',       trigger:'entering_corner_store',           unlocks:'street_network_active', memoryNode:'raymond_met' },
        { id:'computer_password',  content:'Three paths: Diego trusts her with it, crumpled note in trash (flower signature), or sticky note on lobby router',                           sourceNPC:'',                 requiredTrust:0, location:'apartment_studio',   trigger:'computer_login_attempt',          unlocks:'articles',              memoryNode:'password_path' },
        { id:'collette_discovered',content:'Article 5: Collette Leeks — gone for YEARS. Octopus goes full crimson. White room memory surfaces: "The Leeks sequence. The combiner gene."', sourceNPC:'',                 requiredTrust:0, location:'apartment_studio',   trigger:'article_5_read',                  unlocks:'three_mysteries_active',memoryNode:'collette_discovery' },

    _id:'d2', id:'keeper_first_meeting', npcId:'charlie_winston', context:'Player enters Alley Way store for the first time. Charlie is behind the counter watching muted footage on a TV. Does not look up when the door opens.', trigger:'Player enters alley_way — first visit', location:'alley_way',
    stages:[
      { trust:0, label:'Stranger',
        text:'"We\'re closed."\n\nThe sign on the door says OPEN. He still does not look up from the screen. On the TV behind him: old footage, no sound.\n\n— "The sign says open."\n— "I\'m looking for something."\n— (Wait without speaking.)\n\nIf player waits: He eventually looks up. "You know how to be still. Most people can\'t do that anymore." He goes back to the screen. The door stays open.\nIf player mentions sign: "Signs tell you what someone wants you to think. What do you read when no one\'s trying to tell you something?"\nIf player says looking: "Everybody who finds this place is looking for something. The question is whether you\'re ready to find it."',
        behavior:'Testing from the first moment. Not hostile. Measuring patience and whether the player notices what\'s on the screen.',
        subtext:'The knowledge-currency mechanic is established before it is named. The footage on the TV is always playing — always available to be noticed.',
        infoShared:[], relationshipChange:0.1, nextNodes:['keeper_what_do_you_know'] },
      { trust:1, label:'Acquaintance',
        text:'"You\'ve been back." He turns down the TV volume slightly — not off. "What do you know about this neighborhood? Not what you\'ve read. What do you actually know?"\n\nIf the player mentions the MOVE bombing, the Bureau, Marcus, or the network:\n"Good. That\'s real." He nods once.\n\n"May 13th, 1985. Philadelphia. The city government dropped a military bomb on a residential block. 11 people died — five of them children. 61 homes burned to the ground. The fire commissioner told firefighters to let it burn." Pause. "The only person who went to prison for it was someone who survived."\n\n"There\'s a tape. First one is free. Watch it. Then come back."',
        behavior:'The exchange is now direct. He names the bombing plainly, as a starting point — not an argument, a fact.',
        subtext:'The player hears the core of the 1985 history before they see the video. The video deepens it.',
        infoShared:['move_bombing_1985','knowledge_currency_active'], relationshipChange:0.2, nextNodes:['keeper_first_video_offer'] },
      { trust:2, label:'Contact',
        text:'"You watched it." Not a question. He looks at her for a moment.\n\n"Ramona Africa said: \'Nobody was ever arrested for the murder of my family. Nobody went to jail but me.\'" Pause. "She said that in 2022. She still has the burn scars. Someone told her to get cosmetic surgery. She said, \'Why would I want to take it off? I want to be reminded.\'" \n\n"This archive started in 1985. People in this neighborhood who understood what had just been demonstrated: that the government could bomb a city block and face nothing — nothing — if no one kept the record." He looks at the shelves. "They kept the record."\n\n"The rest of the archive has a cost. Money or knowledge. Depends what you have."',
        behavior:'Honoring that the player watched. Sharing Ramona\'s words directly. Explaining why the archive exists — not for memory but against forgetting.',
        subtext:'The distinction matters: memory is passive, keeping the record is active resistance. This is the archive\'s purpose.',
        infoShared:['ramona_testimony_heard','archive_origin_1985','knowledge_currency_terms'], relationshipChange:0.3, nextNodes:['keeper_archive_intro','keeper_bureau_pattern'] },
      { trust:3, label:'Ally',
        text:'"You\'ve been coming back. That\'s not nothing." He pauses. The footage on the TV switches to something else — faces, a street, old.\n\n"The line between 1985 and what\'s happening now — what the Bureau is doing — is shorter than they want you to believe. Different tools. Same intent. Bomb a house, disappear a person — the method changes. The goal doesn\'t."\n\nAnother pause.\n\n"I have footage of Collette Leeks. Not rumors. She found this place — came in like you, watching, quiet. She understood immediately what it was. What it meant. I have tape of her saying: \'They\'re going to come for people like me eventually. The question is what gets left behind.\'" He doesn\'t move. "That was three years before she disappeared."',
        behavior:'Full trust. Connecting the historical pattern to the present. The Collette thread deepens — she found the archive, she understood it, she knew.',
        subtext:'Collette didn\'t build the archive — she recognized it. She was shaped by it. Her disappearance is part of a longer pattern.',
        infoShared:['collette_found_archive','collette_she_knew','bureau_pattern_1985_to_now'], relationshipChange:0.4, nextNodes:['keeper_collette_footage_offer','keeper_archive_deeper'] },
      { trust:4, label:'Confidant',
        text:'"The store was somebody else\'s idea. Not mine. A man named Curtis who lived through \'85. He said, \'The Bureau doesn\'t look at things that seem past their time.\' He died in 2009 and I kept it going." He opens a door behind the counter that was not visible before.\n\n"The archive is down here. Everything Curtis started. Everything added since. Four decades of people making sure that what happened cannot be made into nothing." He stands at the door. Doesn\'t push.\n\n"You\'re not the first person I\'ve opened this door for. You won\'t be the last. But you understand what it\'s for. That matters more than anything else."',
        behavior:'Complete openness. Archive fully accessible. He waits — the choice belongs to the player.',
        subtext:'The archive has a human origin: Curtis, a survivor of 1985. The Keeper is a steward, not a founder. This is bigger than any one person.',
        infoShared:['full_archive_access','curtis_founded_archive','archive_is_collective'], relationshipChange:0.5, nextNodes:['keeper_archive_descent'] },
    ]

    _id:'d3', id:'keeper_why_move', npcId:'charlie_winston', context:'Charlie asks the player why this area is called MOVE. Triggered after Contact trust is established — after the player has watched the first tape or demonstrated genuine engagement with the history. He asks it quietly, without ceremony. It is a test and a gift at the same time.', trigger:'Trust ≥ 2 — player has engaged with the first video or named the bombing correctly', location:'alley_way',
    stages:[
      { trust:0, label:'Stranger',
        text:'(Not available. He does not ask questions he does not trust you to receive.)',
        behavior:'Silent. He watches the screen.',
        subtext:'The question is not offered to strangers.',
        infoShared:[], relationshipChange:0, nextNodes:[] },
      { trust:1, label:'Acquaintance',
        text:'(Not yet. He is still watching to see if you come back.)',
        behavior:'Polite. Measured. Not unfriendly.',
        subtext:'The question is waiting for the right moment.',
        infoShared:[], relationshipChange:0, nextNodes:[] },
      { trust:2, label:'Contact',
        text:'He is watching the footage when you come in. He lets you stand there for a while.\n\nThen: "Do you know why this area is called MOVE?"\n\n—  "The organization. 1973."\n—  "I\'ve heard the name."\n—  (Stay quiet.)\n\nIf the player knows:\nHe nods once. "Tell me what you know." He listens without interrupting. Then he fills in what is missing.\n\nIf the player has heard it:\n"Hearing is a start." He begins.\n\nIf the player is quiet:\nThe silence is fine with him. He begins anyway.\n\n— — —\n\n"John Africa founded it in 1973. West Philadelphia. They believed in living the way things were meant to be lived. Communal. Close to the ground. Against what the city was becoming." He pauses. "They called themselves MOVE because nothing in John Africa\'s teachings had a name that could be boxed in."\n\n— — —\n\n"The city didn\'t like that. Cities never do. 1978, a shootout at their headquarters. One police officer dead. Nine MOVE members arrested. Thirty to a hundred years each." He looks at the screen. "Those nine people — the MOVE 9 — they\'re the reason what happened in \'85 happened. The family was protesting their imprisonment. Had been for years. The city decided it was done listening."\n\n— — —\n\n"May 13th, 1985. They\'d moved to Osage Avenue. A residential block. Middle-class Black neighborhood. The city said they were a nuisance. Loudspeakers. Sanitation complaints." He is quiet for a moment. "What cities say when they want something gone."\n\n— — —\n\n"At five thirty-five in the afternoon, after ten thousand rounds of ammunition had failed, a state police helicopter dropped a bomb on the house. A satchel bomb. Military grade. On a row house in Philadelphia."\n\nHe stops.\n\n"The fire commissioner told them to let it burn."\n\n— — —\n\n"Sixty-one homes. An entire city block. Eleven people dead. Five of them were children." He pauses. The screen flickers. "The two who got out — one was a thirteen-year-old boy. The other was a woman named Ramona Africa. She came out of a burning building and they put handcuffs on her burns. She was the only one ever charged with anything. She served seven years."\n\n— — —\n\n"Nobody else went to prison. Nobody was fired. The mayor, the commissioner, the fire department — investigations. Hearings. They all went home."\n\n— — —\n\n"The city spent thirty-three million dollars rebuilding the houses. Sinking foundations. Leaky roofs. Some of the people who lived there never came back."\n\nHe looks at her.\n\n"This area carries that name because the people who stayed decided it would. Not to mourn. To make sure it couldn\'t be made into nothing." He turns back to the screen. "The Bureau understands that. It\'s why they watch this block."',
        behavior:'Patient. Methodical. He does not dramatize it. He states it the way someone states a thing they have carried a long time — without weight in the voice, because the weight is in the facts.',
        subtext:'The player now understands why this place exists and what it is protecting. The connection between 1985 and the Bureau\'s present work is named directly.',
        infoShared:['move_history_full','move_9','osage_avenue_bombing','ramona_africa','archive_purpose_named'], relationshipChange:0.4, nextNodes:['keeper_first_video_offer','keeper_archive_intro'] },
      { trust:3, label:'Ally',
        text:'If the player asks again or returns to the question:\n\n"I was twelve years old when it happened." He says it without introduction. "I didn\'t live on Osage Avenue. But I could see the sky from where I was. The whole sky was orange." He is quiet. "My mother took me inside. She didn\'t say anything. She didn\'t need to."\n\n— — —\n\n"Curtis — the man who started this archive — he was on that block. Not in the house. He was a neighbor. He watched it. He watched them let it burn." Another pause. "He said: if we don\'t keep the record, it becomes something that happened to strange people who lived strangely. He said: I won\'t let that happen. I was there. I know what they were. They were people."\n\n— — —\n\n"Ramona Africa is still alive. She still has the burn scars. Someone told her once she should get cosmetic surgery, they could take them off." He looks at the shelves. "She said: why would I want to take them off. I want to be reminded."\n\nHe nods once, slowly.\n\n"That\'s the right answer."',
        behavior:'Personal now. Not performed grief — stated memory. He was a child when it happened. Curtis is named for the first time with human context.',
        subtext:'The history becomes intimate. The archive is now connected to specific people making specific choices. Ramona Africa\'s quote is delivered as its own complete thought.',
        infoShared:['keeper_was_twelve','curtis_was_neighbor','ramona_africa_scars','ramona_africa_quote'], relationshipChange:0.3, nextNodes:['keeper_archive_deeper'] },
      { trust:4, label:'Confidant',
        text:'He has told you everything. He knows that. So if you ask again, he says only:\n\n"Ramona Africa said: \'As long as we can fight, we\'re going to fight.\'" He lets that stand for a moment. "She said that forty years after they dropped the bomb. Forty years." He turns off the TV. "Curtis used to say the same thing in different words. The words change. The thing doesn\'t."\n\nHe opens the door to the archive.\n\n"Everything down there — that\'s what the words mean when you put them somewhere they can\'t be taken away."',
        behavior:'Complete. He is not explaining anymore. He is sharing the inheritance.',
        subtext:'The archive is not a memorial. It is an act of ongoing resistance. The player understands this now at the deepest level.',
        infoShared:['ramona_africa_final_quote','archive_as_resistance_act'], relationshipChange:0.2, nextNodes:['keeper_archive_descent'] },
    ]
  }],

// ── Shared Components ──────────────────────────────────────────
function Field({ label, children }) {
  return <div className="form-group"><div className="form-label">{label}</div>{children}</div>;
}
function TextInput({ value, onChange, placeholder }) {
  return <input className="form-input" value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder||''} />;
}
function TextArea({ value, onChange, placeholder, rows=3 }) {
  return <textarea className="form-textarea" value={value||''} onChange={e=>onChange(e.target.value)} placeholder={placeholder||''} rows={rows} />;
}
function Sel({ value, onChange, options }) {
  return (
    <select className="form-select" value={value} onChange={e=>onChange(e.target.value)}>
      {options.map(o=>{
        const v = typeof o==='string'?o:o.value;
        const l = typeof o==='string'?o:o.label;
        return <option key={v} value={v}>{l}</option>;
      })}
    </select>
  );
}
function TrustBadge({ level }) {
  return <span className={`trust-badge trust-${level}`}>{TRUST_LABELS[level]}</span>;
}
function TagList({ tags=[], onChange }) {
  const [inp, setInp] = useState('');
  const add = () => { const t=inp.trim(); if(t&&!tags.includes(t)) onChange([...tags,t]); setInp(''); };
  return (
    <div className="tag-list">
      {tags.map(t=>(
        <span key={t} className="tag">{t}<button className="tag-remove" onClick={()=>onChange(tags.filter(x=>x!==t))}>×</button></span>
      ))}
      <input className="tag-add-input" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="+ add..." />
    </div>
  );
}

function QuestsTab({ data, setData }) {
  const [sel,setSel]=useState(data.quests[0]?._id||null);
  const selected=data.quests.find(q=>q._id===sel);
  const add=()=>{ const q=newQuest(); setData(d=>({...d,quests:[...d.quests,q]})); setSel(q._id); };
  const upd=q=>setData(d=>({...d,quests:d.quests.map(x=>x._id===q._id?q:x)}));
  const del=id=>{ const rem=data.quests.filter(q=>q._id!==id); setData(d=>({...d,quests:rem})); setSel(rem[0]?._id||null); };
  return (
    <div className="main">
      <div className="list-panel">
        <div className="list-panel-header">QUESTS</div>
        <div className="list-scroll">
          {data.quests.map(q=>(
            <div key={q._id} className={`list-item ${q._id===sel?'selected':''}`} onClick={()=>setSel(q._id)}>
              <div className="item-name">{q.name||'Untitled'}</div>
              <div className="item-meta">{q.category} · {q.threads?.length||0} threads</div>
            </div>
          ))}
        </div>
        <button className="list-add-btn" onClick={add}>+ NEW QUEST</button>
      </div>
      <div className="form-panel">
        {selected?<QuestForm quest={selected} onChange={upd} onDelete={()=>del(selected._id)} />:<div className="empty-state">SELECT A QUEST OR CREATE ONE</div>}
      </div>
    </div>
  );
}

function MapTab({data,setData}){
  const { useRef:uR, useCallback:uCB, useEffect:uE, useState:uS } = React;
  const nodes = data.mapNodes||[];
  const conns = data.mapConns||[];
  const setNodes = ns => setData(d=>({...d,mapNodes:ns}));
  const setConns = cs => setData(d=>({...d,mapConns:cs}));

  const [sel,setSel]=uS(null);
  const [pan,setPan]=uS({x:40,y:40});
  const [zoom,setZoom]=uS(1);
  const [dragging,setDragging]=uS(null);
  const [panning,setPanning]=uS(false);
  const [connStart,setConnStart]=uS(null);
  const [mousePos,setMousePos]=uS({x:0,y:0});
  const wrapRef=uR(null);
  const panRef=uR(null);
  const dragRef=uR(null);

  const toCanvas=(cx,cy)=>({ x:(cx-pan.x)/zoom, y:(cy-pan.y)/zoom });

  const onWrapMouseDown=uCB(e=>{
    if(e.target===wrapRef.current||e.target.classList.contains('map-grid-bg')){
      panRef.current={startX:e.clientX-pan.x,startY:e.clientY-pan.y};
      setPanning(true);
    }
  },[pan]);

  const onMouseMove=uCB(e=>{
    const rect=wrapRef.current?.getBoundingClientRect();
    if(rect) setMousePos({x:e.clientX-rect.left,y:e.clientY-rect.top});
    if(panning&&panRef.current){
      setPan({x:e.clientX-panRef.current.startX,y:e.clientY-panRef.current.startY});
    }
    if(dragging&&dragRef.current){
      const dx=(e.clientX-dragRef.current.sx)/zoom;
      const dy=(e.clientY-dragRef.current.sy)/zoom;
      setNodes(nodes.map(n=>n._id===dragging?{...n,x:dragRef.current.ox+dx,y:dragRef.current.oy+dy}:n));
    }
  },[panning,dragging,nodes,zoom]);

  const onMouseUp=uCB(()=>{ setPanning(false); setDragging(null); },[]);
  const onWheel=uCB(e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.9; setZoom(z=>Math.max(0.3,Math.min(3,z*f))); },{passive:false},[]);

  uE(()=>{
    const el=wrapRef.current; if(!el) return;
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[onWheel]);

  const startNodeDrag=(e,id)=>{
    if(e.button!==0) return;
    e.stopPropagation();
    const n=nodes.find(x=>x._id===id);
    dragRef.current={sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};
    setDragging(id); setSel(id);
  };

  const addNode=()=>{
    const n=newMapNode(null);
    n.x=(-pan.x/zoom)+200+Math.random()*100;
    n.y=(-pan.y/zoom)+100+Math.random()*100;
    setNodes([...nodes,n]); setSel(n._id);
  };
  const addFromPlace=(p)=>{
    const exists=nodes.find(n=>n.placeId===p._id);
    if(exists){setSel(exists._id);return;}
    const n=newMapNode(p);
    n.x=(-pan.x/zoom)+200+nodes.length*40%300;
    n.y=(-pan.y/zoom)+100+nodes.length*30%200;
    setNodes([...nodes,n]); setSel(n._id);
  };

  const onPortClick=(e,nodeId,side)=>{
    e.stopPropagation();
    if(!connStart){ setConnStart({nodeId,side}); return; }
    if(connStart.nodeId===nodeId){ setConnStart(null); return; }
    const exists=conns.find(c=>(c.from===connStart.nodeId&&c.to===nodeId)||(c.from===nodeId&&c.to===connStart.nodeId));
    if(!exists) setConns([...conns,{id:uid(),from:connStart.nodeId,to:nodeId,label:''}]);
    setConnStart(null);
  };

  const selNode=nodes.find(n=>n._id===sel);

  // compute connection paths
  const getNodeCenter=(id)=>{
    const n=nodes.find(x=>x._id===id); if(!n) return null;
    return {x:n.x*zoom+pan.x+MAP_NODE_W*zoom/2, y:n.y*zoom+pan.y+MAP_NODE_H*zoom/2};
  };

  return(
    <div className="map-shell">
      <div ref={wrapRef} className={`map-canvas-wrap${panning?' panning':''}`}
        onMouseDown={onWrapMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp}
      >
        <div className="map-grid-bg" />
        <svg className="map-svg">
          {conns.map(c=>{
            const a=getNodeCenter(c.from),b=getNodeCenter(c.to); if(!a||!b) return null;
            const mx=(a.x+b.x)/2;
            return <g key={c.id}>
              <path className={`map-connection${sel===c.id?' selected':''}`}
                d={`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`}
                onClick={()=>setSel(c.id)} style={{pointerEvents:'stroke',cursor:'pointer'}} />
            </g>;
          })}
          {connStart&&(()=>{
            const n=nodes.find(x=>x._id===connStart.nodeId); if(!n) return null;
            const sx=n.x*zoom+pan.x+(connStart.side==='right'?MAP_NODE_W*zoom:0);
            const sy=n.y*zoom+pan.y+MAP_NODE_H*zoom/2;
            return <line x1={sx} y1={sy} x2={mousePos.x} y2={mousePos.y} stroke="#d4a020" strokeWidth="1" strokeDasharray="4,3" />;
          })()}
        </svg>
        <div className="map-viewport" style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`}}>
          {nodes.map(n=>(
            <div key={n._id}
              className={`map-node${sel===n._id?' selected':''}${dragging===n._id?' dragging':''}`}
              style={{left:n.x,top:n.y,width:MAP_NODE_W,minHeight:MAP_NODE_H}}
              onMouseDown={e=>startNodeDrag(e,n._id)}
            >
              <div className="map-node-id">{n.placeId||n._id.slice(0,6)}</div>
              <div className="map-node-name">{n.label||'Location'}</div>
              <div className="map-node-type">{n.type||'—'}</div>
              {(n.worldXMin||n.worldXMax)&&<div style={{fontSize:8,color:'#5a3a18',marginTop:2}}>X {n.worldXMin}–{n.worldXMax}</div>}
              <div className="map-node-ports">
                <div className={`map-port left${connStart?.nodeId===n._id?' active':''}`} onClick={e=>onPortClick(e,n._id,'left')} title="Connect" />
                <div className={`map-port right${connStart?.nodeId===n._id?' active':''}`} onClick={e=>onPortClick(e,n._id,'right')} title="Connect" />
              </div>
            </div>
          ))}
        </div>
        <div className="map-toolbar">
          <button className="map-tool-btn" onClick={addNode}>+ NEW NODE</button>
          <button className="map-tool-btn" onClick={()=>{ setPan({x:40,y:40}); setZoom(1); }}>RESET VIEW</button>
          {connStart&&<button className="map-tool-btn" style={{color:'#d4a020',borderColor:'#d4a020'}} onClick={()=>setConnStart(null)}>CANCEL CONNECTION</button>}
          {sel&&conns.find(c=>c.id===sel)&&<button className="map-tool-btn" style={{color:'#c43028'}} onClick={()=>{setConns(conns.filter(c=>c.id!==sel));setSel(null);}}>DELETE CONNECTION</button>}
        </div>
        {connStart&&<div style={{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',background:'#1a1208',border:'1px solid #d4a020',padding:'4px 12px',fontSize:9,letterSpacing:2,color:'#d4a020',pointerEvents:'none'}}>CLICK ANOTHER NODE PORT TO CONNECT</div>}
      </div>
      <div style={{width:220,flexShrink:0,background:'#0a0805',borderLeft:'1px solid #2a1a08',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'10px 12px',fontSize:9,letterSpacing:2,color:'#7a6040',borderBottom:'1px solid #1a1208',flexShrink:0}}>ADD FROM PLACES</div>
        <div className="list-scroll">
          {data.places.map(p=>(
            <div key={p._id} className="list-item" onClick={()=>addFromPlace(p)} style={{cursor:'pointer'}}>
              <div className="item-name">{p.name}</div>
              <div className="item-meta">{p.type}</div>
            </div>
          ))}
        </div>
      </div>
      <MapDetail
        node={selNode}
        places={data.places}
        onChange={n=>setNodes(nodes.map(x=>x._id===n._id?n:x))}
        onDelete={()=>{setNodes(nodes.filter(x=>x._id!==sel));setConns(conns.filter(c=>c.from!==sel&&c.to!==sel));setSel(null);}}
      />
    </div>
  );
}

  ITEM_GET: {label:'ITEM RECEIVED', color:'#20a040',bg:'#041208',border:'#105020'},
  ITEM_NEED:{label:'ITEM REQUIRED', color:'#a06020',bg:'#120a04',border:'#604010'},
  CONDITION:{label:'CONDITION',     color:'#8060c0',bg:'#0c0818',border:'#402080'},
  BRANCH:   {label:'BRANCH',        color:'#a0a030',bg:'#121204',border:'#606010'},
  END:      {label:'END',           color:'#505050',bg:'#0c0c0c',border:'#303030'},

const OCTOPUS_STATES=['neutral','alert','crimson','white','still','curious','recoil'];
const OCTAVIA_EMOTIONS=['neutral','fear','anger','grief','determination','dissociation','hope','confusion'];

const newTreeNode=(type,x,y)=>({
  _id:uid(), type, x:x||100, y:y||100,
  text:'', voice:'', emotion:'neutral', octopusState:'neutral',
  item:'', quantity:1, condition:'', conditionValue:'',
  outputs:[{id:uid(),label:''}],
});
const newTreeConn=()=>({id:uid(),fromNode:'',fromPort:'',toNode:''});

    <div className={`tree-node${selected?' selected':''}${isDragging?' dragging':''}`}

      <div className="tree-node-header" style={{background:t.border,color:t.color}}>

      <div className="tree-node-body" style={{color:'rgba(255,255,255,.75)'}}>
        {node.type==='NPC'&&<>{node.text||<span style={{color:'rgba(255,255,255,.25)'}}>NPC dialogue…</span>}</>}
        {node.type==='OCTAVIA'&&<>{node.text||<span style={{color:'rgba(255,255,255,.25)'}}>Octavia response…</span>}</>}
        {node.type==='OCTOPUS'&&<div style={{color:t.color,letterSpacing:1,fontSize:9}}>{node.octopusState||'neutral'}</div>}

        {node.type==='CONDITION'&&<div style={{fontSize:9}}><span style={{color:t.color}}>{node.condition||'condition'}</span>{node.conditionValue&&<span style={{color:'rgba(255,255,255,.4)'}}> = {node.conditionValue}</span>}</div>}
        {node.type==='BRANCH'&&<div style={{color:'rgba(255,255,255,.4)',fontSize:9}}>BRANCH POINT</div>}
        {node.type==='END'&&<div style={{color:'rgba(255,255,255,.3)',fontSize:9}}>END CONVERSATION</div>}
      </div>

        <div style={{padding:'0 10px 4px',fontSize:8,color:'rgba(255,255,255,.35)',letterSpacing:1}}>{node.emotion}</div>}

        </div>
      </div>
    </div>
  );
}

function TreeTab({data,setData}){
  const { useRef:uR, useCallback:uCB, useEffect:uE, useState:uS } = React;
  const trees=data.dialogueTrees||[];
  const [activeTId,setActiveTId]=uS(trees[0]?.id||null);
  const activeTree=trees.find(t=>t.id===activeTId);
  const tNodes=activeTree?.nodes||[];
  const tConns=activeTree?.conns||[];
  const setTree=fn=>setData(d=>({...d,dialogueTrees:(d.dialogueTrees||[]).map(t=>t.id===activeTId?fn(t):t)}));
  const setTNodes=ns=>setTree(t=>({...t,nodes:ns}));
  const setTConns=cs=>setTree(t=>({...t,conns:cs}));

  const [sel,setSel]=uS(null);
  const [pan,setPan]=uS({x:60,y:60});
  const [zoom,setZoom]=uS(1);
  const [dragging,setDragging]=uS(null);
  const [panning,setPanning]=uS(false);
  const [connStart,setConnStart]=uS(null);
  const [mousePos,setMousePos]=uS({x:0,y:0});
  const wrapRef=uR(null);
  const panRef=uR(null);
  const dragRef=uR(null);

  const onWrapMD=uCB(e=>{
    if(e.target===wrapRef.current||e.target.classList.contains('map-grid-bg')){
      panRef.current={sx:e.clientX-pan.x,sy:e.clientY-pan.y};
      setPanning(true);
    }
  },[pan]);
  const onMM=uCB(e=>{
    const r=wrapRef.current?.getBoundingClientRect();
    if(r) setMousePos({x:e.clientX-r.left,y:e.clientY-r.top});
    if(panning&&panRef.current) setPan({x:e.clientX-panRef.current.sx,y:e.clientY-panRef.current.sy});
    if(dragging&&dragRef.current){
      const dx=(e.clientX-dragRef.current.sx)/zoom, dy=(e.clientY-dragRef.current.sy)/zoom;
      setTNodes(tNodes.map(n=>n._id===dragging?{...n,x:dragRef.current.ox+dx,y:dragRef.current.oy+dy}:n));
    }
  },[panning,dragging,tNodes,zoom,pan]);
  const onMU=uCB(()=>{setPanning(false);setDragging(null);},[]);
  const onWheel=uCB(e=>{e.preventDefault();setZoom(z=>Math.max(0.3,Math.min(3,z*(e.deltaY<0?1.1:0.9))));},{passive:false},[]);
  uE(()=>{const el=wrapRef.current;if(!el)return;el.addEventListener('wheel',onWheel,{passive:false});return()=>el.removeEventListener('wheel',onWheel);},[onWheel]);

  const startDrag=(e,id)=>{
    if(e.button!==0)return; e.stopPropagation();
    const n=tNodes.find(x=>x._id===id);
    dragRef.current={sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};
    setDragging(id); setSel(id);
  };
  const onPortMD=(e,nodeId,portId)=>{ e.stopPropagation(); setConnStart({nodeId,portId}); };
  const onPortMU=(e,nodeId,portId)=>{
    if(!connStart||connStart.nodeId===nodeId){setConnStart(null);return;}
    const dup=tConns.find(c=>c.fromNode===connStart.nodeId&&c.fromPort===connStart.portId&&c.toNode===nodeId);
    if(!dup) setTConns([...tConns,{id:uid(),fromNode:connStart.nodeId,fromPort:connStart.portId,toNode:nodeId,toPort:portId}]);
    setConnStart(null);
  };

  const addTree=()=>{
    const id='tree_'+uid(); const root=newTreeNode('NPC',80,80);
    setData(d=>({...d,dialogueTrees:[...(d.dialogueTrees||[]),{id,name:'New Tree',npcId:'',nodes:[root],conns:[]}]}));
    setActiveTId(id); setSel(root._id);
  };
  const addNode=(type)=>{
    if(!activeTree)return;
    const n=newTreeNode(type,(-pan.x/zoom)+80+tNodes.length*30%200,(-pan.y/zoom)+80+tNodes.length*40%200);
    setTNodes([...tNodes,n]); setSel(n._id);
  };

  const getPortPos=(nodeId,portId)=>{
    const n=tNodes.find(x=>x._id===nodeId); if(!n) return null;
    if(portId==='in') return {x:n.x*zoom+pan.x+10,y:n.y*zoom+pan.y+36};
    const outIdx=n.outputs.findIndex(o=>o.id===portId);
    const yOff=90+(outIdx||0)*20;
    return {x:(n.x+240)*zoom+pan.x-10,y:n.y*zoom+pan.y+yOff};
  };

  const selNode=tNodes.find(n=>n._id===sel);
  const npcsList=data.characters||[];

  return(
    <div className="tree-shell">
      <div className="tree-left">
        <div className="tree-left-header">TREES</div>
        <div className="list-scroll">
          {trees.map(t=>(
            <div key={t.id} className={`list-item ${t.id===activeTId?'selected':''}`} onClick={()=>{setActiveTId(t.id);setSel(null);}}>
              <div className="item-name">{t.name||t.id}</div>
              <div className="item-meta">{t.npcId||'no npc'} · {(t.nodes||[]).length} nodes</div>
            </div>
          ))}
        </div>
        <button className="list-add-btn" onClick={addTree}>+ NEW TREE</button>
        {activeTree&&<>
          <div style={{padding:'8px 12px',fontSize:9,letterSpacing:2,color:'#7a6040',borderTop:'1px solid #1a1208'}}>PALETTE</div>
          {Object.entries(TREE_NODE_TYPES).map(([k,v])=>(
            <div key={k} className="tree-palette-item" onClick={()=>addNode(k)}>
              <div className="tree-palette-dot" style={{background:v.color}} />
              <span style={{color:'#a08060'}}>{v.label}</span>
            </div>
          ))}
          {activeTree&&<div style={{padding:'8px 12px',borderTop:'1px solid #1a1208'}}>
            <div style={{fontSize:9,color:'#7a6040',letterSpacing:1,marginBottom:6}}>NPC</div>
            <select className="form-select" value={activeTree.npcId||''} onChange={e=>setTree(t=>({...t,npcId:e.target.value}))}>
              <option value="">— select —</option>
              {npcsList.map(c=><option key={c._id} value={c.id}>{c.name}</option>)}
            </select>
            <div style={{fontSize:9,color:'#7a6040',letterSpacing:1,marginTop:8,marginBottom:4}}>TREE NAME</div>
            <input className="form-input" value={activeTree.name||''} onChange={e=>setTree(t=>({...t,name:e.target.value}))} />
          </div>}
        </>}
      </div>
      <div ref={wrapRef} className={`tree-canvas-wrap${panning?' panning':''}`}
        onMouseDown={onWrapMD} onMouseMove={onMM} onMouseUp={onMU}
      >
        <div className="map-grid-bg" />
        {!activeTree&&<div className="empty-state">CREATE A TREE OR SELECT ONE</div>}
        {activeTree&&<>
          <svg className="tree-svg" style={{width:'100%',height:'100%'}}>
            {tConns.map(c=>{
              const a=getPortPos(c.fromNode,c.fromPort), b=getPortPos(c.toNode,c.toPort||'in');
              if(!a||!b) return null;
              const mx=(a.x+b.x)/2;
              const nt=tNodes.find(x=>x._id===c.fromNode);
              const tc=nt?TREE_NODE_TYPES[nt.type]?.color:'#5a3a18';
              return <g key={c.id}>
                <path d={`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`}
                  stroke={sel===c.id?'#d4a020':tc} strokeWidth="1.5" fill="none" opacity={0.6}
                  onClick={()=>setSel(c.id)} style={{pointerEvents:'stroke',cursor:'pointer'}} />
              </g>;
            })}
            {connStart&&(()=>{
              const p=getPortPos(connStart.nodeId,connStart.portId); if(!p) return null;
              return <line x1={p.x} y1={p.y} x2={mousePos.x} y2={mousePos.y} stroke="#d4a020" strokeWidth="1" strokeDasharray="4,3" />;
            })()}
          </svg>
          <div className="tree-viewport" style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`}}>
            {tNodes.map(n=>(
              <TreeNodeView key={n._id} node={n} selected={sel===n._id} dragging={dragging===n._id}
                connStart={connStart} onMouseDown={startDrag}
                onPortMouseDown={onPortMD} onPortMouseUp={onPortMU} />
            ))}
          </div>
          <div className="tree-toolbar">
            <button className="tree-tool-btn" onClick={()=>{setPan({x:60,y:60});setZoom(1);}}>RESET VIEW</button>
            {connStart&&<button className="tree-tool-btn" style={{color:'#d4a020',borderColor:'#d4a020'}} onClick={()=>setConnStart(null)}>CANCEL WIRE</button>}
            {sel&&tConns.find(c=>c.id===sel)&&<button className="tree-tool-btn" style={{color:'#c43028'}} onClick={()=>{setTConns(tConns.filter(c=>c.id!==sel));setSel(null);}}>DELETE WIRE</button>}
            {activeTree&&<button className="tree-tool-btn" style={{color:'#c43028'}} onClick={()=>{if(window.confirm('Delete this tree?'))setData(d=>({...d,dialogueTrees:(d.dialogueTrees||[]).filter(t=>t.id!==activeTId)}));}}>DELETE TREE</button>}
          </div>
        </>}
      </div>
      <TreeDetail
        node={selNode}
        onChange={n=>setTNodes(tNodes.map(x=>x._id===n._id?n:x))}
        onDelete={()=>{setTNodes(tNodes.filter(x=>x._id!==sel));setTConns(tConns.filter(c=>c.fromNode!==sel&&c.toNode!==sel));setSel(null);}}
      />
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState('quests');
  const [data,setData]=useState(()=>{
    try {
      const s=localStorage.getItem('beau_editor_v1');
      if(s){
        const d=JSON.parse(s);
        if(!d.thoughts)       d.thoughts=SEED.thoughts;
        if(!d.mapNodes)       d.mapNodes=[];
        if(!d.mapConns)       d.mapConns=[];
        if(!d.dialogueTrees)  d.dialogueTrees=[];
        return d;
      }
      return {...SEED,mapNodes:[],mapConns:[],dialogueTrees:[]};
    } catch { return SEED; }
  });
  useEffect(()=>{ try { localStorage.setItem('beau_editor_v1',JSON.stringify(data)); } catch(e){} },[data]);

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='beauregarde_data.json'; a.click();
    URL.revokeObjectURL(url);
  };
  const reset=()=>{ if(window.confirm('Reset all data to seed? Cannot be undone.')) setData(SEED); };

  const TABS=[{id:'quests',label:'QUESTS'},{id:'dialogue',label:'DIALOGUE'},{id:'characters',label:'CHARACTERS'},{id:'places',label:'PLACES'},{id:'thoughts',label:'THOUGHTS'},{id:'map',label:'MAP'},{id:'tree',label:'TREE'}];
  return (
    <div className="editor-shell">
      <div className="header">
        <div className="header-title">BEAUREGARDE — QUEST EDITOR</div>
        {TABS.map(t=><button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>)}
        <div className="header-spacer" />
        <button className="export-btn" onClick={reset}>RESET</button>
        <button className="export-btn" onClick={exportJSON}>EXPORT JSON</button>
      </div>
      {tab==='quests'     && <QuestsTab     data={data} setData={setData} />}
      {tab==='dialogue'   && <DialogueTab   data={data} setData={setData} />}
      {tab==='characters' && <CharactersTab data={data} setData={setData} />}
      {tab==='places'     && <PlacesTab     data={data} setData={setData} />}
      {tab==='thoughts'   && <ThoughtsTab   data={data} setData={setData} />}
      {tab==='map'        && <MapTab        data={data} setData={setData} />}
      {tab==='tree'       && <TreeTab       data={data} setData={setData} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
