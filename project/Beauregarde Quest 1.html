// Returns {src, flip} — flip=true means apply scaleX(-1) to face the correct direction
const getCharAnimation=(outfit,facing,action)=>{
  const def=CHAR_ANIMATIONS[outfit];
  if(!def) return {src:null,flip:false};
  if(def.rightBased){
    if(action==='idle')       return {src:def.idle_left||null, flip:facing==='right'};
    if(action==='crouch')     return {src:def.crouch_idle_right||def.idle_left||null, flip:facing==='left'};
    if(action==='crouch_walk')return {src:def.crouch_walk_right||def.crouch_idle_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_start') return {src:def.jump_start_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_air')   return {src:def.jump_air_right||def.jump_start_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_end')   return {src:def.jump_end_right||def.jump_start_right||def.walk||null, flip:facing==='left'};
    if(action==='kick')            return {src:def.kick_right||def.walk||null,            flip:facing==='left'};
    if(action==='sweep_kick')      return {src:def.sweep_kick_right||def.kick_right||null,  flip:facing==='left'};
    if(action==='roundhouse_kick') return {src:def.roundhouse_kick_right||def.kick_right||null, flip:facing==='left'};
    if(action==='double_kick')     return {src:def.double_kick_right||def.kick_right||null, flip:facing==='left'};
    if(action==='block')           return {src:def.block_right||def.idle_left||null,        flip:facing==='left'};
    if(action==='roll')            return {src:def.roll_right||def.kick_right||null,        flip:facing==='left'};
    const src=(action==='run'&&def.run)?def.run:def.walk;
    return {src:src||null, flip:facing==='left'};
  }
  // Legacy path (unused but kept for safety)
  if(def.idle_left!==undefined){
    if(action==='run') return {src:def.run_left||null, flip:facing==='right'};
    return {src:def[`${action}_${facing}`]||null, flip:false};
  }
  const src=(action==='walk'?def.walk:action==='run'?(def.run||def.walk):def.idle)||null;
  const flip=(facing==='right')!==(def.baseDir==='right');
  return {src,flip};
};

    lore:`1973 — WEST PHILADELPHIA\nJohn Africa founded MOVE. A Black naturalist and revolutionary organization. Anti-industrial. Anti-government. Communal living, strict veganism, animal rights. They raised children and animals together. The city called them dangerous.\n\n1978 — POWELTON VILLAGE SHOOTOUT\nA year-long armed standoff ended in gunfire. Officer James Ramp was killed. Nine MOVE members — the MOVE 9 — were arrested and sentenced to 30 to 100 years. Defense testimony placed MOVE in the basement at the time. Ramp was shot at a downward angle from above.\n\n1982 — 6221 OSAGE AVENUE\nThe remaining members relocated to a row house in a middle-class Black neighborhood. To protest the imprisonment of the MOVE 9, they built a fortified rooftop bunker and broadcast political messages through loudspeakers, day and night.\n\nMAY 12, 1985 — MOTHER'S DAY\nMayor Wilson Goode and Commissioner Gregory Sambor secured eviction warrants. Neighbors were evacuated from their homes the night before.\n\nMAY 13, 1985 — 5:35 PM\nAfter a day-long assault — 10,000 rounds of ammunition, tear gas, water cannons — a state police helicopter dropped a military-grade satchel bomb onto the rooftop bunker. The fire commissioner was ordered to let it burn. It burned for one hour and thirty minutes before firefighters were called.\n\nTHE TOLL\n11 killed. 5 of them children, ages 7 to 14. 61 homes destroyed. 250 people homeless. $33 million in taxpayer funds spent rebuilding defective homes with sinking foundations.\n\nTWO SURVIVED\nRamona Africa (adult) and Michael Ward — Birdie Africa — 13 years old. Birdie was pulled from a water-filled alley with severe third-degree burns. His mother, Rhonda Africa, died in the fire.\n\nAFTERMATH\nRamona was arrested while fleeing the burning building — cuffed despite her burns. She was the only person tried for May 13. Charged with arson and conspiracy. She served seven years. No one who ordered the bombing was ever charged.\n\n"Nobody was ever arrested function genL(tag,pax,n,step,x0,hLo,hHi,wLo,wHi){
  const bc=tag==='f'?'#111009':tag==='m'?'#1c1610':'#281e12';
  const wc=tag==='f'?'#1f1b0d':tag==='m'?'#2e2518':'#402e1e';
  return Array.from({length:n},(_,i)=>({
    id:`${tag}${i}`,pax,bc,wc,
    wx:x0+i*step+(sr(i,1)-.5)*step*.38,
    w:wLo+sr(i,2)*(wHi-wLo),h:hLo+sr(i,3)*(hHi-hLo),
    sign:tag==='n'&&i===5?{txt:'CORNER STORE',col:C.nG}:tag==='m'&&i===7?{txt:'JAZZ CLUB',col:C.nR}:null,
  }));
}
const BLDGS=[...genL('f',0.13,16,215,-1700,200,320,150,230),...genL('m',0.40,12,230,-1400,280,400,170,260),...genL('n',0.74,9,250,-1000,330,480,200,300)];
function fogOf(sx,w,facing){
  const cx=sx+w/2,dist=cx-VW/2,ahead=facing==='right'?dist>0:dist<0;
  const d=Math.abs(dist)*(ahead?1.0:1.75);
  if(d<130)return{};if(d<270)return{opacity:.74};if(d<410)return{opacity:.42,filter:'saturate(.5)'};
  if(d<550)return{opacity:.16,filter:'saturate(.2) blur(1px)'};return{opacity:.05,filter:'saturate(0) blur(2px)'};
}

// ── MONOLOGUE HOOK ────────────────────────────────────────────
function useMonologue(lines){
  const [idx,setIdx]=useState(0);const[chars,setChars]=useState(0);
  const line=(lines||[])[idx]||'';const text=line.slice(0,chars);
  const full=chars>=line.length&&line.length>0;
  useEffect(()=>{setIdx(0);setChars(0);},[lines]);
  useEffect(()=>{if(full)return;const t=setTimeout(()=>setChars(c=>c+1),26);return()=>clearTimeout(t);},[chars,full,idx]);
  useEffect(()=>{if(!full||idx>=(lines||[]).length-1)return;const t=setTimeout(()=>{setIdx(i=>i+1);setChars(0);},3200);return()=>clearTimeout(t);},[full,idx,lines]);
  return{text,advance:()=>{if(idx<(lines||[]).length-1){setIdx(i=>i+1);setChars(0);}}};
}

// Canvas-based chroma key for videos exported without alpha channel (solid green background).
// Replace the source video with a proper VP9+alpha WebM to remove this component.
function ChromaKeyVideo({src,flip,height,playing,playbackRate,filterStr}){
  const vRef=useRef(null);
  const cRef=useRef(null);
  const rafRef=useRef(null);
  const drawRef=useRef(null);

  useEffect(()=>{
    const v=vRef.current;const c=cRef.current;
    if(!v||!c)return;
    let active=true;
    let ctx=null;

    const draw=()=>{
      if(!v||!c||!v.videoWidth||v.readyState<2)return;
      const h=typeof height==='number'?height:parseInt(height)||371;
      const w=Math.round(v.videoWidth*h/v.videoHeight);
      // Resize canvas intrinsic buffer to scaled display size (fixes overlapping frames)
      if(c.width!==w||c.height!==h){
        c.width=w;c.height=h;
        c.style.width=w+'px';c.style.height=h+'px';
        ctx=null;
      }
      if(!ctx)ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(v,0,0,w,h);
      const id=ctx.getImageData(0,0,w,h);
      const d=id.data;
      for(let i=0;i<d.length;i+=4){
        if(d[i+1]>80&&d[i+1]>d[i]+30&&d[i+1]>d[i+2]+30)d[i+3]=0;
      }
      ctx.putImageData(id,0,0);
    };
    drawRef.current=draw;

    const loop=()=>{
      if(!active)return;
      if(!v.paused&&!v.ended)draw();
      rafRef.current=requestAnimationFrame(loop);
    };

    v.muted=true;v.loop=true;v.src=src;v.load();
    v.play().catch(()=>{});
    rafRef.current=requestAnimationFrame(loop);
    return()=>{active=false;cancelAnimationFrame(rafRef.current);drawRef.current=null;};
  },[src,height]);

  useEffect(()=>{const v=vRef.current;if(v)v.playbackRate=playbackRate||1;},[playbackRate]);

  useEffect(()=>{
    const v=vRef.current;if(!v)return;
    if(playing){v.play().catch(()=>{});}
    else{
      // Seek to frame 0 then draw one still frame so she appears standing, not invisible
      v.currentTime=0;
      v.addEventListener('seeked',()=>{v.pause();drawRef.current?.();},{once:true});
    }
  },[playing]);

  return(
    <span style={{display:'inline-block',lineHeight:0}}>
      <video ref={vRef} muted loop playsInline preload="auto" style={{display:'none'}}/>
      <canvas ref={cRef} style={{display:'block',transformOrigin:'center center',transform:flip?'scaleX(-1)':'none',filter:filterStr}}/>
    </span>
  );
}

function Char({facing,walking,running=false,crouching=false,kicking=false,sweepKicking=false,roundhouseKicking=false,doubleKicking=false,blocking=false,rolling=false,jumpPhase=null,vertOffset=0,charBottom=116,charX,charHeight=371,currentOutfit='cyber_octavia'}){
  const vidRef=useRef(null);
  const anyOneShot=kicking||sweepKicking||roundhouseKicking||doubleKicking||blocking||rolling;
  const action=jumpPhase?('jump_'+jumpPhase)
    :rolling?'roll'
    :blocking?'block'
    :doubleKicking?'double_kick'
    :roundhouseKicking?'roundhouse_kick'
    :sweepKicking?'sweep_kick'
    :kicking?'kick'
    :crouching?(walking||running?'crouch_walk':'crouch')
    :running?'run':walking?'walk':'idle';
  const effectiveHeight=jumpPhase?Math.round(charHeight*0.9):crouching?Math.round(charHeight*0.75):charHeight;
  const {src:animSrc,flip:shouldFlip}=getCharAnimation(currentOutfit,facing,action);
  const hasIdleAnim=!!CHAR_ANIMATIONS[currentOutfit]?.idle_left;

  useEffect(()=>{
    const v=vidRef.current;if(!v||!animSrc)return;
    v.style.opacity='0';
    v.load();v.muted=true;
    v.loop=!anyOneShot;
    v.playbackRate=anyOneShot?2.5:walking?0.65:1;
    const onReady=()=>{v.style.opacity='1';};
    v.addEventListener('loadeddata',onReady,{once:true});
    if(anyOneShot){
      const onEnded=()=>document.dispatchEvent(new CustomEvent('kickEnd'));
      v.addEventListener('ended',onEnded,{once:true});
      v.play().catch(()=>{});
      return()=>{v.removeEventListener('loadeddata',onReady);v.removeEventListener('ended',onEnded);};
    }
    v.play().catch(()=>{});
    return()=>v.removeEventListener('loadeddata',onReady);
  },[animSrc]); // only animSrc — other deps would reload mid-animation on any key change

  useEffect(()=>{
    const v=vidRef.current;if(!v)return;
    v.muted=true;
    if(anyOneShot){v.playbackRate=2.5;v.play().catch(()=>{});}
    else if(jumpPhase==='start'||jumpPhase==='end'){v.playbackRate=1.5;v.play().catch(()=>{});}
    else if(jumpPhase==='air'){v.playbackRate=1;v.play().catch(()=>{});}
    else if(crouching&&(walking||running)){v.playbackRate=0.65;v.play().catch(()=>{});}
    else if(crouching){v.playbackRate=1;v.play().catch(()=>{});}
    else if(walking){v.playbackRate=0.65;v.play().catch(()=>{});}
    else if(running){v.playbackRate=1;v.play().catch(()=>{});}
    else if(hasIdleAnim){/* idle_left/idle_right loop plays via animSrc change */}
    else{v.currentTime=0;v.addEventListener('seeked',()=>v.pause(),{once:true});}
  },[running,walking,crouching,kicking,sweepKicking,roundhouseKicking,doubleKicking,blocking,rolling,jumpPhase]);

  if(animSrc){
    const ckNeeded=CHAR_ANIMATIONS[currentOutfit]?.needsChromaKey;
    const DROP='drop-shadow(0 6px 16px rgba(196,48,40,.55))';
    const combatScale=anyOneShot?(CHAR_ANIMATIONS[currentOutfit]?.combatScale||1):1;
    return(
      <div style={{position:'absolute',bottom:charBottom+(vertOffset||0),left:charX!==undefined?charX:'50%',zIndex:100,pointerEvents:'none',transform:'translateX(-50%)',filter:ckNeeded?undefined:DROP}}>
        {ckNeeded
          ?<ChromaKeyVideo src={animSrc} flip={shouldFlip} height={effectiveHeight}
              playing={walking||running||crouching||!!jumpPhase} playbackRate={(jumpPhase==='start'||jumpPhase==='end')?1.5:jumpPhase==='air'?1:(walking&&!running)?0.65:1} filterStr={DROP}/>
          :<video key={animSrc} ref={vidRef} src={animSrc} muted playsInline preload="auto"
              style={{height:effectiveHeight,width:'auto',display:'block',
                transformOrigin:'50% 100%',
                transform:`scaleX(${shouldFlip?-combatScale:combatScale}) scaleY(${combatScale})`,
                transition:'opacity 0.08s ease'}}/>
        }
      </div>
    );
  }
  return null;
}

// ── CINEMATIC VIDEO CUES ──────────────────────────────────────────
// Hook: seek to cue.from, play to cue.to, pause and callback
function useCineVideo(vidRef,sceneKey,outfit){
  const [cueName,setCueName]=useState('enter');
  const [onCueEnd,setOnCueEnd]=useState(null);
  const clip=CINEMATIC_SCENES[sceneKey]?.[outfit]??CINEMATIC_SCENES[sceneKey]?.cyber_octavia;

  // Load video once
  useEffect(()=>{
    const v=vidRef.current;if(!v)return;
    v.src=clip.src;v.muted=true;v.preload='auto';v.load();
  },[clip.src]);

  // Play a cue
  const playCue=useCallback((name,callback)=>{
    const v=vidRef.current;if(!v)return;
    const cue=clip.cues[name];if(!cue)return;
    setCueName(name);
    setOnCueEnd(()=>callback);
    v.currentTime=cue.from;
    if(cue.from===cue.to){callback?.();return;} // single-frame hold
    v.play().catch(()=>{});
  },[clip]);

  // timeupdate → pause at cue.to
  useEffect(()=>{
    const v=vidRef.current;if(!v)return;
    const cue=clip.cues[cueName];if(!cue)return;
    const check=()=>{
      if(v.currentTime>=cue.to){
        v.pause();v.currentTime=cue.to;
        v.removeEventListener('timeupdate',check);
        onCueEnd?.();
      }
    };
    v.addEventListener('timeupdate',check);
    return()=>v.removeEventListener('timeupdate',check);
  },[cueName,onCueEnd]);

  return{playCue};
}

// ── SCENE GRID ────────────────────────────────────────────────
// Debug coordinate grid. Shows every 50px (minor) and 100px (major) lines across
// the 1280×720 scene, with axis labels and a live mouse-position readout.
// Drop <SceneGrid/> inside any scene when debug=true.
function SceneGrid(){
  const [mouse,setMouse]=useState({x:0,y:0});
  const containerRef=useRef(null);
  useEffect(()=>{
    const sw=document.getElementById('scale-wrap');
    const mm=e=>{
      const r=sw?sw.getBoundingClientRect():{left:0,top:0,width:VW,height:VH};
      setMouse({
        x:Math.round((e.clientX-r.left)*(VW/r.width)),
        y:Math.round((e.clientY-r.top)*(VH/r.height)),
      });
    };
    window.addEventListener('mousemove',mm);
    return()=>window.removeEventListener('mousemove',mm);
  },[]);
  const MINOR=50,MAJOR=100;
  const cols=Math.floor(VW/MINOR), rows=Math.floor(VH/MINOR);
  return(
    <div ref={containerRef} style={{position:'absolute',inset:0,zIndex:800,pointerEvents:'none'}}>
      <svg width={VW} height={VH} style={{position:'absolute',inset:0}}>
        {/* Minor grid lines */}
        {Array.from({length:cols+1},(_,i)=>{
          const x=i*MINOR; const major=x%MAJOR===0;
          return<line key={'vx'+i} x1={x} y1={0} x2={x} y2={VH}
            stroke={major?'rgba(255,215,0,0.35)':'rgba(255,255,255,0.10)'} strokeWidth={major?1:0.5}/>;
        })}
        {Array.from({length:rows+1},(_,i)=>{
          const y=i*MINOR; const major=y%MAJOR===0;
          return<line key={'vy'+i} x1={0} y1={y} x2={VW} y2={y}
            stroke={major?'rgba(255,215,0,0.35)':'rgba(255,255,255,0.10)'} strokeWidth={major?1:0.5}/>;
        })}
        {/* X axis labels (major columns) */}
        {Array.from({length:Math.floor(VW/MAJOR)+1},(_,i)=>{
          const x=i*MAJOR;
          return<text key={'xl'+i} x={x+2} y={11} fill='rgba(255,215,0,0.8)' fontSize={9} fontFamily="monospace">{x}</text>;
        })}
        {/* Y axis labels (major rows) */}
        {Array.from({length:Math.floor(VH/MAJOR)+1},(_,i)=>{
          const y=i*MAJOR;
          return<text key={'yl'+i} x={2} y={y>0?y-2:10} fill='rgba(255,215,0,0.8)' fontSize={9} fontFamily="monospace">{y}</text>;
        })}
        {/* Mouse crosshair */}
        <line x1={mouse.x} y1={0} x2={mouse.x} y2={VH} stroke='rgba(47,212,230,0.7)' strokeWidth={1} strokeDasharray="4 4"/>
        <line x1={0} y1={mouse.y} x2={VW} y2={mouse.y} stroke='rgba(47,212,230,0.7)' strokeWidth={1} strokeDasharray="4 4"/>
        {/* Interaction radius ring — matches INTERACT_R */}
        <circle cx={mouse.x} cy={mouse.y} r={INTERACT_R} fill='rgba(47,212,230,0.06)' stroke='rgba(47,212,230,0.55)' strokeWidth={1.5} strokeDasharray="6 3"/>
        <circle cx={mouse.x} cy={mouse.y} r={INTERACT_R} fill='none' stroke='rgba(255,59,82,0.25)' strokeWidth={8}/>
        {/* Radius label */}
        <text x={mouse.x+INTERACT_R+4} y={mouse.y-4} fill='rgba(47,212,230,0.85)' fontSize={8} fontFamily="monospace">r:{INTERACT_R}</text>
        {/* Centre dot */}
        <circle cx={mouse.x} cy={mouse.y} r={4} fill='rgba(47,212,230,0.9)'/>
      </svg>
      {/* Coordinate readout — follows mouse, stays on screen */}
      <div style={{
        position:'absolute',
        left:Math.min(mouse.x+12,VW-120),
        top:Math.max(mouse.y-24,4),
        background:'rgba(0,0,0,0.82)',border:'1px solid rgba(47,212,230,0.6)',
        color:'#2fd4e6',fontSize:9,fontFamily:'monospace',padding:'2px 8px',letterSpacing:1,
        whiteSpace:'nowrap'
      }}>x:{mouse.x} y:{mouse.y}</div>
    </div>
  );
}

// ── VOICE BOX (internal monologue / scene choices) ────────────
function VoiceBox({seq,onChoose,onFinish}){
  const[idx,setIdx]=useState(0);
  const[chars,setChars]=useState(0);
  const[sel,setSel]=useState(0);
  const node=seq[idx]||seq[seq.length-1];
  const isChoice=node?.type==='choice';
  const txt=isChoice?'':(node?.t||'');
  const full=isChoice||chars>=txt.length;
  useEffect(()=>{setChars(0);setSel(0);},[idx]);
  useEffect(()=>{if(full||isChoice)return;const t=setTimeout(()=>setChars(c=>c+1),32);return()=>clearTimeout(t);},[chars,full,isChoice]);
  useEffect(()=>{
    if(!full||isChoice)return;
    const t=setTimeout(()=>{if(idx<seq.length-1)setIdx(i=>i+1);else if(onFinish)onFinish();},2200);
    return()=>clearTimeout(t);
  },[full,isChoice,idx,seq,onFinish]);
  useEffect(()=>{
    const kd=e=>{
      if(!isChoice){
        if(!full){if(e.code===KEYS.CONFIRM||e.code===KEYS.SKIP)setChars(9999);return;}
        if(e.code===KEYS.CONFIRM||e.code===KEYS.SKIP){
          if(idx<seq.length-1)setIdx(i=>i+1);else if(onFinish)onFinish();
        }
        return;
      }
      if(e.key==='1')setSel(0);else if(e.key==='2')setSel(1);else if(e.key==='3')setSel(2);else if(e.key==='4')setSel(3);
      else if(e.code===KEYS.UP)setSel(s=>Math.max(0,s-1));
      else if(e.code===KEYS.DOWN)setSel(s=>Math.min((node.opts.length-1),s+1));
      else if(e.code===KEYS.CONFIRM){if(onChoose)onChoose(node.opts[sel].id);}
    };
    window.addEventListener('keydown',kd);return()=>window.removeEventListener('keydown',kd);
  },[isChoice,full,idx,seq,sel,node,onChoose,onFinish]);
  const vc=VOICE_C[node?.v]||C.text;
  return(
    <div style={{position:'absolute',inset:0,zIndex:400,background:'rgba(0,0,0,0.90)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{position:'relative',zIndex:10,width:700,padding:'0 20px'}}>
        {!isChoice?(<>
          {node?.v&&<div style={{color:vc,fontSize:8,letterSpacing:4,fontFamily:"'TheMurk',monospace",marginBottom:18,opacity:.9}}>// {node.v}</div>}
          <div style={{color:vc,fontSize:15,lineHeight:2,fontFamily:"'TheMurk',monospace",fontStyle:'italic',minHeight:72,marginBottom:32,letterSpacing:.3}}>
            {txt.slice(0,chars)}
            {!full&&<span style={{animation:'blink .65s steps(1) infinite',color:vc}}>▌</span>}
          </div>
          {full&&<div style={{color:`${C.dim}66`,fontSize:8,letterSpacing:2,fontFamily:"'TheMurk',monospace"}}>[E] CONTINUE</div>}
        </>):(<>
          <div style={{color:C.dim,fontSize:8,fontFamily:"'TheMurk',monospace",lineHeight:1.9,marginBottom:28,letterSpacing:.3,borderLeft:`2px solid ${C.border}`,paddingLeft:16}}>
            {node.prompt}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {node.opts.map((opt,i)=>(
              <div key={i} onClick={()=>setSel(i)}
                style={{display:'flex',gap:14,alignItems:'flex-start',cursor:'pointer',padding:'6px 12px',
                  borderLeft:`2px solid ${sel===i?C.red:'transparent'}`,background:'transparent'}}>
                <span style={{color:sel===i?C.red:'#3a2c1488',fontSize:10,fontFamily:"'TheMurk',monospace",minWidth:16,flexShrink:0}}>{i+1}</span>
                <span style={{color:opt.muted?C.dim:C.text,fontSize:12,lineHeight:1.7,fontFamily:"'TheMurk',monospace",fontStyle:opt.muted?'italic':'normal'}}>
                  {opt.t.split('').map((ch,j)=>(
                    <span key={j} style={{animation:'letterGlow 0.7s ease both',animationDelay:`${j*0.04}s`,display:'inline',whiteSpace:'pre'}}>{ch}</span>
                  ))}
                </span>
              </div>
            ))}
            <div style={{color:'#2a1c0a',fontSize:8,letterSpacing:2,fontFamily:"'TheMurk',monospace",marginTop:12}}>[ 1/2/3/4 · ↑↓ ] SELECT  [ E ] CONFIRM</div>
          </div>
        </>)}
      </div>
    </div>
  );
}

// ── CHATBOX COMPONENT ─────────────────────────────────────────
function ChatBox({convKey,npcName,npcImg,total,onAct}){
  useSuppressHud(); // hide the always-on HUD while this conversation is up
  const [nodeId,setNodeId]=useState(null);
  const [sel,setSel]=useState(0);
  const [history,setHistory]=useState([]);
  const histRef=useRef(null);
  const outfit=window.__beau_outfit||'cyber_octavia';
  const tree=CONV[convKey+'__'+outfit]||CONV[convKey]||[];
  const node=nodeId?tree.find(n=>n.id===nodeId):tree[0];
  const npcText=(node?.npc||'').replace('__TOTAL__',`That'll be $${total}.`);
  const allOpts=node?.opts||[];
  const choices=allOpts.filter(o=>o.t!=='(continue)');
  const isChoice=choices.length>0;
  const speakerIsOctavia=node?.speaker==='OCTAVIA'||node?.speaker==='octavia';

  // append NPC/Octavia-speaks lines to history as nodes advance
  useEffect(()=>{
    if(!node||!npcText)return;
    const speaker=speakerIsOctavia?'OCTAVIA':npcName;
    setHistory(h=>{
      const last=h[h.length-1];
      if(last&&last.text===npcText&&last.speaker===speaker)return h;
      return[...h,{speaker,text:npcText,isOct:speakerIsOctavia}];
    });
  },[node?.id]);

  // scroll to bottom whenever history grows
  useEffect(()=>{
    if(histRef.current)histRef.current.scrollTop=histRef.current.scrollHeight;
  },[history]);

  const goTo=useCallback((nextId,act,choiceLabel)=>{
    if(act){const r=onAct(act);if(r==='blocked')return;}
    if(choiceLabel)setHistory(h=>[...h,{speaker:'OCTAVIA',text:choiceLabel,isOct:true,isChoice:true}]);
    if(!nextId){onAct('end');return;}
    const next=tree.find(n=>n.id===nextId);
    if(!next){onAct('end');return;}
    setNodeId(next.id);setSel(0);
  },[tree,onAct]);

  const confirm=useCallback(()=>{
    if(isChoice){const o=choices[sel];goTo(o?.next,o?.act,o?.t);}
    else{const o=allOpts[0];goTo(o?.next,o?.act,null);}
  },[isChoice,choices,sel,allOpts,goTo]);

  useEffect(()=>{setNodeId(null);setSel(0);setHistory([]);},[convKey]);

  useEffect(()=>{
    const scroll=delta=>{if(histRef.current)histRef.current.scrollTop+=delta;};
    const kd=e=>{
      if(e.code==='ArrowUp'){
        e.preventDefault();
        if(isChoice)setSel(s=>Math.max(0,s-1));
        else scroll(-80);
      } else if(e.code==='ArrowDown'){
        e.preventDefault();
        if(isChoice)setSel(s=>Math.min(choices.length-1,s+1));
        else scroll(80);
      } else if(e.code==='PageUp'){e.preventDefault();scroll(-200);}
      else if(e.code==='PageDown'){e.preventDefault();scroll(200);}
      else if(e.key==='1')setSel(0);
      else if(e.key==='2')setSel(1);
      else if(e.key==='3')setSel(2);
      else if(e.code==='KeyE'){e.preventDefault();confirm();}
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[confirm,isChoice,choices.length]);

  if(!node)return null;

  const panel={background:'#fff',border:'3px solid #000',fontFamily:"'TheMurk',monospace",boxShadow:'6px 6px 0 #000'};
  // 70% bigger than original 360×560 / 300×440
  const OCT_W=612,OCT_H=952;
  const NPC_W=510,NPC_H=748;

  return(
    <div style={{position:'absolute',inset:0,zIndex:400,
      backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',
      background:'rgba(0,0,0,0.40)',pointerEvents:'auto'}}>

      {/* ── Octavia portrait — bottom left, large, behind panels ── */}
      <div style={{position:'absolute',bottom:0,left:-30,width:OCT_W,height:OCT_H,pointerEvents:'none',zIndex:1}}>
        <img src={OCT_PORTRAIT} alt="" style={{width:'100%',height:'100%',objectFit:'contain',objectPosition:'bottom center'}}
          onError={e=>{e.target.style.display='none';}}/>
      </div>

      {/* ── NPC portrait — top right, large, behind panels ── */}
      {npcImg&&(
        <div style={{position:'absolute',top:0,right:-20,width:NPC_W,height:NPC_H,pointerEvents:'none',zIndex:1}}>
          <img src={npcImg} alt="" style={{width:'100%',height:'100%',objectFit:'contain',objectPosition:'top center'}}/>
        </div>
      )}

      {/* ── CENTER COLUMN — conversation log + choices ── */}
      <div style={{
        position:'absolute',top:'4%',bottom:'4%',
        left:'50%',transform:'translateX(-50%)',
        width:420,zIndex:10,
        display:'flex',flexDirection:'column',gap:10,
      }}>

        {/* Scrollable conversation history */}
        <div ref={histRef} style={{
          ...panel,flex:1,overflowY:'auto',
          padding:'20px 22px',display:'flex',flexDirection:'column',gap:16,
          scrollbarWidth:'thin',scrollbarColor:'#000 #eee',
        }}>
          {history.map((h,i)=>(
            <div key={i}>
              <div style={{
                fontSize:9,fontWeight:700,letterSpacing:3,marginBottom:5,
                color:h.isOct?'#c43028':'#000',
              }}>{h.speaker}</div>
              <div style={{
                fontSize:12,lineHeight:1.85,
                color:h.isChoice?'#555':'#111',
                fontStyle:h.isChoice?'italic':'normal',
              }}>{h.text}</div>
            </div>
          ))}
          {history.length===0&&(
            <div style={{color:'#bbb',fontSize:10,fontStyle:'italic',letterSpacing:1}}>...</div>
          )}
          {history.length>3&&(
            <div style={{fontSize:7,color:'#bbb',letterSpacing:2,textAlign:'center',marginTop:4,fontFamily:"'TheMurk',monospace"}}>
              {isChoice?'PG↑↓ SCROLL HISTORY':'↑↓ SCROLL'}
            </div>
          )}
        </div>

        {/* Choice selection */}
        {isChoice&&(
          <div style={{...panel,padding:'18px 22px',flexShrink:0}}>
            <div style={{fontSize:13,fontWeight:700,letterSpacing:1,marginBottom:14,borderBottom:'2px solid #000',paddingBottom:10}}>
              Octavia's dialogue selection
            </div>
            {choices.map((o,i)=>(
              <div key={i} onClick={()=>{setSel(i);goTo(o.next,o.act,o.t);}}
                style={{fontSize:11,lineHeight:2.4,cursor:'pointer',letterSpacing:1,
                  fontWeight:i===sel?700:400,color:i===sel?'#000':'#555',
                  paddingLeft:i===sel?10:0,
                  borderLeft:i===sel?'3px solid #c43028':'3px solid transparent',
                  transition:'all .1s',
                }}>
                {String.fromCharCode(97+i)})&nbsp;&nbsp;{o.t}
              </div>
            ))}
            <div style={{fontSize:8,color:'#999',letterSpacing:2,marginTop:10,borderTop:'1px solid #eee',paddingTop:8}}>
              ↑↓ NAVIGATE &nbsp;·&nbsp; [ E ] CONFIRM
            </div>
          </div>
        )}

        {/* Continue hint when no choices */}
        {!isChoice&&(
          <div style={{textAlign:'center',fontSize:8,color:'rgba(255,255,255,0.55)',
            letterSpacing:3,fontFamily:"'TheMurk',monospace"}}>
            [ E ] CONTINUE
          </div>
        )}
      </div>
    </div>
  );
}

// ── ATMOSPHERE ────────────────────────────────────────────────
function Atmo({px}){
  const dust=useMemo(()=>Array.from({length:24},(_,i)=>({id:i,x:sr(i,1)*VW,y:sr(i,2)*VH,r:.7+sr(i,3)*1.5,s:.12+sr(i,4)*.35,o:.12+sr(i,5)*.28})),[]);
  const [t,setT]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setT(n=>n+1),80);return()=>clearInterval(id);},[]);
  const sOff=-(px*.86)%100;
  return(<>
    <div style={{position:'absolute',inset:0,zIndex:2,pointerEvents:'none',background:'radial-gradient(ellipse 80% 55% at 50% 22%,rgba(25,13,7,0.68) 0%,rgba(10,7,4,0.55) 50%,rgba(6,4,2,0.40) 100%)'}}>
      <div style={{position:'absolute',top:'18%',left:'22%',width:280,height:180,background:'radial-gradient(ellipse,#c4302012 0%,transparent 70%)'}}/>
    </div>
    <svg style={{position:'absolute',inset:0,zIndex:46,pointerEvents:'none'}} width={VW} height={VH}>
      {dust.map(p=>{const y=((p.y-t*p.s*3)%(VH+20)+VH+20)%(VH+20)-10;return<circle key={p.id} cx={p.x} cy={y} r={p.r} fill={C.gold} opacity={p.o}/>;})}</svg>
    <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 38%,#060402a8 100%)'}}/>
    <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
  </>);
}
function Bldg({d,px,facing}){
  const sx=(d.wx-px)*d.pax+VW/2;
  if(sx>VW+320||sx+d.w<-320)return null;
  const offset=(sx+d.w/2-VW/2)/(VW*.42);
  const rotY=clamp(offset*50,-52,52);
  const fog=fogOf(sx,d.w,facing);
  const cols=Math.floor(d.w/36),rows=Math.floor(d.h/46);
  return(<div style={{position:'absolute',left:sx,bottom:116,width:d.w,height:d.h,transform:`perspective(900px) rotateY(${rotY}deg)`,transformOrigin:'50% 100%',background:d.bc,borderTop:`1px solid ${d.wc}`,transition:'opacity .35s,filter .35s',...fog}}>
    <svg style={{position:'absolute',inset:0}} width={d.w} height={d.h}>
      {Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>{const lit=sr(r*17+c*31+d.wx*.1,7)>.36;return lit?<rect key={`${r}-${c}`} x={c*36+7} y={r*46+9} width={20} height={28} fill={d.wc} opacity={.45+sr(r+c,d.wx*.01)*.45}/>:null;}))}
    </svg>
    {d.sign&&<div style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',color:d.sign.col,fontSize:8,letterSpacing:3,fontFamily:"'TheMurk',monospace",textShadow:`0 0 6px ${d.sign.col},0 0 20px ${d.sign.col}55`,whiteSpace:'nowrap',animation:'flicker 9s infinite'}}>{d.sign.txt}</div>}
    {d.sign?.txt==='CORNER STORE'&&(<>
      {/* Blue awning */}
      <div style={{position:'absolute',bottom:d.h-2,left:'15%',width:'70%',height:22,
        background:'linear-gradient(180deg,#1a4a6a,#0f2e45)',
        borderBottom:'2px solid #2a6a9a',zIndex:2}}/>
      {/* Awning stripes */}
      {/* Door frame */}
      <div style={{position:'absolute',bottom:0,left:'44%',width:'14%',height:44,
        background:'#0a1520',border:'2px solid #2a4a6a',zIndex:2}}/>
      {/* Door handle */}
      <div style={{position:'absolute',bottom:14,left:'53%',width:4,height:10,
        background:'#6a9ab0',borderRadius:2,zIndex:3}}/>
    </>)}
  </div>);
}

function InventoryPanel({items,heartNum,onUse,onClose}){
  const [sel,setSel]=useState(0);
  const listed=items.filter(id=>ITEM_DEFS[id]);

  useEffect(()=>{
    const kd=e=>{
      if(e.code==='KeyI'||e.code==='Escape'){onClose();return;}
      if(e.code==='ArrowUp')setSel(s=>Math.max(0,s-1));
      if(e.code==='ArrowDown')setSel(s=>Math.min(listed.length-1,s+1));
      if(e.code==='KeyE'&&listed[sel]){onUse(listed[sel],sel);onClose();}
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[listed,sel,onUse,onClose]);

  const heartColor={red:C.red,yellow:C.gold,blue:'#2070d0'}[
    heartNum>=75?'red':heartNum>=50?'yellow':'blue'
  ]||C.red;

  return(
    <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
      zIndex:400,background:C.panel,border:`1px solid ${C.border}`,

          </svg>
        </div>
      </div>
      {/* Items */}
      {listed.length===0?(
        <div style={{padding:'20px 14px',color:C.dim,fontSize:7,letterSpacing:2,textAlign:'center'}}>NOTHING CARRIED</div>

  const [popup,setPopup]=useState(null);

  const [inputMethod,setInputMethod]=useState('keyboard');
  const [bedOptionIdx,setBedOptionIdx]=useState(0); // 0=REST, 1=SLEEP

    if(!o.prompt)return false;
    if(o.id==='money'&&money>0)return false;
    if(o.xMin!==undefined)return px>=o.xMin&&px<=o.xMax;
    return Math.abs(o.wx-px)<55;
  });
  const promptPrefix=inputMethod==='controller'?'[ B ]':'[ E ]';

  useEffect(()=>{

      if(popup){
        if(popupAction==='rest')onRest();
        else if(popupAction==='takemoney')onPickupMoney();
        else if(popupAction==='bedrest'){
          // Use selected bed option (0=REST 20%, 1=SLEEP 40%)
          const isDeepSleep=bedOptionIdx===1;
          const amount=isDeepSleep?40:20;
          const msg=isDeepSleep?'Heavy. Deep. Gone for a while.':'Good enough.';
          onRestBed?.(amount);
          setBark(msg);
          setTimeout(()=>setBark(null),isDeepSleep?4500:3500);
          setPopup(null);setPopupAction(null);setBedOptionIdx(0);return;
        }

    const kd=e=>{

          if(bedOptionIdx===0){onRestBed?.(20);setBark('Good enough.');setTimeout(()=>setBark(null),3500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}

          else if(bedOptionIdx===2){setPopup(null);setPopupAction(null);setBedOptionIdx(0);}
          return;
        }
      }
      if(e.code==='KeyE')handleInteract();
    };

        {popupAction==='bedrest'?(

            <div style={{display:'flex',gap:8,marginTop:12}}>
              <div onClick={()=>{setBedOptionIdx(0);onRestBed?.(20);setBark('Good enough.');setTimeout(()=>setBark(null),3500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===0?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===0?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===0?C.selBg:'transparent'}}>REST +20%</div>
              <div onClick={()=>{setBedOptionIdx(1);onRestBed?.(40);setBark('Heavy. Deep. Gone for a while.');setTimeout(()=>setBark(null),4500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===1?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===1?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===1?C.selBg:'transparent'}}>SLEEP +40%</div>
              <div onClick={()=>{setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===2?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===2?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===2?C.selBg:'transparent'}}>LEAVE</div>
            </div>
            <div style={{color:C.dim,fontSize:6,letterSpacing:1,marginTop:8,textAlign:'center'}}>← → {inputMethod==='controller'?'[D-PAD]':'[ARROWS]'} / {inputMethod==='controller'?'[B]':'[E]'} SELECT</div>
          </div>
        ):(
          <div onClick={()=>setPopup(null)} style={{color:C.dim,fontSize:8,marginTop:10,cursor:'pointer',letterSpacing:2}}>[ E ] CLOSE</div>
        )}
      </div>}
      {aptClimbPrompt&&<div style={{position:'absolute',bottom:aptCharBottom+30,left:px,zIndex:300,transform:'translateX(-50%)'}}><Prompt text={`[ ↑↓ ] ${aptClimbPrompt}`}/></div>}
      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} kicking={kicking} sweepKicking={sweepKicking} roundhouseKicking={roundhouseKicking} doubleKicking={doubleKicking} blocking={blocking} rolling={rolling} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={px} charHeight={297} charBottom={aptCharBottom} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>
      <SceneLabel label="OAKWOOD ARMS — 4C"/>
      <Controls hints={[['← →','MOVE'],['E','INTERACT'],['SHIFT','CROUCH'],['SPACE','JUMP'],['I','INVENTORY'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="apartment" onSceneChange={debugGo}/>}
    </div>
  );
}

// ── BATHROOM SCENE ───────────────────────────────────────────
function BathroomScene({heart,mono,onLeave,onShowerDone,bathroomSpawnPos,bathroomSpawnFacing,showerStat,debug,debugGo,currentOutfit,onEquipItem,onFindPhone,firstEntry=false}){
  const[px,setPx]=useState(bathroomSpawnPos??350);
  const[facing,setFacing]=useState(bathroomSpawnFacing??'right');
  const[blink,setBlink]=useState(firstEntry);
  const[walking,setWalking]=useState(false);
  const[pendingEquip,setPendingEquip]=useState(null);
  const[popup,setPopup]=useState(null);
  const[popupAction,setPopupAction]=useState(null);
  const[phoneTaken,setPhoneTaken]=useState(false);
  const[dialogueStep,setDialogueStep]=useState(showerStat?null:'shower_intro');
  const[newShowerStat,setNewShowerStat]=useState(null);
  const[waterState,setWaterState]=useState('running');
  const showerAudio=useRef(null);const dripAudio=useRef(null);
  const bathVidRef=useRef(null);
  const keys=useRef({});const raf=useRef(null);
  const exploring=dialogueStep===null;
  const near=exploring?BATH_OBJ.find(o=>{
    if(!o.prompt)return false;
    if(o.xMin!==undefined)return px>=o.xMin&&px<=o.xMax;
    return Math.abs(o.wx-px)<55;
  }):null;

  const handleChoose=useCallback((id)=>{
    if(dialogueStep==='shower_intro'){
      if(id==='A'){setWaterState('off');setDialogueStep('shower_a_sub');}
      else if(id==='B'){setNewShowerStat('sacrifice');setDialogueStep('shower_b_out');}
      else if(id==='C'){setWaterState('dripping');setNewShowerStat('compromise');setDialogueStep('shower_c_out');}
      else if(id==='D'){setWaterState('dripping');setNewShowerStat('passive');setDialogueStep('shower_d_out');}
    }else if(dialogueStep==='shower_a_sub'){
      const s={A1a:'empathetic',A1b:'guarded',A1c:'balanced',A1d:'traumatized'}[id]||'unknown';
      setNewShowerStat(s);
      if(id==='A1a')setWaterState('running');
      else if(id==='A1c'||id==='A1d')setWaterState('dripping');
      setDialogueStep(`shower_${id.toLowerCase()}_out`);
    }else if(dialogueStep==='mirror_main'){
      if(id==='A')setDialogueStep('mirror_a');
      else setDialogueStep('mirror_b_out');
    }else if(dialogueStep==='mirror_a'){
      setDialogueStep(`mirror_${id.toLowerCase()}_out`);
    }
  },[dialogueStep]);

  const handleFinish=useCallback(()=>{
    if(dialogueStep?.startsWith('shower')&&onShowerDone)onShowerDone(newShowerStat);
    setDialogueStep(null);
  },[dialogueStep,onShowerDone,newShowerStat]);

  const SHW_SRC=350, SHW_BASE=0.25, SHW_RANGE=600;

  // distance-based volume — fires on every position change
  useEffect(()=>{
    const vol=SHW_BASE*Math.max(0,1-Math.abs(px-SHW_SRC)/SHW_RANGE);
    if(showerAudio.current)showerAudio.current.volume=vol;
    if(dripAudio.current)dripAudio.current.volume=vol;
  },[px]);

  // water state switching — play/pause correct track, apply current distance vol
  useEffect(()=>{
    const sa=showerAudio.current;const da=dripAudio.current;
    if(!sa||!da)return;
    const vol=SHW_BASE*Math.max(0,1-Math.abs(px-SHW_SRC)/SHW_RANGE);
    if(waterState==='running'){da.pause();da.currentTime=0;sa.volume=vol;sa.muted=false;sa.play().catch(()=>{});}
    else if(waterState==='off'){sa.pause();sa.currentTime=0;da.pause();da.currentTime=0;}
    else if(waterState==='dripping'){sa.pause();sa.currentTime=0;da.volume=vol;da.muted=false;da.play().catch(()=>{});}
  },[waterState]); // eslint-disable-line

  useEffect(()=>()=>{showerAudio.current?.pause();dripAudio.current?.pause();},[]);

  useEffect(()=>{
    const v=bathVidRef.current;if(!v)return;
    v.muted=true;
    v.play().catch(()=>{});
  },[]);

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(dialogueStep)return;
      if(popup){
        if(e.code==='Escape'||e.code==='KeyE'){
          if(popupAction==='findphone'){onFindPhone?.();setPhoneTaken(true);setPopup(null);setPopupAction(null);return;}
          setPopup(null);setPopupAction(null);
        }
        return;
      }
      if(e.code==='KeyE'){
        if(near?.id==='door')onLeave();
        else if(near?.id==='mirror')setDialogueStep('mirror_main');
        else if(near?.id==='soak'){
          setPopup(BATH_POPUPS.soak);
        } else if(BATH_POPUPS[near?.id]){
          if(near.id==='toilet'&&phoneTaken){
            setPopup(TOILET_BARKS[Math.floor(Math.random()*TOILET_BARKS.length)]);
          } else {
            setPopup(BATH_POPUPS[near.id]);
            if(near.id==='toilet')setPopupAction('findphone');
          }
        }
      }
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[near,onLeave,popup,popupAction,dialogueStep,onFindPhone,phoneTaken,onEquipItem]);

  useEffect(()=>{
    if(pendingEquip&&onEquipItem){
      onEquipItem(pendingEquip);
      setPendingEquip(null);
    }
  },[pendingEquip,onEquipItem]);

  useEffect(()=>{
    const loop=()=>{
      if(!popup&&!dialogueStep){
        if(keys.current['ArrowLeft']||keys.current['KeyA']){setPx(x=>Math.max(VIEWPORT.minX,x-SPD));setFacing('left');setWalking(true);}
        else if(keys.current['ArrowRight']||keys.current['KeyD']){setPx(x=>Math.min(VIEWPORT.maxX,x+SPD));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[popup,dialogueStep]);

  const activeSeq=dialogueStep?DIALOGUE_SEQS[dialogueStep]:null;
  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#080606'}}>
      <video ref={bathVidRef} src={BATHROOM_VID} autoPlay loop playsInline preload="auto"
        style={{position:'absolute',top:'10%',left:0,width:'100%',
          height:'90%',objectFit:'cover',objectPosition:'center bottom',zIndex:0}}/>
      <svg style={{position:'absolute',inset:0,opacity:.04,pointerEvents:'none'}} width={VW} height={VH}>
        {Array.from({length:12},(_,r)=>Array.from({length:22},(_,c)=>(
          <rect key={`${r}-${c}`} x={c*60+2} y={r*48+2} width={56} height={44} rx={1} fill="none" stroke="#c8b89055" strokeWidth={.5}/>
        )))}
      </svg>
      {BATH_OBJ.map(o=>{
        const isNear=near?.id===o.id;
        return(<div key={o.id} style={{position:'absolute',bottom:116,left:o.wx,zIndex:VIEWPORT.promptZ}}>
          {isNear&&o.prompt&&<Prompt text={o.prompt}/>}
        </div>);
      })}
      {activeSeq&&<VoiceBox key={dialogueStep} seq={activeSeq} onChoose={handleChoose} onFinish={handleFinish}/>}
      {popup&&!dialogueStep&&<div style={{position:'absolute',top:60,left:'50%',transform:'translateX(-50%)',zIndex:300,background:C.panel,border:`1px solid ${C.border}`,padding:'12px 20px',fontFamily:"'TheMurk',monospace",maxWidth:440}}>
        <div style={{color:C.red,fontSize:7,letterSpacing:3,marginBottom:8}}>// {popup.title}</div>
        <div style={{color:C.text,fontSize:8,lineHeight:1.75}}>{popup.body}</div>
        <div onClick={()=>setPopup(null)} style={{color:C.dim,fontSize:8,marginTop:10,cursor:'pointer',letterSpacing:2}}>[ E ] CLOSE</div>
      </div>}
      <audio ref={showerAudio} src={SHOWER_SFX} loop preload="auto" muted/>
      <audio ref={dripAudio} src={DRIP_SFX} loop preload="auto" muted/>
      <Char facing={facing} walking={walking} charBottom={43} charX={px} charHeight={334} currentOutfit={currentOutfit}/><Mono text={mono}/><Heart state={heart}/>
      <SceneLabel label="BATHROOM — 4C OAKWOOD ARMS"/>
      <Controls hints={[['← →','MOVE'],['E','INTERACT'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="bathroom" onSceneChange={debugGo}/>}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 40%,#060402c0 100%)'}}/>
      {blink&&<BlinkTransition onDone={()=>setBlink(false)}/>}
    </div>
  );
}

// ── HALLWAY SCENE ─────────────────────────────────────────────
function HallwayScene({heart,mono,mode,onRoom,onExit,inventory,heartNum,onUseItem,currentOutfit,debug,debugGo,stamina,onStaminaChange,hudOpen=false}){
  const[px,setPx]=useState(mode==='in'?1030:200);
  const[facing,setFacing]=useState(mode==='in'?'left':'right');
  const[walking,setWalking]=useState(false);
  const[popup,setPopup]=useState(null);
  const[exiting,setExiting]=useState(false);
  const elevAudio=useRef(null);const radioAudio=useRef(null);
  const convAudio=useRef(null);const vacAudio=useRef(null);
  const apt4aAudio=useRef(null);const apt4bAudio=useRef(null);
  const knockAudio=useRef(null);
  const hallwayVidRef=useRef(null);
  useEffect(()=>{const v=hallwayVidRef.current;if(!v)return;v.muted=true;v.play().catch(()=>{});},[]);
  useEffect(()=>{
    [apt4aAudio,apt4bAudio].forEach(r=>{if(r.current){r.current.volume=0;r.current.muted=false;r.current.play().catch(()=>{});}});
  },[]);
  const raf=useRef(null);
  const hallwaySPD=SPD*0.2;
  const {keys,running,isCrouching,kicking,sweepKicking,roundhouseKicking,doubleKicking,blocking,rolling,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(hallwaySPD,stamina,onStaminaChange,currentOutfit,hudOpen);
  const {charBottom:hallCharBottom,climbPrompt:hallClimbPrompt}=useWorldY(30,[],px,keys);
  const near=HALL_OBJ.find(o=>Math.abs(o.wx-px)<70&&o.prompt);

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(popup){if(e.code==='Escape'||e.code==='KeyE'){setPopup(null);if(near?.id==='door_4b'){const a=apt4bAudio.current;if(a){a.muted=false;a.play().catch(()=>{});}}return;}}
      if(e.code==='KeyE'){
        if(near?.id==='her_door')onRoom();
        else if(near?.id==='stairs_up'||near?.id==='stairs_down'){setPopup(HALL_POPUPS[near.id]);}
        else if(near?.id==='elevator'){debugGo?.('elevator');}
        else if(near?.id==='door_4a'||near?.id==='door_4b'){
          const ka=knockAudio.current;if(ka){ka.muted=false;ka.play().catch(()=>{});}
          setTimeout(()=>{
            setPopup(HALL_POPUPS[near.id]);
            if(near?.id==='door_4b')apt4bAudio.current?.pause();
          },3200);
        }
      }
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[near,onRoom,onExit,popup]);

  // start door ambience at vol 0 on mount
  useEffect(()=>{
    [radioAudio,convAudio,vacAudio].forEach(r=>{
      if(r.current){
        r.current.volume=0;
        r.current.muted=false;
        r.current.play().catch(()=>{});
      }
    });
  },[]);

  // proximity volume — apartments
  useEffect(()=>{
    const vol=(playerPx,wx,max=260,peak=0.55)=>Math.max(0,(1-Math.abs(playerPx-wx)/max)*peak);
    if(apt4aAudio.current)apt4aAudio.current.volume=vol(px,663,300,0.04);
    if(apt4bAudio.current)apt4bAudio.current.volume=vol(px,850,300,0.06);
  },[px]);

  useEffect(()=>()=>{[elevAudio,radioAudio,convAudio,vacAudio,apt4aAudio,apt4bAudio,knockAudio].forEach(r=>r.current?.pause());},[]);

  useEffect(()=>{
    const hallwayMaxX=1150;
    const loop=()=>{
      if(!popup&&!exiting){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const isMoving=left||right;
        const {currentSpeed,isKicking}=updateMovement(isMoving);

        if(!isKicking&&left){setPx(x=>Math.max(VIEWPORT.minX,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(!isKicking&&right){setPx(x=>Math.min(hallwayMaxX,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[popup,exiting]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0a0907'}}>
      <video ref={hallwayVidRef} src={HALLWAY_IMG} autoPlay loop playsInline preload="auto"
        style={{position:'absolute',inset:0,width:'200%',height:'100%',left:`${-px*1.0}px`,top:0,objectFit:'cover',objectPosition:'left center',zIndex:0}}/>
      <svg style={{position:'absolute',top:55,left:0,width:VW,height:28,zIndex:2,pointerEvents:'none'}} width={VW} height={28}>
        {[140,310,490,650,820,1000].map((sx,i)=><rect key={i} x={sx-22} y={0} width={44} height={7} rx={2} fill="#d4a02018"/>)}</svg>
      {near&&near.prompt&&(
        <div style={{position:'absolute',bottom:116,left:near.wx,zIndex:VIEWPORT.promptZ}}>
          <Prompt text={near.prompt}/>
        </div>
      )}
      <audio ref={elevAudio} src={ELEV_SFX} loop preload="auto" muted/>
      <audio ref={radioAudio} src={RADIO_SFX} loop preload="auto" muted/>
      <audio ref={convAudio} src={CONV_SFX} loop preload="auto" muted/>
      <audio ref={vacAudio} src={VAC_SFX} loop preload="auto" muted/>
      <audio ref={apt4aAudio} src="../audio/sfx/ambient/building/01_spanish_radio.mp3" loop preload="auto" muted/>
      <audio ref={apt4bAudio} src="../audio/sfx/ambient/building/vacuum_cleaner_baby.mp3" loop preload="auto" muted/>
      <audio ref={knockAudio} src="../audio/sfx/interact/doors/knocking.mp3" preload="auto" muted/>
      {exiting&&<div style={{position:'absolute',inset:0,zIndex:300,background:'#000',opacity:.7,pointerEvents:'none'}}/>}
      {exiting&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:301,color:C.dim,fontSize:7,letterSpacing:4,fontFamily:"'TheMurk',monospace"}}>LOBBY ↓</div>}
      {popup&&<div style={{position:'absolute',top:60,left:'50%',transform:'translateX(-50%)',zIndex:300,background:C.panel,border:`1px solid ${C.border}`,padding:'12px 20px',fontFamily:"'TheMurk',monospace",maxWidth:440}}>
        <div style={{color:C.red,fontSize:7,letterSpacing:3,marginBottom:8}}>// {popup.title}</div>
        <div style={{color:C.text,fontSize:8,lineHeight:1.75}}>{popup.body}</div>
        <div onClick={()=>setPopup(null)} style={{color:C.dim,fontSize:8,marginTop:10,cursor:'pointer',letterSpacing:2}}>[ E ] CLOSE</div>
      </div>}
      {hallClimbPrompt&&<div style={{position:'absolute',bottom:hallCharBottom+30,left:px,zIndex:300,transform:'translateX(-50%)'}}><Prompt text={`[ ↑↓ ] ${hallClimbPrompt}`}/></div>}
      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} kicking={kicking} sweepKicking={sweepKicking} roundhouseKicking={roundhouseKicking} doubleKicking={doubleKicking} blocking={blocking} rolling={rolling} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={px} charBottom={hallCharBottom} charHeight={308} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>
      <SceneLabel label="4TH FLOOR — OAKWOOD ARMS"/>
      <Controls hints={[['← →','MOVE'],['E','INTERACT'],['SHIFT','CROUCH'],['SPACE','JUMP'],['I','INVENTORY'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="hallway" onSceneChange={debugGo}/>}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 40%,#060402b0 100%)'}}/>
    </div>
  );
}

// ── ELEVATOR SCENE ────────────────────────────────────────────
function ElevatorScene({onDone,onExit,currentOutfit}){
  const [moving,setMoving]=useState(false);
  const [selected,setSelected]=useState(4);
  const [shake,setShake]=useState({x:0,y:0});
  const shakeInterval=useRef(null);
  const elevSoundRef=useRef(null);
  const floors=['G','1','2','3','4'];
  const currentFloor=4;

  useEffect(()=>{
    if(moving){
      shakeInterval.current=setInterval(()=>{
        setShake({x:(Math.random()-.5)*5,y:(Math.random()-.5)*3});
      },70);
    }else{
      clearInterval(shakeInterval.current);
      setShake({x:0,y:0});
    }
    return()=>clearInterval(shakeInterval.current);
  },[moving]);

  useEffect(()=>{
    const kd=e=>{
      if(moving)return;
      if(e.code==='ArrowUp'||e.code==='KeyW'){
        setSelected(s=>s>0?s-1:floors.length);
        return;
      }
      if(e.code==='ArrowDown'||e.code==='KeyS'){
        setSelected(s=>s<floors.length?s+1:0);
        return;
      }
      if(e.code==='KeyE'){
        const floor=floors[selected];
        if(floor==='EXIT'){onExit?.();return;}
        const floorNum=floor==='G'?0:parseInt(floor);
        if(floorNum===currentFloor)return;
        setMoving(true);
        const es=elevSoundRef.current;if(es){es.muted=false;es.play().catch(()=>{});}
        setTimeout(()=>onDone?.(),2000);
      }
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[moving,selected,onDone,onExit,currentFloor,floors]);

  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0a0907',transform:`translate(${shake.x}px,${shake.y}px)`}}>
      <img src="../graphics/maps/the_veil/move_block/residential_zone/apartment_building/elevator/apt_elevator.png"
        style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',zIndex:0}}
        alt="elevator"/>
      <Char facing="right" walking={false} charX={VW/2} charBottom={42} charHeight={336} currentOutfit={currentOutfit}/>
      <div style={{position:'absolute',right:20,top:'50%',transform:'translateY(-50%)',background:C.panel,border:`1px solid ${C.border}`,padding:12,zIndex:300}}>
        <div style={{color:C.dim,fontSize:8,letterSpacing:2,fontFamily:"'TheMurk',monospace",marginBottom:10}}>FLOOR</div>
        {floors.map((f,i)=>(
          <div key={f} style={{display:'block',width:'100%',padding:'8px 12px',marginBottom:6,background:currentFloor===(f==='G'?0:parseInt(f))?C.gold:selected===i?C.selBg:C.selBg,color:currentFloor===(f==='G'?0:parseInt(f))?'#000':C.text,border:`1px solid ${C.border}`,fontFamily:"'TheMurk',monospace",fontSize:8,opacity:moving?0.5:1,letterSpacing:1}}>
            {selected===i&&'[ E ] '}{f}
          </div>
        ))}
        <div style={{display:'block',width:'100%',padding:'8px 12px',marginTop:10,background:selected===floors.length?'#3a2020':'#1a0808',color:C.red,border:`1px solid ${C.border}`,fontFamily:"'TheMurk',monospace",fontSize:8,opacity:moving?0.5:1,letterSpacing:1}}>
          {selected===floors.length&&'[ E ] '}EXIT
        </div>
      </div>

// ── INTERNAL THOUGHTS BOX ─────────────────────────────────────
// Octavia's internal monologue — distinct from NPC ChatBox.
// Style this component to match the custom thoughts UI design.
function InternalThoughtsBox({convKey,onDone}){
  const [nodeId,setNodeId]=useState(null);
  const outfit=window.__beau_outfit||'cyber_octavia';
  const tree=CONV[convKey+'__'+outfit]||CONV[convKey]||[];
  const node=nodeId?tree.find(n=>n.id===nodeId):tree[0];
  const emotion=(node?.emotion||node?.voice||'').toUpperCase();

  const advance=useCallback(()=>{
    if(!node){onDone();return;}
    const nextId=node.opts?.[0]?.next;
    if(!nextId){onDone();return;}
    const next=tree.find(n=>n.id===nextId);
    if(!next){onDone();return;}
    setNodeId(next.id);
  },[node,tree,onDone]);

  useEffect(()=>{
    const h=e=>{
      if(e.code==='KeyE'||e.code==='Space'){e.preventDefault();advance();}
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[advance]);

  if(!node)return null;

  return(
    <div style={{position:'absolute',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'auto'}}>
      <div style={{
        maxWidth:520,width:'90%',padding:'32px 40px',
        background:'rgba(8,9,10,0.92)',
        borderLeft:'3px solid #40e090',
        fontFamily:"'TheMurk',monospace",letterSpacing:'1px',
      }}>
        {emotion&&<div style={{fontSize:7,color:'#40e090',marginBottom:14,letterSpacing:'3px'}}>〰 {emotion}</div>}
        <div style={{fontSize:10,color:'rgba(220,230,220,0.9)',lineHeight:2,fontStyle:'italic'}}>
          {node.npc||node.text||''}
        </div>
        <div style={{marginTop:20,fontSize:6,color:'rgba(255,255,255,0.3)',textAlign:'right',letterSpacing:'2px'}}>
          [ E ] continue
        </div>
      </div>
    </div>
  );
}

function StrScene({heart,mono,mode,spawnX,onStore,onHome,onPharmacy,onRestaurant,onAlleyWay,inventory,onUseItem,heartNum,currentOutfit,debug,debugGo,stamina,onStaminaChange,hudOpen=false}){
  // STR_IMG_W: rendered width of exterior.png at backgroundSize:'auto 120%'
  // Original image 3252×1280; rendered height=VH*1.2=864; width=3252*(864/1280)≈2195
  const STR_IMG_W=Math.floor(3252*(VH*1.2/1280));
  const STR_CAM_MAX=STR_IMG_W-VW;
  const initX=spawnX!=null?spawnX:(mode==='return'?860:640);
  const initFacing=spawnX!=null?(spawnX>=1200?'left':'right'):(mode==='return'?'left':'right');
  const [worldX,setWorldX]=useState(initX);
  const [facing,setFacing]=useState(initFacing);
  const [walking,setWalking]=useState(false);
  const [conv,setConv]=useState(null);
  const [painGlitch,setPainGlitch]=useState(null);
  const [streetTexts,setStreetTexts]=useState([]);
  const raf=useRef(null);
  const strSPD=SPD*0.1024;
  const {keys,running,isCrouching,kicking,sweepKicking,roundhouseKicking,doubleKicking,blocking,rolling,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(strSPD,stamina,onStaminaChange,currentOutfit,hudOpen,0.35);
  const {charBottom:strCharBottom,climbPrompt:strClimbPrompt}=useWorldY(25,[],worldX,keys);
  // Camera: follows worldX but stops at image edges — never shows black
  const cam=clamp(worldX-VW/2,0,STR_CAM_MAX);
  const nearNpc=STR_NPCS.find(n=>Math.abs(n.wx-worldX)<85);
  const nearLoc=STR_LOCS.find(l=>worldX>=l.xMin&&worldX<=l.xMax);
  const nearStore=nearLoc?.id==='store';
  const nearLobby=nearLoc?.id==='lobby';
  const nearPharmacy=nearLoc?.id==='pharmacy';
  const nearRestaurant=nearLoc?.id==='restaurant';
  const nearAlleyWay=nearLoc?.id==='alley_video_store';

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(e.code==='KeyE'){
        if(conv){return;}
        if(nearLobby)onHome();
        else if(nearStore)onStore();
        else if(nearPharmacy)onPharmacy();
        else if(nearRestaurant)onRestaurant();
        else if(nearAlleyWay)onAlleyWay();
        else if(nearNpc)setConv({key:nearNpc.conv,name:nearNpc.name});
      }
      if(e.code==='Escape'){setConv(null);}
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[nearLoc,nearStore,nearPharmacy,nearRestaurant,nearAlleyWay,nearLobby,nearNpc,conv,onStore,onHome,onPharmacy,onRestaurant,onAlleyWay]);

  useEffect(()=>{
    const loop=()=>{
      if(!conv){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const isMoving=left||right;
        const {currentSpeed,isKicking}=updateMovement(isMoving);

        if(!isKicking&&left){setWorldX(x=>Math.max(0,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(!isKicking&&right){setWorldX(x=>Math.min(STR_IMG_W,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[conv,STR_IMG_W]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  useEffect(()=>{
    const t=setInterval(()=>{
      if(Math.random()<0.12){
        const dx=(-5+Math.random()*10).toFixed(1);
        const dy=(-1+Math.random()*2).toFixed(1);
        setPainGlitch({dx,dy});
        setTimeout(()=>setPainGlitch(null),75+Math.random()*110);
      }
    },1800);
    return()=>clearInterval(t);
  },[]);


  // Floating ambient street text while walking
  const STREET_TEXT_POOL=[
    "Yo, watch yourself walking alone at night.",
    "Rain's coming hard, baby. Don't stay out too long.",
    "Network been moving people through. Keep your head down.",
    "...yeah, the Bureau was asking questions yesterday. Nobody talking.",
    "Power was out on Third Street yesterday. Bureau doing something.",
    "They're hunting someone. Can feel it. City feels different when they're hunting.",
    "Bureau's got a face. Someone they're looking for.",
    "Network's moving people. Safe houses going active.",
  ];

  useEffect(()=>{
    if(!walking||conv)return;
    const interval=setInterval(()=>{
      if(Math.random()<0.4){
        const txt=STREET_TEXT_POOL[Math.floor(Math.random()*STREET_TEXT_POOL.length)];
        const x=100+Math.random()*(VW-200);
        const id=Date.now();
        setStreetTexts(prev=>[...prev,{id,txt,x}]);
        setTimeout(()=>setStreetTexts(prev=>prev.filter(t=>t.id!==id)),3000);
      }
    },Math.random()*4000+4000);
    return()=>clearInterval(interval);
  },[walking,conv]);

  const pgXf=painGlitch?{transform:`translate(${painGlitch.dx}px,${painGlitch.dy}px)`}:{};
  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:C.bg,...pgXf}}>
      <div style={{position:'absolute',inset:0,zIndex:0,backgroundImage:`url('${EXTERIOR_IMG}')`,backgroundSize:'auto 120%',backgroundPosition:`${-cam}px 105%`,backgroundRepeat:'no-repeat',backgroundColor:'#0a0907'}}/>
      {nearLoc&&!conv&&<div style={{position:'absolute',bottom:25,left:worldX-cam,zIndex:9999}}><Prompt text={`[ E ] ${nearLoc.label}`}/></div>}
      {nearNpc&&!conv&&<div style={{position:'absolute',bottom:25,left:worldX-cam,zIndex:9999}}><Prompt text="[ E ] TALK"/></div>}
      {strClimbPrompt&&<div style={{position:'absolute',bottom:strCharBottom+30,left:worldX-cam,zIndex:300,transform:'translateX(-50%)'}}><Prompt text={`[ ↑↓ ] ${strClimbPrompt}`}/></div>}
      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} kicking={kicking} sweepKicking={sweepKicking} roundhouseKicking={roundhouseKicking} doubleKicking={doubleKicking} blocking={blocking} rolling={rolling} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={worldX-cam} charHeight={74} charBottom={strCharBottom} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>
      <SceneLabel label={mode==='return'?'THE VEIL — RETURNING':'THE VEIL — MOVE BLOCK'}/>
      <Controls hints={[['← →','MOVE'],['E','TALK/ENTER'],['SHIFT','CROUCH'],['SPACE','JUMP'],['I','INVENTORY'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={worldX} scene="street" onSceneChange={debugGo}/>}
      {conv&&<ChatBox convKey={conv.key} npcName={conv.name} npcImg={''} total={0}
        onAct={act=>{if(act==='end'||!act)setConv(null);}}/>}
      {streetTexts.map(st=>(
        <div key={st.id} style={{position:'absolute',top:Math.random()*200+100,left:st.x,zIndex:100,fontFamily:"'TheMurk',monospace",fontSize:8,color:`${C.dim}`,whiteSpace:'nowrap',animation:`fade 3s ease-out`,opacity:.7,pointerEvents:'none'}}>
          "{st.txt}"
        </div>
      ))}
    </div>
  );
}

// ── HUD SUPPRESSION ──────────────────────────────────────────
// Dialogue boxes / menus call this so the always-on in-game HUD slides away while
// they're up. Reference-counted (multiple sources can stack) via a window event.
let __hudSuppress=0;
function beauSuppressHud(delta){
  __hudSuppress=Math.max(0,__hudSuppress+delta);
  window.dispatchEvent(new CustomEvent('beau_hudSuppress',{detail:{count:__hudSuppress}}));
}
function useSuppressHud(){
  useEffect(()=>{beauSuppressHud(1);return()=>beauSuppressHud(-1);},[]);
}
// Drop-in: render <HudSuppressor/> while any custom (non-CineDialogBox) menu is open.
function HudSuppressor(){useSuppressHud();return null;}

// Always-on in-game HUD device (it IS Octavia's phone — only after she finds it).
// Two modes inside the mask screen region:
//  • inStore → 2×4 shopping cart grid (hover a slot → PUT BACK)
//  • otherwise → paged status. Each page fills the screen; 'home' shows a large
//    Octavia portrait (left) + big HEALTH/STAMINA bars (right). d-pad ←/→ cycles.
function InGameHUD({inStore=false,basket=[],onRemoveItem,heartNum=0,stamina=0,money=0,currentOutfit,onEquipItem}){
  const [hov,setHov]=useState(null);
  const [tab,setTab]=useState(0);
  const [dir,setDir]=useState('right'); // slide direction for page transitions
  const [sel,setSel]=useState(0); // selected item within the current page (power/gear)
  const [glitch,setGlitch]=useState(false); // random CRT glitch burst
  const [visible,setVisible]=useState(true); // auto-hide after idle
  const [suppressed,setSuppressed]=useState(()=>__hudSuppress>0); // hidden while a dialogue/menu is open
  const hideTimerRef=useRef(null);
  const HUD_W=211, HUD_H=Math.round(HUD_W*581/1080); // 176 + ~20%
  const S=INGAME_HUD_SCREEN;
  const sx=HUD_W*S.x, sy=HUD_H*S.y, sw=HUD_W*S.w, sh=HUD_H*S.h;
  // Content is authored at a fixed design canvas (BW×BH = the 440-frame screen),
  // then uniformly scaled to fit the actual mask region — shrink without reflow.
  const BW=325, BH=165, scale=sw/BW;
  const PAD=10, PAD_R=16; // inset content from the screen edges (extra on the right)

  // d-pad ←/→ (or keyboard [ ]) cycle status pages
  // d-pad ←/→ (BracketLeft/Right) change page; d-pad ↑/↓ (ArrowUp/Down) cycle items within a page.
  useEffect(()=>{
    if(inStore||suppressed)return; // dialogue/menu open → HUD ignores d-pad (no accidental equip)
    const L=HUD_TABS_INGAME.length;
    const pid=HUD_TABS_INGAME[tab].id;
    const count=pid==='power'?HUD_POWERS.length:pid==='gear'?HUD_GEAR.length:0;
    const kd=e=>{
      if(e.code==='BracketLeft'){setDir('left');setTab(t=>(t-1+L)%L);setSel(0);}
      else if(e.code==='BracketRight'){setDir('right');setTab(t=>(t+1)%L);setSel(0);}
      else if(count>0&&e.code==='ArrowUp'){
        setSel(s=>{const n=(s-1+count)%count;if(pid==='gear')onEquipItem?.(HUD_GEAR[n].id);return n;});
      }
      else if(count>0&&e.code==='ArrowDown'){
        setSel(s=>{const n=(s+1)%count;if(pid==='gear')onEquipItem?.(HUD_GEAR[n].id);return n;});
      }
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[inStore,tab,suppressed]);

  // Random glitch blip — fires every few seconds for a short burst
  useEffect(()=>{
    let t1,t2;
    const schedule=()=>{
      t1=setTimeout(()=>{
        setGlitch(true);
        t2=setTimeout(()=>{setGlitch(false);schedule();},140+Math.random()*180);
      },3500+Math.random()*6500);
    };
    schedule();
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);

  // Hide while a dialogue/menu is open
  useEffect(()=>{
    const h=e=>setSuppressed((e.detail?.count||0)>0);
    window.addEventListener('beau_hudSuppress',h);
    return()=>window.removeEventListener('beau_hudSuppress',h);
  },[]);

  // Auto-hide after 3s idle; any d-pad key wakes it back up
  const resetHideTimer=useCallback(()=>{
    setVisible(true);
    clearTimeout(hideTimerRef.current);
    hideTimerRef.current=setTimeout(()=>setVisible(false),3000);
  },[]);

  useEffect(()=>{
    resetHideTimer(); // start the first timer on mount
    const DPAD=['ArrowUp','ArrowDown','BracketLeft','BracketRight'];
    const kd=e=>{if(DPAD.includes(e.code))resetHideTimer();};
    window.addEventListener('keydown',kd);
    return()=>{window.removeEventListener('keydown',kd);clearTimeout(hideTimerRef.current);};
  },[resetHideTimer]);

  // Wake HUD and switch to VITALS when health or stamina drops low
  const HEALTH_WARN=30, STAMINA_WARN=25;
  useEffect(()=>{
    if(heartNum<HEALTH_WARN||stamina<STAMINA_WARN){
      setTab(0); // force VITALS page so the bars are visible
      resetHideTimer();
    }
  },[heartNum,stamina]);

  const page=HUD_TABS_INGAME[tab];
  const show=visible&&!suppressed; // dialogue/menu open → slide away

  return(
    <div style={{position:'absolute',left:12,bottom:12,width:HUD_W,height:HUD_H,zIndex:160,
      fontFamily:"'TheMurk',monospace",userSelect:'none',opacity:0.82,
      animation:show?'hudSlideUp 0.4s ease-out forwards':'hudSlideDown 0.4s ease-in forwards',
      pointerEvents:show?'auto':'none'}}>
      <style>{`
        @keyframes hudSlideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes hudSlideDown{from{transform:translateY(0);opacity:1}to{transform:translateY(100%);opacity:0}}
        @keyframes hudPageInR{from{transform:translateX(60%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes hudPageInL{from{transform:translateX(-60%);opacity:0}to{transform:translateX(0);opacity:1}}
      `}</style>
      {/* Device frame */}
      <img src={INGAME_HUD_IMG} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',
        objectFit:'fill',pointerEvents:'none'}}/>

      {/* Screen — fixed design canvas scaled to fit the mask region */}
      <div style={{position:'absolute',left:sx,top:sy,width:BW,height:BH,
        transform:`scale(${scale})`,transformOrigin:'top left',overflow:inStore?'visible':'hidden'}}>
        {inStore?(
          /* ── CART MODE: 2×4 grid ── */
          <div style={{position:'absolute',top:PAD,left:PAD,bottom:PAD,right:PAD_R,display:'grid',
            gridTemplateColumns:'repeat(4,1fr)',gridTemplateRows:'1fr 1fr',gap:3,padding:1}}>
            {Array.from({length:8}).map((_,i)=>{
              const id=basket[i];
              const it=id?STORE_ITEMS.find(x=>x.id===id):null;
              if(!it)return <div key={'e'+i} style={{border:`1px solid ${C.border}33`,background:C.selBg+'55'}}/>;
              const isHov=hov===id;
              return(
                <div key={id} onMouseEnter={()=>setHov(id)} onMouseLeave={()=>setHov(null)}
                  style={{position:'relative',display:'flex',flexDirection:'column',alignItems:'stretch',
                    border:`1px solid ${isHov?C.gold:C.border+'66'}`,
                    background:isHov?C.selBg:C.selBg+'88',cursor:'pointer'}}>
                  <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
                    {it.img?<img src={it.img} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                      :<span style={{color:it.col||C.gold,fontSize:22,fontWeight:'bold'}}>{it.label[0]}</span>}
                  </div>
                  <span style={{fontSize:9,color:isHov?C.gold:C.dim,letterSpacing:0.5,
                    maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textAlign:'center'}}>
                    {it.label.split(' ')[0]}
                  </span>
                  {isHov&&(
