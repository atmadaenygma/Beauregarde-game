<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEAUREGARDE — Construction Kit</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face {
      font-family: 'TheMurk';
      src: url('../graphics/assets/fonts/TheMurk-GrungeMatrix.otf') format('opentype');
      font-weight: normal;
    }
    :root {
      --bg:#68bfb8; --surface:#f0ebe0; --raised:#e4ddd0;
      --text:#0e0b08; --text2:#5a4838;
      --dim:#9a9080; --dimmer:#d0cabb; --border:#c0b8a8;
      --accent:#1a7870; --accent2:#b84818; --red:#c43028;
      --muted:#887868; --tag-bg:#e8e2d3; --input-bg:#ffffff; --scroll:#9a9080;
      --brutal:#0e0b08;
      --fxt:6px; --fxs:7px; --fxb:8px; --fxh:9px;
    }
    body.fs-md { --fxt:8px; --fxs:9px; --fxb:10px; --fxh:11px; }
    body.fs-lg { --fxt:10px; --fxs:11px; --fxb:13px; --fxh:14px; }
    body.pal-chalk {
      --bg:#f0ebe0; --surface:#ffffff; --raised:#e8e2d4;
      --text:#1a1208; --text2:#6a5840; --dim:#b0988a; --dimmer:#d8d0c0; --border:#c8c0b0;
      --accent:#d44414; --accent2:#a83210; --red:#c43028;
      --muted:#8a7868; --tag-bg:#ede8dc; --input-bg:#ffffff; --scroll:#b0988a;
      --brutal:#1a1208;
    }
    body.pal-northside {
      --bg:#12082a; --surface:#1e1040; --raised:#281850;
      --text:#c8f0dc; --text2:#7890a8; --dim:#5040a0; --dimmer:#2a1860; --border:#381e60;
      --accent:#a030e0; --accent2:#28cc80; --red:#e03068;
      --muted:#6050a0; --tag-bg:#201040; --input-bg:#1e1040; --scroll:#5040a0;
      --brutal:#5040a0;
    }
    body.pal-chromakopia {
      --bg:#090c07; --surface:#121810; --raised:#1a2018;
      --text:#d8e0c0; --text2:#788058; --dim:#3a5030; --dimmer:#1e2a18; --border:#253020;
      --accent:#4a9038; --accent2:#88c840; --red:#c43028;
      --muted:#587048; --tag-bg:#151c12; --input-bg:#121810; --scroll:#3a5030;
      --brutal:#3a5030;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:'TheMurk',monospace; }

    /* SHELL */
    .shell { display:flex; flex-direction:column; height:100vh; }

    /* NAV */
    .nav { display:flex; align-items:center; gap:8px; background:var(--surface); border-bottom:3px solid var(--brutal); padding:0 14px; height:48px; flex-shrink:0; z-index:300; }
    .nav-title { color:var(--accent); font-size:var(--fxh); font-weight:700; letter-spacing:3px; white-space:nowrap; }
    .nav-spacer { flex:1; }
    .nav-btn { background:var(--raised); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); font-weight:700; letter-spacing:1px; padding:5px 12px; cursor:pointer; white-space:nowrap; box-shadow:3px 3px 0 var(--brutal); transition:box-shadow .06s,transform .06s; }
    .nav-btn:hover { border-color:var(--accent); color:var(--accent); box-shadow:none; transform:translate(3px,3px); }
    .nav-btn.back-btn { border-color:var(--brutal); color:var(--text2); box-shadow:2px 2px 0 var(--brutal); }
    .nav-btn.back-btn:hover { color:var(--text); box-shadow:none; transform:translate(2px,2px); }
    .nav-btn.save-btn { border-color:var(--accent2); color:var(--accent2); box-shadow:3px 3px 0 var(--accent2); }
    .nav-btn.save-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    .nav-btn.export-btn { border-color:var(--accent); color:var(--accent); box-shadow:3px 3px 0 var(--accent); }
    .nav-btn.export-btn:hover { background:var(--accent); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    .pal-sel { background:var(--raised); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:4px 6px; cursor:pointer; }

    /* TREE / BREADCRUMB BAR */
    .tree-bar { display:flex; align-items:center; background:var(--surface); border-bottom:2px solid var(--brutal); height:34px; overflow-x:auto; overflow-y:hidden; flex-shrink:0; }
    .tree-bar::-webkit-scrollbar { height:0; }
    .tree-tab { display:flex; align-items:center; gap:5px; padding:0 12px; height:100%; border-right:2px solid var(--brutal); cursor:pointer; flex-shrink:0; user-select:none; }
    .tree-tab:hover { background:var(--raised); }
    .tree-tab.active { background:var(--raised); border-bottom:3px solid var(--accent); }
    .tree-tab-name { font-size:var(--fxb); color:var(--text2); letter-spacing:1px; }
    .tree-tab.active .tree-tab-name { color:var(--accent); }
    .tree-tab-rename { font-size:var(--fxb); background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; padding:1px 4px; width:90px; }
    .tree-type-badge { font-size:var(--fxt); font-weight:700; letter-spacing:1px; padding:2px 4px; cursor:pointer; color:var(--bg); flex-shrink:0; user-select:none; }
    .tree-type-badge:hover { opacity:0.75; }
    .sb-item.sb-active { background:var(--raised); }
    .tree-tab-del { font-size:var(--fxh); color:var(--dim); cursor:pointer; }
    .tree-tab-del:hover { color:var(--red); }
    .tree-new { display:flex; align-items:center; padding:0 14px; cursor:pointer; font-size:var(--fxb); color:var(--text2); letter-spacing:1px; flex-shrink:0; }
    .tree-new:hover { color:var(--accent); }
    /* breadcrumb */
    .bc-item { display:flex; align-items:center; padding:0 12px; height:100%; cursor:pointer; font-size:var(--fxb); letter-spacing:1px; color:var(--text2); white-space:nowrap; }
    .bc-item:hover { color:var(--text); }
    .bc-item.active { color:var(--accent); font-weight:700; }
    .bc-sep { color:var(--dim); font-size:10px; flex-shrink:0; }

    /* BODY ROW */
    .body-row { display:flex; flex:1; overflow:hidden; }

    /* SIDEBAR */
    .sidebar { width:280px; flex-shrink:0; background:var(--surface); border-right:3px solid var(--brutal); overflow-y:auto; display:flex; flex-direction:column; }
    .sidebar::-webkit-scrollbar { width:4px; }
    .sidebar::-webkit-scrollbar-thumb { background:var(--scroll); }
    .acc-section { border-bottom:2px solid var(--brutal); }
    .acc-header { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; user-select:none; }
    .acc-header:hover { background:var(--raised); }
    .acc-arrow { font-size:var(--fxb); color:var(--text2); transition:transform .15s; }
    .acc-label { font-size:var(--fxb); font-weight:700; letter-spacing:2px; color:var(--text); flex:1; }
    .acc-add { font-size:var(--fxs); letter-spacing:1px; color:var(--accent2); background:none; border:2px solid var(--accent2); padding:3px 7px; cursor:pointer; font-family:'TheMurk',monospace; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .acc-add:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }
    .acc-body { background:var(--bg); }
    .sb-item { display:flex; align-items:center; gap:7px; padding:6px 12px; cursor:pointer; user-select:none; }
    .sb-item:hover { background:var(--raised); }
    .sb-item-icon { font-size:10px; }
    .sb-item-name { font-size:var(--fxb); color:var(--text); flex:1; }
    .sb-item-sub { font-size:var(--fxs); color:var(--text2); }
    .sb-sep { padding:5px 12px 3px; font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; }

    /* CANVAS AREA */
    .canvas-area { flex:1; display:flex; overflow:hidden; position:relative; }
    .canvas-wrap { flex:1; position:relative; overflow:hidden; background:var(--bg); }
    .canvas-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; pointer-events:none; }
    .canvas-empty-label { font-size:11px; letter-spacing:4px; color:var(--dimmer); }
    .canvas-empty-sub { font-size:var(--fxs); color:var(--dimmer); letter-spacing:1px; }

    /* WIRES */
    .wires-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
    .wire-path { fill:none; stroke-width:2; opacity:0.8; }
    .wire-draft { fill:none; stroke:#ffffff; stroke-width:1.5; stroke-dasharray:6 4; opacity:0.5; }

    /* CANVAS INNER */
    .canvas-inner { position:absolute; transform-origin:0 0; }

    /* NODES */
    .node { position:absolute; min-width:210px; background:var(--surface); border:2px solid var(--brutal); border-top-width:3px; user-select:none; z-index:2; box-shadow:4px 4px 0 var(--brutal); }
    .node.selected { border-color:var(--accent); box-shadow:4px 4px 0 var(--accent); z-index:3; }
    .node-header { display:flex; align-items:center; gap:5px; padding:5px 8px; cursor:grab; border-bottom:2px solid var(--brutal); }
    .node-header:active { cursor:grabbing; }
    .node-icon { font-size:10px; flex-shrink:0; }
    .node-type-lbl { font-size:var(--fxs); font-weight:700; letter-spacing:2px; flex-shrink:0; }
    .node-title { font-size:var(--fxb); color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .node-edit-btn { font-size:var(--fxs); color:var(--accent2); border:2px solid var(--accent2); padding:1px 5px; cursor:pointer; letter-spacing:1px; flex-shrink:0; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .node-edit-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }
    .node-open-btn { font-size:var(--fxh); color:var(--text2); cursor:pointer; flex-shrink:0; padding:0 2px; }
    .node-open-btn:hover { color:var(--accent); }
    .node-del { font-size:10px; color:var(--dim); cursor:pointer; flex-shrink:0; }
    .node-del:hover { color:var(--red); }
    .node-body { padding:4px 0; }
    /* port rows */
    .pr { display:flex; align-items:center; padding:3px 0; position:relative; min-height:20px; }
    .pr.in { padding-left:16px; padding-right:8px; }
    .pr.out { padding-left:8px; padding-right:16px; justify-content:flex-end; }
    .pd { position:absolute; width:10px; height:10px; border-radius:50%; border:2px solid var(--bg); cursor:crosshair; z-index:5; top:50%; transform:translateY(-50%); }
    .pr.in .pd { left:-5px; }
    .pr.out .pd { right:-5px; }
    .pl { font-size:var(--fxs); color:var(--text2); letter-spacing:1px; }
    .pr.connected .pd { border-color:var(--surface); }
    .pr.in.connected:hover .pd { background:var(--red) !important; cursor:pointer; }
    .pr.in.connected:hover .pl { color:var(--red); }
    /* node fields */
    .nf { padding:2px 10px; display:flex; align-items:center; gap:6px; }
    .nfl { font-size:var(--fxs); color:var(--text2); letter-spacing:1px; width:54px; flex-shrink:0; }
    .nfv { font-size:var(--fxb); color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nd { height:2px; background:var(--brutal); margin:3px 0; }

    /* EDIT PANEL */
    .edit-panel { width:280px; flex-shrink:0; background:var(--surface); border-left:2px solid var(--brutal); display:flex; flex-direction:column; z-index:10; }
    .ep-header { display:flex; align-items:center; padding:10px 12px; border-bottom:2px solid var(--brutal); gap:8px; }
    .ep-title { font-size:var(--fxh); font-weight:700; letter-spacing:2px; color:var(--accent); flex:1; }
    .ep-close { background:none; border:2px solid var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxs); padding:3px 8px; cursor:pointer; }
    .ep-close:hover { border-color:var(--red); color:var(--red); }
    .ep-body { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
    .ep-body::-webkit-scrollbar { width:4px; }
    .ep-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    .ep-field { display:flex; flex-direction:column; gap:4px; }
    .ep-label { font-size:var(--fxs); letter-spacing:2px; color:var(--text2); font-weight:700; }
    .ep-input { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; }
    .ep-input:focus { border-color:var(--accent); outline:none; }
    .ep-textarea { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; height:70px; resize:vertical; }
    .ep-textarea:focus { border-color:var(--accent); outline:none; }
    .ep-sep { font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; border-top:2px solid var(--brutal); padding-top:6px; }
    .ep-open-btn { background:var(--raised); border:2px solid var(--accent2); color:var(--accent2); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:6px; cursor:pointer; letter-spacing:1px; text-align:center; box-shadow:2px 2px 0 var(--accent2); transition:box-shadow .06s,transform .06s; }
    .ep-open-btn:hover { background:var(--accent2); color:var(--bg); box-shadow:none; transform:translate(2px,2px); }

    /* POPOVER */
    .popover-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:600; display:flex; align-items:center; justify-content:center; }
    .popover-box { background:var(--surface); border:3px solid var(--brutal); box-shadow:8px 8px 0 var(--brutal); width:600px; max-width:96vw; max-height:85vh; display:flex; flex-direction:column; }
    .popover-header { display:flex; align-items:center; padding:12px 16px; border-bottom:2px solid var(--brutal); gap:10px; flex-shrink:0; }
    .popover-title { font-size:10px; font-weight:700; letter-spacing:3px; flex:1; }
    .popover-close { background:none; border:2px solid var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxs); padding:4px 10px; cursor:pointer; box-shadow:2px 2px 0 var(--brutal); transition:box-shadow .06s,transform .06s; }
    .popover-close:hover { border-color:var(--red); color:var(--red); box-shadow:none; transform:translate(2px,2px); }
    .popover-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .popover-body::-webkit-scrollbar { width:4px; }
    .popover-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    /* tabs inside popover */
    .pop-tabs { display:flex; border-bottom:2px solid var(--brutal); flex-shrink:0; }
    .pop-tab { padding:8px 16px; font-size:var(--fxb); letter-spacing:1px; cursor:pointer; color:var(--text2); border-bottom:3px solid transparent; margin-bottom:-2px; }
    .pop-tab:hover { color:var(--text); }
    .pop-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .pop-tab-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
    .pop-tab-body::-webkit-scrollbar { width:4px; }
    .pop-tab-body::-webkit-scrollbar-thumb { background:var(--scroll); }
    /* fields */
    .pf { display:flex; flex-direction:column; gap:4px; }
    .pfl { font-size:var(--fxs); letter-spacing:2px; color:var(--text2); font-weight:700; }
    .pfi { background:var(--input-bg); border:2px solid var(--brutal); color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:5px 8px; width:100%; }
    .pfi:focus { border-color:var(--accent); outline:none; box-shadow:2px 2px 0 var(--accent); }
    .pf-row { display:flex; gap:10px; }
    /* item table */
    .itbl { display:flex; flex-direction:column; gap:4px; }
    .itbl-hdr { display:flex; gap:6px; padding:2px 8px; opacity:0.45; }
    .itbl-hdr span { font-size:var(--fxs); letter-spacing:1px; }
    .irow { display:flex; gap:6px; align-items:center; padding:5px 8px; background:var(--raised); border:2px solid var(--brutal); }
    .ifield { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; }
    .ifield:focus { border-color:var(--accent); outline:none; }
    .ifield.fn { flex:2; }
    .ifield.fp { width:60px; }
    .ifield.ft { width:86px; }
    .ifield.fq { width:50px; }
    .isel { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 4px; font-family:'TheMurk',monospace; width:86px; }
    .idel { background:none; border:none; color:var(--dim); cursor:pointer; font-size:10px; padding:0 2px; flex-shrink:0; }
    .idel:hover { color:var(--red); }
    .iadd { background:var(--raised); border:2px dashed var(--brutal); color:var(--text2); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:7px; cursor:pointer; letter-spacing:1px; text-align:center; }
    .iadd:hover { border-color:var(--accent2); color:var(--accent2); }
    .isave { background:var(--raised); border:2px solid var(--accent); color:var(--accent); font-family:'TheMurk',monospace; font-size:var(--fxb); padding:8px; cursor:pointer; letter-spacing:1px; text-align:center; margin-top:4px; box-shadow:3px 3px 0 var(--accent); transition:box-shadow .06s,transform .06s; }
    .isave:hover { background:var(--accent); color:var(--bg); box-shadow:none; transform:translate(3px,3px); }
    /* list rows (scenes, spawn) */
    .lrow { display:flex; gap:6px; align-items:center; padding:5px 8px; background:var(--raised); border:2px solid var(--brutal); }
    .lfield-a { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; flex:1; min-width:0; }
    .lfield-a:focus { border-color:var(--accent); outline:none; }
    .lfield-b { font-size:var(--fxb); color:var(--text); background:var(--input-bg); border:2px solid var(--brutal); padding:3px 5px; font-family:'TheMurk',monospace; flex:2; min-width:0; }
    .lfield-b:focus { border-color:var(--accent); outline:none; }
    .psec { font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; margin-top:6px; }

    /* CONTEXT MENU */
    .ctx-menu { position:fixed; background:var(--surface); border:2px solid var(--brutal); box-shadow:4px 4px 0 var(--brutal); z-index:1000; min-width:140px; }
    .ctx-item { padding:7px 14px; font-size:var(--fxb); cursor:pointer; letter-spacing:1px; }
    .ctx-item:hover { background:var(--raised); color:var(--accent); }
    .ctx-item.danger:hover { color:var(--red); }

    /* TOAST */
    .toast { position:fixed; bottom:20px; right:20px; background:var(--raised); border:2px solid var(--accent); box-shadow:4px 4px 0 var(--accent); color:var(--accent); font-size:var(--fxb); letter-spacing:2px; padding:8px 16px; z-index:9999; pointer-events:none; }

    /* SEARCH */
    .nav-search { display:flex; align-items:center; background:var(--raised); border:2px solid var(--brutal); padding:0 8px; gap:5px; flex:1; max-width:260px; }
    .nav-search-input { background:none; border:none; color:var(--text); font-family:'TheMurk',monospace; font-size:var(--fxb); letter-spacing:1px; width:100%; padding:5px 0; outline:none; }
    .nav-search-input::placeholder { color:var(--muted); }
    .nav-search-clear { color:var(--dim); cursor:pointer; font-size:10px; flex-shrink:0; }
    .nav-search-clear:hover { color:var(--red); }
    .search-header { padding:6px 12px; font-size:var(--fxs); letter-spacing:2px; color:var(--dim); font-weight:700; border-bottom:2px solid var(--brutal); }
    .search-cat { padding:4px 12px 2px; font-size:var(--fxs); letter-spacing:2px; color:var(--accent2); font-weight:700; }

    /* LIBRARY COUNT */
    .acc-count { font-size:var(--fxs); color:var(--muted); background:var(--dimmer); padding:1px 5px; border:1px solid var(--brutal); flex-shrink:0; }

    /* OUTFIT SUB-ACCORDION */
    .outfit-acc-hdr { display:flex; align-items:center; gap:7px; padding:7px 12px; cursor:pointer; user-select:none; border-top:2px solid var(--brutal); }
    .outfit-acc-hdr:hover { background:var(--raised); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useLayoutEffect,useCallback,useMemo}=React;

/* ── PORT COLORS ─────────────────────────────────────────────────── */
const PC={
  character:{color:'#40c080'},
  dialogue: {color:'#c47a10'},
  quest:    {color:'#d4a020'},
  place:    {color:'#4080c0'},
  flow:     {color:'#7a7090'},
  item:     {color:'#a06890'},
  trigger:  {color:'#e05030'},
  exit:     {color:'#e0a020'},
};
const wc=pt=>PC[pt]?.color||'#888';

/* ── PORT DEFINITIONS ────────────────────────────────────────────── */
const NP={
  /* MASTER GRAPH */
  OCTAVIA:{
    inputs:[],
    outputs:[
      {id:'to_scene',   label:'TO SCENE',    pt:'character'},

function PortRow({nodeId,port,side,onPortMouseDown,cPorts}){
  const key=nodeId+'::'+port.id;
  const isConn=cPorts&&cPorts.has(key);
  return(
    <div className={'pr '+side+(isConn?' connected':'')} data-port={key} data-side={side}>
      <div className="pd" data-port={key} data-side={side}
        style={{background:wc(port.pt)}}
        onMouseDown={e=>{e.stopPropagation();onPortMouseDown&&onPortMouseDown(nodeId,port,side,e);}}
        title={port.label}
      />
      <span className="pl">{port.label}</span>
    </div>
  );
}

function NodeFields({node}){
  const t=node.type;
  if(t==='OCTAVIA')return(<><div className="nf"><span className="nfl">NAME</span><span className="nfv" style={{color:'#40e090'}}>{node.label}</span></div><div className="nf"><span className="nfl">ROLE</span><span className="nfv">protagonist</span></div></>);
  if(t==='CHARACTER')return(<><div className="nf"><span className="nfl">NAME</span><span className="nfv">{node.label}</span></div><div className="nf"><span className="nfl">ROLE</span><span className="nfv">{node.role||em}</span></div></>);
  if(t==='PLACE')return(<><div className="nf"><span className="nfl">NAME</span><span className="nfv">{node.label}</span></div><div className="nf"><span className="nfl">TYPE</span><span className="nfv">{node.subtype||em}</span></div></>);
  if(t==='QUEST')return(<><div className="nf"><span className="nfl">NAME</span><span className="nfv">{node.label}</span></div><div className="nf"><span className="nfl">TYPE</span><span className="nfv">{node.major?'◆ MAJOR':'◇ MINOR'}</span></div></>);
  if(t==='DIALOGUE_TREE'){
    const pc=node._playCount||'always';
    const cc=node._condCount||0;
    return(<>
      <div className="nf"><span className="nfl">TREE</span><span className="nfv">{node.label}</span></div>
      {pc!=='always'&&<div className="nf"><span className="nfl">PLAY</span><span className="nfv" style={{color:'#e09030',fontWeight:700}}>{pc==='once'?'ONCE':`MAX ${node._playLimit||1}`}</span></div>}
      {cc>0&&<div className="nf"><span className="nfl">COND</span><span className="nfv" style={{color:'#e09030'}}>{cc} rule{cc!==1?'s':''}</span></div>}
    </>);
  }
  if(t==='INVENTORY')return(<><div className="nf"><span className="nfl">ITEM</span><span className="nfv">{node.label}</span></div><div className="nf"><span className="nfl">ACTION</span><span className="nfv">{node.action||'give / take'}</span></div></>);
  if(t==='TRIGGER')return(<><div className="nf"><span className="nfl">TRIGGER</span><span className="nfv">{node.label}</span></div><div className="nf"><span className="nfl">ON</span><span className="nfv">{node.condition||'enter / interact'}</span></div></>);
  if(t==='SPAWN_POINT')return(<><div className="nf"><span className="nfl">CHAR</span><span className="nfv">{node.label||em}</span></div><div className="nf"><span className="nfl">WORLD X</span><span className="nfv" style={{color:'#4ab8d0',fontWeight:700}}>{node.worldX||0}</span></div></>);
  if(t==='SCENE')return(<>
    <div className="nf"><span className="nfl">SCENE</span><span className="nfv">{node.label||'—'}</span></div>
    <div className="nf"><span className="nfl">TYPE</span><span className="nfv">{(node.sceneType||'neutral').toUpperCase()}</span></div>
    <div className="nf"><span className="nfl">OCT X</span><span className="nfv" style={{color:'#40e090',fontWeight:700}}>{node.octaviaWorldX!==undefined?node.octaviaWorldX:'—'}</span></div>
    {node.triggerWorldX!==undefined&&<div className="nf"><span className="nfl">TRIG X</span><span className="nfv" style={{color:'#e09030',fontWeight:700}}>{node.triggerWorldX}</span></div>}
    {(node.sceneChars||[]).length>0&&<div className="nf"><span className="nfl">CHARS</span><span className="nfv">{node.sceneChars.length}</span></div>}
    {node.musicCueLabel&&<div className="nf"><span className="nfl">&#9834; MUSIC</span><span className="nfv" style={{color:'#a030e0'}}>{node.musicCueLabel}</span></div>}
  </>);
  if(t==='STATEMENT')return(<><div className="nf"><span className="nfl">SPEAKER</span><span className="nfv">{node.speaker||em}</span></div><div className="nf"><span className="nfl">TEXT</span><span className="nfv">{trunc(node.text,26)}</span></div></>);
  if(t==='QUESTION')return(<div className="nf"><span className="nfl">PROMPT</span><span className="nfv">{node.text||em}</span></div>);
  if(t==='THOUGHTS')return(<><div className="nf"><span className="nfl">EMOTION</span><span className="nfv" style={{color:'#40e090'}}>{node.emotion||node.voice||'FEAR'}</span></div><div className="nf"><span className="nfl">TEXT</span><span className="nfv">{trunc(node.text,26)}</span></div></>);
  if(t==='DEAD_END')return(<div className="nf"><span className="nfl">LINE</span><span className="nfv">{node.text||em}</span></div>);
  if(t==='END_CONVO')return(<><div className="nf"><span className="nfl">CLOSING</span><span className="nfv">{node.text||em}</span></div><div className="nf"><span className="nfl">REL</span><span className="nfv">{node.relDelta||'+0'}</span></div></>);
  if(t==='LOOP')return(<><div className="nf"><span className="nfl">TEXT</span><span className="nfv">{node.text||em}</span></div><div className="nf"><span className="nfl">COND</span><span className="nfv">{node.condition||em}</span></div></>);
  if(t==='ITEMS')return(<><div className="nf"><span className="nfl">ACTION</span><span className="nfv">{node.action||'give'}</span></div><div className="nf"><span className="nfl">ITEM</span><span className="nfv">{node.item||em}</span></div></>);
  if(t==='OUTFIT_CHECK')return(<div className="nf"><span className="nfl">BRANCHES</span><span className="nfv" style={{color:'#a060c0'}}>hoodie / regular / other</span></div>);

/* ── CANVAS NODE ─────────────────────────────────────────────────── */
function CanvasNode({node,selected,onHdr,onDelete,onPortMouseDown,onOpen,onEdit,onDblClick,cPorts,conns}){
  const meta=NM[node.type]||{icon:'?',lbl:node.type,color:'#888'};
  const base=NP[node.type]||{inputs:[],outputs:[]};
  /* expand multi-ports: each occupied slot gets a new empty slot below it */
  const expandedInputs=base.inputs.flatMap(p=>{
    if(!p.multi)return[p];
    const used=(conns||[]).filter(c=>c.dst===node.id&&c.dstPort.startsWith(p.id+'_')).length;
    return Array.from({length:used+1},(_,i)=>({...p,id:`${p.id}_${i}`,label:i===0?p.label:p.label}));
  });
  const ports={inputs:expandedInputs,outputs:base.outputs};
  return(
    <div className={'node'+(selected?' selected':'')}
      style={{left:node.x,top:node.y,borderTopColor:meta.color}}>
      <div className="node-header" onMouseDown={e=>onHdr(node.id,e)}
        onDoubleClick={e=>{e.stopPropagation();onDblClick&&onDblClick(node.type,node.id,node.entityId);}}>
        <span className="node-icon">{meta.icon}</span>
        <span className="node-type-lbl" style={{color:meta.color}}>{meta.lbl}</span>
        <span className="node-title">{node.label||''}</span>
        {(node.type==='CHARACTER'||node.type==='OCTAVIA')&&onEdit&&(
          <span className="node-edit-btn" onClick={e=>{e.stopPropagation();onEdit(node.entityId||node.id);}}>EDIT</span>
        )}
        {meta.canOpen&&onOpen&&(
          <span className="node-open-btn" onClick={e=>{e.stopPropagation();onOpen(meta.ot,node.entityId||node.id);}} title="Open sub-canvas">&#x2197;</span>
        )}
        <span className="node-del" onClick={e=>{e.stopPropagation();onDelete(node.id);}}>&#x2715;</span>
      </div>
      <div className="node-body">
        {ports.inputs.map(p=>(
          <PortRow key={p.id} nodeId={node.id} port={p} side="in"
            onPortMouseDown={onPortMouseDown} cPorts={cPorts}/>
        ))}
        <NodeFields node={node}/>
        {ports.outputs.length>0&&<div className="nd"/>}
        {ports.outputs.map(p=>(
          <PortRow key={p.id} nodeId={node.id} port={p} side="out"
            onPortMouseDown={onPortMouseDown} cPorts={cPorts}/>
        ))}
      </div>
    </div>
  );
}

/* ── WIRE LAYER ──────────────────────────────────────────────────── */
function WireLayer({conns,nodes,portPositions,draft,zoom,offset}){
  const cp=80*(zoom||1); // bezier control point offset scales with zoom
  const getPos=(nodeId,portId,side)=>{
    const key=nodeId+'::'+portId;
    const p=portPositions.current.get(key);
    if(p)return p;
    // fallback: compute from node's canvas position → convert to viewport coords
    const n=nodes.find(x=>x.id===nodeId);
    if(!n)return{x:0,y:0};
    const ox=offset||{x:0,y:0};
    const z=zoom||1;
    return{x:(ox.x+n.x+(side==='out'?220:0))*z,y:(ox.y+n.y+40)*z};
  };
  const paths=conns.map(c=>{
    const sp=(NP[c.srcType]||{outputs:[]}).outputs;
    const baseId=c.srcPort.replace(/_\d+$/,'');
    const spt=sp.find(p=>p.id===c.srcPort||p.id===baseId);
    const color=spt?wc(spt.pt):'#888';
    const a=getPos(c.src,c.srcPort,'out');
    const b=getPos(c.dst,c.dstPort,'in');
    return(<path key={c.id} className="wire-path" stroke={color}
      d={'M'+a.x+','+a.y+' C'+(a.x+cp)+','+a.y+' '+(b.x-cp)+','+b.y+' '+b.x+','+b.y}/>);
  });
  let dp=null;
  if(draft&&draft.fromPos&&draft.toPos){
    const a=draft.fromPos,b=draft.toPos;
    dp=<path className="wire-draft" d={'M'+a.x+','+a.y+' C'+(a.x+cp)+','+a.y+' '+(b.x-cp)+','+b.y+' '+b.x+','+b.y}/>;
  }
  return(<svg className="wires-svg">{paths}{dp}</svg>);
}

function PopoverModal({title,color,onClose,children}){
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return(
    <div className="popover-backdrop" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="popover-box" onMouseDown={e=>e.stopPropagation()}>
        <div className="popover-header">
          <span className="popover-title" style={{color:color||'var(--accent)'}}>{title}</span>
          <button className="popover-close" onClick={onClose}>&#x2715; CLOSE</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ── AI REFERENCE LIBRARY (IndexedDB) ───────────────────────────── */
const openRefDB=()=>new Promise((res,rej)=>{
  const req=indexedDB.open('beau_ai_refs',1);
  req.onupgradeneeded=e=>e.target.result.createObjectStore('refs',{keyPath:'id'});
  req.onsuccess=e=>res(e.target.result);req.onerror=rej;
});
const loadRefs=async()=>{try{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readonly').objectStore('refs').getAll();r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}catch(e){return[];}};
const saveRef=async ref=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readwrite').objectStore('refs').put(ref);r.onsuccess=res;r.onerror=rej;});};
const deleteRef=async id=>{const db=await openRefDB();return new Promise((res,rej)=>{const r=db.transaction('refs','readwrite').objectStore('refs').delete(id);r.onsuccess=res;r.onerror=rej;});};

    // reference content — first 6000 chars each, with cache marker
    const refBlock=refs.length?'\n\nREFERENCE MATERIAL (use these for tone, themes, world detail):\n'+
      refs.map(r=>`=== ${r.name} ===\n${r.content.slice(0,6000)}${r.content.length>6000?'\n[truncated — '+Math.round(r.content.length/1000)+'KB total]':''}`).join('\n\n'):'';
    return `You are a creative writing assistant for BEAUREGARDE — a cyberpunk RPG set in The Veil, a dystopian urban neighborhood where body modification is common and an underground network operates in the shadows. The protagonist is Octavia: a modified survivor waking up after 7 missing days.

GAME WORLD:
- Tone: neo-noir, grounded, community-focused. Not neon-glamour cyberpunk — survival cyberpunk.
- Themes: identity, modification, surveillance, loss, mutual aid, found family, memory.
- Factions: The Network (community protection), The Bureau (state surveillance).
- Key locations: The Veil street, Corner Store (Raymond), Pharmacy, Restaurant (Diego), Alley video store (Charlie).

CURRENT CHARACTERS:
  ${charList||'(none yet)'}

ACTIVE QUESTS:
  ${questList||'(none yet)'}

DIALOGUE TREES: ${treeList||'(none yet)'}

When writing dialogue: use short, clipped lines. Characters speak from lived experience, not exposition. NPCs are tired, careful, warm beneath the caution.${refBlock}`;
  };

  const send=async(text)=>{
    if(!text.trim())return;
    if(!apiKey){setTab('key');return;}
    const userMsg={role:'user',content:text};
    const history=[...msgs.filter(m=>m.role!=='assistant'||msgs.indexOf(m)>0),userMsg];
    setMsgs(p=>[...p,userMsg]);setInput('');setLoading(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'x-api-key':apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-beta':'prompt-caching-2024-07-31',
          'content-type':'application/json',
          'anthropic-dangerous-allow-browser':'true',
        },
        body:JSON.stringify({
          model:AI_MODEL,max_tokens:2048,
          system:[{type:'text',text:buildSystem(),cache_control:{type:'ephemeral'}}],
          messages:history,
        }),
      });
      if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API error '+res.status);}
      const d=await res.json();
      setMsgs(p=>[...p,{role:'assistant',content:d.content[0].text}]);
    }catch(e){
      setMsgs(p=>[...p,{role:'assistant',content:`⚠️ ${e.message}`,error:true}]);
    }finally{setLoading(false);}
  };

  const uploadFile=async e=>{
    const file=e.target.files[0];if(!file)return;
    setUploadStatus('Reading '+file.name+'...');
    const reader=new FileReader();
    reader.onload=async ev=>{
      const ref={id:uid(),name:file.name,content:ev.target.result,size:file.size,addedAt:Date.now()};
      await saveRef(ref);
      setRefs(p=>[...p,ref]);
      setUploadStatus('✓ '+file.name+' added ('+Math.round(file.size/1024)+'KB)');
      setTimeout(()=>setUploadStatus(''),3000);
    };
    reader.onerror=()=>{setUploadStatus('✗ Could not read file.');setTimeout(()=>setUploadStatus(''),3000);};
    reader.readAsText(file);
    e.target.value='';
  };

  const removeRef=async id=>{await deleteRef(id);setRefs(p=>p.filter(r=>r.id!==id));};

  const panelStyle={position:'fixed',top:0,right:0,bottom:0,width:420,zIndex:600,
    display:'flex',flexDirection:'column',background:'var(--surface)',
    borderLeft:'3px solid var(--brutal)',boxShadow:'-6px 0 0 var(--brutal)',
    fontFamily:"'TheMurk',monospace",
  };
  const TABS=[['chat','CHAT'],['refs','REFERENCES'],['key','API KEY']];

  return(
    <div style={panelStyle}>
      {/* header */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'0 14px',height:48,borderBottom:'3px solid var(--brutal)',background:'var(--raised)',flexShrink:0}}>
        <span style={{color:'var(--accent)',fontSize:'var(--fxh)',fontWeight:700,letterSpacing:2,flex:1}}>✦ AI ASSISTANT</span>
        {TABS.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:tab===id?'var(--accent)':'none',color:tab===id?'var(--bg)':'var(--text2)',border:'2px solid '+(tab===id?'var(--accent)':'var(--brutal)'),fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'3px 8px',cursor:'pointer',letterSpacing:'1px'}}>
            {label}
          </button>
        ))}
        <span style={{cursor:'pointer',fontSize:12,color:'var(--dim)',padding:'0 4px'}} onClick={onClose}>✕</span>
      </div>

      {/* CHAT tab */}
      {tab==='chat'&&(<>
        {/* quick prompts */}
        <div style={{padding:'8px 10px',borderBottom:'2px solid var(--brutal)',display:'flex',flexWrap:'wrap',gap:5,flexShrink:0}}>
          {QUICK_PROMPTS.map(q=>(
            <button key={q.label} onClick={()=>send(q.prompt)}
              style={{background:'var(--raised)',border:'2px solid var(--brutal)',color:'var(--text)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',padding:'3px 8px',cursor:'pointer',letterSpacing:'0.5px',boxShadow:'2px 2px 0 var(--brutal)',transition:'all .06s'}}
              onMouseEnter={e=>{e.target.style.transform='translate(2px,2px)';e.target.style.boxShadow='none';}}
              onMouseLeave={e=>{e.target.style.transform='';e.target.style.boxShadow='2px 2px 0 var(--brutal)';}}>
              {q.label}
            </button>
          ))}
        </div>
        {/* messages */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12,scrollbarWidth:'thin'}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{
              alignSelf:m.role==='user'?'flex-end':'flex-start',
              maxWidth:'88%',padding:'10px 13px',
              background:m.role==='user'?'var(--accent)':m.error?'#c4302822':'var(--raised)',
              color:m.role==='user'?'var(--bg)':m.error?'var(--red)':'var(--text)',
              border:'2px solid '+(m.role==='user'?'var(--accent)':m.error?'var(--red)':'var(--brutal)'),
              fontSize:'var(--fxb)',lineHeight:1.7,whiteSpace:'pre-wrap',
              boxShadow:m.role==='user'?'none':'3px 3px 0 var(--brutal)',
            }}>{m.content}</div>
          ))}
          {loading&&<div style={{alignSelf:'flex-start',padding:'10px 14px',background:'var(--raised)',border:'2px solid var(--brutal)',fontSize:'var(--fxb)',color:'var(--accent)',letterSpacing:2,boxShadow:'3px 3px 0 var(--brutal)'}}>THINKING...</div>}
          <div ref={chatEndRef}/>
        </div>
        {/* input */}
        <div style={{borderTop:'3px solid var(--brutal)',padding:'10px 12px',display:'flex',gap:8,flexShrink:0,background:'var(--raised)'}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input);}}}
            placeholder="Ask anything... (Enter to send, Shift+Enter for new line)"
            style={{flex:1,background:'var(--input-bg)',border:'2px solid var(--brutal)',color:'var(--text)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',padding:'7px 9px',resize:'none',height:60,lineHeight:1.5}}/>
          <button onClick={()=>send(input)} disabled={loading}
            style={{background:'var(--accent)',border:'2px solid var(--brutal)',color:'var(--bg)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',fontWeight:700,padding:'0 12px',cursor:'pointer',boxShadow:'3px 3px 0 var(--brutal)',alignSelf:'stretch',letterSpacing:1}}>
            SEND
          </button>
        </div>
      </>)}

      {/* REFERENCES tab */}
      {tab==='refs'&&(
        <div style={{flex:1,overflowY:'auto',padding:'14px 14px',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:'var(--fxs)',color:'var(--text2)',lineHeight:1.7,letterSpacing:'0.5px'}}>
            Upload .txt or .md files — books, scripts, worldbuilding docs, reference articles. The AI will use them as context when writing for your game. Large files are truncated to 6,000 characters per document.
          </div>
          <input ref={fileRef} type="file" accept=".txt,.md,.csv" style={{display:'none'}} onChange={uploadFile}/>
          <button onClick={()=>fileRef.current?.click()}
            style={{background:'var(--raised)',border:'2px solid var(--accent2)',color:'var(--accent2)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',fontWeight:700,padding:'9px',cursor:'pointer',letterSpacing:1,boxShadow:'3px 3px 0 var(--accent2)',textAlign:'center'}}>
            + UPLOAD FILE (.txt / .md)
          </button>
          {uploadStatus&&<div style={{fontSize:'var(--fxs)',color:'var(--accent)',letterSpacing:1}}>{uploadStatus}</div>}
          {refs.length===0&&<div style={{color:'var(--muted)',fontSize:'var(--fxs)',letterSpacing:1}}>No reference files yet.</div>}
          {refs.map(r=>(
            <div key={r.id} style={{background:'var(--raised)',border:'2px solid var(--brutal)',padding:'10px 12px',display:'flex',alignItems:'flex-start',gap:8,boxShadow:'3px 3px 0 var(--brutal)'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:'var(--fxb)',fontWeight:700,letterSpacing:1,marginBottom:3}}>{r.name}</div>
                <div style={{fontSize:'var(--fxt)',color:'var(--text2)',letterSpacing:1}}>{Math.round(r.size/1024)}KB · {r.content.split(/\s+/).length.toLocaleString()} words</div>
                {r.content.length>6000&&<div style={{fontSize:'var(--fxt)',color:'var(--accent2)',letterSpacing:1}}>⚠ truncated to 6KB in context</div>}
              </div>
              <span style={{cursor:'pointer',color:'var(--red)',fontSize:12,padding:'2px 4px',flexShrink:0}} onClick={()=>removeRef(r.id)}>✕</span>
            </div>
          ))}
          {refs.length>0&&(
            <div style={{fontSize:'var(--fxt)',color:'var(--muted)',letterSpacing:1,marginTop:4}}>
              {refs.length} file{refs.length!==1?'s':''} · ~{Math.round(refs.reduce((a,r)=>a+Math.min(r.content.length,6000),0)/1000)}KB in context
            </div>
          )}
        </div>
      )}

      {/* API KEY tab */}
      {tab==='key'&&(
        <div style={{flex:1,padding:'14px 14px',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:'var(--fxs)',color:'var(--text2)',lineHeight:1.7,letterSpacing:'0.5px'}}>
            Your Anthropic API key is stored locally in your browser (localStorage). It is never sent anywhere except directly to the Anthropic API.
          </div>
          <div className="pf">
            <label className="pfl">ANTHROPIC API KEY</label>
            <input className="pfi" type="password" value={keyDraft} onChange={e=>setKeyDraft(e.target.value)}
              placeholder="sk-ant-api03-..."
              onKeyDown={e=>{if(e.key==='Enter')saveKey();}}/>
          </div>
          <button onClick={saveKey}
            style={{background:'var(--accent)',border:'2px solid var(--accent)',color:'var(--bg)',fontFamily:"'TheMurk',monospace",fontSize:'var(--fxb)',fontWeight:700,padding:'9px',cursor:'pointer',letterSpacing:1,boxShadow:'3px 3px 0 var(--accent)',textAlign:'center'}}>
            SAVE KEY
          </button>
          {uploadStatus&&<div style={{fontSize:'var(--fxb)',color:'#40c080',letterSpacing:1}}>{uploadStatus}</div>}
          <div style={{fontSize:'var(--fxt)',color:'var(--muted)',lineHeight:1.8,letterSpacing:'0.5px',marginTop:8}}>
            Get your API key at console.anthropic.com<br/>
            Model: {AI_MODEL}<br/>
            Prompt caching is enabled — reference docs are cached between requests to reduce cost.
          </div>
          {apiKey&&<div style={{fontSize:'var(--fxs)',color:'#40c080',letterSpacing:1}}>✓ Key set ({apiKey.slice(0,12)}...)</div>}
        </div>
      )}
    </div>
  );
}

/* ── DIALOGUE NODE POPOVER ───────────────────────────────────────── */
const THOUGHT_EMOTIONS=['FEAR','GRIEF','ANGER','HOPE','DOUBT','RESOLVE','ANXIETY','LONGING','SHAME','PRIDE','LOVE','CALM','NUMBNESS','GUILT','WONDER'];
const STATEMENT_EMOTIONS=['NEUTRAL','WARM','COLD','TENSE','TIRED','URGENT','SARCASTIC','AFRAID','AMUSED','SUSPICIOUS'];

function DialogueNodePopover({node,chars,onSave,onClose}){
  const t=node.type;
  const [emotion,setEmotion]=useState(node.emotion||node.voice||'FEAR');
  const [text,setText]=useState(node.text||'');
  const [speaker,setSpeaker]=useState(node.speaker||'');
  const [speakerEmotion,setSpeakerEmotion]=useState(node.speakerEmotion||'NEUTRAL');
  const [optA,setOptA]=useState(node.optA||'');
  const [actA,setActA]=useState(node.actA||'');
  const [mutedA,setMutedA]=useState(node.mutedA||false);
  const [optB,setOptB]=useState(node.optB||'');
  const [actB,setActB]=useState(node.actB||'');
  const [mutedB,setMutedB]=useState(node.mutedB||false);
  const [optC,setOptC]=useState(node.optC||'');
  const [actC,setActC]=useState(node.actC||'');
  const [mutedC,setMutedC]=useState(node.mutedC||false);
  const [condition,setCondition]=useState(node.condition||'');
  const [relDelta,setRelDelta]=useState(node.relDelta||'+0');
  const [endAct,setEndAct]=useState(node.act||'');
  const [action,setAction]=useState(node.action||'give');
  const [item,setItem]=useState(node.item||'');

  const save=()=>{
    const base={...node,text};
    if(t==='THOUGHTS') onSave({...base,emotion,voice:emotion});
    else if(t==='STATEMENT') onSave({...base,speaker,speakerEmotion,emotion:speakerEmotion});
    else if(t==='QUESTION') onSave({...base,optA,actA,mutedA,optB,actB,mutedB,optC,actC,mutedC});
    else if(t==='DEAD_END') onSave(base);
    else if(t==='END_CONVO') onSave({...base,relDelta,act:endAct});
    else if(t==='LOOP') onSave({...base,condition});
    else if(t==='ITEMS') onSave({...base,action,item});
    else onSave(base);
    onClose();
  };

  const meta=NM[t]||{icon:'?',lbl:t,color:'#888'};
  const title=meta.icon+' '+meta.lbl;

  return(
    <PopoverModal title={title} color={meta.color} onClose={onClose}>
      <div className="pop-tab-body">
        {t==='THOUGHTS'&&(<>
          <div className="pf">
            <label className="pfl">EMOTION</label>
            <select className="pfi" value={emotion} onChange={e=>setEmotion(e.target.value)}>
              {THOUGHT_EMOTIONS.map(em=><option key={em} value={em}>{em}</option>)}
            </select>
          </div>
          <div className="pf">
            <label className="pfl">OCTAVIA'S THOUGHT</label>
            <textarea className="pfi" rows={4} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:80}}/>
          </div>
        </>)}

        {t==='STATEMENT'&&(<>
          <div className="pf-row">
            <div className="pf" style={{flex:2}}>
              <label className="pfl">SPEAKER</label>
              <select className="pfi" value={speaker} onChange={e=>setSpeaker(e.target.value)}>
                <option value="">— select —</option>
                <option value="OCTAVIA">OCTAVIA</option>
                {(chars||[]).map(c=><option key={c.id} value={c.name.toUpperCase()}>{c.name.toUpperCase()}</option>)}
              </select>
            </div>
            <div className="pf" style={{flex:2}}>
              <label className="pfl">EMOTION</label>
              <select className="pfi" value={speakerEmotion} onChange={e=>setSpeakerEmotion(e.target.value)}>
                {STATEMENT_EMOTIONS.map(em=><option key={em} value={em}>{em}</option>)}
              </select>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">DIALOGUE TEXT</label>
            <textarea className="pfi" rows={4} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:80}}/>
          </div>
        </>)}

        {t==='QUESTION'&&(<>
          <div className="pf">
            <label className="pfl">PROMPT / NPC LINE</label>
            <textarea className="pfi" rows={3} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:60}}/>
          </div>
          {[
            {label:'OPTION A',val:optA,setVal:setOptA,act:actA,setAct:setActA,muted:mutedA,setMuted:setMutedA,ph:'player choice A'},
            {label:'OPTION B',val:optB,setVal:setOptB,act:actB,setAct:setActB,muted:mutedB,setMuted:setMutedB,ph:'player choice B'},
            {label:'OPTION C (optional)',val:optC,setVal:setOptC,act:actC,setAct:setActC,muted:mutedC,setMuted:setMutedC,ph:'player choice C (leave blank to hide)'},
          ].map(({label,val,setVal,act,setAct,muted,setMuted,ph})=>(
            <div key={label} className="pf">
              <label className="pfl">{label}</label>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <input className="pfi" style={{flex:2}} value={val} placeholder={ph} onChange={e=>setVal(e.target.value)}/>
                <select className="pfi" style={{flex:1}} value={act} onChange={e=>setAct(e.target.value)}>
                  {KNOWN_ACTS.map(a=><option key={a.value} value={a.value}>{a.label}</option>)}
                </select>
                <label style={{display:'flex',alignItems:'center',gap:4,fontSize:'var(--fxs)',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
                  <input type="checkbox" checked={muted} onChange={e=>setMuted(e.target.checked)}/>
                  muted
                </label>
              </div>
            </div>
          ))}
        </>)}

        {t==='DEAD_END'&&(
          <div className="pf">
            <label className="pfl">NPC'S DEAD-END LINE</label>
            <textarea className="pfi" rows={3} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:60}}/>
          </div>
        )}

        {t==='END_CONVO'&&(<>
          <div className="pf">
            <label className="pfl">CLOSING LINE</label>
            <textarea className="pfi" rows={3} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:60}}/>
          </div>
          <div className="pf-row">
            <div className="pf" style={{flex:1}}>
              <label className="pfl">RELATIONSHIP CHANGE</label>
              <select className="pfi" value={relDelta} onChange={e=>setRelDelta(e.target.value)}>
                <option value="+2">+2 (strong bond)</option>
                <option value="+1">+1 (positive)</option>
                <option value="+0">+0 (neutral)</option>
                <option value="-1">-1 (friction)</option>
                <option value="-2">-2 (broken)</option>
              </select>
            </div>
            <div className="pf" style={{flex:1}}>
              <label className="pfl">GAME ACTION</label>
              <select className="pfi" value={endAct} onChange={e=>setEndAct(e.target.value)}>
                {KNOWN_ACTS.map(a=><option key={a.value} value={a.value}>{a.label}</option>)}
              </select>
            </div>
          </div>
        </>)}

        {t==='LOOP'&&(<>
          <div className="pf">
            <label className="pfl">LOOP LINE (repeated when condition met)</label>
            <textarea className="pfi" rows={3} value={text} onChange={e=>setText(e.target.value)}
              style={{resize:'vertical',minHeight:60}}/>
          </div>
          <div className="pf">
            <label className="pfl">CONDITION</label>
            <input className="pfi" value={condition} placeholder="e.g. trust &lt; 2" onChange={e=>setCondition(e.target.value)}/>
          </div>
        </>)}

        {t==='ITEMS'&&(<>
          <div className="pf-row">
            <div className="pf" style={{flex:1}}>
              <label className="pfl">ACTION</label>
              <select className="pfi" value={action} onChange={e=>setAction(e.target.value)}>
                <option value="give">GIVE</option>
                <option value="need">NEED</option>
                <option value="check">CHECK</option>
                <option value="take">TAKE</option>
              </select>
            </div>
            <div className="pf" style={{flex:2}}>
              <label className="pfl">ITEM NAME</label>
              <input className="pfi" value={item} placeholder="item name" onChange={e=>setItem(e.target.value)}/>
            </div>
          </div>
          <div className="pf">
            <label className="pfl">CONTEXT / NOTE</label>
            <input className="pfi" value={text} placeholder="optional note" onChange={e=>setText(e.target.value)}/>
          </div>
        </>)}

        <div style={{display:'flex',justifyContent:'flex-end',paddingTop:4}}>
          <button className="nav-btn isave" onClick={save}>SAVE NODE</button>
        </div>
      </div>
    </PopoverModal>
  );
}

/* ── CONDITION ROW ───────────────────────────────────────────────── */
function ConditionRow({cond,outfits,chars,onChange,onRemove}){
  const btn={fontFamily:"'TheMurk',monospace",fontSize:'var(--fxt)',fontWeight:700,padding:'2px 6px',cursor:'pointer',letterSpacing:'1px',border:'2px solid',flexShrink:0};
  return(
    <div style={{display:'flex',gap:5,alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--dimmer)',flexWrap:'wrap'}}>
      <button style={{...btn,background:cond.negate?'var(--red)':'var(--raised)',borderColor:cond.negate?'var(--red)':'var(--brutal)',color:cond.negate?'var(--bg)':'var(--text)'}}
        onClick={()=>onChange({negate:!cond.negate})}>NOT</button>
      <select className="pfi" style={{flex:'0 0 auto',width:88,fontSize:'var(--fxt)',padding:'2px 4px'}}
        value={cond.type} onChange={e=>onChange({type:e.target.value,value:'',op:'is',charId:''})}>
        <option value="outfit">OUTFIT</option>
        <option value="item">ITEM</option>
        <option value="trust">TRUST</option>
        <option value="scene">SCENE</option>
      </select>
      {cond.type==='outfit'&&(
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
          <option value="">— outfit —</option>
          {(outfits||[]).filter(o=>o.id!=='any').map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
      )}
      {cond.type==='item'&&(
        <input className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          placeholder="item name" value={cond.value||''} onChange={e=>onChange({value:e.target.value})}/>
      )}
      {cond.type==='trust'&&(<>
        <select className="pfi" style={{width:40,fontSize:'var(--fxt)',padding:'2px 3px'}}
          value={cond.op||'gte'} onChange={e=>onChange({op:e.target.value})}>
          <option value="gte">≥</option><option value="lt">&lt;</option>
        </select>
        <input className="pfi" type="number" min={0} max={4} style={{width:38,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||0} onChange={e=>onChange({value:parseInt(e.target.value)||0})}/>
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.charId||''} onChange={e=>onChange({charId:e.target.value})}>
          <option value="">— char —</option>
          {(chars||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </>)}
      {cond.type==='scene'&&(
        <select className="pfi" style={{flex:1,fontSize:'var(--fxt)',padding:'2px 4px'}}
          value={cond.value||''} onChange={e=>onChange({value:e.target.value})}>
          <option value="">— scene —</option>
          {KNOWN_SCENES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      )}
      <span style={{color:'var(--red)',cursor:'pointer',fontSize:'11px',padding:'0 4px',flexShrink:0}} onClick={onRemove}>✕</span>
    </div>
  );
}

/* ── APP ─────────────────────────────────────────────────────────── */
function App(){
  const [pal,setPal]=useState('void');
  const [textSize,setTextSize]=useState('sm');
  const [showAI,setShowAI]=useState(false);
  useEffect(()=>{
    const cls=[];
    if(pal!=='void')cls.push(`pal-${pal}`);
    if(textSize!=='sm')cls.push(`fs-${textSize}`);
    document.body.className=cls.join(' ');
  },[pal,textSize]);

  /* entity state */
  const init=useMemo(()=>{
    const s=loadState();
    if(s)return{chars:s.chars,dtrees:s.dtrees,quests:s.quests,mt:s.mt,amid:s.amid,outfits:s.outfits||OUTFITS_DEFAULT,audio:s.audio||AUDIO_DEFAULT};
    return{chars:SEED_CHARS,dtrees:SEED_TREES,quests:SEED_QUESTS,
      mt:[{id:'m1',name:'Main Graph',treeType:'general',nodes:[],conns:[]}],amid:'m1',outfits:OUTFITS_DEFAULT,audio:AUDIO_DEFAULT};
  },[]);
  const [chars,setChars]=useState(init.chars);
  const [dtrees,setDtrees]=useState(init.dtrees);
  const [quests,setQuests]=useState(init.quests);
  const [mt,setMt]=useState(init.mt); /* master trees */
  const [amid,setAmid]=useState(init.amid); /* active master tree id */
  const [outfits,setOutfits]=useState(init.outfits||OUTFITS_DEFAULT);
  const [audio,setAudio]=useState(init.audio||AUDIO_DEFAULT);

  useEffect(()=>{ saveState({chars,dtrees,quests,mt,amid,outfits,audio}); },[chars,dtrees,quests,mt,amid,outfits,audio]);

  /* view stack */
  const [vStack,setVStack]=useState([{type:'master',id:null}]);
  const view=vStack[vStack.length-1];
  const pushView=(type,id)=>setVStack(p=>[...p,{type,id}]);
  const popView=()=>setVStack(p=>p.length>1?p.slice(0,-1):p);

  /* accordion */
  const [openAcc,setOpenAcc]=useState('chars');
  const [openOutfits,setOpenOutfits]=useState(false);
  const [openAudio,setOpenAudio]=useState(false);

  /* popover */
  const [popover,setPopover]=useState(null);

  /* search */
  const [search,setSearch]=useState('');

  /* all nodes across all master trees (for library) */
  const allLibNodes=useMemo(()=>mt.flatMap(t=>t.nodes||[]),[mt]);

  /* rename tree tab */
  const [renamingTab,setRenamingTab]=useState(null);
  const [renamingTree,setRenamingTree]=useState(null);
  const renameTree=(id,newName)=>{
    const name=newName.trim()||'Untitled';
    setDtrees(p=>p.map(x=>x.id===id?{...x,name}:x));
    setMt(p=>p.map(mt=>({...mt,nodes:(mt.nodes||[]).map(n=>n.entityId===id?{...n,label:name}:n)})));
  };

  /* reset view state on navigation */
  useEffect(()=>{ setOffset({x:80,y:40}); setZoom(1); setSelectedId(null); setPopover(null); },[view]);

  /* ── ACTIVE CANVAS ─────────────────────────────────────────────── */
  const activeCanvas=useMemo(()=>{
    if(view.type==='master'){
      const t=mt.find(t=>t.id===amid)||mt[0]||{nodes:[],conns:[]};
      return{nodes:t.nodes||[],conns:t.conns||[]};
    }
    const map={character:chars,dialogue:dtrees,quest:quests};
    const ent=(map[view.type]||[]).find(e=>e.id===view.id);
    return{nodes:ent?.subCanvas?.nodes||[],conns:ent?.subCanvas?.conns||[]};
  },[view,mt,amid,chars,dtrees,quests]);

  const setNodes=useCallback(fn=>{
    if(view.type==='master'){
      setMt(prev=>prev.map(t=>t.id===amid?{...t,nodes:typeof fn==='function'?fn(t.nodes):fn}:t));
    }else{
      const setter={character:setChars,dialogue:setDtrees,quest:setQuests}[view.type];
      if(setter)setter(prev=>prev.map(e=>e.id===view.id?{...e,subCanvas:{...e.subCanvas,nodes:typeof fn==='function'?fn(e.subCanvas.nodes||[]):fn}}:e));
    }
  },[view,amid]);

  const setConns=useCallback(fn=>{
    if(view.type==='master'){
      setMt(prev=>prev.map(t=>t.id===amid?{...t,conns:typeof fn==='function'?fn(t.conns):fn}:t));
    }else{
      const setter={character:setChars,dialogue:setDtrees,quest:setQuests}[view.type];
      if(setter)setter(prev=>prev.map(e=>e.id===view.id?{...e,subCanvas:{...e.subCanvas,conns:typeof fn==='function'?fn(e.subCanvas.conns||[]):fn}}:e));
    }
  },[view,amid]);

  const nodes=activeCanvas.nodes;
  const conns=activeCanvas.conns;

  /* master tree management */
  const newMT=()=>{const id=uid();setMt(p=>[...p,{id,name:'New Graph',treeType:'general',nodes:[],conns:[]}]);setAmid(id);setRenamingTab(id);};
  const delMT=id=>{if(mt.length<=1)return;setMt(p=>p.filter(t=>t.id!==id));if(amid===id)setAmid(mt.find(t=>t.id!==id)?.id||null);};
  const renMT=(id,name)=>setMt(p=>p.map(t=>t.id===id?{...t,name:name||t.name}:t));
  const cycleMT=id=>setMt(p=>p.map(t=>{if(t.id!==id)return t;const types=TREE_TYPES;const next=types[(types.indexOf(t.treeType||'general')+1)%types.length];return{...t,treeType:next};}));

  /* canvas pan/zoom */
  const [offset,setOffset]=useState({x:80,y:40});
  const [zoom,setZoom]=useState(1);
  const canvasRef=useRef();
  const isPanning=useRef(false);
  const panStart=useRef({x:0,y:0,ox:0,oy:0});

  /* port positions */
  const portPos=useRef(new Map());
  const [,rerender]=useState(0);
  useLayoutEffect(()=>{
    const wrap=canvasRef.current;
    if(!wrap)return;
    const nm=new Map();
    const wR=wrap.getBoundingClientRect();
    wrap.querySelectorAll('.pd[data-port]').forEach(el=>{
      const r=el.getBoundingClientRect();
      // store in viewport-relative coords (canvas-wrap space) — SVG draws in the same space
      nm.set(el.getAttribute('data-port'),{
        x:r.left+r.width/2-wR.left,
        y:r.top+r.height/2-wR.top,
      });
    });
    let changed=nm.size!==portPos.current.size;
    if(!changed)nm.forEach((v,k)=>{const o=portPos.current.get(k);if(!o||Math.abs(o.x-v.x)>0.5||Math.abs(o.y-v.y)>0.5)changed=true;});
    portPos.current=nm;
    if(changed)rerender(n=>n+1);
  });

  /* wire draft */
  const [draft,setDraft]=useState(null);
  const draftRef=useRef(null);

  /* selected */
  const [selectedId,setSelectedId]=useState(null);

  /* context menu */
  const [ctx,setCtx]=useState(null);

  /* toast */
  const [toast,setToast]=useState(null);
  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),2200);},[]);

  /* place node on canvas */
  const placeNode=useCallback((type,label,extra,atPos)=>{
    const wrap=canvasRef.current;
    let x=80+nodes.length*28,y=80+nodes.length*18;
    if(atPos&&wrap){const r=wrap.getBoundingClientRect();x=(atPos.x-r.left)/zoom-offset.x;y=(atPos.y-r.top)/zoom-offset.y;}
    const id=uid();
    setNodes(prev=>[...prev,{id,type,label,x,y,...extra}]);
    setSelectedId(id);
  },[zoom,offset,nodes.length,setNodes]);

  /* node drag */
  const dragNode=useRef(null);
  const onHdr=(nodeId,e)=>{
    if(e.button!==0)return;
    e.stopPropagation();
    setSelectedId(nodeId);
    const nd=nodes.find(n=>n.id===nodeId);
    if(!nd)return;
    dragNode.current={id:nodeId,sx:e.clientX,sy:e.clientY,ox:nd.x,oy:nd.y};
    window.addEventListener('mousemove',onNodeMove);
    window.addEventListener('mouseup',onNodeUp);
  };
  const onNodeMove=useCallback(e=>{
    if(!dragNode.current)return;
    const dx=(e.clientX-dragNode.current.sx)/zoom;
    const dy=(e.clientY-dragNode.current.sy)/zoom;
    setNodes(prev=>prev.map(n=>n.id===dragNode.current.id?{...n,x:Math.max(0,dragNode.current.ox+dx),y:Math.max(0,dragNode.current.oy+dy)}:n));
  },[zoom,setNodes]);
  const onNodeUp=useCallback(()=>{
    dragNode.current=null;
    window.removeEventListener('mousemove',onNodeMove);
    window.removeEventListener('mouseup',onNodeUp);
  },[onNodeMove]);

  /* canvas events */
  const onCMD=e=>{
    if(e.button===1||(e.button===0&&e.altKey)){
      isPanning.current=true;
      panStart.current={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};
      e.preventDefault();
    }else if(e.button===0){setSelectedId(null);setCtx(null);}
  };
  const onCMM=e=>{
    if(isPanning.current)setOffset({x:panStart.current.ox+(e.clientX-panStart.current.x)/zoom,y:panStart.current.oy+(e.clientY-panStart.current.y)/zoom});
    if(draftRef.current){
      const r=canvasRef.current?.getBoundingClientRect();
      if(r)setDraft(p=>p?{...p,toPos:{x:e.clientX-r.left,y:e.clientY-r.top}}:null);
    }
  };
  const onCMU=e=>{
    isPanning.current=false;
    if(draftRef.current){
      let el=document.elementFromPoint(e.clientX,e.clientY);
      while(el&&!el.dataset.port)el=el.parentElement;
      if(el&&el.dataset.port&&el.dataset.side==='in'){
        const[dstNode,dstPort]=el.dataset.port.split('::');
        const d=draftRef.current;
        if(dstNode!==d.srcNodeId&&!conns.some(c=>c.src===d.srcNodeId&&c.srcPort===d.srcPortId&&c.dst===dstNode&&c.dstPort===dstPort)){
          const sn=nodes.find(n=>n.id===d.srcNodeId);
          setConns(p=>[...p,{id:uid(),src:d.srcNodeId,srcPort:d.srcPortId,srcType:sn?.type,dst:dstNode,dstPort}]);
        }
      }
      draftRef.current=null;
      setDraft(null);
    }
  };
  const onCW=e=>{e.preventDefault();setZoom(z=>Math.min(3,Math.max(0.2,z*(e.deltaY<0?1.1:0.9))));};

  /* port drag start / disconnect */
  const onPortMD=(nodeId,port,side,e)=>{
    if(side==='in'){
      /* click connected input port → disconnect */
      const key=nodeId+'::'+port.id;
      if(cPorts.has(key)){
        setConns(p=>p.filter(c=>!(c.dst===nodeId&&c.dstPort===port.id)));
      }
      return;
    }
    const pos=portPos.current.get(nodeId+'::'+port.id);
    if(!pos)return;
    draftRef.current={srcNodeId:nodeId,srcPortId:port.id,fromPos:pos};
    setDraft({fromPos:pos,toPos:pos});
  };

  /* delete node */
  const delNode=id=>{setNodes(p=>p.filter(n=>n.id!==id));setConns(p=>p.filter(c=>c.src!==id&&c.dst!==id));if(selectedId===id)setSelectedId(null);};

  /* connected ports set */
  const cPorts=useMemo(()=>{const s=new Set();conns.forEach(c=>{s.add(c.src+'::'+c.srcPort);s.add(c.dst+'::'+c.dstPort);});return s;},[conns]);

  /* sidebar drag */
  const dragItem=useRef(null);
  const sbDragStart=(type,label,extra)=>e=>{dragItem.current={type,label,extra};e.dataTransfer.effectAllowed='copy';};
  const onDrop=e=>{e.preventDefault();if(!dragItem.current)return;const{type,label,extra}=dragItem.current;placeNode(type,label,extra,{x:e.clientX,y:e.clientY});dragItem.current=null;};
  const onDragOver=e=>e.preventDefault();

  /* context menu */
  const onCCM=e=>{
    e.preventDefault();
    const ne=e.target.closest('.node');
    if(ne){const pe=ne.querySelector('[data-port]');if(pe)setCtx({x:e.clientX,y:e.clientY,nodeId:pe.getAttribute('data-port').split('::')[0]});}
  };

  /* double-click node → open popover or navigate into subcanvas */
  const onNodeDblClick=useCallback((nodeType,nodeId,entityId)=>{
    if(nodeType==='CHARACTER'||nodeType==='OCTAVIA') setPopover({type:'character',nodeId,entityId:entityId||nodeId});
    else if(nodeType==='INVENTORY') setPopover({type:'inventory',nodeId});
    else if(nodeType==='SCENE') setPopover({type:'scene',nodeId});
    else if(nodeType==='SPAWN_POINT') setPopover({type:'spawn',nodeId});
    else if(nodeType==='QUEST') setPopover({type:'quest',nodeId,entityId});
    else if(nodeType==='DIALOGUE_TREE') setVStack(p=>[...p,{type:'dialogue',id:entityId}]);
    else if(['THOUGHTS','STATEMENT','QUESTION','DEAD_END','END_CONVO','LOOP','ITEMS'].includes(nodeType))
      setPopover({type:'dialoguenode',nodeId});
  },[]);

  /* ── DIALOGUE SERIALIZER ── converts kit node graph → game flat format */
  const serializeDialogueTree=useCallback(tree=>{
    const {nodes:ns,conns:cs}=(tree.subCanvas||{nodes:[],conns:[]});
    if(!ns.length)return[];
    // build adjacency: nodeId → {portId → targetNodeId}
    const adj={};
    ns.forEach(n=>{adj[n.id]={};});
    cs.forEach(c=>{if(adj[c.src])adj[c.src][c.srcPort]=c.dst;});
    // find root: node with no incoming flow connections
    const hasPredecessor=new Set(cs.map(c=>c.dst));
    const roots=ns.filter(n=>!hasPredecessor.has(n.id));
    const start=roots[0]||ns[0];
    // walk in order, BFS to collect all nodes reachable
    const visited=new Set();
    const ordered=[];
    const queue=[start];
    while(queue.length){
      const n=queue.shift();
      if(!n||visited.has(n.id))continue;
      visited.add(n.id);
      ordered.push(n);
      const outs=adj[n.id]||{};
      // push out ports in a stable order
      ['out','opt_a','opt_b','opt_c','returns_to','if_met','if_not'].forEach(p=>{
        if(outs[p]){const next=ns.find(x=>x.id===outs[p]);if(next&&!visited.has(next.id))queue.push(next);}
      });
    }
    // map each node to game format
    return ordered.map(n=>{
      const outs=adj[n.id]||{};
      const next=id=>id||null;
      if(n.type==='STATEMENT')return{id:n.id,speaker:n.speaker||null,npc:n.text||'',opts:[{t:'(continue)',next:next(outs.out)}]};
      if(n.type==='QUESTION')return{id:n.id,npc:n.text||'',opts:[
        {t:n.optA||'Option A',next:next(outs.opt_a),...(n.actA?{act:n.actA}:{}),...(n.mutedA?{muted:true}:{})},
        {t:n.optB||'Option B',next:next(outs.opt_b),...(n.actB?{act:n.actB}:{}),...(n.mutedB?{muted:true}:{})},
        ...(n.optC?[{t:n.optC,next:next(outs.opt_c),...(n.actC?{act:n.actC}:{}),...(n.mutedC?{muted:true}:{})}]:[]),
      ]};
      if(n.type==='THOUGHTS')return{id:n.id,internal:true,emotion:n.emotion||n.voice||'FEAR',voice:n.emotion||n.voice||'FEAR',npc:n.text||'',opts:[{t:'',next:next(outs.out)}]};
      if(n.type==='DEAD_END')return{id:n.id,npc:n.text||'',opts:[]};
      if(n.type==='END_CONVO')return{id:n.id,npc:n.text||'',relDelta:n.relDelta||'+0',opts:[{t:'(continue)',next:null,...(n.act?{act:n.act}:{})}]};
      if(n.type==='LOOP')return{id:n.id,npc:n.text||'',condition:n.condition||'',opts:[{t:'(loop)',next:next(outs.returns_to)}]};
      if(n.type==='ITEMS')return{id:n.id,itemCheck:true,action:n.action||'give',item:n.item||'',opts:[
        {t:'if_met',next:next(outs.if_met)},
        {t:'if_not',next:next(outs.if_not)},
      ]};
      if(n.type==='OUTFIT_CHECK')return{id:n.id,outfitCheck:true,opts:[
        {t:'hoodie',next:next(outs.hoodie)},
        {t:'regular',next:next(outs.regular)},
        {t:'other',next:next(outs.other)},
      ]};
      return{id:n.id,npc:n.text||n.label||'',opts:[]};
    });
  },[]);

  /* ── FILE HANDLE PERSISTENCE (IndexedDB) ─────────────────────── */
  const _fhDB=useRef(null);
  const _fhHandle=useRef(null);
  const getDB=useCallback(()=>new Promise((res,rej)=>{
    if(_fhDB.current)return res(_fhDB.current);
    const req=indexedDB.open('beau_kit_fs',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('h');
    req.onsuccess=e=>{_fhDB.current=e.target.result;res(e.target.result);};
    req.onerror=e=>rej(e);
  }),[]);
  const dbGet=useCallback(async k=>{const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction('h','readonly').objectStore('h').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});},[getDB]);
  const dbPut=useCallback(async(k,v)=>{const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction('h','readwrite').objectStore('h').put(v,k);r.onsuccess=res;r.onerror=rej;});},[getDB]);

  const writePayload=useCallback(async(json)=>{
    const tryHandle=async h=>{
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){const r=await h.requestPermission({mode:'readwrite'});if(r!=='granted')throw new Error('denied');}
      const w=await h.createWritable();await w.write(json);await w.close();
      return h.name||'beauregarde_data.json';
    };
    // try in-memory handle first (same session)
    if(_fhHandle.current){
      try{const name=await tryHandle(_fhHandle.current);return name;}
      catch(e){_fhHandle.current=null;}
    }
    // try persisted handle (IndexedDB)
    try{
      const stored=await dbGet('exportHandle');
      if(stored){const name=await tryHandle(stored);_fhHandle.current=stored;return name;}
    }catch(e){}
    // first time: show picker
    if(!window.showSaveFilePicker)throw new Error('no-api');
    const h=await window.showSaveFilePicker({
      suggestedName:'beauregarde_data.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}],
    });
    await tryHandle(h);
    _fhHandle.current=h;
    try{await dbPut('exportHandle',h);}catch(idbErr){} // best-effort; real handles are cloneable, mocks may not be
    return h.name;
  },[dbGet,dbPut]);

  /* export — outputs game-compatible beauregarde_data.json */
  const exportGame=async()=>{
    // 1. PEOPLE (mapped to game's PEOPLE_DB format)
    const people=chars.filter(c=>c.id!=='c1').map(c=>({
      id:c.id, name:(c.name||'').toUpperCase(), role:c.role||'',
      handle:c.handle||'', status:(c.status||'contact').toUpperCase(),
      portrait:c.portrait?('../graphics/portraits/npc/'+c.portrait):'',
      info:c.info||'', discovered:c.discovered!==false,
      category:c.category||null,
      // gameplay-only fields (not in PEOPLE_DB but used by game logic)
      trust:c.trust||0, tags:c.tags||[], alignment:c.alignment||'neutral',
      enemyType:c.enemyType||'weak', hitPoints:c.hitPoints||10,
      lootable:c.lootable||false, lootItems:c.lootItems||[],
      pickpocketable:c.pickpocketable||false,
      pickpocketDifficulty:c.pickpocketDifficulty||'medium',
      pickpocketItems:c.pickpocketItems||[],
      caughtConsequence:c.caughtConsequence||'',
    }));
    // 2. QUESTS (mapped to game's QUESTS_DB format)
    const questsOut={
      major:quests.filter(q=>q.major).map(q=>({id:q.id,name:q.name,status:(q.status||'active').toUpperCase(),progress:q.progress||'',info:q.info||'',category:q.category||''})),
      minor:quests.filter(q=>!q.major).map(q=>({id:q.id,name:q.name,status:(q.status||'active').toUpperCase(),progress:q.progress||'',info:q.info||'',category:q.category||''})),
    };
    // 3. DIALOGUE (serialized node graphs)
    const dialogueOut={};
    dtrees.forEach(t=>{
      const key=t.name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
      dialogueOut[key]={id:t.id,name:t.name,treeType:t.treeType,outfitCondition:t.outfitCondition||'any',nodes:serializeDialogueTree(t),playCount:t.playCount||'always',playLimit:t.playLimit||1,conditions:t.conditions||[]};
    });
    // 4. SCENES (from SCENE nodes in all master trees)
    const allMtConns=mt.flatMap(t=>(t.conns||[]));
    const sceneNodes=mt.flatMap(t=>(t.nodes||[]).filter(n=>n.type==='SCENE'));
    const allMtNodes=mt.flatMap(t=>(t.nodes||[]));
    const scenesOut=sceneNodes.map(n=>{
      // find any DIALOGUE_TREE wired from this scene's to_dialogue output
      const dlgConn=allMtConns.find(c=>c.src===n.id&&c.srcPort==='to_dialogue');
      let dialogueTrigger=null;
      if(dlgConn){
        const dlgNode=allMtNodes.find(x=>x.id===dlgConn.dst);
        if(dlgNode&&dlgNode.type==='DIALOGUE_TREE'){
          const key=(dlgNode.label||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
          dialogueTrigger={key,worldX:n.triggerWorldX!==undefined?n.triggerWorldX:null};
        }
      }
      return{
        id:n.id, name:n.label||'Scene', atmosphere:n.atmosphere||'',
        sceneType:n.sceneType||'neutral', octaviaWorldX:n.octaviaWorldX||400,
        elevatorFloor:n.elevatorFloor||null,
        chars:(n.sceneChars||[]).map(sc=>({charId:sc.charId,worldX:sc.worldX,alignment:sc.alignment})),
        storeItems:(n.storeItems||[]),
        dialogueTrigger,
      };
    });
    // 5. SPAWN POINTS
    const spawnNodes=mt.flatMap(t=>(t.nodes||[]).filter(n=>n.type==='SPAWN_POINT'));
    const spawnsOut=spawnNodes.map(n=>({id:n.id,charId:n.charId||null,worldX:n.worldX||400}));
    // assemble
    const payload={people,quests:questsOut,dialogue:dialogueOut,scenes:scenesOut,spawns:spawnsOut,outfits:outfits.filter(o=>o.id!=='any'),audio};
    const json=JSON.stringify(payload,null,2);
    try{
      const name=await writePayload(json);
      showToast('WRITTEN → '+name);
    }catch(e){
      if(e.name==='AbortError')return; // user cancelled picker
      if(e.message==='no-api'){
        // browser doesn't support File System Access API — fall back to download
        const blob=new Blob([json],{type:'application/json'});
