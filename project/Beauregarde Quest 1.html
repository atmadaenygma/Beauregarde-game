// Returns {src, flip} — flip=true means apply scaleX(-1) to face the correct direction
const getCharAnimation=(outfit,facing,action)=>{
  const def=CHAR_ANIMATIONS[outfit];
  if(!def) return {src:null,flip:false};
  if(def.rightBased){
    if(action==='idle')       return {src:def.idle_left||null, flip:facing==='right'};
    if(action==='crouch')     return {src:def.crouch_idle_right||def.idle_left||null, flip:facing==='left'};
    if(action==='crouch_walk')return {src:def.crouch_walk_right||def.crouch_idle_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_start') return {src:def.jump_start_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_air')   return {src:def.jump_air_right||def.jump_start_right||def.walk||null, flip:facing==='left'};
    if(action==='jump_end')   return {src:def.jump_end_right||def.jump_start_right||def.walk||null, flip:facing==='left'};
    const src=(action==='run'&&def.run)?def.run:def.walk;
    return {src:src||null, flip:facing==='left'};
  }
  // Legacy path (unused but kept for safety)
  if(def.idle_left!==undefined){
    if(action==='run') return {src:def.run_left||null, flip:facing==='right'};
    return {src:def[`${action}_${facing}`]||null, flip:false};
  }
  const src=(action==='walk'?def.walk:action==='run'?(def.run||def.walk):def.idle)||null;
  const flip=(facing==='right')!==(def.baseDir==='right');
  return {src,flip};
};

function fogOf(sx,w,facing){
  const cx=sx+w/2,dist=cx-VW/2,ahead=facing==='right'?dist>0:dist<0;
  const d=Math.abs(dist)*(ahead?1.0:1.75);
  if(d<130)return{};if(d<270)return{opacity:.74};if(d<410)return{opacity:.42,filter:'saturate(.5)'};
  if(d<550)return{opacity:.16,filter:'saturate(.2) blur(1px)'};return{opacity:.05,filter:'saturate(0) blur(2px)'};
}

function useMonologue(lines){
  const [idx,setIdx]=useState(0);const[chars,setChars]=useState(0);
  const line=(lines||[])[idx]||'';const text=line.slice(0,chars);
  const full=chars>=line.length&&line.length>0;
  useEffect(()=>{setIdx(0);setChars(0);},[lines]);
  useEffect(()=>{if(full)return;const t=setTimeout(()=>setChars(c=>c+1),26);return()=>clearTimeout(t);},[chars,full,idx]);
  useEffect(()=>{if(!full||idx>=(lines||[]).length-1)return;const t=setTimeout(()=>{setIdx(i=>i+1);setChars(0);},3200);return()=>clearTimeout(t);},[full,idx,lines]);
  return{text,advance:()=>{if(idx<(lines||[]).length-1){setIdx(i=>i+1);setChars(0);}}};
}

// Canvas-based chroma key for videos exported without alpha channel (solid green background).
// Replace the source video with a proper VP9+alpha WebM to remove this component.
function ChromaKeyVideo({src,flip,height,playing,playbackRate,filterStr}){
  const vRef=useRef(null);
  const cRef=useRef(null);
  const rafRef=useRef(null);
  const drawRef=useRef(null);

  useEffect(()=>{
    const v=vRef.current;const c=cRef.current;
    if(!v||!c)return;
    let active=true;
    let ctx=null;

    const draw=()=>{
      if(!v||!c||!v.videoWidth||v.readyState<2)return;
      const h=typeof height==='number'?height:parseInt(height)||371;
      const w=Math.round(v.videoWidth*h/v.videoHeight);
      // Resize canvas intrinsic buffer to scaled display size (fixes overlapping frames)
      if(c.width!==w||c.height!==h){
        c.width=w;c.height=h;
        c.style.width=w+'px';c.style.height=h+'px';
        ctx=null;
      }
      if(!ctx)ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(v,0,0,w,h);
      const id=ctx.getImageData(0,0,w,h);
      const d=id.data;
      for(let i=0;i<d.length;i+=4){
        if(d[i+1]>80&&d[i+1]>d[i]+30&&d[i+1]>d[i+2]+30)d[i+3]=0;
      }
      ctx.putImageData(id,0,0);
    };
    drawRef.current=draw;

    const loop=()=>{
      if(!active)return;
      if(!v.paused&&!v.ended)draw();
      rafRef.current=requestAnimationFrame(loop);
    };

    v.muted=true;v.loop=true;v.src=src;v.load();
    v.play().catch(()=>{});
    rafRef.current=requestAnimationFrame(loop);
    return()=>{active=false;cancelAnimationFrame(rafRef.current);drawRef.current=null;};
  },[src,height]);

  useEffect(()=>{const v=vRef.current;if(v)v.playbackRate=playbackRate||1;},[playbackRate]);

  useEffect(()=>{
    const v=vRef.current;if(!v)return;
    if(playing){v.play().catch(()=>{});}
    else{
      // Seek to frame 0 then draw one still frame so she appears standing, not invisible
      v.currentTime=0;
      v.addEventListener('seeked',()=>{v.pause();drawRef.current?.();},{once:true});
    }
  },[playing]);

  return(
    <span style={{display:'inline-block',lineHeight:0}}>
      <video ref={vRef} muted loop playsInline preload="auto" style={{display:'none'}}/>
      <canvas ref={cRef} style={{display:'block',transformOrigin:'center center',transform:flip?'scaleX(-1)':'none',filter:filterStr}}/>
    </span>
  );
}

function Char({facing,walking,running=false,crouching=false,jumpPhase=null,vertOffset=0,charBottom=116,charX,charHeight=371,currentOutfit='cyber_octavia'}){
  const vidRef=useRef(null);
  const action=jumpPhase?('jump_'+jumpPhase):crouching?(walking||running?'crouch_walk':'crouch'):running?'run':walking?'walk':'idle';
  const effectiveHeight=jumpPhase?Math.round(charHeight*0.9):crouching?Math.round(charHeight*0.75):charHeight;
  const {src:animSrc,flip:shouldFlip}=getCharAnimation(currentOutfit,facing,action);
  // True only for outfits with dedicated idle files (rags). Others share the walk file.
  const hasIdleAnim=!!CHAR_ANIMATIONS[currentOutfit]?.idle_left;
  useEffect(()=>{
    const v=vidRef.current;if(!v||!animSrc)return;
    // Hide until alpha is decoded to prevent green flash on src change
    v.style.opacity='0';
    v.load();v.muted=true;
    v.playbackRate=walking?0.65:1;
    const onReady=()=>{v.style.opacity='1';};
    v.addEventListener('loadeddata',onReady,{once:true});
    v.play().catch(()=>{});
    return()=>v.removeEventListener('loadeddata',onReady);
  },[animSrc,running,walking,crouching,jumpPhase]);
  useEffect(()=>{
    const v=vidRef.current;if(!v)return;
    v.muted=true;
    if(jumpPhase==='start'||jumpPhase==='end'){v.playbackRate=1.5;v.play().catch(()=>{});}
    else if(jumpPhase==='air'){v.playbackRate=1;v.play().catch(()=>{});}
    else if(crouching&&(walking||running)){v.playbackRate=0.65;v.play().catch(()=>{});}
    else if(crouching){v.playbackRate=1;v.play().catch(()=>{});}
    else if(walking){v.playbackRate=0.65;v.play().catch(()=>{});}
    else if(running){v.playbackRate=1;v.play().catch(()=>{});}
    else if(hasIdleAnim){/* rags: idle_left/idle_right loop plays via animSrc change */}
    else{v.currentTime=0;v.addEventListener('seeked',()=>v.pause(),{once:true});} // single-file outfit idle: freeze at frame 0
  },[running,walking,crouching,jumpPhase]);
  if(animSrc){
    const ckNeeded=CHAR_ANIMATIONS[currentOutfit]?.needsChromaKey;
    const DROP='drop-shadow(0 6px 16px rgba(196,48,40,.55))';
    return(
      <div style={{position:'absolute',bottom:charBottom+(vertOffset||0),left:charX!==undefined?charX:'50%',zIndex:100,pointerEvents:'none',transform:'translateX(-50%)'}}>
        {ckNeeded
          ?<ChromaKeyVideo src={animSrc} flip={shouldFlip} height={effectiveHeight}
              playing={walking||running||crouching||!!jumpPhase} playbackRate={(jumpPhase==='start'||jumpPhase==='end')?1.5:jumpPhase==='air'?1:(walking&&!running)?0.65:1} filterStr={DROP}/>
          :<video key={animSrc} ref={vidRef} src={animSrc} loop muted playsInline preload="auto"
              style={{height:effectiveHeight,display:'block',transformOrigin:'center center',
                transform:shouldFlip?'scaleX(-1)':'none',filter:DROP,transition:'opacity 0.1s ease'}}/>
        }
      </div>
    );
  }
  return null;
}

function VoiceBox({seq,onChoose,onFinish}){
  const[idx,setIdx]=useState(0);
  const[chars,setChars]=useState(0);
  const[sel,setSel]=useState(0);
  const node=seq[idx]||seq[seq.length-1];
  const isChoice=node?.type==='choice';
  const txt=isChoice?'':(node?.t||'');
  const full=isChoice||chars>=txt.length;
  useEffect(()=>{setChars(0);setSel(0);},[idx]);
  useEffect(()=>{if(full||isChoice)return;const t=setTimeout(()=>setChars(c=>c+1),32);return()=>clearTimeout(t);},[chars,full,isChoice]);
  useEffect(()=>{
    if(!full||isChoice)return;
    const t=setTimeout(()=>{if(idx<seq.length-1)setIdx(i=>i+1);else if(onFinish)onFinish();},2200);
    return()=>clearTimeout(t);
  },[full,isChoice,idx,seq,onFinish]);
  useEffect(()=>{
    const kd=e=>{
      if(!isChoice){
        if(!full){if(e.code===KEYS.CONFIRM||e.code===KEYS.SKIP)setChars(9999);return;}
        if(e.code===KEYS.CONFIRM||e.code===KEYS.SKIP){
          if(idx<seq.length-1)setIdx(i=>i+1);else if(onFinish)onFinish();
        }
        return;
      }
      if(e.key==='1')setSel(0);else if(e.key==='2')setSel(1);else if(e.key==='3')setSel(2);else if(e.key==='4')setSel(3);
      else if(e.code===KEYS.UP)setSel(s=>Math.max(0,s-1));
      else if(e.code===KEYS.DOWN)setSel(s=>Math.min((node.opts.length-1),s+1));
      else if(e.code===KEYS.CONFIRM){if(onChoose)onChoose(node.opts[sel].id);}
    };
    window.addEventListener('keydown',kd);return()=>window.removeEventListener('keydown',kd);
  },[isChoice,full,idx,seq,sel,node,onChoose,onFinish]);
  const vc=VOICE_C[node?.v]||C.text;
  return(
    <div style={{position:'absolute',inset:0,zIndex:400,background:'rgba(0,0,0,0.90)',display:'flex',alignItems:'center',justifyContent:'center'}}>

          <div style={{color:vc,fontSize:15,lineHeight:2,fontFamily:"'Blue Screen',monospace",fontStyle:'italic',minHeight:72,marginBottom:32,letterSpacing:.3}}>
            {txt.slice(0,chars)}

          </div>
          {full&&<div style={{color:`${C.dim}66`,fontSize:8,letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>[E] CONTINUE</div>}
        </>):(<>
          <div style={{color:C.dim,fontSize:8,fontFamily:"'Blue Screen',monospace",lineHeight:1.9,marginBottom:28,letterSpacing:.3,borderLeft:`2px solid ${C.border}`,paddingLeft:16}}>

              <div key={i} onClick={()=>setSel(i)}
                style={{display:'flex',gap:12,alignItems:'flex-start',cursor:'pointer',padding:'5px 10px',
                  borderLeft:`2px solid ${sel===i?C.red:'transparent'}`,background:'transparent'}}>
                <span style={{color:'#3a2c14',fontSize:8,fontFamily:"'Blue Screen',monospace",minWidth:14}}>{i+1}</span>

function ChatBox({convKey,npcName,npcImg,total,onAct}){

  const npcText=(node?.npc||'').replace('__TOTAL__',`That'll be $${total}.`);

  const confirm=useCallback((idx)=>{
    const opt=node?.opts?.[idx];
    if(!opt)return;
    const result=opt.act?onAct(opt.act):null;
    if(result==='blocked')return;
    if(opt.next){setNodeId(opt.next);setSel(0);}
    else onAct('end');
  },[node,onAct]);

  useEffect(()=>{setNodeId('s0');setSel(0);},[convKey]);

  useEffect(()=>{
    const kd=e=>{
      if(e.key==='1')setSel(0);

function Bldg({d,px,facing}){
  const sx=(d.wx-px)*d.pax+VW/2;
  if(sx>VW+320||sx+d.w<-320)return null;
  const offset=(sx+d.w/2-VW/2)/(VW*.42);
  const rotY=clamp(offset*50,-52,52);
  const fog=fogOf(sx,d.w,facing);
  const cols=Math.floor(d.w/36),rows=Math.floor(d.h/46);
  return(<div style={{position:'absolute',left:sx,bottom:116,width:d.w,height:d.h,transform:`perspective(900px) rotateY(${rotY}deg)`,transformOrigin:'50% 100%',background:d.bc,borderTop:`1px solid ${d.wc}`,transition:'opacity .35s,filter .35s',...fog}}>
    <svg style={{position:'absolute',inset:0}} width={d.w} height={d.h}>
      {Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>{const lit=sr(r*17+c*31+d.wx*.1,7)>.36;return lit?<rect key={`${r}-${c}`} x={c*36+7} y={r*46+9} width={20} height={28} fill={d.wc} opacity={.45+sr(r+c,d.wx*.01)*.45}/>:null;}))}
    </svg>

    return Math.abs(o.wx-px)<55;
  });
  const promptPrefix=inputMethod==='controller'?'[ B ]':'[ E ]';

  useEffect(()=>{
    const handleInteract=()=>{
      if(popup){
        if(popupAction==='rest')onRest();
        else if(popupAction==='takemoney')onPickupMoney();
        else if(popupAction==='bedrest'){
          // Use selected bed option (0=REST 20%, 1=SLEEP 40%)

      // Bed options navigation — left/right or up/down to switch between REST, SLEEP, and LEAVE
      if(popupAction==='bedrest'){
        if(e.code==='ArrowLeft'){setBedOptionIdx(i=>i===0?2:i-1);return;}
        if(e.code==='ArrowRight'){setBedOptionIdx(i=>i===2?0:i+1);return;}
        // E key: execute selected bed option
        if(e.code==='KeyE'){
          if(bedOptionIdx===0){onRestBed?.(20);setBark('Good enough.');setTimeout(()=>setBark(null),3500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}
          else if(bedOptionIdx===1){onRestBed?.(40);setBark('Heavy. Deep. Gone for a while.');setTimeout(()=>setBark(null),4500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}
          else if(bedOptionIdx===2){setPopup(null);setPopupAction(null);setBedOptionIdx(0);}
          return;
        }
      }
      if(e.code==='KeyE')handleInteract();
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{
      window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);
    };
  },[near,onLeave,onEnterBathroom,onRest,onPickupMoney,popup,popupAction,money,bedOptionIdx]);

  useEffect(()=>{
    const loop=()=>{
      if(!popup){
        const left =keys.current['ArrowLeft'] ||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const isMoving=left||right;
        const {currentSpeed}=updateMovement(isMoving);

        if(left){setPx(x=>Math.max(VIEWPORT.minX,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(right){setPx(x=>Math.min(VIEWPORT.maxX,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      } else {
        setWalking(false);
      }
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);};
  },[popup]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  const flOff=-(px*.7)%80;
  const aptVidRef=useRef(null);
  useEffect(()=>{const v=aptVidRef.current;if(!v)return;v.muted=true;v.play().catch(()=>{});},[]);
  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0a0704'}}>
      <video ref={aptVidRef} src={APT_IMG} autoPlay loop playsInline preload="auto"
        style={{position:'absolute',inset:0,width:'130%',height:'130%',left:`${-px*0.3}px`,top:'-5%',objectFit:'cover',objectPosition:'center',zIndex:0}}/>
      {APT_OBJ.map(o=>{
        const gone=o.id==='money'&&money>0;
        const prompt=o.prompt;
        return(<div key={o.id} style={{position:'absolute',bottom:116,left:o.wx,zIndex:VIEWPORT.promptZ}}>
          {near?.id===o.id&&!gone&&<Prompt text={promptPrefix+' '+prompt}/>}
        </div>);
      })}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 40%,#060402a8 100%)'}}/>
      {popup&&<div style={{position:'absolute',top:60,left:'50%',transform:'translateX(-50%)',zIndex:300,background:C.panel,border:`1px solid ${C.border}`,padding:'12px 20px',fontFamily:"'Blue Screen',monospace",maxWidth:440}}>
        <div style={{color:C.red,fontSize:7,letterSpacing:3,marginBottom:8}}>// {popup.title}</div>
        <div style={{color:C.text,fontSize:8,lineHeight:1.75}}>{popup.body}</div>
        {popupAction==='bedrest'?(
          <div>
            <div style={{display:'flex',gap:8,marginTop:12}}>
              <div onClick={()=>{setBedOptionIdx(0);onRestBed?.(20);setBark('Good enough.');setTimeout(()=>setBark(null),3500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===0?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===0?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===0?C.selBg:'transparent'}}>REST +20%</div>
              <div onClick={()=>{setBedOptionIdx(1);onRestBed?.(40);setBark('Heavy. Deep. Gone for a while.');setTimeout(()=>setBark(null),4500);setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===1?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===1?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===1?C.selBg:'transparent'}}>SLEEP +40%</div>
              <div onClick={()=>{setPopup(null);setPopupAction(null);setBedOptionIdx(0);}}
                style={{flex:1,padding:'5px 0',border:bedOptionIdx===2?`1px solid ${C.gold}`:`1px solid ${C.border}`,color:bedOptionIdx===2?C.gold:C.dim,fontSize:7,letterSpacing:2,textAlign:'center',cursor:'pointer',background:bedOptionIdx===2?C.selBg:'transparent'}}>LEAVE</div>
            </div>
            <div style={{color:C.dim,fontSize:6,letterSpacing:1,marginTop:8,textAlign:'center'}}>← → {inputMethod==='controller'?'[D-PAD]':'[ARROWS]'} / {inputMethod==='controller'?'[B]':'[E]'} SELECT</div>
          </div>
        ):(
          <div onClick={()=>setPopup(null)} style={{color:C.dim,fontSize:8,marginTop:10,cursor:'pointer',letterSpacing:2}}>[ E ] CLOSE</div>
        )}

      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={px} charHeight={297} charBottom={53} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>

  );
}

// ── BATHROOM SCENE ───────────────────────────────────────────
function BathroomScene({heart,mono,onLeave,onShowerDone,bathroomSpawnPos,bathroomSpawnFacing,showerStat,debug,debugGo,currentOutfit,onEquipItem,onFindPhone}){
  const[px,setPx]=useState(bathroomSpawnPos??350);
  const[facing,setFacing]=useState(bathroomSpawnFacing??'right');
  const[walking,setWalking]=useState(false);
  const[pendingEquip,setPendingEquip]=useState(null);
  const[popup,setPopup]=useState(null);
  const[popupAction,setPopupAction]=useState(null);
  const[phoneTaken,setPhoneTaken]=useState(false);
  const[dialogueStep,setDialogueStep]=useState(showerStat?null:'shower_intro');
  const[newShowerStat,setNewShowerStat]=useState(null);
  const[waterState,setWaterState]=useState('running');
  const showerAudio=useRef(null);const dripAudio=useRef(null);
  const bathVidRef=useRef(null);
  const keys=useRef({});const raf=useRef(null);
  const exploring=dialogueStep===null;
  const near=exploring?BATH_OBJ.find(o=>{
    if(!o.prompt)return false;
    if(o.xMin!==undefined)return px>=o.xMin&&px<=o.xMax;
    return Math.abs(o.wx-px)<55;
  }):null;

  const handleChoose=useCallback((id)=>{
    if(dialogueStep==='shower_intro'){
      if(id==='A'){setWaterState('off');setDialogueStep('shower_a_sub');}
      else if(id==='B'){setNewShowerStat('sacrifice');setDialogueStep('shower_b_out');}
      else if(id==='C'){setWaterState('dripping');setNewShowerStat('compromise');setDialogueStep('shower_c_out');}
      else if(id==='D'){setWaterState('dripping');setNewShowerStat('passive');setDialogueStep('shower_d_out');}
    }else if(dialogueStep==='shower_a_sub'){
      const s={A1a:'empathetic',A1b:'guarded',A1c:'balanced',A1d:'traumatized'}[id]||'unknown';
      setNewShowerStat(s);
      if(id==='A1a')setWaterState('running');
      else if(id==='A1c'||id==='A1d')setWaterState('dripping');
      setDialogueStep(`shower_${id.toLowerCase()}_out`);
    }else if(dialogueStep==='mirror_main'){
      if(id==='A')setDialogueStep('mirror_a');
      else setDialogueStep('mirror_b_out');
    }else if(dialogueStep==='mirror_a'){
      setDialogueStep(`mirror_${id.toLowerCase()}_out`);
    }
  },[dialogueStep]);

  const handleFinish=useCallback(()=>{
    if(dialogueStep?.startsWith('shower')&&onShowerDone)onShowerDone(newShowerStat);
    setDialogueStep(null);
  },[dialogueStep,onShowerDone,newShowerStat]);

  const SHW_SRC=350, SHW_BASE=0.25, SHW_RANGE=600;

  // distance-based volume — fires on every position change
  useEffect(()=>{
    const vol=SHW_BASE*Math.max(0,1-Math.abs(px-SHW_SRC)/SHW_RANGE);
    if(showerAudio.current)showerAudio.current.volume=vol;
    if(dripAudio.current)dripAudio.current.volume=vol;
  },[px]);

  // water state switching — play/pause correct track, apply current distance vol
  useEffect(()=>{
    const sa=showerAudio.current;const da=dripAudio.current;
    if(!sa||!da)return;
    const vol=SHW_BASE*Math.max(0,1-Math.abs(px-SHW_SRC)/SHW_RANGE);
    if(waterState==='running'){da.pause();da.currentTime=0;sa.volume=vol;sa.muted=false;sa.play().catch(()=>{});}
    else if(waterState==='off'){sa.pause();sa.currentTime=0;da.pause();da.currentTime=0;}
    else if(waterState==='dripping'){sa.pause();sa.currentTime=0;da.volume=vol;da.muted=false;da.play().catch(()=>{});}
  },[waterState]); // eslint-disable-line

  useEffect(()=>()=>{showerAudio.current?.pause();dripAudio.current?.pause();},[]);

  useEffect(()=>{
    const v=bathVidRef.current;if(!v)return;
    v.muted=true;
    v.play().catch(()=>{});
  },[]);

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(dialogueStep)return;
      if(popup){
        if(e.code==='Escape'||e.code==='KeyE'){
          if(popupAction==='findphone'){onFindPhone?.();setPhoneTaken(true);setPopup(null);setPopupAction(null);return;}
          setPopup(null);setPopupAction(null);
        }
        return;
      }
      if(e.code==='KeyE'){
        if(near?.id==='door')onLeave();
        else if(near?.id==='mirror')setDialogueStep('mirror_main');
        else if(near?.id==='soak'){
          setPopup(BATH_POPUPS.soak);
        } else if(BATH_POPUPS[near?.id]){
          if(near.id==='toilet'&&phoneTaken){
            setPopup(TOILET_BARKS[Math.floor(Math.random()*TOILET_BARKS.length)]);
          } else {
            setPopup(BATH_POPUPS[near.id]);
            if(near.id==='toilet')setPopupAction('findphone');
          }
        }
      }
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[near,onLeave,popup,popupAction,dialogueStep,onFindPhone,phoneTaken,onEquipItem]);

  useEffect(()=>{
    if(pendingEquip&&onEquipItem){
      onEquipItem(pendingEquip);
      setPendingEquip(null);
    }
  },[pendingEquip,onEquipItem]);

  useEffect(()=>{
    const loop=()=>{
      if(!popup&&!dialogueStep){
        if(keys.current['ArrowLeft']||keys.current['KeyA']){setPx(x=>Math.max(VIEWPORT.minX,x-SPD));setFacing('left');setWalking(true);}
        else if(keys.current['ArrowRight']||keys.current['KeyD']){setPx(x=>Math.min(VIEWPORT.maxX,x+SPD));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[popup,dialogueStep]);

  const activeSeq=dialogueStep?DIALOGUE_SEQS[dialogueStep]:null;
  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#080606'}}>
      <video ref={bathVidRef} src={BATHROOM_VID} autoPlay loop playsInline preload="auto"
        style={{position:'absolute',top:'10%',left:0,width:'100%',
          height:'90%',objectFit:'cover',objectPosition:'center bottom',zIndex:0}}/>
      <svg style={{position:'absolute',inset:0,opacity:.04,pointerEvents:'none'}} width={VW} height={VH}>
        {Array.from({length:12},(_,r)=>Array.from({length:22},(_,c)=>(
          <rect key={`${r}-${c}`} x={c*60+2} y={r*48+2} width={56} height={44} rx={1} fill="none" stroke="#c8b89055" strokeWidth={.5}/>
        )))}
      </svg>
      {BATH_OBJ.map(o=>{
        const isNear=near?.id===o.id;
        return(<div key={o.id} style={{position:'absolute',bottom:116,left:o.wx,zIndex:VIEWPORT.promptZ}}>
          {isNear&&o.prompt&&<Prompt text={o.prompt}/>}
        </div>);
      })}
      {activeSeq&&<VoiceBox key={dialogueStep} seq={activeSeq} onChoose={handleChoose} onFinish={handleFinish}/>}
      {popup&&!dialogueStep&&<div style={{position:'absolute',top:60,left:'50%',transform:'translateX(-50%)',zIndex:300,background:C.panel,border:`1px solid ${C.border}`,padding:'12px 20px',fontFamily:"'Blue Screen',monospace",maxWidth:440}}>
        <div style={{color:C.red,fontSize:7,letterSpacing:3,marginBottom:8}}>// {popup.title}</div>
        <div style={{color:C.text,fontSize:8,lineHeight:1.75}}>{popup.body}</div>
        <div onClick={()=>setPopup(null)} style={{color:C.dim,fontSize:8,marginTop:10,cursor:'pointer',letterSpacing:2}}>[ E ] CLOSE</div>
      </div>}
      <audio ref={showerAudio} src={SHOWER_SFX} loop preload="auto" muted/>
      <audio ref={dripAudio} src={DRIP_SFX} loop preload="auto" muted/>
      <Char facing={facing} walking={walking} charBottom={43} charX={px} charHeight={334} currentOutfit={currentOutfit}/><Mono text={mono}/><Heart state={heart}/>
      <SceneLabel label="BATHROOM — 4C OAKWOOD ARMS"/>
      <Controls hints={[['← →','MOVE'],['E','INTERACT'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="bathroom" onSceneChange={debugGo}/>}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 40%,#060402c0 100%)'}}/>
    </div>
  );
}

// ── HALLWAY SCENE ─────────────────────────────────────────────
function HallwayScene({heart,mono,mode,onRoom,onExit,inventory,heartNum,onUseItem,currentOutfit,debug,debugGo,stamina,onStaminaChange,hudOpen=false}){
  const[px,setPx]=useState(mode==='in'?1030:200);
  const[facing,setFacing]=useState(mode==='in'?'left':'right');
  const[walking,setWalking]=useState(false);
  const[popup,setPopup]=useState(null);
  const[exiting,setExiting]=useState(false);
  const elevAudio=useRef(null);const radioAudio=useRef(null);
  const convAudio=useRef(null);const vacAudio=useRef(null);
  const apt4aAudio=useRef(null);const apt4bAudio=useRef(null);
  const knockAudio=useRef(null);
  const hallwayVidRef=useRef(null);
  useEffect(()=>{const v=hallwayVidRef.current;if(!v)return;v.muted=true;v.play().catch(()=>{});},[]);
  useEffect(()=>{
    [apt4aAudio,apt4bAudio].forEach(r=>{if(r.current){r.current.volume=0;r.current.muted=false;r.current.play().catch(()=>{});}});
  },[]);
  const raf=useRef(null);
  const hallwaySPD=SPD*0.2;
  const {keys,running,isCrouching,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(hallwaySPD,stamina,onStaminaChange,currentOutfit,hudOpen);
  const near=HALL_OBJ.find(o=>Math.abs(o.wx-px)<70&&o.prompt);

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(popup){if(e.code==='Escape'||e.code==='KeyE'){setPopup(null);if(near?.id==='door_4b'){const a=apt4bAudio.current;if(a){a.muted=false;a.play().catch(()=>{});}}return;}}
      if(e.code==='KeyE'){
        if(near?.id==='her_door')onRoom();
        else if(near?.id==='stairs_up'||near?.id==='stairs_down'){setPopup(HALL_POPUPS[near.id]);}
        else if(near?.id==='elevator'){debugGo?.('elevator');}
        else if(near?.id==='door_4a'||near?.id==='door_4b'){
          const ka=knockAudio.current;if(ka){ka.muted=false;ka.play().catch(()=>{});}
          setTimeout(()=>{
            setPopup(HALL_POPUPS[near.id]);
            if(near?.id==='door_4b')apt4bAudio.current?.pause();

        }

    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);

    [radioAudio,convAudio,vacAudio].forEach(r=>{
      if(r.current){
        r.current.volume=0;
        r.current.muted=false;
        r.current.play().catch(()=>{});
      }
    });
  },[]);

  // proximity volume — apartments
  useEffect(()=>{
    const vol=(playerPx,wx,max=260,peak=0.55)=>Math.max(0,(1-Math.abs(playerPx-wx)/max)*peak);
    if(apt4aAudio.current)apt4aAudio.current.volume=vol(px,663,300,0.04);
    if(apt4bAudio.current)apt4bAudio.current.volume=vol(px,850,300,0.06);

  useEffect(()=>{
    const hallwayMaxX=1150;

      if(!popup&&!exiting){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];

        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[popup,exiting]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  return(

        style={{position:'absolute',inset:0,width:'200%',height:'100%',left:`${-px*1.0}px`,top:0,objectFit:'cover',objectPosition:'left center',zIndex:0}}/>
      <svg style={{position:'absolute',top:55,left:0,width:VW,height:28,zIndex:2,pointerEvents:'none'}} width={VW} height={28}>
        {[140,310,490,650,820,1000].map((sx,i)=><rect key={i} x={sx-22} y={0} width={44} height={7} rx={2} fill="#d4a02018"/>)}</svg>
      {near&&near.prompt&&(
        <div style={{position:'absolute',bottom:116,left:near.wx,zIndex:VIEWPORT.promptZ}}>
          <Prompt text={near.prompt}/>
        </div>
      )}
      <audio ref={elevAudio} src={ELEV_SFX} loop preload="auto" muted/>
      <audio ref={radioAudio} src={RADIO_SFX} loop preload="auto" muted/>
      <audio ref={convAudio} src={CONV_SFX} loop preload="auto" muted/>
      <audio ref={vacAudio} src={VAC_SFX} loop preload="auto" muted/>
      <audio ref={apt4aAudio} src="../audio/sfx/ambient/building/01_spanish_radio.mp3" loop preload="auto" muted/>
      <audio ref={apt4bAudio} src="../audio/sfx/ambient/building/vacuum_cleaner_baby.mp3" loop preload="auto" muted/>
      <audio ref={knockAudio} src="../audio/sfx/interact/doors/knocking.mp3" preload="auto" muted/>
      {exiting&&<div style={{position:'absolute',inset:0,zIndex:300,background:'#000',opacity:.7,pointerEvents:'none'}}/>}

    </div>
  );
}

// ── ELEVATOR SCENE ────────────────────────────────────────────
function ElevatorScene({onDone,onExit,currentOutfit}){
  const [moving,setMoving]=useState(false);
  const [selected,setSelected]=useState(4);
  const [shake,setShake]=useState({x:0,y:0});
  const shakeInterval=useRef(null);
  const elevSoundRef=useRef(null);
  const floors=['G','1','2','3','4'];
  const currentFloor=4;

  useEffect(()=>{
    if(moving){
      shakeInterval.current=setInterval(()=>{
        setShake({x:(Math.random()-.5)*5,y:(Math.random()-.5)*3});
      },70);
    }else{
      clearInterval(shakeInterval.current);
      setShake({x:0,y:0});
    }
    return()=>clearInterval(shakeInterval.current);
  },[moving]);

  useEffect(()=>{

      if(moving)return;
      if(e.code==='ArrowUp'||e.code==='KeyW'){
        setSelected(s=>s>0?s-1:floors.length);
        return;
      }
      if(e.code==='ArrowDown'||e.code==='KeyS'){
        setSelected(s=>s<floors.length?s+1:0);
        return;

      if(e.code==='KeyE'){
        const floor=floors[selected];
        if(floor==='EXIT'){onExit?.();return;}

        setMoving(true);
        const es=elevSoundRef.current;if(es){es.muted=false;es.play().catch(()=>{});}
        setTimeout(()=>onDone?.(),2000);
      }
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[moving,selected,onDone,onExit,currentFloor,floors]);

  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0a0907',transform:`translate(${shake.x}px,${shake.y}px)`}}>

        {floors.map((f,i)=>(
          <div key={f} style={{display:'block',width:'100%',padding:'8px 12px',marginBottom:6,background:currentFloor===(f==='G'?0:parseInt(f))?C.gold:selected===i?C.selBg:C.selBg,color:currentFloor===(f==='G'?0:parseInt(f))?'#000':C.text,border:`1px solid ${C.border}`,fontFamily:"'Blue Screen',monospace",fontSize:8,opacity:moving?0.5:1,letterSpacing:1}}>
            {selected===i&&'[ E ] '}{f}
          </div>

        <div style={{display:'block',width:'100%',padding:'8px 12px',marginTop:10,background:selected===floors.length?'#3a2020':'#1a0808',color:C.red,border:`1px solid ${C.border}`,fontFamily:"'Blue Screen',monospace",fontSize:8,opacity:moving?0.5:1,letterSpacing:1}}>

const STR_NPCS=[

  {id:'woman',wx:320,h:76,col:'#7a7050',conv:'street_elder',   name:'ELDER'},

function StrScene({heart,mono,mode,spawnX,onStore,onHome,onPharmacy,onRestaurant,onAlleyWay,inventory,onUseItem,heartNum,currentOutfit,debug,debugGo,stamina,onStaminaChange,hudOpen=false}){
  // STR_IMG_W: rendered width of exterior.png at backgroundSize:'auto 120%'
  // Original image 3252×1280; rendered height=VH*1.2=864; width=3252*(864/1280)≈2195
  const STR_IMG_W=Math.floor(3252*(VH*1.2/1280));
  const STR_CAM_MAX=STR_IMG_W-VW;
  const initX=spawnX!=null?spawnX:(mode==='return'?860:640);
  const initFacing=spawnX!=null?(spawnX>=1200?'left':'right'):(mode==='return'?'left':'right');
  const [worldX,setWorldX]=useState(initX);
  const [facing,setFacing]=useState(initFacing);
  const [walking,setWalking]=useState(false);
  const [conv,setConv]=useState(null);
  const [painGlitch,setPainGlitch]=useState(null);
  const [streetTexts,setStreetTexts]=useState([]);
  const raf=useRef(null);
  const strSPD=SPD*0.1024;
  const {keys,running,isCrouching,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(strSPD,stamina,onStaminaChange,currentOutfit,hudOpen,0.25);
  // Camera: follows worldX but stops at image edges — never shows black
  const cam=clamp(worldX-VW/2,0,STR_CAM_MAX);
  const nearNpc=STR_NPCS.find(n=>Math.abs(n.wx-worldX)<85);
  const nearLoc=STR_LOCS.find(l=>worldX>=l.xMin&&worldX<=l.xMax);
  const nearStore=nearLoc?.id==='store';
  const nearLobby=nearLoc?.id==='lobby';
  const nearPharmacy=nearLoc?.id==='pharmacy';
  const nearRestaurant=nearLoc?.id==='restaurant';
  const nearAlleyWay=nearLoc?.id==='alley_video_store';

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(e.code==='KeyE'){
        if(conv){return;}
        if(nearLobby)onHome();
        else if(nearStore)onStore();
        else if(nearPharmacy)onPharmacy();
        else if(nearRestaurant)onRestaurant();
        else if(nearAlleyWay)onAlleyWay();
        else if(nearNpc)setConv({key:nearNpc.conv,name:nearNpc.name});
      }
      if(e.code==='Escape'){setConv(null);}
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[nearLoc,nearStore,nearPharmacy,nearRestaurant,nearAlleyWay,nearLobby,nearNpc,conv,onStore,onHome,onPharmacy,onRestaurant,onAlleyWay]);

  useEffect(()=>{
    const loop=()=>{
      if(!conv){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const isMoving=left||right;
        const {currentSpeed}=updateMovement(isMoving);

        if(left){setWorldX(x=>Math.max(0,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(right){setWorldX(x=>Math.min(STR_IMG_W,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[conv,STR_IMG_W]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  useEffect(()=>{
    const t=setInterval(()=>{
      if(Math.random()<0.12){
        const dx=(-5+Math.random()*10).toFixed(1);
        const dy=(-1+Math.random()*2).toFixed(1);
        setPainGlitch({dx,dy});
        setTimeout(()=>setPainGlitch(null),75+Math.random()*110);
      }
    },1800);
    return()=>clearInterval(t);
  },[]);


  // Floating ambient street text while walking
  const STREET_TEXT_POOL=[
    "Yo, watch yourself walking alone at night.",
    "Rain's coming hard, baby. Don't stay out too long.",
    "Network been moving people through. Keep your head down.",
    "...yeah, the Bureau was asking questions yesterday. Nobody talking.",
    "Power was out on Third Street yesterday. Bureau doing something.",
    "They're hunting someone. Can feel it. City feels different when they're hunting.",
    "Bureau's got a face. Someone they're looking for.",
    "Network's moving people. Safe houses going active.",

const PHARMACY_ITEMS=[
  {id:'painkillers',wx:550,label:'PAINKILLERS',col:'#a89050',price:4},
  {id:'bandages',   wx:730,label:'BANDAGES',   col:'#9a8070',price:3},
];
const RESTAURANT_ITEMS=[]; // food — to be added with quests

// ── STORE SCENE ───────────────────────────────────────────────
const STORE_ITEMS=[
  {id:'water',    wx:685, label:'WATER',    col:'#304860',price:2, look:'the water looks good'},
  {id:'sandwich', wx:875, label:'SANDWICH', col:'#806030',price:2, look:'the sandwich looks good'},
];

function StoreScene({heart,mono,onLeave,money,onSpendMoney,onAddItems,onTheft,currentOutfit,debug,debugGo,stamina,onStaminaChange,hudOpen=false}){
  const [walking,setWalking]=useState(false);
  const [px,setPx]=useState(109);
  const [facing,setFacing]=useState('right');
  const [basket,setBasket]=useState([]);
  const [paid,setPaid]=useState(false);
  const [credit,setCredit]=useState(false);
  const [stolen,setStolen]=useState(false);
  const [conv,setConv]=useState(null);
  const raf=useRef(null);
  const {keys,running,isCrouching,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(SPD,stamina,onStaminaChange,currentOutfit,hudOpen);
  const nearItem=STORE_ITEMS.find(i=>Math.abs(i.wx-px)<52&&!basket.includes(i.id));
  const nearLookItem=STORE_ITEMS.find(i=>Math.abs(i.wx-px)<90&&!basket.includes(i.id));
  const nearCounter=Math.abs(px-1144)<100&&!conv;
  const atExit=px<200;
  const total=basket.reduce((s,id)=>s+(STORE_ITEMS.find(i=>i.id===id)?.price||0),0);
  const canPay=money>=total&&total>0;

  const handleAct=useCallback((act)=>{
    if(act==='pay'){if(!canPay)return 'blocked';onSpendMoney(total);onAddItems?.(basket);setPaid(true);}
    else if(act==='freeItems'){onAddItems?.(basket);setBasket([]);setCredit(true);}
    else if(act==='stealAttempt')setConv('clerk_caught');
    else if(act==='stealFinal'){setStolen(true);onAddItems?.(basket);onTheft?.();setConv(null);setTimeout(onLeave,1000);}
    else if(act==='putback'){setBasket([]);setConv(null);}
    else if(act==='leave'){setConv(null);setTimeout(onLeave,400);}
    else if(act==='end')setConv(null);
  },[total,money,onSpendMoney,onLeave,onAddItems,basket]);

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      if(e.code==='Escape'){if(!conv)return;setConv(null);return;}
      if(e.code==='KeyE'&&!conv){
        if(atExit&&!basket.length)onLeave();
        else if(atExit&&basket.length>0&&!paid&&!stolen)setConv('raymond_caught');
        else if(nearItem)setBasket(b=>[...b,nearItem.id]);
        else if(nearCounter&&basket.length>0)setConv(canPay?'raymond_pay':'store_cant_pay');
        else if(nearCounter&&basket.length===0)setConv('raymond_browse');
      }
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
    return()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
  },[nearItem,nearCounter,canPay,paid,stolen,atExit,basket,onLeave,conv]);

  useEffect(()=>{
    const loop=()=>{
      if(!conv){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const {currentSpeed}=updateMovement(left||right);
        if(left){setPx(x=>Math.max(VIEWPORT.minX,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(right){setPx(x=>Math.min(VIEWPORT.maxX,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[conv]);

  const flOff=-(px*.7)%80;
  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0c0a07'}}>
      <video src={CORNER_STORE_IMG} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}} autoPlay muted loop/>
      {[480,720,960].map((sx,i)=><div key={i} style={{position:'absolute',top:40,left:sx-90,width:180,height:220,pointerEvents:'none',background:'radial-gradient(ellipse 40% 55% at 50% 0%,#d4a02014 0%,transparent 70%)'}}/>)
      }
      {/* Item look text + take prompts */}
      {STORE_ITEMS.map(item=>{
        const inB=basket.includes(item.id);
        if(inB)return null;
        const near52=Math.abs(item.wx-px)<52;
        const near90=Math.abs(item.wx-px)<90;
        return(<div key={item.id} style={{position:'absolute',bottom:200,left:item.wx,transform:'translateX(-50%)',zIndex:VIEWPORT.promptZ,pointerEvents:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
          {near90&&!near52&&<div style={{color:C.dim,fontSize:7,letterSpacing:2,fontFamily:"'Blue Screen',monospace",whiteSpace:'nowrap',textShadow:'0 0 6px #000'}}>{item.look}</div>}
          {near52&&<div style={{position:'relative'}}><Prompt text={`[ E ] TAKE — $${item.price}`}/></div>}
        </div>);
      })}
      {/* Clerk NPC */}
      <div style={{position:'absolute',bottom:65,left:1144,transform:'translateX(-50%)',zIndex:10,display:'flex',flexDirection:'column',alignItems:'center'}}>
        <NpcVideo src={STORE_CLERK_VID} height={482}/>
        {nearCounter&&!conv&&basket.length===0&&<Prompt text="[ E ] TALK"/>}
        {nearCounter&&!conv&&basket.length>0&&<Prompt text={canPay?`[ E ] PAY — $${total}`:'[ E ] TALK (need cash)'}/>}
      </div>
      {/* Exit prompt */}
      {atExit&&!basket.length&&<div style={{position:'absolute',bottom:240,left:'50%',transform:'translateX(-50%)',zIndex:150,background:C.panel,border:`1px solid ${C.border}`,color:C.gold,fontSize:7,padding:'4px 14px',letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>[ E ] EXIT</div>}
      {atExit&&basket.length>0&&!paid&&!stolen&&<div style={{position:'absolute',bottom:240,left:'50%',transform:'translateX(-50%)',zIndex:150,background:C.panel,border:`1px solid ${C.border}`,color:C.red,fontSize:7,padding:'4px 14px',letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>[ E ] LEAVE (unpaid)</div>}
      {/* Floor */}
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 38%,#060402a0 100%)'}}/>
      {/* Basket */}
      {basket.length>0&&<div style={{position:'absolute',top:20,right:20,zIndex:300,background:C.panel,border:`1px solid ${C.border}`,padding:'6px 12px',fontFamily:"'Blue Screen',monospace",minWidth:120}}>
        <div style={{color:C.dim,fontSize:8,letterSpacing:2,marginBottom:5}}>BASKET</div>
        {basket.map(id=>{const it=STORE_ITEMS.find(i=>i.id===id);return<div key={id} style={{display:'flex',justifyContent:'space-between',gap:14,color:C.text,fontSize:8}}><span>{it?.label}</span><span style={{color:C.gold}}>${it?.price}</span></div>;})}
        <div style={{borderTop:`1px solid ${C.border}33`,marginTop:4,paddingTop:4,display:'flex',justifyContent:'space-between',color:C.text,fontSize:8}}><span>TOTAL</span><span style={{color:C.gold}}>${total}</span></div>
        <div style={{color:money>=total?'#8ab840':C.red,fontSize:8,marginTop:3}}>{money>=total?`HAVE $${money} — OK`:`NEED $${total-money} MORE`}</div>
      </div>}
      {stolen&&<div style={{position:'absolute',top:20,left:'50%',transform:'translateX(-50%)',zIndex:300,color:C.red,fontSize:8,letterSpacing:4,fontFamily:"'Blue Screen',monospace",textShadow:`0 0 12px ${C.red}`}}>// THEFT</div>}
      {paid&&!credit&&<div style={{position:'absolute',top:20,left:'50%',transform:'translateX(-50%)',zIndex:300,color:'#8ab840',fontSize:7,letterSpacing:3,fontFamily:"'Blue Screen',monospace"}}>// PAID — ${money-total} REMAINING</div>}
      {credit&&<div style={{position:'absolute',top:20,left:'50%',transform:'translateX(-50%)',zIndex:300,color:C.gold,fontSize:7,letterSpacing:3,fontFamily:"'Blue Screen',monospace"}}>// CREDIT — COME BACK WHEN YOU CAN</div>}
      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={px} charBottom={65} charHeight={482} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>
      <SceneLabel label="CORNER STORE"/>
      <Controls hints={[['← →','MOVE'],['E','INTERACT'],['SHIFT','CROUCH'],['SPACE','JUMP'],['I','INVENTORY'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="store" onSceneChange={debugGo}/>}
      {conv&&<ChatBox convKey={conv} npcName="RAYMOND" npcImg={CLERK_IMG} total={total} onAct={handleAct}/>}
    </div>
  );
}

        else if(nearGuard&&guardBlocking)setConv('guard_blocked');

      if(!conv){

  return(

  useEffect(()=>{
    const kd=e=>{
      if(e.code==='Escape'){if(!conv)return;setConv(null);return;}
      if(e.code==='KeyE'&&!conv){
        if(atExit)onLeave();
        else if(nearCounter)setConv('charlie_first_meeting');
      }
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[nearCounter,atExit,onLeave,conv]);

  useEffect(()=>{
    const loop=()=>{
      if(!conv){
        const left=keys.current['ArrowLeft']||keys.current['KeyA'];
        const right=keys.current['ArrowRight']||keys.current['KeyD'];
        const {currentSpeed}=updateMovement(left||right);
        if(left){setPx(x=>Math.max(VIEWPORT.minX,x-currentSpeed));setFacing('left');setWalking(true);}
        else if(right){setPx(x=>Math.min(VIEWPORT.maxX,x+currentSpeed));setFacing('right');setWalking(true);}
        else setWalking(false);
      }else setWalking(false);
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf.current);
  },[conv]); // do NOT include updateMovement — it causes dependency cycles with stamina updates

  return(
    <div style={{width:VW,height:VH,position:'relative',overflow:'hidden',background:'#0a0908'}}>
      <video src={ALLEY_VIDEO_STORE_IMG} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}} autoPlay muted loop/>
      <div style={{position:'absolute',bottom:29,left:850,zIndex:10,display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{color:C.gold,fontSize:8,letterSpacing:2,fontFamily:"'Blue Screen',monospace",marginBottom:4,whiteSpace:'nowrap',textAlign:'center'}}>// CHARLIE</div>
        <NpcVideo src={CHARLIE_IDLE_VID} height={408} width={408}/>
        {nearCounter&&!conv&&<div style={{position:'absolute',bottom:-35,left:'50%',transform:'translateX(-50%)',whiteSpace:'nowrap',background:C.panel,border:`1px solid ${C.border}`,color:C.gold,fontSize:8,padding:'2px 8px',letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>[ E ] TALK</div>}
      </div>
      <div style={{position:'absolute',inset:0,zIndex:49,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000014 3px,#00000014 4px)'}}/>
      <div style={{position:'absolute',inset:0,zIndex:48,pointerEvents:'none',background:'radial-gradient(ellipse 85% 72% at 50% 50%,transparent 38%,#060402a0 100%)'}}/>
      <Char facing={facing} walking={walking} running={running} crouching={isCrouching} jumpPhase={jumpPhase} vertOffset={vertOffset} charX={px} charBottom={29} currentOutfit={currentOutfit}/><Mono text={bark||mono}/><Heart state={heart}/>
      <SceneLabel label="ALLEY WAY — THE VEIL"/>
      <Controls hints={[['← →','MOVE'],['E','TALK'],['SHIFT','CROUCH'],['SPACE','JUMP'],['I','INVENTORY'],['TAB','DEBUG']]}/>
      {debug&&<DebugOverlay px={px} scene="alley_video_store" onSceneChange={debugGo}/>}
      {conv&&<ChatBox convKey={conv} npcName="CHARLIE" npcImg={CHARLIE_PORTRAIT} total={0} onAct={(act)=>{
        if(act==='giveMoveVideo'){window.dispatchEvent(new CustomEvent('beau_unlockVideo',{detail:{id:'v1'}}));setConv(null);return;}
        if(act==='end'||!act)setConv(null);
      }}/>}
      {atExit&&!conv&&<div style={{position:'absolute',bottom:240,left:'50%',transform:'translateX(-50%)',zIndex:150,background:C.panel,border:`1px solid ${C.border}`,color:C.gold,fontSize:7,padding:'4px 14px',letterSpacing:2,fontFamily:"'Blue Screen',monospace"}}>[ E ] EXIT</div>}
    </div>
  );
}

const N_LINES=[{t:'Darkness.',g:false},{t:'White room. Hands.',g:false},{t:'"Neural pathways integrating."',g:true},{t:'"Octopus neural ganglia merging with human cortex."',g:true},{t:'Fear.',g:false},{t:'"Valuable property."',g:true},{t:'"Asset approved."',g:true},{t:'...pain...',g:false},{t:'',g:false}];
function Nightmare({onDone}){
  const [ph,setPh]=useState(0);const[vis,setVis]=useState(false);
  useEffect(()=>{setVis(false);const t=setTimeout(()=>setVis(true),320);return()=>clearTimeout(t);},[ph]);
  useEffect(()=>{const d=ph===0?2000:ph===N_LINES.length-1?1200:2300;const t=setTimeout(()=>{ph<N_LINES.length-1?setPh(p=>p+1):onDone();},d);return()=>clearTimeout(t);},[ph,onDone]);
  const line=N_LINES[ph];
  return(<div style={{width:VW,height:VH,position:'absolute',inset:0,zIndex:400,background:ph%3===2?'#0a0302':'#060202',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>

    {ph===6&&<div style={{position:'absolute',inset:0,background:C.red,opacity:.12,animation:'flash .9s ease-out 1'}}/>}
  </div>);
}

// ── OPENING SEQUENCE ─────────────────────────────────────────
function StaticNoise(){
  const ref=useRef(null);
  useEffect(()=>{
    const canvas=ref.current;if(!canvas)return;
    const ctx=canvas.getContext('2d');
    let raf;let last=0;
    const draw=(t)=>{
      if(t-last>80){
        last=t;
        const img=ctx.createImageData(256,256);
        for(let i=0;i<img.data.length;i+=4){
          if(Math.random()<0.045){
            const v=Math.floor(Math.random()*90+10);
            img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=200;
          }
        }
        ctx.putImageData(img,0,0);
      }
      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(raf);
  },[]);
  return<canvas ref={ref} width={256} height={256}
    style={{position:'absolute',inset:0,zIndex:5,pointerEvents:'none',
      opacity:.18,imageRendering:'pixelated',width:VW,height:VH}}/>;
}

function Opening({onDone}){
  const NOISE_CH='▓▒░█▌▐─│▄▪╫■▀╬';
  const[nodeId,setNodeId]=useState('o0');
  const[sel,setSel]=useState(0);
  const[chars,setChars]=useState(0);
  const[tail,setTail]=useState('');
  const[glitch,setGlitch]=useState(null);
  const showerRef=useRef(null);
  const node=OPEN.find(n=>n.id===nodeId)||OPEN[0];
  const txt=node.text;
  const shown=txt.slice(0,chars);
  const full=chars>=txt.length;
  const SCOL={
    PAIN:C.red,MEMORY:C.gold,MACHINE:'#4090b0',
    FEAR:VOICE_C.FEAR,BODY:VOICE_C.BODY,SURVIVAL:VOICE_C.SURVIVAL,
    INSTINCT:VOICE_C.INSTINCT,CONFUSION:VOICE_C.CONFUSION,
    DENIAL:VOICE_C.DENIAL,TRAUMA:VOICE_C.TRAUMA,GRIEF:VOICE_C.GRIEF,
    RAGE:VOICE_C.RAGE,ACCEPTANCE:VOICE_C.ACCEPTANCE,CURIOSITY:VOICE_C.CURIOSITY,
  };
  const col=node.speaker?(SCOL[node.speaker]||C.text):'#7a6848';

  useEffect(()=>{
    const a=showerRef.current;if(!a)return;
    a.volume=0.08;
    a.muted=false;
    a.play().catch(()=>{});
    return()=>{a.pause();a.currentTime=0;};
  },[]);

  useEffect(()=>{setChars(0);setSel(0);setTail('');},[nodeId]);

  // typewriter
  useEffect(()=>{
    if(full)return;
    const t=setTimeout(()=>setChars(c=>c+1),34);
    return()=>clearTimeout(t);
  },[chars,full]);

  // scramble tail — noise chars ahead of settled text
  useEffect(()=>{
    if(full)return;
    const t=setInterval(()=>{
      const len=1+Math.floor(Math.random()*3);
      setTail(Array.from({length:len},()=>NOISE_CH[Math.floor(Math.random()*NOISE_CH.length)]).join(''));
    },48);
    return()=>clearInterval(t);
  },[full]);

  // periodic glitch displacement
  useEffect(()=>{
    const t=setInterval(()=>{
      if(Math.random()<0.22){
        const dx=((-7+Math.random()*14)).toFixed(1);
        const dy=((-1.5+Math.random()*3)).toFixed(1);
        const sk=((-2.5+Math.random()*5)).toFixed(1);
        setGlitch({dx,dy,sk});
        setTimeout(()=>setGlitch(null),45+Math.random()*110);
      }
    },320);
    return()=>clearInterval(t);
  },[]);

  const confirm=useCallback((idx)=>{
    const opt=node?.opts?.[idx];
    if(!opt)return;
    if(opt.act==='wake'){onDone();return;}
    if(opt.next)setNodeId(opt.next);
  },[node,onDone]);

  useEffect(()=>{
    const kd=e=>{
      if(!full){setChars(9999);setTail('');return;}
      if(e.code==='Enter'){confirm(0);return;}
      if(e.key==='1')setSel(0);
      else if(e.key==='2')setSel(1);
      else if(e.key==='3')setSel(2);
      else if(e.code==='ArrowUp')setSel(s=>Math.max(0,s-1));
      else if(e.code==='ArrowDown')setSel(s=>Math.min((node?.opts?.length||1)-1,s+1));
      else if(e.code==='KeyE')confirm(sel);
    };
    window.addEventListener('keydown',kd);
    return()=>window.removeEventListener('keydown',kd);
  },[full,sel,confirm,node]);

  const gxf=glitch?{transform:`translate(${glitch.dx}px,${glitch.dy}px) skewX(${glitch.sk}deg)`}:{};

  return(
    <div style={{width:VW,height:VH,background:'#000',position:'relative',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <audio ref={showerRef} src={SHOWER_SFX} loop preload="auto" muted/>
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 70% 65% at 50% 55%,#090201 0%,#000 100%)'}}/>
      <StaticNoise/>
      <div style={{position:'absolute',inset:0,zIndex:6,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 3px,#00000018 3px,#00000018 4px)'}}/>
      <div style={{position:'relative',zIndex:10,width:660,...gxf}}>
        {/* chromatic aberration ghosts during glitch */}
        {glitch&&shown&&<>
          <div style={{position:'absolute',top:0,left:0,width:'100%',color:`${col}88`,fontSize:15,lineHeight:2,fontFamily:"'Blue Screen',monospace",fontStyle:'italic',letterSpacing:.3,transform:'translateX(-5px)',pointerEvents:'none',whiteSpace:'pre-wrap'}}>{node.speaker&&'\n\n'}{shown}</div>
          <div style={{position:'absolute',top:0,left:0,width:'100%',color:'#4090b088',fontSize:15,lineHeight:2,fontFamily:"'Blue Screen',monospace",fontStyle:'italic',letterSpacing:.3,transform:'translateX(5px)',pointerEvents:'none',whiteSpace:'pre-wrap'}}>{node.speaker&&'\n\n'}{shown}</div>
        </>}
        {node.speaker&&(
          <div style={{color:col,fontSize:8,letterSpacing:4,fontFamily:"'Blue Screen',monospace",marginBottom:16,opacity:.8}}>
            // {node.speaker}
          </div>
        )}
        <div style={{color:col,fontSize:15,lineHeight:2,fontFamily:"'Blue Screen',monospace",fontStyle:'italic',minHeight:72,marginBottom:40,letterSpacing:.3}}>
          {shown}
          {!full&&<span style={{color:`${col}80`,letterSpacing:.5}}>{tail}</span>}
          {!full&&<span style={{animation:'blink .65s steps(1) infinite',color:col}}>▌</span>}
        </div>
        {full&&(
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {node.opts?.map((opt,i)=>(
              <div key={i} onClick={()=>setSel(i)}
                style={{display:'flex',gap:12,alignItems:'flex-start',cursor:'pointer',padding:'5px 10px',
                  borderLeft:`2px solid ${sel===i?col:'transparent'}`,
                  background:'transparent'}}>
                <span style={{color:'#3a2c14',fontSize:8,fontFamily:"'Blue Screen',monospace",minWidth:14,paddingTop:2}}>{i+1}</span>
                <span style={{color:opt.muted?'#4a3820':C.text,fontSize:7,lineHeight:1.65,
                  fontFamily:"'Blue Screen',monospace",fontStyle:opt.muted?'italic':'normal'}}>{opt.t}</span>
              </div>
            ))}
            <div style={{color:'#2a1c0a',fontSize:8,letterSpacing:2,fontFamily:"'Blue Screen',monospace",marginTop:12}}>
              [ 1/2/3 ] SELECT &nbsp;·&nbsp; [ E ] CONFIRM &nbsp;·&nbsp; [ ENTER ] SKIP
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── GAMEPAD HOOK ──────────────────────────────────────────────
function useGamepad() {
  useEffect(()=>{
    const DEAD=0.25;
    // Standard gamepad layout (Xbox / PS / generic) — mirrors KEYS constant
    const BTN={
      0:KEYS.RUN,      // A / Cross  — run (ShiftRight)
      1:KEYS.CONFIRM,  // B / Circle — interact, confirm dialogue
      2:KEYS.JUMP,     // X / Square — jump
      4:KEYS.TAB_PREV, // LB / L1     — HUD: previous tab
      5:KEYS.TAB_NEXT, // RB / R1     — HUD: next tab
      8:'KeyI',        // Back/Select — toggle device HUD (KeyI, not Shift)
      9:'Pause',       // Start/Menu  — pause menu
      12:KEYS.UP,      // D-pad up
      13:KEYS.DOWN,    // D-pad down — also acts as crouch in scenes (ArrowDown)
      14:KEYS.LEFT,    // D-pad left
      15:KEYS.RIGHT,   // D-pad right
    };
    const ALL=Object.values(KEYS);
    ALL.push('KeyI','Escape','Pause'); // Add non-KEYS buttons
    const held={};
    let raf;
    const keyMap={ShiftLeft:'ShiftLeft',ShiftRight:'ShiftRight',Escape:'Escape',KeyI:'KeyI',Enter:'Enter',Space:'Space',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',KeyE:'KeyE',KeyQ:'KeyQ',KeyW:'KeyW'};
    const kd=code=>document.documentElement.dispatchEvent(new KeyboardEvent('keydown',{key:code,code:keyMap[code]||code,bubbles:true,cancelable:true}));
    const ku=code=>document.documentElement.dispatchEvent(new KeyboardEvent('keyup',  {key:code,code:keyMap[code]||code,bubbles:true,cancelable:true}));
    const poll=()=>{
      const want={};
      const pads=navigator.getGamepads?navigator.getGamepads():[];
      for(const gp of pads){
        if(!gp)continue;
        gp.buttons.forEach((b,i)=>{ if(BTN[i]&&b.pressed) want[BTN[i]]=true; });
        const lx=gp.axes[0]||0, ly=gp.axes[1]||0;
        if(lx<-DEAD) want['ArrowLeft']=true;
        if(lx> DEAD) want['ArrowRight']=true;
        if(ly<-DEAD) want['ArrowUp']=true;
        if(ly> DEAD) want['ArrowDown']=true;
      }
      ALL.forEach(code=>{
        if( want[code]&&!held[code]){held[code]=true; kd(code);}
        if(!want[code]&& held[code]){held[code]=false;ku(code);}
      });
      raf=requestAnimationFrame(poll);
    };
    raf=requestAnimationFrame(poll);
    return()=>{
      cancelAnimationFrame(raf);
      ALL.forEach(code=>{if(held[code])ku(code);});
    };
  },[]);
}

// ── INPUT SOURCE DETECTION ───────────────────────────────────
function useInputSource(){
  const [src,setSrc]=useState('keyboard');
  useEffect(()=>{
    const interval=setInterval(()=>{
      const pads=navigator.getGamepads?navigator.getGamepads():[];
      for(const gp of pads){
        if(!gp)continue;
        if(gp.buttons.some(b=>b.pressed)||gp.axes.some(a=>Math.abs(a)>0.25)){setSrc('controller');return;}
      }
    },100);
    const kb=e=>{if(e.isTrusted)setSrc('keyboard');};
    const ms=()=>setSrc('keyboard');
    window.addEventListener('keydown',kb);
    window.addEventListener('mousedown',ms);
    return()=>{clearInterval(interval);window.removeEventListener('keydown',kb);window.removeEventListener('mousedown',ms);};
  },[]);
  return src;
}

// ── UNIVERSAL SCENE MOVEMENT HOOK ───────────────────────────
// UNIVERSAL MOVEMENT SYSTEM FOR ALL SCENES
// All new scenes MUST implement running mechanics and stamina this way:
//
// 1. Function signature: Add `stamina` and `onStaminaChange` props
// 2. Call hook: `const {keys,running,isCrouching,jumpPhase,vertOffset,bark,updateMovement}=useSceneMovement(baseSpeed,stamina,onStaminaChange,currentOutfit);`
// 3. Movement loop: Before movement checks, call `const {currentSpeed}=updateMovement(isMoving);`
// 4. Use speed: Replace hardcoded SPD with `currentSpeed` (applies 2.1x multiplier when running)
// 5. Character: Pass `running={running}` to <Char> component
// 6. Mono: Show bark: `<Mono text={bark||mono}/>`
// 7. QuestApp: Pass `stamina={stamina} onStaminaChange={setStamina}` to scene component
//
// This ensures EVERY scene has consistent running, stamina, outfit restrictions, and controller support.

function useSceneMovement(baseSpeed,stamina,onStaminaChange,currentOutfit,paused=false,jumpScale=1){
  const keys=useRef({});
  const [running,setRunning]=useState(false);
  const [isCrouching,setIsCrouching]=useState(false);
  const [jumpPhase,setJumpPhase]=useState(null); // null | 'start' | 'air' | 'end'
  const [vertOffset,setVertOffset]=useState(0);
  const [bark,setBark]=useState(null);
  const lastBarkTime=useRef(0);
  const lastStaminaRecoveryTime=useRef(0);

  // Jump state — refs so the RAF loop sees latest values without restarts
  const jumpingRef=useRef(false);
  const jumpStartRef=useRef(0);
  const jumpPeakRef=useRef(0);
  const jumpDurRef=useRef(0);
  const isMovingRef=useRef(false); // updated by updateMovement each frame
  const isRunningRef=useRef(false); // updated by updateMovement each frame
  const jumpScaleRef=useRef(jumpScale);
  jumpScaleRef.current=jumpScale;

  // Refs keep the loop from going stale — always current without needing to
  // restart the RAF loop when outfit / stamina / speed change.
  const staminaRef=useRef(stamina);
  const outfitRef=useRef(currentOutfit);
  const onStaminaChangeRef=useRef(onStaminaChange);
  const baseSpeedRef=useRef(baseSpeed);
  const pausedRef=useRef(paused);
  staminaRef.current=stamina;
  outfitRef.current=currentOutfit;
  onStaminaChangeRef.current=onStaminaChange;
  baseSpeedRef.current=baseSpeed;
  pausedRef.current=paused;

  // When HUD opens or closes, clear held keys so stale holds don't carry over
  useEffect(()=>{
    if(paused){
      delete keys.current['ShiftLeft'];
      delete keys.current['ShiftRight'];
      delete keys.current['ArrowLeft'];
      delete keys.current['ArrowRight'];
      delete keys.current['ArrowUp'];
      delete keys.current['ArrowDown'];
      delete keys.current['Space'];
      setRunning(false);
      setIsCrouching(false);
      setJumpPhase(null);
      jumpingRef.current=false;
    }
  },[paused]);

  // Jump + idle bob RAF loop
  useEffect(()=>{
    let rafId;
    const loop=()=>{
      const now=Date.now();
      if(jumpingRef.current){
        const elapsed=now-jumpStartRef.current;
        const progress=Math.min(1,elapsed/jumpDurRef.current);
        const offset=Math.round(jumpPeakRef.current*Math.sin(Math.PI*progress));
        setVertOffset(offset);
        // Phase splits: first 25% = start, middle 50% = air, last 25% = end
        const phase=progress<0.25?'start':progress<0.75?'air':'end';
        setJumpPhase(phase);
        if(progress>=1){jumpingRef.current=false;setJumpPhase(null);setVertOffset(0);}
      } else if(!isMovingRef.current&&!pausedRef.current){
        setJumpPhase(null);
        // Gentle idle bob — ±3px sine wave
        setVertOffset(Math.round(Math.sin(now/600)*3));
      } else {
        setJumpPhase(null);
        setVertOffset(0);
      }
      rafId=requestAnimationFrame(loop);
    };
    rafId=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(rafId);
  },[]);

  // Stable callback — no deps needed because everything is read from refs
  const updateMovement=useCallback((isMoving)=>{
    isMovingRef.current=isMoving;
    if(pausedRef.current){
      setRunning(false);
      setIsCrouching(false);
      isRunningRef.current=false;
      return {canRun:false, currentSpeed:baseSpeedRef.current};
    }

    const spd=baseSpeedRef.current;
    const stam=staminaRef.current;
    const outfit=outfitRef.current;
    const changeStamina=onStaminaChangeRef.current;

    const isRunning=keys.current['ShiftRight']; // controller A button
    const outfitAllowsRun=outfit==='cyber_octavia';
    const outfitAllowsStealth=outfit==='cyber_octavia';
    const canRun=isRunning&&stam>0&&outfitAllowsRun;
    const wantsCrouch=!!(keys.current['ShiftLeft']||keys.current['ArrowDown']);
    let barkMsg=null;

    if(isRunning&&isMoving&&!outfitAllowsRun){
      if(outfit==='hoodie'){
        barkMsg=RUN_BARKS_HOODIE[Math.floor(Math.random()*RUN_BARKS_HOODIE.length)];
      }
    }
    if(wantsCrouch&&!outfitAllowsStealth){
      if(outfit==='hoodie'){
        barkMsg=STEALTH_BARKS_HOODIE[Math.floor(Math.random()*STEALTH_BARKS_HOODIE.length)];
      }
    }

    if(barkMsg&&Date.now()-lastBarkTime.current>3000){
      setBark(barkMsg);
      lastBarkTime.current=Date.now();
      setTimeout(()=>setBark(null),3000);
    }

    const crouching=wantsCrouch&&outfitAllowsStealth;
    setRunning(canRun&&!barkMsg&&isMoving);
    setIsCrouching(crouching);
    isRunningRef.current=canRun&&!barkMsg&&isMoving;

    if(canRun&&isMoving){
      changeStamina?.(s=>Math.max(0,s-0.15)); // ~11 seconds of running at 60fps
    } else if(stam<100&&Date.now()-lastStaminaRecoveryTime.current>200){
      changeStamina?.(s=>Math.min(100,s+1.5)); // recovers in ~13 seconds
      lastStaminaRecoveryTime.current=Date.now();
    }

    const baseSpd=canRun&&!barkMsg?spd*2.1:spd;
    return {canRun:canRun&&!barkMsg, currentSpeed:crouching?baseSpd*0.4:baseSpd};
  },[]); // stable — reads everything from refs

  useEffect(()=>{
    const kd=e=>{
      keys.current[e.code]=true;
      // Jump trigger — Space key or controller X (mapped to Space via BTN[2])
      if(e.code==='Space'&&!jumpingRef.current&&!pausedRef.current){
        if(outfitRef.current!=='cyber_octavia'){
          // Hoodie: bark instead of jumping
          if(Date.now()-lastBarkTime.current>3000){
            const msg=STEALTH_BARKS_HOODIE[Math.floor(Math.random()*STEALTH_BARKS_HOODIE.length)];
            setBark(msg);
            lastBarkTime.current=Date.now();
            setTimeout(()=>setBark(null),3000);
          }
          return;
        }
        const isRun=isRunningRef.current;
        const isMove=isMovingRef.current;
        const isCrouch=!!(keys.current['ShiftLeft']||keys.current['ArrowDown']);
        const jScale=jumpScaleRef.current;
        // Hierarchy: standing (lowest) < walking < crouched jump < running (highest/furthest)
        jumpPeakRef.current=(isRun?300:isCrouch?250:isMove?200:100)*jScale;
        jumpDurRef.current =(isRun?900:isCrouch?720:isMove?620:380)*Math.sqrt(jScale);
        jumpingRef.current=true;
        jumpStartRef.current=Date.now();
      }
    };
    const ku=e=>{delete keys.current[e.code];};
    window.addEventListener('keydown',kd);
    window.addEventListener('keyup',ku);
    return()=>{
      window.removeEventListener('keydown',kd);
      window.removeEventListener('keyup',ku);
    };
  },[]);

  return {keys,running,isCrouching,jumpPhase,vertOffset,bark,setBark,updateMovement};
}

const SYS_MODES=['save','load','options','quit'];
const SAVE_SLOTS=[
  {slot:1,name:'SLOT 1',scene:'street',  time:'2:45h',status:'empty'},
  {slot:2,name:'SLOT 2',scene:'apartment',time:'1:20h',status:'occupied'},
  {slot:3,name:'SLOT 3',scene:'hallway', time:'0:50h',status:'occupied'},
